na, ale ważna granica w periodyzacji dziejów.","l":0},{"t":"s","q":"Najstarszą epoką kamienną, w której ludzie żyli głównie z łowiectwa i zbieractwa, był:","a":"Paleolit","ex":"To starsza epoka kamienna.","l":1},{"t":"f","q":"Starszą epokę kamienną, w której ludzie polowali i zbierali pokarm, nazywamy _______.","a":"paleolitem","acc":[],"ex":"Ludzie prowadzili wtedy koczowniczy tryb życia.","l":1},{"t":"s","q":"Młodszą epokę kamienną, w której ludzie zaczęli uprawiać rośliny i hodować zwierzęta, nazywamy:","a":"Neolitem","ex":"To epoka rewolucji neolitycznej.","l":1},{"t":"tf","q":"W epoce neolitu ludzie zaczęli uprawiać rośliny i hodować zwierzęta, przechodząc na osiadły tryb życia.","a":true,"ex":"To fundamentalna zmiana w sposobie życia ludzi.","l":1},{"t":"s","q":"Przejście od koczowniczego trybu życia (łowiectwo, zbieractwo) do osiadłego (rolnictwo, hodowla) nazywamy:","a":"Rewolucją neolityczną","ex":"To jedna z najważniejszych zmian w dziejach ludzkości.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego zmianę sposobu życia ludzi w epoce neolitu nazwano „rewolucją neolityczną”.","a":"Nazwano ją rewolucją, ponieważ radykalnie i trwale zmieniła sposób życia ludzi — od wędrownego łowiectwa i zbieractwa do osiadłego rolnictwa i hodowli zwierząt, co doprowadziło do powstania stałych osad, gromadzenia zapasów żywności i rozwoju rzemiosła.","l":1},{"t":"s","q":"Pierwsze cywilizacje na świecie powstały na obszarze:","a":"Żyznego Półksiężyca na Bliskim Wschodzie","ex":"To region między rzekami Tygrys i Eufrat oraz dolina Nilu.","l":2},{"t":"f","q":"Obszar żyznych ziem na Bliskim Wschodzie, gdzie powstały pierwsze cywilizacje, nazywamy _______ Półksiężycem.","a":"Żyznym","acc":[],"ex":"Obejmował dorzecza Tygrysu, Eufratu i Nilu.","l":2},{"t":"s","q":"Cywilizacja Sumerów rozwinęła się w krainie zwanej:","a":"Mezopotamią","ex":"Mezopotamia leży między Tygrysem a Eufratem.","l":2},{"t":"tf","q":"Mezopotamia to kraina leżąca między rzekami Tygrys i Eufrat, gdzie rozwinęła się cywilizacja Sumerów.","a":true,"ex":"To jeden z kolebek cywilizacji na świecie.","l":2},{"t":"s","q":"Sumerowie jako jedni z pierwszych na świecie wynaleźli:","a":"Pismo","ex":"To przełomowy wynalazek w historii ludzkości.","l":2},{"t":"f","q":"Pierwsze pismo Sumerów, zapisywane za pomocą znaków wyciskanych w glinie, nazywamy pismem _______.","a":"klinowym","acc":[],"ex":"Znaki przypominały kliny wyciskane rylcem w glinianych tabliczkach.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego wynalezienie pisma przez Sumerów było przełomowym wydarzeniem w historii ludzkości.","a":"Wynalezienie pisma umożliwiło zapisywanie i przekazywanie informacji, umów, praw oraz wiedzy w sposób trwały, co znacząco ułatwiło zarządzanie państwem, handel oraz przekazywanie dorobku kulturowego kolejnym pokoleniom — to właśnie od pojawienia się pisma historycy liczą początek historii, w odróżnieniu od prehistorii.","l":2},{"t":"s","q":"Rzeka, dzięki której mogła rozwinąć się cywilizacja starożytnego Egiptu, to:","a":"Nil","ex":"Coroczne wylewy Nilu użyźniały ziemię.","l":3},{"t":"tf","q":"Starożytny Egipt bywa nazywany „darem Nilu”, ponieważ jego rozwój był ściśle związany z tą rzeką.","a":true,"ex":"Nil dostarczał wody i żyznego mułu potrzebnego rolnictwu.","l":3},{"t":"s","q":"Władca starożytnego Egiptu nazywany był:","a":"Faraonem","ex":"Faraon posiadał nieograniczoną władzę.","l":3},{"t":"f","q":"Władca starożytnego Egiptu, posiadający nieograniczoną władzę, nosił tytuł _______.","a":"faraona","acc":[],"ex":"Uważany był też za istotę boską.","l":3},{"t":"s","q":"System pisma używany w starożytnym Egipcie nazywamy:","a":"Hieroglifami","ex":"To pismo obrazkowe, bardzo skomplikowane w nauce.","l":3},{"t":"tf","q":"Egipcjanie zapisywali teksty za pomocą hieroglifów, często na materiale zwanym papirusem.","a":true,"ex":"Papirus był rodzajem starożytnego papieru.","l":3},{"t":"o","q":"Wyjaśnij, na czym polegała trudność w posługiwaniu się pismem hieroglificznym w starożytnym Egipcie.","a":"Pismo hieroglificzne było bardzo skomplikowane — obejmowało setki różnych znaków, których nauka wymagała wielu lat, dlatego umiejętność czytania i pisania posiadali głównie wykształceni pisarze, a nie zwykli mieszkańcy Egiptu.","l":3},{"t":"s","q":"Osoby zajmujące się w starożytnym Egipcie zapisywaniem tekstów urzędowych nazywano:","a":"Pisarzami","ex":"Pisarze byli ważną, wykształconą grupą społeczną.","l":3},{"t":"tf","q":"Pisarze pełnili w starożytnym Egipcie ważną rolę, zajmując się m.in. prowadzeniem dokumentacji urzędowej.","a":true,"ex":"Byli jedną z nielicznych grup umiejących czytać i pisać.","l":3},{"t":"s","q":"System wierzeń starożytnych Egipcjan, zakładający istnienie wielu bogów, nazywamy:","a":"Politeizmem","ex":"Egipcjanie czcili wielu różnych bogów.","l":4,"k":1},{"t":"f","q":"Wiara w wielu bogów nazywana jest _______ (wielobóstwem).","a":"politeizmem","acc":[],"ex":"To przeciwieństwo monoteizmu.","l":4,"k":1},{"t":"s","q":"Zabalsamowane, zakonserwowane ciało zmarłego w starożytnym Egipcie nazywano:","a":"Mumią","ex":"Balsamowanie miało zachować ciało na wieczność.","l":4},{"t":"tf","q":"Egipcjanie wierzyli w życie pozagrobowe, dlatego balsamowali ciała zmarłych, tworząc mumie.","a":true,"ex":"To wiązało się z całym rytuałem pogrzebowym.","l":4},{"t":"s","q":"Monumentalne budowle grobowe faraonów w starożytnym Egipcie to:","a":"Piramidy","ex":"Największe z nich znajdują się w Gizie.","l":3},{"t":"f","q":"Groby faraonów w starożytnym Egipcie miały formę monumentalnych budowli zwanych _______.","a":"piramidami","acc":[],"ex":"Ich budowa wymagała ogromnych zasobów i pracy.","l":3},{"t":"o","q":"Opisz, w jaki sposób Egipcjanie starali się zapewnić zmarłemu faraonowi życie wieczne.","a":"Egipcjanie balsamowali ciało zmarłego faraona, tworząc mumię, umieszczali je w sarkofagu wewnątrz piramidy razem z przedmiotami potrzebnymi w zaświatach, wierząc, że dzięki temu dusza faraona będzie mogła cieszyć się życiem wiecznym po przejściu sądu Ozyrysa.","l":4},{"t":"s","q":"Sądem nad duszą zmarłego, w wierzeniach starożytnych Egipcjan, kierował bóg:","a":"Ozyrys","ex":"To bóg zaświatów w mitologii egipskiej.","l":4},{"t":"tf","q":"Według wierzeń Egipcjan, dusza zmarłego stawała przed sądem boga Ozyrysa.","a":true,"ex":"Od wyniku tego sądu zależało dalsze losy duszy.","l":4},{"t":"s","q":"Starożytny Izrael jest związany z powstaniem religii zwanej:","a":"Judaizmem","ex":"To jedna z pierwszych religii monoteistycznych.","l":5},{"t":"f","q":"Religia starożytnych Żydów, oparta na wierze w jednego Boga, nazywa się _______.","a":"judaizmem","acc":[],"ex":"To jedna z najstarszych religii monoteistycznych świata.","l":5},{"t":"s","q":"Święta księga judaizmu i chrześcijaństwa, opisująca m.in. dzieje Żydów, to:","a":"Biblia","ex":"Składa się m.in. ze Starego Testamentu.","l":5},{"t":"tf","q":"Biblia jest świętą księgą związaną zarówno z judaizmem, jak i chrześcijaństwem.","a":true,"ex":"Stary Testament jest wspólny dla obu religii.","l":5},{"t":"s","q":"Wiara w jednego Boga nazywana jest:","a":"Monoteizmem","ex":"To przeciwieństwo wiary w wielu bogów.","l":5},{"t":"f","q":"Wiara w istnienie tylko jednego Boga nazywana jest _______ (jedynobóstwem).","a":"monoteizmem","acc":[],"ex":"Judaizm był jedną z pierwszych takich religii.","l":5},{"t":"o","q":"Wyjaśnij różnicę między politeizmem a monoteizmem, podając przykład religii reprezentującej każdy z tych typów wierzeń.","a":"Politeizm to wiara w wielu bogów, np. religia starożytnych Egipcjan czy Greków, natomiast monoteizm to wiara w jednego Boga, np. judaizm wyznawany przez starożytnych Izraelitów.","l":5,"k":1},{"t":"s","q":"Wśród ważnych postaci Starego Testamentu wymienia się m.in.:","a":"Abrahama, Dawida i Salomona","ex":"To postacie związane z dziejami starożytnego Izraela.","l":5},{"t":"tf","q":"Abraham, Dawid i Salomon to postacie związane ze starożytnym Izraelem, opisane w Biblii.","a":true,"ex":"Dawid i Salomon byli m.in. królami Izraela.","l":5},{"t":"s","q":"Sposób ustalania wieku dla danego roku polega na:","a":"Dodaniu jedynki do liczby pełnych stuleci zawartych w danej liczbie lat","ex":"Np. rok 1815 zawiera 18 pełnych stuleci, więc należy do wieku XIX.","l":0},{"t":"o","q":"Ustal, w którym wieku miał miejsce rok 999 n.e. Wyjaśnij sposób obliczenia.","a":"Rok 999 przypada na X wiek n.e., ponieważ zawiera on dziewięć pełnych stuleci (900 lat), a dziesiąte stulecie trwa od roku 901 do 1000 — do dziesiątego wieku zaliczają się więc wszystkie lata od 901 do 1000, w tym rok 999.","l":0},{"t":"s","q":"Rok 1815 przypada na:","a":"XIX wiek","ex":"Zawiera 18 pełnych stuleci, więc należy do wieku XIX.","l":0},{"t":"f","q":"Rok 1000 kończy _______ wiek n.e.","a":"dziesiąty","acc":[],"ex":"Rzymski zapis tego wieku to X.","l":0},{"t":"o","q":"Wyjaśnij ogólną zasadę ustalania wieku na podstawie roku, np. dlaczego rok 1815 należy do XIX wieku.","a":"Aby ustalić wiek danego roku, do liczby pełnych stuleci zawartych w danym roku dodaje się jeden — np. rok 1815 zawiera osiemnaście pełnych stuleci (1800 lat), więc należy do wieku dziewiętnastego (XIX), gdyż dziewiętnasty wiek trwa od 1801 do 1900 roku.","l":0},{"t":"s","q":"Prehistoria zakończyła się wraz z:","a":"Wynalezieniem pisma, ok. 3500 r. p.n.e.","ex":"To umowna granica między prehistorią a historią.","l":0},{"t":"tf","q":"Za umowny koniec prehistorii przyjmuje się moment wynalezienia pisma, ok. 3500 r. p.n.e.","a":true,"ex":"Od tego momentu mówimy już o historii, a nie prehistorii.","l":0},{"t":"tf","q":"Po starożytności nastąpiło średniowiecze, a po nim czasy nowożytne, trwające do dziś.","a":true,"ex":"To ogólny podział epok historycznych.","l":0},{"t":"s","q":"Wielki Mur, monumentalna budowla obronna, powstał w starożytności na terenie:","a":"Chin","ex":"To jedna z najdłuższych budowli świata.","l":null},{"t":"f","q":"Monumentalna budowla obronna wznoszona przez wieki w starożytnych i późniejszych Chinach to Wielki _______.","a":"Mur","acc":[],"ex":"Miał chronić Chiny przed najazdami z północy.","l":null},{"t":"o","q":"Wyjaśnij, w jakim celu zbudowano Wielki Mur Chiński.","a":"Wielki Mur Chiński budowano głównie w celach obronnych — miał chronić chińskie państwo przed najazdami koczowniczych ludów z północy.","l":null},{"t":"s","q":"Cywilizacja, która rozwinęła się w dolinie rzeki Indus, na terenie dzisiejszego Pakistanu i Indii, nazywana jest cywilizacją:","a":"Doliny Indusu","ex":"To jedna z czterech najstarszych cywilizacji rzecznych świata.","l":null},{"t":"tf","q":"Cywilizacja doliny Indusu rozwijała się mniej więcej między 2500 a 1800 r. p.n.e.","a":true,"ex":"To jedna z najstarszych cywilizacji na świecie.","l":null},{"t":"s","q":"Ważne miasto cywilizacji doliny Indusu, którego ruiny odkryto archeologicznie, to:","a":"Harappa","ex":"Odkrycia w Harappie pokazały bardzo zaawansowane planowanie miejskie.","l":null},{"t":"f","q":"Jednym z ważnych miast starożytnej cywilizacji doliny Indusu było _______.","a":"Harappa","acc":[],"ex":"Miasto to dało nazwę całej cywilizacji harappańskiej.","l":null},{"t":"s","q":"Starożytnym miastem cywilizacji Sumerów było:","a":"Ur","ex":"Ur było jednym z ważniejszych miast-państw sumeryjskich.","l":2},{"t":"tf","q":"Ur było jednym z ważnych miast-państw cywilizacji Sumerów w Mezopotamii.","a":true,"ex":"Znajdowało się na terenie dzisiejszego Iraku.","l":2},{"t":"s","q":"Stolicą starożytnego Egiptu było m.in. miasto:","a":"Memfis","ex":"Memfis leżało u wejścia do delty Nilu.","l":3},{"t":"o","q":"Podaj przykład osiągnięcia lub wynalazku związanego z każdą z czterech starożytnych cywilizacji: Sumerów, Egiptu, doliny Indusu i Chin.","a":"Np. Sumerowie — pismo klinowe; Egipt — piramidy i mumifikacja; dolina Indusu — dobrze zaplanowane miasta z kanalizacją; Chiny — Wielki Mur i wynalezienie papieru (lub jedwabiu).","l":null},{"t":"s","q":"Wspólną cechą najstarszych cywilizacji świata (Sumerów, Egiptu, doliny Indusu, Chin) było to, że:","a":"Rozwinęły się nad brzegami wielkich rzek","ex":"Rzeki dostarczały wody i żyznego mułu.","l":null},{"t":"tf","q":"Wspólną cechą najstarszych cywilizacji było to, że rozwinęły się nad brzegami wielkich rzek, które użyźniały ziemię i ułatwiały uprawę roli.","a":true,"ex":"Dotyczy to Nilu, Tygrysu i Eufratu, Indusu oraz Huang He.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego najstarsze cywilizacje świata rozwinęły się właśnie nad wielkimi rzekami.","a":"Wielkie rzeki, takie jak Nil, Tygrys i Eufrat, Indus czy Huang He, regularnie zalewały okoliczne tereny, użyźniając glebę i umożliwiając wydajne rolnictwo, a także dostarczały wody do nawadniania upraw — to sprzyjało gromadzeniu nadwyżek żywności, wzrostowi liczby ludności i rozwojowi organizacji społecznej, co doprowadziło do powstania pierwszych cywilizacji.","l":null},{"t":"s","q":"Tak zwana „Księga Umarłych” to starożytny egipski tekst związany z:","a":"Wierzeniami dotyczącymi życia pozagrobowego","ex":"Miała pomóc zmarłemu w drodze przez zaświaty.","l":4},{"t":"tf","q":"Egipska „Księga Umarłych” zawierała teksty i zaklęcia mające pomóc zmarłemu w życiu pozagrobowym.","a":true,"ex":"To zbiór formuł religijnych umieszczanych często w grobowcach.","l":4},{"t":"o","q":"Wyjaśnij, czego mogła dotyczyć tzw. spowiedź negatywna zmarłego w wierzeniach starożytnych Egipcjan.","a":"Zmarły, stając przed sądem bogów (w tym boga Ozyrysa), zapewniał, że w swoim życiu nie popełnił żadnych złych czynów wobec innych ludzi — taka „spowiedź negatywna” miała zadecydować o jego dalszym losie w zaświatach.","l":4},{"t":"s","q":"Zwój zawierający święte teksty judaizmu, przechowywany w synagodze, nazywamy:","a":"Torą","ex":"Jest odczytywana podczas nabożeństw.","l":5},{"t":"f","q":"Święty zwój zawierający najważniejsze teksty judaizmu nazywa się _______.","a":"Torą","acc":[],"ex":"Zawiera m.in. pierwsze pięć ksiąg Biblii hebrajskiej.","l":5},{"t":"tf","q":"Tora jest świętym zwojem, zawierającym najważniejsze teksty judaizmu.","a":true,"ex":"Jest przechowywana i czczona w synagogach.","l":5},{"t":"s","q":"Państwo rządzone przez koronowanego, dziedzicznego władcę nazywamy:","a":"Monarchią","ex":"To jedna z najstarszych form rządów w historii.","l":null},{"t":"f","q":"Ustrój, w którym władzę sprawuje koronowany władca, przekazujący ją zwykle dziedzicznie, nazywamy _______.","a":"monarchią","acc":[],"ex":"Przykładem jest starożytny Egipt rządzony przez faraonów.","l":null},{"t":"w","q":"era","a":"Długi okres w dziejach liczony od ważnego wydarzenia; w Europie: od narodzin Chrystusa.","l":0,"k":1},{"t":"w","q":"prehistoria","a":"Najdawniejszy okres dziejów człowieka, przed wynalezieniem pisma.","l":0,"k":1},{"t":"w","q":"paleolit","a":"Starsza epoka kamienna, w której ludzie polowali i zbierali pokarm.","l":1,"k":1},{"t":"w","q":"neolit","a":"Młodsza epoka kamienna, w której ludzie zaczęli uprawiać rolę i hodować zwierzęta.","l":1,"k":1},{"t":"w","q":"rewolucja neolityczna","a":"Przejście od zbieractwa i łowiectwa do rolnictwa i osiadłego trybu życia.","l":1,"k":1},{"t":"w","q":"cywilizacja","a":"Wysoki poziom rozwoju społeczeństwa, mający m.in. pismo, państwo i miasta.","l":2,"k":1},{"t":"w","q":"Mezopotamia","a":"Kraina między rzekami Eufrat i Tygrys, kolebka wczesnej cywilizacji.","l":2,"k":1},{"t":"w","q":"pismo klinowe","a":"Pismo Sumerów, tworzone przez odciskanie klinowatych znaków w glinianych tabliczkach.","l":2,"k":1},{"t":"w","q":"hieroglify","a":"Pismo obrazkowe starożytnych Egipcjan.","l":3,"k":1},{"t":"w","q":"faraon","a":"Władca starożytnego Egiptu, uważany za syna boga.","l":3,"k":1},{"t":"w","q":"piramida","a":"Wielka grobowa budowla egipskich faraonów.","l":3,"k":1},{"t":"w","q":"papirus","a":"Materiał do pisania wytwarzany z rośliny rosnącej nad Nilem.","l":3,"k":1},{"t":"w","q":"mumifikacja","a":"Zabieg zabezpieczania ciała zmarłego przed rozkładem, stosowany w Egipcie.","l":4,"k":1},{"t":"w","q":"dynastia","a":"Ród panujący, w którym władza przechodzi z pokolenia na pokolenie.","l":3,"k":1}],"lessons":["Czas w historii","Od myśliwych do rolników","Cywilizacje Sumerów","Starożytny Egipt","Wierzenia starożytnych Egipcjan","Starożytny Izrael"]},{"id":"h2","title":"Starożytna Grecja","icon":"🏛️","q":[{"t":"s","q":"Greckie miasto-państwo nazywano:","a":"Polis","ex":"Każde polis było niezależnym, samorządnym organizmem.","l":0},{"t":"tf","q":"Starożytna Grecja składała się z wielu niezależnych miast-państw (polis), a nie z jednego zjednoczonego państwa.","a":true,"ex":"Ateny i Sparta to przykłady takich miast-państw.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego starożytni Grecy nie utworzyli jednego wspólnego państwa.","a":"Grecja jest krainą górzystą, podzieloną naturalnymi barierami (górami, morzem), co utrudniało komunikację i sprzyjało powstawaniu niezależnych, samorządnych miast-państw (polis), z których każde miało własne prawa i władze, zamiast jednego scentralizowanego państwa.","l":0},{"t":"s","q":"System sprawowania władzy w starożytnych Atenach, w którym decyzje podejmowali obywatele, nazywamy:","a":"Demokracją","ex":"To słynny ateński ustrój polityczny.","l":0,"k":1},{"t":"f","q":"Ustrój, w którym władzę sprawują obywatele, np. w starożytnych Atenach, nazywamy _______.","a":"demokracją","acc":[],"ex":"Nazwa pochodzi z języka greckiego.","l":0,"k":1},{"t":"s","q":"Zgromadzenie, na którym ateńscy obywatele osobiście podejmowali najważniejsze decyzje państwowe, nazywało się:","a":"Zgromadzenie ludowe","ex":"Uczestniczyli w nim dorośli obywatele płci męskiej.","l":0,"k":1},{"t":"tf","q":"W demokracji ateńskiej najważniejsze decyzje podejmowało zgromadzenie ludowe, w którym mogli uczestniczyć obywatele.","a":true,"ex":"To była demokracja bezpośrednia, a nie przedstawicielska.","l":0,"k":1},{"t":"s","q":"Postać szczególnie związana z rozkwitem demokracji ateńskiej to:","a":"Perykles","ex":"Okres jego przywództwa nazywa się „wiekiem Peryklesa”.","l":0,"k":1},{"t":"f","q":"Okres świetności demokracji ateńskiej wiąże się z przywódcą o imieniu _______.","a":"Perykles","acc":[],"ex":"Za jego rządów wzniesiono m.in. Partenon.","l":0,"k":1},{"t":"s","q":"Procedura, dzięki której ateńscy obywatele mogli zagłosować za czasowym wygnaniem z miasta osoby uznanej za zagrożenie dla demokracji, nazywała się:","a":"Ostracyzm","ex":"Głosowano skorupkami (ostraka), stąd nazwa.","l":0,"k":1},{"t":"tf","q":"Ostracyzm był procedurą pozwalającą obywatelom Aten na czasowe wygnanie osoby uznanej za niebezpieczną dla ustroju.","a":true,"ex":"Miało to chronić demokrację przed nadmiernym wzrostem wpływów jednostki.","l":0,"k":1},{"t":"o","q":"Wyjaśnij, na czym polegał ostracyzm w starożytnych Atenach.","a":"Ostracyzm polegał na głosowaniu, w którym obywatele Aten mogli zdecydować o czasowym (zwykle dziesięcioletnim) wygnaniu z miasta osoby uznanej za zagrożenie dla demokracji — miało to zapobiegać nadmiernemu wzrostowi wpływów jednej osoby.","l":0,"k":1},{"t":"tf","q":"W demokracji ateńskiej prawa obywatelskie posiadali tylko dorośli mężczyźni urodzeni w Atenach — nie mieli ich kobiety ani niewolnicy.","a":true,"ex":"To istotna różnica względem współczesnych demokracji.","l":0,"k":1},{"t":"s","q":"Zbiór opowieści o greckich bogach i herosach nazywamy:","a":"Mitologią","ex":"Mitologia wyjaśniała Grekom zjawiska świata.","l":1},{"t":"f","q":"Opowieści o greckich bogach, herosach i legendarnych wydarzeniach nazywamy _______.","a":"mitami","acc":[],"ex":"Każdy mit niósł ze sobą jakieś przesłanie lub wyjaśnienie.","l":1},{"t":"s","q":"Według wierzeń starożytnych Greków, bogowie mieszkali na górze:","a":"Olimp","ex":"Stąd nazwa „bogowie olimpijscy”.","l":1},{"t":"tf","q":"Zgodnie z wierzeniami starożytnych Greków, ich bogowie mieszkali na górze Olimp.","a":true,"ex":"To najwyższa góra Grecji.","l":1},{"t":"s","q":"Bohater mitu greckiego, który wykradł bogom ogień i podarował go ludziom, to:","a":"Prometeusz","ex":"Za ten czyn został surowo ukarany przez Zeusa.","l":1,"k":1},{"t":"f","q":"Herosem znanym z wykonania dwunastu niezwykle trudnych prac był _______.","a":"Herakles","acc":[],"ex":"Jego prace obejmowały m.in. pokonanie lwa nemejskiego.","l":1,"k":1},{"t":"s","q":"Miejsce w starożytnej Grecji, gdzie znajdowała się słynna wyrocznia, w której kapłanka (Pytia) przekazywała przepowiednie, to:","a":"Delfy","ex":"Wyrocznia delficka była poświęcona bogu Apollinowi.","l":1,"k":1},{"t":"tf","q":"W Delfach znajdowała się słynna wyrocznia, z której korzystali Grecy szukający rady bogów.","a":true,"ex":"Przybywali tam ludzie z całej Grecji.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, w jakim celu starożytni Grecy korzystali z wyroczni w Delfach.","a":"Grecy udawali się do wyroczni w Delfach, by za pośrednictwem kapłanki (Pytii) uzyskać radę lub przepowiednię od boga Apollina w ważnych sprawach osobistych, politycznych lub wojennych.","l":1,"k":1},{"t":"s","q":"Charakterystyczna, monumentalna budowla wzniesiona na ateńskim Akropolu, poświęcona bogini Atenie, to:","a":"Partenon","ex":"To symbol starożytnych Aten.","l":3,"k":1},{"t":"f","q":"Świątynia ku czci bogini Ateny, wzniesiona na ateńskim Akropolu, nazywa się _______.","a":"Partenon","acc":[],"ex":"Powstała za czasów Peryklesa.","l":3,"k":1},{"t":"s","q":"Starożytni Grecy jako jedni z pierwszych na świecie stworzyli:","a":"Teatr, w tym tragedię i komedię","ex":"Teatr grecki miał ogromny wpływ na późniejszą kulturę europejską.","l":3},{"t":"tf","q":"Starożytni Grecy stworzyli teatr, rozróżniając gatunki tragedii i komedii.","a":true,"ex":"Przedstawienia odbywały się w wielkich amfiteatrach pod gołym niebem.","l":3},{"t":"f","q":"Słynny grecki filozof, znany ze stwierdzenia „Wiem, że nic nie wiem”, to _______.","a":"Sokrates","acc":[],"ex":"Uczył poprzez zadawanie pytań.","l":3,"k":1},{"t":"o","q":"Wyjaśnij, co mógł mieć na myśli Sokrates, mówiąc „Wiem, że nic nie wiem”.","a":"Sokrates chciał podkreślić, że prawdziwa mądrość zaczyna się od uświadomienia sobie granic własnej wiedzy — osoba świadoma tego, jak wiele jeszcze nie wie, jest bardziej otwarta na naukę i poszukiwanie prawdy niż ktoś przekonany, że wie już wszystko.","l":3,"k":1},{"t":"s","q":"Autorem słynnych eposów „Iliada” i „Odyseja” był:","a":"Homer","ex":"Oba dzieła opisują wydarzenia związane z wojną trojańską.","l":3,"k":1},{"t":"tf","q":"Homer jest uznawany za autora eposów „Iliada” i „Odyseja”, opisujących m.in. wojnę trojańską i przygody Odyseusza.","a":true,"ex":"To jedne z najważniejszych dzieł literatury starożytnej.","l":3,"k":1},{"t":"s","q":"Dziedzina nauki zajmująca się poszukiwaniem odpowiedzi na fundamentalne pytania o świat i życie, zapoczątkowana w starożytnej Grecji, to:","a":"Filozofia","ex":"Grecy jako pierwsi na dużą skalę rozwinęli tę dziedzinę.","l":3,"k":1},{"t":"f","q":"Dziedzina wiedzy zapoczątkowana w starożytnej Grecji, zajmująca się fundamentalnymi pytaniami o świat, człowieka i wartości, to _______.","a":"filozofia","acc":[],"ex":"Sokrates, Platon i Arystoteles byli jej wybitnymi przedstawicielami.","l":3,"k":1},{"t":"s","q":"Wiele wyrazów pochodzenia greckiego jest obecnych we współczesnym języku polskim, np.:","a":"Demokracja, filozofia, teatr","ex":"To trwałe dziedzictwo języka greckiego.","l":3,"k":1},{"t":"tf","q":"Wiele współczesnych słów, np. „demokracja” czy „filozofia”, pochodzi z języka starożytnych Greków.","a":true,"ex":"To pokazuje wpływ starożytnej Grecji na współczesną kulturę.","l":3,"k":1},{"t":"o","q":"Wymień trzy osiągnięcia starożytnych Greków, które mają wpływ na współczesną kulturę.","a":"Np. demokracja jako system sprawowania władzy, teatr (tragedia i komedia), filozofia oraz architektura (np. wzorce kolumn, jak w Partenonie).","l":3,"k":1},{"t":"s","q":"Różnica między grecką tragedią a komedią polega na tym, że:","a":"Tragedia opowiadała o poważnych, często smutnych wydarzeniach, a komedia miała charakter żartobliwy","ex":"Oba gatunki wywodzą się z greckiego teatru.","l":3},{"t":"tf","q":"Grecka tragedia opowiadała zwykle o poważnych, dramatycznych wydarzeniach, a komedia miała charakter żartobliwy i lekki.","a":true,"ex":"To podstawowa różnica między obydwoma gatunkami teatralnymi.","l":3},{"t":"s","q":"Demokracja ateńska różniła się od współczesnej demokracji tym, że:","a":"Nie obejmowała wszystkich mieszkańców (np. kobiet, niewolników), inaczej niż większość dzisiejszych demokracji","ex":"To istotna różnica historyczna.","l":0,"k":1},{"t":"o","q":"Wskaż jedną różnicę między demokracją ateńską a demokracją współczesną.","a":"W demokracji ateńskiej prawa obywatelskie (w tym prawo głosu) mieli tylko dorośli mężczyźni urodzeni w Atenach, natomiast we współczesnych demokracjach prawo głosu mają zwykle wszyscy dorośli obywatele danego kraju, niezależnie od płci.","l":0,"k":1},{"t":"s","q":"Morze leżące na wschód od Grecji, między nią a Azją Mniejszą, nazywa się Morzem:","a":"Egejskim","ex":"Usiane jest licznymi greckimi wyspami.","l":null},{"t":"tf","q":"Morze Egejskie leży na wschód od Grecji, między nią a Azją Mniejszą.","a":true,"ex":"To jedno z mórz otaczających Grecję.","l":null},{"t":"s","q":"Morze leżące na zachód od Grecji nazywa się Morzem:","a":"Jońskim","ex":"Oddziela Grecję od Włoch.","l":null},{"t":"f","q":"Morze leżące na zachód od Grecji nazywa się Morzem _______.","a":"Jońskim","acc":[],"ex":"To drugie, obok Egejskiego, morze otaczające Grecję.","l":null},{"t":"s","q":"Południowy półwysep Grecji, połączony z resztą lądu wąskim przesmykiem, nazywa się:","a":"Peloponez","ex":"Znajdowała się tam m.in. Sparta.","l":null},{"t":"tf","q":"Peloponez to południowy półwysep Grecji.","a":true,"ex":"Połączony jest z resztą Grecji wąskim Przesmykiem Korynckim.","l":null},{"t":"o","q":"Wymień morza (lub akweny) otaczające starożytną Grecję.","a":"Morze Śródziemne, Morze Egejskie i Morze Jońskie.","l":null},{"t":"s","q":"Najsłynniejsze starożytne igrzyska greckie organizowano w mieście:","a":"Olimpia","ex":"Stąd wywodzi się nazwa „igrzyska olimpijskie”.","l":2,"k":1},{"t":"f","q":"Najsłynniejsze starożytne igrzyska greckie, dające początek nowożytnym igrzyskom olimpijskim, odbywały się w _______.","a":"Olimpii","acc":[],"ex":"Odbywały się tam co cztery lata.","l":2,"k":1},{"t":"s","q":"Miasto-państwo słynące z surowego wychowania i potęgi militarnej w starożytnej Grecji to:","a":"Sparta","ex":"Sparta kładła ogromny nacisk na wyszkolenie wojskowe.","l":0},{"t":"tf","q":"Sparta była miastem-państwem słynącym w starożytnej Grecji z potęgi militarnej i surowego wychowania młodzieży.","a":true,"ex":"Chłopcy od najmłodszych lat byli przygotowywani do służby wojskowej.","l":0},{"t":"s","q":"Bóg będący władcą mórz w mitologii greckiej to:","a":"Posejdon","ex":"Wywoływał sztormy, uderzając trójzębem.","l":1},{"t":"f","q":"Greckim bogiem władającym morzami, wywołującym sztormy, był _______.","a":"Posejdon","acc":[],"ex":"Był bratem Zeusa i Hadesa.","l":1},{"t":"s","q":"Bogini mądrości i sprawiedliwej wojny, opiekunka Aten, to:","a":"Atena","ex":"Partenon na Akropolu był jej poświęcony.","l":1},{"t":"tf","q":"Atena była grecką boginią mądrości i sprawiedliwej wojny, patronką Aten.","a":true,"ex":"Od jej imienia pochodzi nazwa miasta Ateny.","l":1},{"t":"s","q":"Bogini miłości i piękna w mitologii greckiej to:","a":"Afrodyta","ex":"Jej rzymskim odpowiednikiem jest Wenus.","l":1},{"t":"f","q":"Grecką boginią miłości i piękna była _______.","a":"Afrodyta","acc":[],"ex":"Według mitu narodziła się z morskiej piany.","l":1},{"t":"s","q":"Władca wszystkich bogów greckich, rządzący z góry Olimp, to:","a":"Zeus","ex":"Był bogiem nieba i błyskawic.","l":1},{"t":"tf","q":"Zeus był władcą wszystkich bogów olimpijskich w mitologii greckiej.","a":true,"ex":"Rządził z góry Olimp.","l":1,"k":1},{"t":"s","q":"Bóg podziemnego świata zmarłych w mitologii greckiej to:","a":"Hades","ex":"Od jego imienia pochodzi nazwa całej krainy zmarłych.","l":1},{"t":"f","q":"Greckim bogiem podziemnego królestwa zmarłych był _______.","a":"Hades","acc":[],"ex":"Jego imieniem nazywano też samo miejsce, którym władał.","l":1},{"t":"s","q":"Miejsce w greckim zaświecie, gdzie karano dusze za najcięższe zbrodnie, nazywało się:","a":"Tartar","ex":"To najmroczniejsza część krainy zmarłych.","l":1},{"t":"tf","q":"Tartar był miejscem w greckim zaświecie, gdzie karano dusze za najcięższe przewinienia.","a":true,"ex":"Trafiały tam dusze tych, którzy obrazili bogów.","l":1},{"t":"o","q":"Wyjaśnij różnicę między Hadesem a Tartarem w wierzeniach starożytnych Greków.","a":"Hades to ogólne określenie podziemnego królestwa zmarłych (a także imię boga nim władającego), po którym błąkała się większość dusz, natomiast Tartar to szczególnie mroczna część zaświatów, gdzie karano dusze osób, które popełniły najcięższe zbrodnie lub obraziły bogów.","l":1},{"t":"s","q":"Rzucanie dyskiem było jedną z dyscyplin sportowych na:","a":"Starożytnych igrzyskach greckich","ex":"Znany posąg Dyskobola przedstawia tego typu zawodnika.","l":2},{"t":"tf","q":"Rzucanie dyskiem było jedną z dyscyplin lekkoatletycznych na starożytnych igrzyskach greckich.","a":true,"ex":"Obok biegów i skoku w dal, było to jedno z pięcioboju.","l":2},{"t":"s","q":"Wyścigi rydwanów na starożytnych igrzyskach greckich zaliczano do konkurencji:","a":"Jeździeckich, a nie lekkoatletycznych","ex":"Wymagały użycia koni i pojazdu.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego wyścigi rydwanów, mimo że były częścią starożytnych igrzysk, nie są zaliczane do dyscyplin lekkoatletycznych.","a":"Wyścigi rydwanów są dyscypliną jeździecką, wymagającą użycia koni i pojazdu (rydwanu), podczas gdy dyscypliny lekkoatletyczne (jak bieg, rzut dyskiem czy skok w dal) polegają na indywidualnym wysiłku fizycznym zawodnika, bez użycia zwierząt czy pojazdów.","l":2},{"t":"s","q":"Miejsce w starożytnej Grecji, gdzie wystawiano przedstawienia teatralne — zachowane do dziś ruiny znajdują się m.in. w:","a":"Epidauros","ex":"To jeden z najlepiej zachowanych antycznych teatrów.","l":3},{"t":"tf","q":"W Epidauros zachowały się ruiny starożytnego teatru greckiego, gdzie wystawiano przedstawienia.","a":true,"ex":"Teatr ten słynie z doskonałej akustyki.","l":3},{"t":"s","q":"Słynny grecki rzeźbiarz, twórca posągów zdobiących ateński Akropol, to:","a":"Fidiasz","ex":"Był jednym z najwybitniejszych rzeźbiarzy starożytności.","l":3,"k":1},{"t":"f","q":"Słynnym greckim rzeźbiarzem, twórcą wielu dzieł na ateńskim Akropolu, był _______.","a":"Fidiasz","acc":[],"ex":"Tworzył m.in. posągi bogów dla świątyń.","l":3,"k":1},{"t":"o","q":"Wymień dwa osiągnięcia starożytnych Greków w dziedzinie literatury.","a":"Np. eposy Homera „Iliada” i „Odyseja” oraz rozwój teatru — tragedii (np. dzieła Sofoklesa) i komedii.","l":3,"k":1},{"t":"w","q":"polis","a":"Starożytne greckie miasto-państwo.","l":0,"k":1},{"t":"w","q":"demokracja","a":"Rządy ludu; w Atenach obywatele wspólnie decydowali o sprawach państwa.","l":0,"k":1},{"t":"w","q":"akropol","a":"Wzgórze obronne w greckim mieście, na którym stawiano świątynie.","l":0,"k":1},{"t":"w","q":"agora","a":"Główny plac w greckim mieście, miejsce zgromadzeń i handlu.","l":0,"k":1},{"t":"w","q":"kolonizacja","a":"Zakładanie przez Greków osad poza ojczyzną.","l":null,"k":1},{"t":"w","q":"olimpiada","a":"Ogólnogrecki festiwal sportowy ku czci Zeusa, rozgrywany co cztery lata w Olimpii.","l":2,"k":1},{"t":"w","q":"falanga","a":"Zwarty szyk bojowy ciężkozbrojnych greckich piechurów.","l":null,"k":1},{"t":"w","q":"mit","a":"Opowieść o bogach i bohaterach wyjaśniająca świat.","l":1,"k":1},{"t":"w","q":"filozof","a":"Mędrzec poszukujący prawdy o świecie i człowieku, np. Sokrates, Platon, Arystoteles.","l":3,"k":1},{"t":"w","q":"tragedia","a":"Poważny gatunek dramatu antycznego, opowiadający o losach bohaterów.","l":3,"k":1},{"t":"w","q":"Sparta","a":"Grecka polis z silną armią, w której chłopców od dzieciństwa szkolono na wojowników.","l":0,"k":1},{"t":"w","q":"Ateny","a":"Grecka polis, kolebka demokracji.","l":0,"k":1},{"t":"w","q":"wojny perskie","a":"Wojny Greków z państwem perskim (m.in. bitwa pod Maratonem).","l":null,"k":1},{"t":"o","q":"Co to jest polis i jak wyglądała starożytna Grecja?","a":"Polis to miasto-państwo: miasto z okolicą albo wyspa. W Grecji były setki niezależnych polis; kraj jest górzysty, ma ubogą, skalistą ziemię, półwysep Peloponez i ponad 2 tysiące wysp.","l":0},{"t":"o","q":"Jak Grecy nazywali siebie, a jak obcych?","a":"Siebie Hellenami (kraj: Hellada), a nie-Greków barbarzyńcami.","l":0},{"t":"f","q":"Demokracja oznacza „rządy _______”.","a":"ludu","acc":[],"ex":"Z greckiego: demos – lud, kratos – władza.","l":0,"k":1},{"t":"o","q":"Wymień trzy główne instytucje demokracji ateńskiej.","a":"Zgromadzenie ludowe, rada pięciuset i sąd ludowy.","l":0,"k":1},{"t":"o","q":"Kto brał udział w zgromadzeniu ludowym i jak głosowano?","a":"Wszyscy obywatele (wolni mężczyźni). Głosowano przez podniesienie ręki.","l":0},{"t":"o","q":"Jak wybierano członków rady pięciuset?","a":"500 obywateli losowano na rok.","l":0},{"t":"o","q":"Ilu sędziów liczył sąd ludowy i jak głosowano w sądzie?","a":"Ok. 6 tysięcy sędziów, wybieranych losowo. Głosowanie było tajne.","l":0,"k":1},{"t":"o","q":"Na czym polegał ostracyzm?","a":"Obywatele pisali na skorupkach (ostrakon) nazwisko człowieka, który mógł stać się tyranem. Jeśli zebrano ok. 6 tys. głosów, wygnano go na 10 lat.","l":0,"k":1},{"t":"f","q":"Przywódcą Aten w „wieku Peryklesa” był _______.","a":"Perykles","acc":[],"ex":"Rządził ok. 461–429 p.n.e.","l":0,"k":1},{"t":"o","q":"Kogo w Atenach nie zaliczano do obywateli?","a":"Kobiet, niewolników i cudzoziemców. Obywatelami (ok. 40 tys. z ok. 300 tys. mieszkańców) byli tylko wolni mężczyźni.","l":0},{"t":"o","q":"Skąd brali się niewolnicy w Grecji?","a":"Byli to jeńcy wojenni, ludzie porwani przez piratów i dzieci niewolników.","l":0},{"t":"o","q":"Czym różniła się demokracja ateńska od dzisiejszej?","a":"Ateńska była bezpośrednia (obywatele sami decydowali), a dzisiejsza jest pośrednia, przedstawicielska – wybieramy przedstawicieli.","l":0,"k":1},{"t":"tf","q":"Tyrania to rządy jednego człowieka.","a":true,"ex":"Przed demokracją w Atenach rządzili tyrani.","l":0,"k":1},{"t":"w","q":"ostracyzm","a":"Wygnanie z miasta na 10 lat, o którym decydowano w głosowaniu na skorupkach.","l":0,"k":1},{"t":"w","q":"tyrania","a":"Rządy jednego człowieka.","l":0,"k":1},{"t":"o","q":"Jak nazywamy wiarę w wielu bogów?","a":"Politeizmem.","l":1,"k":1},{"t":"o","q":"Ilu bogów olimpijskich czcili Grecy i gdzie mieszkali?","a":"12 bogów, mieszkali na górze Olimp (2917 m n.p.m.).","l":1,"k":1},{"t":"o","q":"Czym zajmowali się: Zeus, Hera, Posejdon i Atena?","a":"Zeus – władca świata (piorun); Hera – żona Zeusa, opiekunka małżeństw; Posejdon – bóg mórz (trójząb); Atena – bogini mądrości i sprawiedliwej wojny, patronka Aten.","l":1},{"t":"o","q":"Czym zajmowali się: Hades, Hefajstos, Afrodyta i Apollo?","a":"Hades – bóg zaświatów; Hefajstos – kowal bogów; Afrodyta – bogini miłości i piękna; Apollo – bóg słońca, muzyki i wyroczni.","l":1},{"t":"o","q":"Co to jest mit?","a":"Opowieść o bogach i herosach, tłumacząca świat i wydarzenia.","l":1},{"t":"o","q":"Kto według mitów był pierwszy na początku świata?","a":"Chaos. Potem pojawili się Gaja (Ziemia) i Uran (Niebo).","l":1},{"t":"o","q":"Co zrobił Prometeusz i jaką poniósł karę?","a":"Wykradł bogom ogień i dał go ludziom. Zeus przykuł go do skały; uwolnił go Herakles.","l":1,"k":1},{"t":"o","q":"Czym zasłynął Herakles?","a":"Dwunastoma pracami (np. zabił lwa nemejskiego). Był synem Zeusa i herosem.","l":1,"k":1},{"t":"o","q":"Jak Grecy wyobrażali sobie życie po śmierci?","a":"Dusze zmarłych przewoził Charon przez rzekę Styks do Hadesu. Najgorszych zbrodniarzy karano w Tartarze.","l":1},{"t":"o","q":"Na czym polegał kult bogów w Grecji?","a":"Na budowaniu świątyń, składaniu ofiar, procesjach i organizowaniu igrzysk.","l":1},{"t":"o","q":"Czym była wyrocznia w Delfach?","a":"Miejscem poświęconym Apollinowi, gdzie kapłanka Pytia przekazywała przepowiednie. Radził się jej np. król Krezus.","l":1,"k":1},{"t":"f","q":"Pierwsze igrzyska olimpijskie odbyły się w _______ roku p.n.e.","a":"776","acc":["776 p.n.e."],"ex":"Ostatnie w starożytności ok. 393 r. n.e.","l":2,"k":1},{"t":"o","q":"Gdzie, co ile lat i ku czci kogo organizowano igrzyska?","a":"W Olimpii, co 4 lata, ku czci Zeusa.","l":2,"k":1},{"t":"o","q":"Co to jest olimpiada?","a":"Okres czterech lat między igrzyskami.","l":2,"k":1},{"t":"o","q":"Co to był pokój boży?","a":"Zawieszenie wojen od ogłoszenia igrzysk do powrotu uczestników do domów.","l":2,"k":1},{"t":"o","q":"Kto mógł startować w igrzyskach?","a":"Wolni mężczyźni Grecy. Nie mogli niewolnicy, cudzoziemcy ani kobiety (nie mogły ich nawet oglądać).","l":2},{"t":"o","q":"Jak przygotowywali się zawodnicy?","a":"Ćwiczyli 10 miesięcy w domu i 30 dni w Olimpii; składali przysięgę przed posągiem Zeusa.","l":2,"k":1},{"t":"o","q":"Ile dni trwały igrzyska i co dostawał zwycięzca?","a":"5 dni. Zwycięzca dostawał wieniec oliwny i honory w rodzinnej polis.","l":2,"k":1},{"t":"o","q":"Wymień rodzaje dyscyplin na starożytnych igrzyskach.","a":"Lekkoatletyczne (bieg na stadion – 192 m, dłuższe biegi, bieg w zbroi, skok w dal, rzut oszczepem i dyskiem), ciężka atletyka (zapasy, boks, pankration) i wyścigi rydwanów.","l":2,"k":1},{"t":"o","q":"Kim był Milon z Krotonu i kto wykonał posąg Zeusa Olimpijskiego?","a":"Milon – słynny zapaśnik, wielokrotny zwycięzca igrzysk. Posąg Zeusa (ok. 13 m) wykonał Fidiasz.","l":2,"k":1},{"t":"tf","q":"W starożytnych igrzyskach mogły startować kobiety.","a":false,"ex":"Kobiety nie mogły nawet oglądać zawodów.","l":2},{"t":"o","q":"Co znajdowało się na Akropolu w Atenach?","a":"Wzgórze ze świątyniami, m.in. Partenon – świątynia Ateny, zbudowana za Peryklesa.","l":3,"k":1},{"t":"o","q":"Kim był Fidiasz, a kim Myron?","a":"Fidiasz – rzeźbiarz, twórca posągów Ateny w Partenonie (ok. 12 m) i Zeusa w Olimpii. Myron – rzeźbiarz, autor Dyskobola.","l":3,"k":1},{"t":"o","q":"Skąd wziął się teatr i kto występował w greckim teatrze?","a":"Z obrzędów ku czci Dionizosa. Występowali chór i aktorzy w maskach. Wystawiano tragedie i komedie.","l":3},{"t":"o","q":"Kim był Sofokles?","a":"Autorem tragedii, np. „Antygony” i „Króla Edypa”.","l":3},{"t":"o","q":"Kim był Homer i czym są „Iliada” i „Odyseja”?","a":"Poetą. „Iliada” opisuje wojnę trojańską, a „Odyseja” powrót Odyseusza do domu.","l":3,"k":1},{"t":"o","q":"Co oznacza słowo „filozofia”?","a":"Umiłowanie mądrości.","l":3,"k":1},{"t":"o","q":"Co głosił Sokrates i jak zakończył życie?","a":"„Wiem, że nic nie wiem”. Został skazany na śmierć (cykuta) w 399 r. p.n.e.","l":3,"k":1},{"t":"o","q":"Kim byli Archimedes i Hipokrates?","a":"Archimedes – matematyk i wynalazca; Hipokrates – „ojciec medycyny”.","l":3},{"t":"o","q":"Podaj słowa pochodzenia greckiego używane dziś.","a":"Np. demokracja, teatr, filozofia, geografia.","l":3,"k":1}],"lessons":["Demokracja ateńska","Mitologia grecka","Na olimpijskim stadionie","Co zawdzięczamy starożytnym Grekom?"]},{"id":"h3","title":"Antyczny Rzym","icon":"🦅","q":[{"t":"s","q":"Według legendy Rzym został założony przez:","a":"Romulusa i Remusa","ex":"Legenda mówi o braciach wykarmionych przez wilczycę.","l":0},{"t":"tf","q":"Według legendy, Rzym został założony przez braci Romulusa i Remusa w 753 r. p.n.e.","a":true,"ex":"To tradycyjna data założenia Rzymu.","l":0,"k":1},{"t":"f","q":"Legendarnymi założycielami Rzymu byli bracia Romulus i _______.","a":"Remus","acc":[],"ex":"Według legendy zostali wykarmieni przez wilczycę.","l":0},{"t":"s","q":"We wczesnym okresie swojej historii Rzym był rządzony jako:","a":"Republika","ex":"Republika trwała kilkaset lat, zanim powstało cesarstwo.","l":0},{"t":"tf","q":"Przez wiele wieków Rzym był republiką, zanim przekształcił się w cesarstwo.","a":true,"ex":"Republika rzymska trwała od VI do I wieku p.n.e.","l":0},{"t":"s","q":"Najwyżsi urzędnicy republiki rzymskiej, wybierani corocznie w liczbie dwóch, nazywali się:","a":"Konsulowie","ex":"Sprawowali władzę wspólnie, by się nawzajem kontrolować.","l":0,"k":1},{"t":"f","q":"Najwyżsi urzędnicy w republice rzymskiej, wybierani co roku w parze, nazywali się _______.","a":"konsulami","acc":[],"ex":"Ich władza była ograniczona rocznym okresem urzędowania.","l":0,"k":1},{"t":"s","q":"Zgromadzenie arystokratów rzymskich, mające duży wpływ na politykę republiki, nazywało się:","a":"Senat","ex":"Senat rzymski składał się z doświadczonych, wpływowych obywateli.","l":0},{"t":"tf","q":"Senat rzymski, złożony z przedstawicieli arystokracji, odgrywał ważną rolę w republice rzymskiej.","a":true,"ex":"Doradzał konsulom i miał duży wpływ na politykę państwa.","l":0,"k":1},{"t":"s","q":"Urzędnik broniący interesów zwykłych obywateli (plebejuszy) w republice rzymskiej, mający prawo zawetowania niekorzystnych decyzji, nazywał się:","a":"Trybun ludowy","ex":"Jego osoba była nietykalna.","l":0,"k":1},{"t":"f","q":"Prawo trybuna ludowego do zablokowania niekorzystnej decyzji nazywano prawem _______.","a":"weta","acc":[],"ex":"To słowo w łacinie oznacza „zabraniam”.","l":0,"k":1},{"t":"o","q":"Wyjaśnij rolę trybuna ludowego w republice rzymskiej.","a":"Trybun ludowy był urzędnikiem reprezentującym interesy zwykłych obywateli (plebejuszy) i miał prawo weta, czyli mógł zablokować decyzje senatu lub innych urzędników, jeśli uznał je za niekorzystne dla ludu.","l":0,"k":1},{"t":"tf","q":"Juliusz Cezar był rzymskim wodzem i politykiem, którego działania przyczyniły się do końca republiki rzymskiej.","a":true,"ex":"Po nim władzę przejął Oktawian August, pierwszy cesarz.","l":0,"k":1},{"t":"s","q":"Pierwszym rzymskim cesarzem był:","a":"Oktawian August","ex":"Przyjął tytuł „August”, oznaczający „czcigodny”.","l":0,"k":1},{"t":"f","q":"Pierwszym cesarzem rzymskim, który przyjął tytuł „August”, był _______.","a":"Oktawian","acc":[],"ex":"Był przybranym synem Juliusza Cezara.","l":0,"k":1},{"t":"tf","q":"Podstawową jednostką wojska rzymskiego był legion.","a":true,"ex":"Legiony były doskonale wyszkolonymi jednostkami armii rzymskiej.","l":0,"k":1},{"t":"s","q":"Podstawową jednostką organizacyjną armii rzymskiej był:","a":"Legion","ex":"Legiony podbiły większość znanego świata śródziemnomorskiego.","l":0,"k":1},{"t":"s","q":"Do wyższej, uprzywilejowanej grupy społeczeństwa rzymskiego należeli:","a":"Arystokraci (patrycjusze)","ex":"Patrycjusze mieli największy wpływ na politykę.","l":1,"k":1},{"t":"f","q":"Uboższa, liczna grupa wolnych obywateli rzymskich, często pozbawiona majątku, nazywana była _______.","a":"plebejuszami","acc":[],"ex":"Walczyli o swoje prawa polityczne przez wieki republiki.","l":1},{"t":"tf","q":"Niewolnicy w starożytnym Rzymie byli pozbawieni wolności osobistej i traktowani jako własność innych ludzi.","a":true,"ex":"Ich sytuacja i traktowanie mogły się bardzo różnić.","l":1},{"t":"s","q":"Niewolnik, który odzyskał wolność, nazywany był w Rzymie:","a":"Wyzwoleńcem","ex":"Mógł uzyskać wolność np. dzięki wykupieniu się.","l":1,"k":1},{"t":"f","q":"Niewolnik, który uzyskał wolność, nazywany był w starożytnym Rzymie _______.","a":"wyzwoleńcem","acc":[],"ex":"Wyzwoleńcy mieli ograniczone, ale realne prawa.","l":1,"k":1},{"t":"s","q":"Centralny plac Rzymu, będący sercem życia publicznego miasta, nazywał się:","a":"Forum Romanum","ex":"Odbywały się tam m.in. zgromadzenia i sądy.","l":1,"k":1},{"t":"tf","q":"Forum Romanum było centralnym placem starożytnego Rzymu, gdzie toczyło się życie publiczne miasta.","a":true,"ex":"Znajdowały się tam ważne świątynie i budynki publiczne.","l":1,"k":1},{"t":"s","q":"Rzymska budowla wodociągowa, służąca do transportu wody na duże odległości, to:","a":"Akwedukt","ex":"Niektóre akwedukty przetrwały do dziś.","l":2,"k":1},{"t":"f","q":"Budowlę służącą do transportu wody na duże odległości w starożytnym Rzymie nazywano _______.","a":"akweduktem","acc":[],"ex":"Wykorzystywały siłę grawitacji do transportu wody.","l":2,"k":1},{"t":"s","q":"Wielka rzymska budowla przeznaczona do organizowania igrzysk i walk gladiatorów to:","a":"Koloseum (amfiteatr Flawiuszów)","ex":"To jeden z najbardziej znanych zabytków starożytnego Rzymu.","l":1,"k":1},{"t":"tf","q":"Koloseum było amfiteatrem, w którym odbywały się m.in. walki gladiatorów.","a":true,"ex":"Mogło pomieścić dziesiątki tysięcy widzów.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, do czego służyły rzymskie termy i amfiteatry.","a":"Termy były rzymskimi łaźniami publicznymi, pełniącymi też funkcję miejsc spotkań towarzyskich, natomiast amfiteatry (jak Koloseum) służyły do organizowania widowisk publicznych, np. walk gladiatorów czy pokazów zwierząt.","l":1,"k":1},{"t":"s","q":"Powiedzenie „Wszystkie drogi prowadzą do Rzymu” nawiązuje do:","a":"Rozbudowanej sieci dróg budowanych przez Rzymian, łączących całe imperium ze stolicą","ex":"Rzymskie drogi były wzorem inżynierii na wieki.","l":2},{"t":"tf","q":"Rzymianie zbudowali rozbudowaną sieć dróg, łączących odległe prowincje imperium ze stolicą.","a":true,"ex":"Ułatwiało to handel oraz przemieszczanie się wojska.","l":2},{"t":"s","q":"Język, którym posługiwali się starożytni Rzymianie, dający początek m.in. językom romańskim, to:","a":"Łacina","ex":"Z łaciny wywodzą się m.in. włoski, francuski i hiszpański.","l":2,"k":1},{"t":"f","q":"Język starożytnych Rzymian, będący podstawą dla języków romańskich, to _______.","a":"łacina","acc":[],"ex":"Jest wciąż obecna w terminologii naukowej i prawniczej.","l":2,"k":1},{"t":"o","q":"Podaj przykład wpływu starożytnego Rzymu na współczesność.","a":"Np. prawo rzymskie stanowi podstawę wielu współczesnych systemów prawnych, a łacina dała początek językom romańskim (włoskiemu, francuskiemu, hiszpańskiemu i innym) oraz jest wciąż obecna w terminologii naukowej.","l":2,"k":1},{"t":"s","q":"Jezus Chrystus, założyciel chrześcijaństwa, urodził się i działał na terenie:","a":"Rzymskiej prowincji Palestyny","ex":"Palestyna znajdowała się wówczas pod panowaniem rzymskim.","l":3,"k":1},{"t":"tf","q":"Jezus Chrystus żył i nauczał na terenie rzymskiej prowincji, jaką była Palestyna.","a":true,"ex":"To wydarzenia opisane w Nowym Testamencie.","l":3,"k":1},{"t":"s","q":"Apostołowie szczególnie związani z rozpowszechnianiem chrześcijaństwa to m.in.:","a":"Św. Piotr i św. Paweł","ex":"Obaj apostołowie ponieśli śmierć męczeńską w Rzymie.","l":3,"k":1},{"t":"f","q":"Do apostołów szczególnie zasłużonych w rozpowszechnianiu chrześcijaństwa należeli św. Piotr i św. _______.","a":"Paweł","acc":[],"ex":"Św. Paweł odbył liczne podróże misyjne.","l":3,"k":1},{"t":"s","q":"Cesarz rzymski, prześladujący wczesnych chrześcijan, to m.in.:","a":"Neron","ex":"Chrześcijanie byli oskarżani m.in. o pożar Rzymu.","l":3,"k":1},{"t":"tf","q":"Cesarz Neron jest znany m.in. z prześladowania pierwszych chrześcijan w Rzymie.","a":true,"ex":"To jeden z najbardziej znanych przykładów prześladowań religijnych w starożytności.","l":3,"k":1},{"t":"s","q":"Cesarz, za którego panowania chrześcijaństwo zyskało tolerancję prawną w Cesarstwie Rzymskim, to:","a":"Konstantyn Wielki","ex":"Wprowadził tolerancję religijną dla chrześcijan.","l":3,"k":1},{"t":"f","q":"Cesarz, dzięki któremu chrześcijaństwo uzyskało tolerancję religijną w Cesarstwie Rzymskim, to _______ Wielki.","a":"Konstantyn","acc":[],"ex":"To ważny punkt zwrotny w historii chrześcijaństwa.","l":3,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego chrześcijaństwo przetrwało mimo prześladowań w pierwszych wiekach swojego istnienia.","a":"Mimo prześladowań, chrześcijaństwo przyciągało coraz więcej wyznawców dzięki swojemu przesłaniu i wspólnotowemu charakterowi; z czasem, dzięki tolerancji religijnej wprowadzonej przez cesarza Konstantyna Wielkiego, a później uznaniu go za religię państwową, chrześcijaństwo mogło się swobodnie rozwijać i rozprzestrzeniać w całym Cesarstwie Rzymskim.","l":3,"k":1},{"t":"s","q":"Rzymski odpowiednik greckiego boga Posejdona (władcy mórz) to:","a":"Neptun","ex":"Rzymianie nadawali greckim bóstwom własne imiona.","l":1},{"t":"tf","q":"Neptun był rzymskim odpowiednikiem greckiego boga Posejdona, władcy mórz.","a":true,"ex":"Obaj bogowie mieli podobne funkcje i cechy.","l":1},{"t":"s","q":"Rzymski bóg wojny, odpowiednik greckiego Aresa, to:","a":"Mars","ex":"Od jego imienia pochodzi nazwa planety Mars.","l":1},{"t":"f","q":"Rzymskim bogiem wojny, odpowiadającym greckiemu Aresowi, był _______.","a":"Mars","acc":[],"ex":"Był też patronem rzymskich legionistów.","l":1},{"t":"s","q":"Rzymska bogini, opiekunka małżeństw, odpowiadająca greckiej Herze, to:","a":"Junona","ex":"Była żoną Jowisza, władcy bogów.","l":1},{"t":"tf","q":"Junona była rzymską boginią opiekującą się małżeństwami, odpowiadającą greckiej Herze.","a":true,"ex":"Uznawano ją za królową bogów rzymskich.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego wielu rzymskich bogów miało swoje odpowiedniki wśród bogów greckich.","a":"Rzymianie przejęli wiele elementów kultury i religii greckiej, w tym wierzenia w bogów — nadawali greckim bóstwom rzymskie imiona (np. Zeus stał się Jowiszem, Posejdon Neptunem), zachowując przy tym podobne funkcje i cechy tych bóstw.","l":1},{"t":"s","q":"W sytuacji poważnego zagrożenia republiki rzymskiej jej obywatele mogli powołać na krótki czas:","a":"Dyktatora, z nadzwyczajnymi uprawnieniami","ex":"Jego władza była ograniczona czasowo, w odróżnieniu od późniejszych cesarzy.","l":0},{"t":"tf","q":"W sytuacji zagrożenia republiki rzymskiej jej obywatele powoływali dyktatora z nadzwyczajnymi, czasowymi uprawnieniami.","a":true,"ex":"Miało to pomóc szybko zażegnać kryzys, np. wojenny.","l":0},{"t":"s","q":"Akwedukty w starożytnym Rzymie umożliwiały:","a":"Dostarczanie wody do miast z odległych, górskich źródeł","ex":"Niektóre akwedukty liczyły dziesiątki kilometrów długości.","l":2,"k":1},{"t":"o","q":"Wyjaśnij, jakie znaczenie miała gęsta sieć rzymskich dróg dla funkcjonowania imperium.","a":"Sieć dobrych dróg umożliwiała sprawne przemieszczanie się wojska, kupców i podróżników między różnymi częściami rozległego imperium, co ułatwiało zarówno obronę granic, jak i wymianę handlową oraz sprawne zarządzanie odległymi prowincjami.","l":2},{"t":"s","q":"Panteon w starożytnym Rzymie był:","a":"Świątynią poświęconą wszystkim bogom rzymskim","ex":"Jego kopuła jest architektonicznym osiągnięciem starożytności.","l":2,"k":1},{"t":"f","q":"Rzymska świątynia poświęcona wszystkim bogom nazywała się _______.","a":"Panteonem","acc":[],"ex":"Zachowała się do dziś w bardzo dobrym stanie.","l":2,"k":1},{"t":"tf","q":"Panteon był rzymską świątynią poświęconą wszystkim bogom.","a":true,"ex":"Jego nazwa dosłownie oznacza „wszystkim bogom”.","l":2,"k":1},{"t":"o","q":"Uporządkuj chronologicznie: powstanie Rzymu, zamordowanie Juliusza Cezara, powstanie chrześcijaństwa, upadek zachodniego Cesarstwa Rzymskiego.","a":"Kolejność chronologiczna: powstanie Rzymu (753 r. p.n.e.) → zamordowanie Juliusza Cezara (44 r. p.n.e.) → powstanie chrześcijaństwa (I wiek n.e.) → upadek zachodniego Cesarstwa Rzymskiego (476 r. n.e.).","l":null,"k":1},{"t":"s","q":"Do dokonań Juliusza Cezara zalicza się m.in.:","a":"Reformę armii rzymskiej i gromadzenie w swoim ręku najważniejszych urzędów","ex":"Jego działania przyczyniły się do upadku republiki.","l":0},{"t":"tf","q":"Juliusz Cezar przyczynił się do obalenia republiki rzymskiej, gromadząc w swoim ręku najważniejsze urzędy państwowe.","a":true,"ex":"Po nim władzę przejął jego przybrany syn, Oktawian August.","l":0,"k":1},{"t":"s","q":"Igrzyska w rzymskim Koloseum obejmowały m.in.:","a":"Walki gladiatorów","ex":"Widowiska te przyciągały tysiące widzów.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego chrześcijanie byli czasem prześladowani w Cesarstwie Rzymskim.","a":"Chrześcijanie odmawiali oddawania boskiej czci posągowi cesarza, co Rzymianie traktowali jako brak lojalności wobec państwa i bogów — to właśnie odmowa udziału w kulcie cesarza, a nie zwykłe przestępstwa, była częstą przyczyną ich prześladowań.","l":3},{"t":"s","q":"Prawo rzymskie jest dziś uznawane za:","a":"Podstawę wielu współczesnych systemów prawnych na świecie","ex":"Jego zasady wpłynęły na prawo wielu krajów europejskich.","l":2,"k":1},{"t":"tf","q":"Prawo rzymskie stanowi do dziś podstawę wielu współczesnych systemów prawnych na świecie.","a":true,"ex":"To jedno z trwałych dziedzictw starożytnego Rzymu.","l":2,"k":1},{"t":"w","q":"republika","a":"Państwo, w którym władzę sprawują wybierani urzędnicy, a nie król.","l":0,"k":1},{"t":"w","q":"senat","a":"Rada starszych w Rzymie, ważny organ władzy w republice.","l":0,"k":1},{"t":"w","q":"konsul","a":"Najwyższy urzędnik republiki rzymskiej, wybierany na rok.","l":0,"k":1},{"t":"w","q":"legion","a":"Podstawowa jednostka armii rzymskiej.","l":0,"k":1},{"t":"w","q":"cesarz","a":"Jedyny władca imperium rzymskiego po upadku republiki.","l":0,"k":1},{"t":"w","q":"patrycjusze","a":"Zamożna arystokracja rzymska.","l":1,"k":1},{"t":"w","q":"plebejusze","a":"Zwykła ludność wolna w Rzymie.","l":1,"k":1},{"t":"w","q":"gladiator","a":"Walczący na arenie niewolnik lub jeniec, zwykle w Koloseum.","l":1,"k":1},{"t":"w","q":"akwedukt","a":"Rzymska budowla doprowadzająca wodę do miasta.","l":2,"k":1},{"t":"w","q":"forum","a":"Główny plac w rzymskim mieście, centrum życia politycznego i handlu.","l":1,"k":1},{"t":"w","q":"Koloseum","a":"Wielki amfiteatr w Rzymie, miejsce walk gladiatorów.","l":1,"k":1},{"t":"w","q":"katakumby","a":"Podziemne korytarze, w których chrześcijanie chowali zmarłych.","l":3,"k":1},{"t":"w","q":"chrześcijaństwo","a":"Religia oparta na nauce Jezusa Chrystusa.","l":3,"k":1},{"t":"w","q":"imperium","a":"Wielkie państwo obejmujące wiele podbitych krajów.","l":0,"k":1},{"t":"f","q":"Rzym według legendy założono w _______ r. p.n.e.","a":"753","acc":["753 p.n.e."],"ex":"Założycielami mieli być Romulus i Remus, wykarmieni przez wilczycę.","l":0,"k":1},{"t":"o","q":"Podaj kluczowe daty z dziejów Rzymu.","a":"753 p.n.e. – założenie Rzymu; ok. 500 p.n.e. – republika; 49 p.n.e. – Juliusz Cezar obala republikę; 30 p.n.e.–14 n.e. – rządy Oktawiana Augusta, pierwszego cesarza; 476 n.e. – upadek cesarstwa zachodniego.","l":0,"k":1},{"t":"o","q":"Kim był Juliusz Cezar?","a":"Rzymskim wodzem, który w 49 p.n.e. obalił republikę. W 44 p.n.e. został zamordowany.","l":0,"k":1},{"t":"o","q":"Kim był Oktawian August?","a":"Pierwszym cesarzem rzymskim, rządził w latach 30 p.n.e.–14 n.e.","l":0,"k":1},{"t":"o","q":"Kto rządził w republice rzymskiej?","a":"Zgromadzenia ludowe, urzędnicy (np. dwóch konsulów wybieranych na rok) i senat (dożywotnio). Realną władzę miała arystokracja.","l":0,"k":1},{"t":"o","q":"Do czego miał prawo trybun ludu?","a":"Do weta, czyli sprzeciwu wobec decyzji urzędników.","l":0,"k":1},{"t":"tf","q":"Republika rzymska była ustrojem demokratycznym.","a":false,"ex":"Rządziła arystokracja.","l":0},{"t":"o","q":"Ilu żołnierzy liczył legion i jak wyglądał legionista?","a":"4,5–6 tys. żołnierzy. Legionista: hełm, pancerz, tarcza, krótki miecz, oszczep, sandały.","l":0,"k":1},{"t":"o","q":"Kiedy Imperium Rzymskie było największe i jaki język tam obowiązywał?","a":"W II wieku n.e.; językiem była łacina.","l":0,"k":1},{"t":"o","q":"Na jakie grupy dzielili się mieszkańcy Rzymu?","a":"Ludzie wolni (arystokraci, kupcy, rzemieślnicy i wolni chłopi, proletariusze, wyzwoleńcy) oraz niewolnicy.","l":1,"k":1},{"t":"o","q":"Kim byli arystokraci, a kim proletariusze?","a":"Arystokraci – bogaci, mieszkali w willach, nie pracowali fizycznie. Proletariusze – biedni, mieszkali w kamienicach, dostawali darmową żywność i igrzyska.","l":1,"k":1},{"t":"o","q":"Skąd brali się niewolnicy w Rzymie?","a":"Jeńcy wojenni, ludzie porwani przez piratów, dłużnicy i dzieci niewolników.","l":1},{"t":"o","q":"Dlaczego niewolników nazywano „narzędziami mówiącymi”?","a":"Bo traktowano ich jak przedmioty, nie mieli żadnych praw.","l":1},{"t":"o","q":"Kim byli wyzwoleńcy?","a":"Dawnymi niewolnikami, którzy odzyskali wolność.","l":1,"k":1},{"t":"o","q":"Jak nazywano Rzym i do czego służyły akwedukty?","a":"Wiecznym Miastem. Akwedukty doprowadzały wodę do miasta.","l":1,"k":1},{"t":"o","q":"Czym było Forum Romanum?","a":"Centrum Rzymu – placem z budynkami publicznymi, miejscem spotkań, handlu i zgromadzeń.","l":2,"k":1},{"t":"o","q":"Do czego służyło Koloseum?","a":"Do walk gladiatorów; był to amfiteatr na ok. 45 tys. widzów, zbudowany za Flawiuszów.","l":2,"k":1},{"t":"o","q":"Do czego służył Circus Maximus?","a":"Do wyścigów rydwanów; mieścił ok. 250 tys. widzów.","l":2},{"t":"o","q":"Do czego służyły termy?","a":"Do kąpieli, ale też spotkań i rozrywki.","l":2},{"t":"o","q":"Co wyróżniało Panteon?","a":"Wielka kopuła; świątynia wszystkich bogów, zbudowana z betonu.","l":2,"k":1},{"t":"o","q":"Jakie osiągnięcia budowlane zawdzięczamy Rzymianom?","a":"Drogi (ok. 80 tys. km), akwedukty, łuki triumfalne, beton, kopuły.","l":2,"k":1},{"t":"o","q":"Co zawdzięczamy Rzymianom w dziedzinie prawa i języka?","a":"Prawo rzymskie, na którym oparto późniejsze prawo, oraz łacinę, z której powstały języki romańskie (włoski, francuski, hiszpański, portugalski, rumuński).","l":2,"k":1},{"t":"o","q":"Kim byli Wergiliusz, Horacy i Owidiusz?","a":"Rzymskimi poetami. Wergiliusz napisał „Eneidę”.","l":2},{"t":"f","q":"Przysłowie mówi: „Wszystkie drogi prowadzą do _______”.","a":"Rzymu","acc":[],"ex":"Rzymianie zbudowali sieć dróg.","l":2},{"t":"o","q":"Jak nazywali się rzymscy odpowiednicy Zeusa, Ateny, Posejdona i Afrodyty?","a":"Jowisz, Minerwa, Neptun i Wenus.","l":3},{"t":"o","q":"Czego Rzymianie wymagali od Żydów i dlaczego mieli z nimi konflikt?","a":"Składania ofiar rzymskim bogom i oddawania boskiej czci cesarzowi. Żydzi wierzyli w jednego Boga (monoteizm).","l":3},{"t":"o","q":"Kim był Jezus z Nazaretu?","a":"Założycielem chrześcijaństwa. Ukrzyżowano go w Jerozolimie ok. 30 r. n.e. Chrześcijanie wierzą, że zmartwychwstał.","l":3,"k":1},{"t":"o","q":"Co to są Ewangelie?","a":"Cztery księgi opisujące życie i nauczanie Jezusa.","l":3,"k":1},{"t":"o","q":"Kim byli apostołowie i św. Paweł?","a":"Apostołowie – uczniowie Jezusa, którzy głosili jego naukę. Paweł prowadził misje wśród pogan.","l":3,"k":1},{"t":"o","q":"Dlaczego cesarz Neron prześladował chrześcijan?","a":"Obwiniał ich o pożar Rzymu w 64 r. n.e.","l":3,"k":1},{"t":"f","q":"W _______ r. cesarz Konstantyn Wielki ogłosił wolność religii.","a":"313","acc":[],"ex":"Edykt mediolański; w 380 r. chrześcijaństwo stało się religią państwową.","l":3,"k":1}],"lessons":["Od republiki do cesarstwa","Społeczeństwo antycznego Rzymu","Osiągnięcia starożytnych Rzymian","Narodziny chrześcijaństwa"]},{"id":"h4","title":"Czasy średniowiecza","icon":"⛪","q":[{"t":"s","q":"Data 476 r. n.e. wiąże się z:","a":"Upadkiem zachodniego cesarstwa rzymskiego","ex":"To umowna data uznawana za koniec starożytności.","l":0,"k":1},{"t":"tf","q":"Rok 476 uznaje się za koniec zachodniego cesarstwa rzymskiego, co często przyjmuje się jako umowny początek średniowiecza.","a":true,"ex":"To ważna cezura w periodyzacji historii.","l":0,"k":1},{"t":"s","q":"Wschodnia część dawnego Cesarstwa Rzymskiego, ze stolicą w Konstantynopolu, przetrwała jako:","a":"Cesarstwo Bizantyjskie","ex":"Przetrwało tysiąc lat dłużej niż zachodnia część cesarstwa.","l":0,"k":1},{"t":"f","q":"Wschodnia część dawnego Cesarstwa Rzymskiego przetrwała jako Cesarstwo _______.","a":"Bizantyjskie","acc":[],"ex":"Jego stolicą był Konstantynopol.","l":0},{"t":"s","q":"Stolicą Cesarstwa Bizantyjskiego był:","a":"Konstantynopol","ex":"Miasto to dziś nazywa się Stambuł.","l":0,"k":1},{"t":"tf","q":"Konstantynopol, stolica Bizancjum, bywał nazywany „Nowym Rzymem”.","a":true,"ex":"Podkreślało to ciągłość z tradycją rzymską.","l":0,"k":1},{"t":"s","q":"Cesarz bizantyjski znany m.in. z kodyfikacji prawa rzymskiego to:","a":"Justynian Wielki","ex":"Jego dzieło prawne wywarło ogromny wpływ na późniejsze prawo europejskie.","l":0,"k":1},{"t":"f","q":"Cesarz bizantyjski, który usystematyzował prawo rzymskie, tworząc tzw. Kodeks Justyniana, to _______ Wielki.","a":"Justynian","acc":[],"ex":"Kodeks ten był podstawą prawa przez wieki.","l":0,"k":1},{"t":"s","q":"Wspaniała świątynia wzniesiona w Konstantynopolu za czasów Justyniana to:","a":"Hagia Sophia","ex":"To arcydzieło architektury bizantyjskiej.","l":0,"k":1},{"t":"tf","q":"Hagia Sophia to wspaniała świątynia wzniesiona w Konstantynopolu.","a":true,"ex":"Później została przekształcona w meczet, a dziś jest muzeum/meczetem.","l":0,"k":1},{"t":"s","q":"Rozłam chrześcijaństwa na Kościół katolicki i prawosławny, zwany wielką schizmą wschodnią, miał miejsce w:","a":"1054 roku","ex":"Od tego czasu chrześcijaństwo zachodnie i wschodnie idą osobnymi drogami.","l":0,"k":1},{"t":"f","q":"Rozłam chrześcijaństwa na Kościół katolicki i prawosławny nazywamy wielką schizmą _______.","a":"wschodnią","acc":[],"ex":"Do dziś oba Kościoły pozostają rozdzielone.","l":0,"k":1},{"t":"o","q":"Wyjaśnij, na czym polegała wielka schizma wschodnia.","a":"Wielka schizma wschodnia to rozłam w chrześcijaństwie, do którego doszło w 1054 roku, w wyniku sporu o pierwszeństwo w Kościele między papieżem rzymskim a patriarchą Konstantynopola — od tego momentu chrześcijaństwo podzieliło się na Kościół katolicki (zachodni) i Kościół prawosławny (wschodni).","l":0,"k":1},{"t":"s","q":"Rok 1453 wiąże się z:","a":"Upadkiem Konstantynopola i Cesarstwa Bizantyjskiego","ex":"Miasto zdobyli wtedy Turcy osmańscy.","l":0,"k":1},{"t":"tf","q":"Konstantynopol, a wraz z nim Cesarstwo Bizantyjskie, upadło w 1453 roku.","a":true,"ex":"To zakończyło ponad tysiącletnią historię tego cesarstwa.","l":0,"k":1},{"t":"s","q":"Twórcą religii islamskiej był:","a":"Mahomet","ex":"Uznawany jest przez muzułmanów za proroka.","l":1,"k":1},{"t":"f","q":"Twórcą islamu, uznawanym przez muzułmanów za proroka, był _______.","a":"Mahomet","acc":[],"ex":"Żył na Półwyspie Arabskim w VII wieku.","l":1,"k":1},{"t":"s","q":"Święta księga islamu nazywa się:","a":"Koran","ex":"Zawiera zasady wiary i życia muzułmanów.","l":1,"k":1},{"t":"tf","q":"Koran jest świętą księgą islamu.","a":true,"ex":"Muzułmanie wierzą, że jest to słowo objawione Mahometowi.","l":1,"k":1},{"t":"s","q":"Ucieczka Mahometa z Mekki do Medyny w 622 roku nazywana jest:","a":"Hidżrą","ex":"Od tego wydarzenia liczy się kalendarz muzułmański.","l":1,"k":1},{"t":"f","q":"Ucieczka Mahometa z Mekki do Medyny w 622 roku, od której liczy się początek kalendarza muzułmańskiego, nazywana jest _______.","a":"hidżrą","acc":[],"ex":"To kluczowe wydarzenie w historii islamu.","l":1,"k":1},{"t":"s","q":"Wyznawcę islamu nazywamy:","a":"Muzułmaninem","ex":"Islam jest dziś jedną z największych religii świata.","l":1},{"t":"tf","q":"Wyznawców islamu nazywamy muzułmanami.","a":true,"ex":"Ich świętą księgą jest Koran.","l":1},{"t":"o","q":"Wyjaśnij, jaki wpływ na Europę miała cywilizacja arabska w średniowieczu.","a":"Cywilizacja arabska przekazała Europie m.in. osiągnięcia naukowe (np. w matematyce i astronomii), zachowała i przetłumaczyła wiele dzieł starożytnych filozofów greckich, a także wprowadziła nowe technologie i towary, wpływając na rozwój europejskiej nauki i kultury.","l":1},{"t":"s","q":"Ludem, który pod wodzą Karola Wielkiego zbudował rozległe państwo w zachodniej Europie, byli:","a":"Frankowie","ex":"Państwo Franków obejmowało znaczną część zachodniej Europy.","l":2},{"t":"tf","q":"Karol Wielki był władcą ludu Franków, który zbudował rozległe państwo w zachodniej Europie.","a":true,"ex":"Jego imperium obejmowało m.in. dzisiejszą Francję i Niemcy.","l":2},{"t":"s","q":"Karol Wielki został koronowany na cesarza w roku:","a":"800","ex":"Koronacji dokonał papież w Rzymie.","l":2},{"t":"f","q":"Karol Wielki został koronowany na cesarza w roku _______.","a":"800","acc":[],"ex":"To symboliczne odnowienie idei cesarstwa zachodniego.","l":2},{"t":"tf","q":"Pepin Krótki, ojciec Karola Wielkiego, zawarł ważne porozumienie z papieżem, przyczyniając się do powstania Państwa Kościelnego.","a":true,"ex":"To umocniło sojusz między Frankami a papiestwem.","l":2,"k":1},{"t":"o","q":"Wyjaśnij znaczenie koronacji Karola Wielkiego na cesarza w 800 roku.","a":"Koronacja Karola Wielkiego na cesarza w 800 roku symbolicznie odnawiała ideę zachodniego cesarstwa rzymskiego (które upadło w 476 roku), umacniając pozycję Karola Wielkiego jako najważniejszego władcy w zachodniej Europie i podkreślając bliski związek między władzą świecką a Kościołem.","l":2,"k":1},{"t":"s","q":"Władca, który w 962 roku doprowadził do powstania Świętego Cesarstwa Rzymskiego, to:","a":"Otton I","ex":"Nawiązywał w ten sposób do tradycji cesarstwa Karola Wielkiego.","l":3,"k":1},{"t":"f","q":"Święte Cesarstwo Rzymskie powstało w roku _______, za sprawą króla Ottona I.","a":"962","acc":[],"ex":"Cesarstwo to przetrwało, w różnych formach, do początku XIX wieku.","l":3,"k":1},{"t":"tf","q":"Otton I doprowadził do powstania Świętego Cesarstwa Rzymskiego w 962 roku.","a":true,"ex":"To nawiązywało do idei cesarstwa Karola Wielkiego.","l":3,"k":1},{"t":"s","q":"Spór między władcami świeckimi (cesarzami) a papieżami o prawo mianowania biskupów nazywano sporem o:","a":"Inwestyturę","ex":"To ważny konflikt między władzą świecką a kościelną w średniowieczu.","l":4,"k":1},{"t":"f","q":"Prawo do nadawania urzędu kościelnego (np. biskupiego) nazywano _______.","a":"inwestyturą","acc":[],"ex":"O to prawo spierali się cesarze i papieże.","l":4,"k":1},{"t":"s","q":"Spór o inwestyturę między cesarzem a papieżem zakończył się ugodą zawartą w:","a":"Wormacji, w 1122 roku","ex":"Ugoda ta częściowo rozstrzygnęła spór o inwestyturę.","l":4,"k":1},{"t":"tf","q":"Spór o inwestyturę między cesarzem a papieżem zakończył się ugodą w Wormacji w 1122 roku.","a":true,"ex":"To zakończyło jeden z ważniejszych konfliktów wczesnego średniowiecza.","l":4,"k":1},{"t":"o","q":"Wyjaśnij, na czym polegał spór o inwestyturę między cesarzem a papieżem.","a":"Spór o inwestyturę dotyczył tego, kto ma prawo mianować (obsadzać) biskupów i opatów — cesarz uważał, że ma do tego prawo jako władca świecki, natomiast papież i Kościół twierdzili, że nominacje kościelne powinny należeć wyłącznie do władzy duchownej; spór ten zakończyła ugoda w Wormacji w 1122 roku.","l":4,"k":1},{"t":"w","q":"średniowiecze","a":"Epoka w dziejach Europy trwająca mniej więcej od V do XV wieku.","l":null,"k":1},{"t":"w","q":"chrystianizacja","a":"Szerzenie wiary chrześcijańskiej wśród ludów pogańskich.","l":null,"k":1},{"t":"w","q":"papież","a":"Głowa Kościoła katolickiego.","l":4,"k":1},{"t":"w","q":"klasztor","a":"Zabudowania, w których mieszkają zakonnicy lub zakonnice.","l":null,"k":1},{"t":"w","q":"mnich","a":"Zakonnik żyjący według reguły zakonnej, zwykle w klasztorze.","l":null,"k":1},{"t":"w","q":"wyprawa krzyżowa","a":"Wyprawa rycerzy z Europy do Ziemi Świętej w celu jej odzyskania.","l":5,"k":1},{"t":"w","q":"Karol Wielki","a":"Frankijski władca koronowany na cesarza w 800 roku.","l":2,"k":1},{"t":"w","q":"islam","a":"Religia założona przez Mahometa.","l":1,"k":1},{"t":"w","q":"herb","a":"Znak rodu lub miasta, umieszczany na tarczy.","l":null,"k":1},{"t":"w","q":"zamek","a":"Warowna siedziba możnego rycerza lub władcy.","l":null,"k":1},{"t":"o","q":"Jak nazywano mieszkańców Skandynawii, którzy w średniowieczu wyprawiali się łodziami po innych krajach?","a":"Wikingami (Normanami).","l":3},{"t":"o","q":"Czym zajmowali się Wikingowie?","a":"Dokonywali łupieżczych wypraw, uprawiali handel i zakładali osady.","l":3},{"t":"o","q":"Co wydarzyło się w 1066 r. w Anglii?","a":"Normanowie pod wodzą Wilhelma Zdobywcy pokonali Anglosasów w bitwie pod Hastings i zdobyli Anglię.","l":3},{"t":"o","q":"Jak nazywano państwo, którego władcą został w 962 r. Otton I?","a":"Świętym Cesarstwem Rzymskim.","l":3,"k":1},{"t":"o","q":"Co to był Konstantynopol i gdzie leżał?","a":"Stolica Cesarstwa Bizantyjskiego (dawne Bizancjum) nad Bosforem.","l":0,"k":1},{"t":"o","q":"Jakie daty wiążą się z Cesarstwem Bizantyjskim?","a":"395 – podział Imperium; 527–565 – Justynian Wielki; 1054 – wielka schizma; 1453 – zdobycie Konstantynopola przez Turków.","l":0,"k":1},{"t":"o","q":"Jakim językiem posługiwano się w Bizancjum?","a":"Greckim.","l":0},{"t":"o","q":"Czym zasłynął Justynian Wielki?","a":"Kodeksem Justyniana (zbiorem prawa) i budową Hagia Sophia.","l":0,"k":1},{"t":"o","q":"Co to są ikony i mozaiki?","a":"Ikony to święte obrazy; mozaiki to obrazy z kolorowych kamyków (np. w Rawennie).","l":0},{"t":"o","q":"Kto stał na czele Kościoła na Wschodzie, a kto na Zachodzie?","a":"Na Wschodzie patriarcha, na Zachodzie papież.","l":0},{"t":"o","q":"Kogo nazywamy prawosławnymi, a kogo katolikami?","a":"Prawosławni to wierni Kościoła wschodniego, katolicy – zachodniego. Podział nastąpił w 1054 r.","l":0,"k":1},{"t":"o","q":"Gdzie narodził się islam i kim był Mahomet?","a":"Na Półwyspie Arabskim, w Mekce. Mahomet (ur. ok. 570) był prorokiem, który otrzymał objawienie od archanioła Gabriela.","l":1,"k":1},{"t":"o","q":"Co znajdowało się w Al-Kabie w Mekce?","a":"Czarny Kamień.","l":1},{"t":"f","q":"Hidżra to ucieczka Mahometa z Mekki do Medyny w _______ r.","a":"622","acc":[],"ex":"Od tego roku liczą lata muzułmanie.","l":1,"k":1},{"t":"o","q":"Wymień pięć filarów islamu.","a":"Wyznanie wiary, modlitwa 5 razy dziennie, jałmużna, post (ramadan), pielgrzymka do Mekki.","l":1,"k":1},{"t":"o","q":"Co to jest Koran i kalif?","a":"Koran – święta księga islamu. Kalif – następca Mahometa, przywódca muzułmanów.","l":1,"k":1},{"t":"o","q":"Co Europa zawdzięcza światu arabskiemu?","a":"Cyfry arabskie, wiedzę medyczną, tłumaczenia dzieł, słowa (np. alkohol, cukier, gitara).","l":1},{"t":"o","q":"Kim byli Frankowie i kto ich ochrzcił?","a":"Germańskim ludem. Ochrzcił ich król Chlodwig.","l":2,"k":1},{"t":"o","q":"Czym zasłynął Pepin Krótki?","a":"Wsparł papieża i otrzymał od niego poparcie; stworzono Państwo Kościelne (Watykan).","l":2,"k":1},{"t":"f","q":"Karol Wielki rządził w latach 768–_______.","a":"814","acc":[],"ex":"Cesarzem został koronowany w 800 r. przez papieża.","l":2},{"t":"o","q":"Na czym polegało odrodzenie karolińskie?","a":"Karol zakładał szkoły (m.in. pałacową), nauczano siedmiu sztuk wyzwolonych, kopiści przepisywali księgi.","l":2},{"t":"o","q":"Gdzie Karol Wielki najchętniej przebywał?","a":"W Akwizgranie.","l":2},{"t":"o","q":"Co postanowił traktat w Verdun (843)?","a":"Podział państwa Karola Wielkiego na trzy królestwa między jego wnuków (Lotara, Ludwika Niemieckiego, Karola Łysego).","l":3,"k":1},{"t":"o","q":"Kto najeżdżał Europę po rozpadzie państwa Karola?","a":"Normanowie (wikingowie), Węgrzy i arabscy piraci.","l":3},{"t":"o","q":"Co wydarzyło się w 955 roku?","a":"Otton I pokonał Węgrów w bitwie na Lechowym Polu.","l":3,"k":1},{"t":"o","q":"Kto został koronowany w 962 r. i co to oznaczało?","a":"Otton I Wielki został koronowany na cesarza; powstało Święte Cesarstwo Rzymskie.","l":3,"k":1},{"t":"o","q":"Jakie państwa słowiańskie powstały w X wieku?","a":"Państwo Polan (Polska), Czechy, Ruś Kijowska.","l":3},{"t":"o","q":"Co to jest inwestytura?","a":"Nadawanie urzędów kościelnych (wręczanie pierścienia i pastorału).","l":4,"k":1},{"t":"o","q":"Jaki był skutek reformy kluniackiej?","a":"Walka z nadużyciami w Kościele; w 1059 r. ustalono, że papieża wybierają kardynałowie (konklawe).","l":4},{"t":"o","q":"Kto spierał się w XI w. o inwestyturę?","a":"Papież Grzegorz VII i cesarz Henryk IV.","l":4,"k":1},{"t":"o","q":"Co wydarzyło się w Canossie?","a":"W 1077 r. Henryk IV, obłożony klątwą (1076), upokorzył się przed papieżem i prosił o zdjęcie klątwy.","l":4},{"t":"o","q":"Jak zakończył się spór o inwestyturę?","a":"Ugodą w Wormacji (1122): biskupów wybierali księża, cesarz zrezygnował z inwestytury, ale w Niemczech zachował wpływ na wybór.","l":4,"k":1},{"t":"o","q":"Co to jest krucjata?","a":"Wyprawa krzyżowa, czyli wojenna wyprawa rycerzy chrześcijańskich do Ziemi Świętej.","l":5,"k":1},{"t":"o","q":"Kto i kiedy ogłosił pierwszą krucjatę?","a":"Papież Urban II na synodzie w Clermont w 1095 r.","l":5,"k":1},{"t":"o","q":"Jakie były przyczyny wypraw krzyżowych?","a":"Pomoc Bizancjum zagrożonemu przez Turków seldżuckich, odzyskanie Ziemi Świętej, chęć łupów i ziemi, ucieczka przed głodem.","l":5},{"t":"f","q":"W _______ r. krzyżowcy zdobyli Jerozolimę.","a":"1099","acc":[],"ex":"Powstało Królestwo Jerozolimskie.","l":5,"k":1},{"t":"o","q":"Co działo się w 1204 i 1291 r.?","a":"1204 – IV krucjata zdobyła Konstantynopol; 1291 – upadek Akki, końca państw krzyżowców.","l":5,"k":1},{"t":"o","q":"Ile było krucjat i jakie były ich skutki?","a":"Siedem. Skutki: wrogość chrześcijan i muzułmanów, pogłębienie rozłamu, osłabienie Bizancjum, powstanie zakonów rycerskich, rozwój handlu.","l":5,"k":1},{"t":"o","q":"Co to są zakony rycerskie?","a":"Zakony łączące życie mnichów i rycerzy, np. templariusze, joannici i krzyżacy.","l":5}],"lessons":["Cesarstwo bizantyjskie","Początki islamu","Państwo Karola Wielkiego","Nowe państwa w Europie","Walka cesarza z papieżem","Wyprawy krzyżowe"]},{"id":"h5","title":"Społeczeństwo średniowiecznej Europy","icon":"🏰","q":[{"t":"s","q":"System społeczno-polityczny średniowiecznej Europy, oparty na zależnościach lennych, nazywamy:","a":"Feudalizmem","ex":"Opierał się na wzajemnych zobowiązaniach seniora i wasala.","l":0,"k":1},{"t":"tf","q":"Feudalizm to system oparty na zależnościach między seniorem a wasalem, powiązanych nadaniem ziemi (lenna).","a":true,"ex":"To podstawa organizacji społecznej średniowiecznej Europy.","l":0,"k":1},{"t":"s","q":"Ziemię nadawaną wasalowi przez seniora w zamian za służbę nazywano:","a":"Lennem","ex":"Lenno wiązało się z konkretnymi zobowiązaniami.","l":0,"k":1},{"t":"f","q":"Ziemię nadawaną w systemie feudalnym w zamian za służbę wojskową nazywano _______.","a":"lennem","acc":[],"ex":"To podstawa relacji między seniorem a wasalem.","l":0},{"t":"s","q":"Możny pan nadający lenno w zamian za służbę nazywano:","a":"Seniorem","ex":"Senior stał wyżej w hierarchii feudalnej.","l":0,"k":1},{"t":"s","q":"Osobę otrzymującą lenno w zamian za wierną służbę seniorowi nazywano:","a":"Wasalem","ex":"Wasal zobowiązywał się do wierności wobec seniora.","l":0,"k":1},{"t":"tf","q":"W systemie feudalnym senior nadawał lenno wasalowi, który w zamian zobowiązywał się do wierności i służby, np. wojskowej.","a":true,"ex":"To wzajemne zobowiązanie było podstawą feudalizmu.","l":0,"k":1},{"t":"o","q":"Wyjaśnij zależność między seniorem a wasalem w systemie feudalnym.","a":"Senior nadawał wasalowi ziemię (lenno) w zamian za złożenie hołdu lennego i zobowiązanie się do wierności oraz służby, najczęściej wojskowej — to wzajemne zobowiązanie stanowiło podstawę systemu feudalnego.","l":0,"k":1},{"t":"s","q":"Uroczystość, podczas której wasal zobowiązywał się do wierności wobec seniora, nazywano:","a":"Hołdem lennym","ex":"Odbywała się w formie uroczystej przysięgi.","l":0,"k":1},{"t":"f","q":"Uroczystość składania zobowiązania wierności przez wasala wobec seniora nazywano hołdem _______.","a":"lennym","acc":[],"ex":"To formalny akt potwierdzający więź feudalną.","l":0,"k":1},{"t":"s","q":"Podział feudalnych ziem na coraz mniejsze, niezależne od siebie jednostki nazywamy:","a":"Rozdrobnieniem feudalnym","ex":"To osłabiało centralną władzę monarchy.","l":0},{"t":"tf","q":"Rozdrobnienie feudalne to podział państwa na liczne, niezależne od siebie jednostki terytorialne rządzone przez lokalnych władców.","a":true,"ex":"Zjawisko to dotknęło również średniowieczną Polskę.","l":0},{"t":"s","q":"Uroczystość, w trakcie której młody mężczyzna oficjalnie stawał się rycerzem, nazywano:","a":"Pasowaniem na rycerza","ex":"Poprzedzały ją lata przygotowań.","l":1},{"t":"f","q":"Uroczyste nadanie tytułu rycerskiego młodemu mężczyźnie nazywano _______ na rycerza.","a":"pasowaniem","acc":[],"ex":"Zwykle towarzyszył temu symboliczny cios mieczem.","l":1},{"t":"s","q":"Widowiskowe zawody rycerskie, sprawdzające umiejętności walki, nazywano:","a":"Turniejami rycerskimi","ex":"Były okazją do zdobycia sławy i nagród.","l":1},{"t":"tf","q":"Turnieje rycerskie były widowiskowymi zawodami sprawdzającymi umiejętności walki rycerzy.","a":true,"ex":"Przyciągały tłumy widzów, w tym możnych panów.","l":1},{"t":"s","q":"Młody chłopiec przygotowujący się do stanu rycerskiego, służący na dworze rycerskim jako pierwszy etap szkolenia, nazywany był:","a":"Paziem","ex":"To pierwszy etap drogi do rycerstwa.","l":1},{"t":"f","q":"Etap szkolenia rycerskiego następujący po byciu paziem, w którym młodzieniec towarzyszył rycerzowi w walce, nazywał się _______.","a":"giermkiem","acc":[],"ex":"Giermek pomagał rycerzowi także poza polem bitwy.","l":1},{"t":"o","q":"Opisz krótko etapy, jakie musiał przejść młody chłopiec, by zostać średniowiecznym rycerzem.","a":"Chłopiec z rodziny rycerskiej najpierw służył jako paź na dworze, ucząc się podstawowych obyczajów i umiejętności, następnie jako giermek towarzyszył doświadczonemu rycerzowi, ucząc się walki, a po odpowiednim przygotowaniu przechodził uroczystość pasowania na rycerza.","l":1},{"t":"s","q":"Warowna budowla, będąca siedzibą rycerza lub możnowładcy w średniowieczu, to:","a":"Zamek","ex":"Pełnił zarówno funkcje mieszkalne, jak i obronne.","l":1},{"t":"tf","q":"Zamek był warowną siedzibą rycerza lub możnowładcy, pełniącą funkcje mieszkalne i obronne.","a":true,"ex":"Wiele zamków przetrwało do dziś jako zabytki.","l":1},{"t":"s","q":"Centralny plac średniowiecznego miasta, wokół którego koncentrowało się życie handlowe, nazywano:","a":"Rynkiem","ex":"To serce życia gospodarczego i społecznego miasta.","l":2},{"t":"f","q":"Centralny plac handlowy średniowiecznego miasta nazywano _______.","a":"rynkiem","acc":[],"ex":"Wokół niego często stały ratusz i kamienice mieszczańskie.","l":2},{"t":"s","q":"Budynek będący siedzibą władz miejskich w średniowiecznym mieście to:","a":"Ratusz","ex":"To symbol samorządności miejskiej.","l":2},{"t":"tf","q":"Ratusz był siedzibą władz miejskich w średniowiecznym mieście.","a":true,"ex":"Zwykle stał na rynku, w centrum miasta.","l":2},{"t":"s","q":"Organizacja zrzeszająca rzemieślników jednego zawodu w średniowiecznym mieście nazywała się:","a":"Cech","ex":"Dbała o jakość wyrobów i szkolenie rzemieślników.","l":2},{"t":"f","q":"Organizacja zrzeszająca rzemieślników jednej profesji w średniowiecznym mieście nazywała się _______.","a":"cechem","acc":[],"ex":"Ustalała m.in. zasady szkolenia od czeladnika do mistrza.","l":2},{"t":"o","q":"Wyjaśnij, jaką rolę pełniły cechy rzemieślnicze w średniowiecznym mieście.","a":"Cechy zrzeszały rzemieślników jednego zawodu, dbając o jakość wykonywanych wyrobów, ustalając zasady szkolenia (od czeladnika do mistrza), regulując ceny oraz broniąc interesów swoich członków wobec władz miasta i konkurencji.","l":2},{"t":"s","q":"Bogatsza, wpływowa grupa mieszczan, sprawująca władzę w mieście, nazywana była:","a":"Patrycjatem","ex":"To najbogatsza warstwa mieszczaństwa.","l":2},{"t":"tf","q":"Patrycjat to bogatsza, wpływowa grupa mieszczan, mająca duży wpływ na władze miejskie.","a":true,"ex":"Zasiadał najczęściej w radzie miejskiej.","l":2},{"t":"s","q":"Obowiązkowa praca chłopa na rzecz pana feudalnego nazywana była:","a":"Pańszczyzną","ex":"Chłop musiał poświęcać część swojego czasu na pracę dla pana.","l":2},{"t":"f","q":"Obowiązkowa, darmowa praca chłopa na polu pana feudalnego nazywana była _______.","a":"pańszczyzną","acc":[],"ex":"Była jednym z głównych obciążeń chłopów w średniowieczu.","l":2},{"t":"s","q":"Danina na rzecz Kościoła, wynosząca dziesiątą część plonów lub dochodów, nazywana była:","a":"Dziesięciną","ex":"Jej nazwa pochodzi od ułamka „jedna dziesiąta”.","l":2},{"t":"tf","q":"Dziesięcina była daniną na rzecz Kościoła, wynoszącą dziesiątą część plonów lub dochodów.","a":true,"ex":"Dotyczyła zarówno chłopów, jak i innych grup społecznych.","l":2},{"t":"o","q":"Wyjaśnij różnicę między pańszczyzną a dziesięciną.","a":"Pańszczyzna to obowiązkowa, darmowa praca chłopa na rzecz pana feudalnego (np. na jego polach), natomiast dziesięcina to danina, zwykle w postaci części plonów, płacona przez ludność na rzecz Kościoła.","l":2},{"t":"s","q":"Święty, twórca reguły zakonnej, na której oparł się zakon benedyktynów, to:","a":"Św. Benedykt","ex":"Jego reguła kładła nacisk na modlitwę i pracę.","l":3},{"t":"tf","q":"Św. Benedykt jest twórcą reguły, na któ
