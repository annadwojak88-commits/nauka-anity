rej oparty jest zakon benedyktynów.","a":true,"ex":"Benedyktyni odegrali ważną rolę w rozwoju kultury średniowiecznej.","l":3},{"t":"f","q":"Twórcą zakonu franciszkanów, kładącego duży nacisk na ubóstwo, był święty _______ z Asyżu.","a":"Franciszek","acc":[],"ex":"Franciszkanie byli tzw. zakonem żebraczym.","l":3},{"t":"s","q":"Wczesnośredniowieczny styl w architekturze, charakteryzujący się grubymi murami i półkolistymi łukami, nazywamy stylem:","a":"Romańskim","ex":"Budowle w tym stylu wyglądają masywnie i solidnie.","l":3},{"t":"tf","q":"Styl romański w architekturze charakteryzował się grubymi murami i półkolistymi łukami.","a":true,"ex":"Poprzedzał styl gotycki w rozwoju architektury średniowiecznej.","l":3},{"t":"s","q":"Późniejszy styl średniowieczny w architekturze, charakteryzujący się ostrołukami i strzelistymi wieżami, nazywamy stylem:","a":"Gotyckim","ex":"Katedry gotyckie są znane ze swojej wysokości i witraży.","l":3},{"t":"f","q":"Styl architektoniczny charakteryzujący się ostrołukami i strzelistymi wieżami nazywamy stylem _______.","a":"gotyckim","acc":[],"ex":"Przykładem są liczne średniowieczne katedry europejskie.","l":3},{"t":"o","q":"Wyjaśnij, czym różni się styl romański od gotyckiego w architekturze średniowiecznej.","a":"Styl romański charakteryzuje się grubymi murami, małymi oknami i półkolistymi łukami, co nadaje budowlom masywny, ciężki wygląd, natomiast styl gotycki cechują ostrołuki, smukłe, wysokie wieże i duże, kolorowe witraże, co sprawia, że budowle gotyckie wydają się lżejsze i bardziej strzeliste.","l":3},{"t":"s","q":"Instytucje szkolnictwa wyższego, powstające w średniowiecznej Europie od XI–XII wieku, nazywano:","a":"Uniwersytetami","ex":"Były ważnymi ośrodkami nauki i kultury.","l":3},{"t":"tf","q":"Uniwersytety, powstające od XI–XII wieku, były ważnymi ośrodkami nauki w średniowiecznej Europie.","a":true,"ex":"Uczono tam m.in. teologii, prawa i medycyny.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego powstanie uniwersytetów było ważnym wydarzeniem w średniowiecznej Europie.","a":"Powstanie uniwersytetów umożliwiło systematyczne kształcenie na wysokim poziomie w takich dziedzinach jak prawo, teologia czy medycyna, przyczyniając się do rozwoju nauki, kultury i wymiany myśli w średniowiecznej Europie, a wykształceni tam ludzie później często obejmowali ważne stanowiska w Kościele i państwie.","l":3},{"t":"w","q":"feudalizm","a":"Ustrój średniowieczny oparty na zależności wasala od seniora.","l":0,"k":1},{"t":"w","q":"lenno","a":"Ziemia nadana przez seniora wasalowi w zamian za służbę.","l":0,"k":1},{"t":"w","q":"wasal","a":"Rycerz zależny od seniora, któremu składał przysięgę wierności.","l":0,"k":1},{"t":"w","q":"senior","a":"Pan nadający lenno wasalowi.","l":0,"k":1},{"t":"w","q":"rycerz","a":"Ciężkozbrojny wojownik średniowieczny walczący konno.","l":1,"k":1},{"t":"w","q":"pasowanie","a":"Uroczystość przyjęcia młodzieńca do stanu rycerskiego.","l":1,"k":1},{"t":"w","q":"turniej","a":"Rycerskie zawody sprawdzające umiejętności walki.","l":1,"k":1},{"t":"w","q":"cech","a":"Organizacja rzemieślników jednego zawodu w mieście.","l":2,"k":1},{"t":"w","q":"lokacja","a":"Założenie miasta lub wsi na określonych prawach.","l":2,"k":1},{"t":"w","q":"pańszczyzna","a":"Obowiązkowa praca chłopa na rzecz pana.","l":2,"k":1},{"t":"w","q":"ratusz","a":"Siedziba władz miasta.","l":2,"k":1},{"t":"w","q":"romański (styl)","a":"Styl w architekturze średniowiecznej z grubymi murami i okrągłymi łukami.","l":3,"k":1},{"t":"w","q":"gotyk","a":"Styl w architekturze z ostrymi łukami i strzelistymi wieżami.","l":3,"k":1},{"t":"w","q":"uniwersytet","a":"Wyższa szkoła, w średniowieczu powstająca w dużych miastach.","l":3,"k":1},{"t":"o","q":"Kim byli senior i wasal?","a":"Senior – właściciel ziemi (król, możnowładca świecki lub duchowny). Wasal – rycerz, który od seniora otrzymał lenno.","l":0,"k":1},{"t":"o","q":"Jakie obowiązki miał wasal wobec seniora?","a":"Udział w wyprawach wojennych, rady i sądy.","l":0,"k":1},{"t":"o","q":"Jakie obowiązki miał senior wobec wasala?","a":"Obrona wasala i opieka nad nim (wasal czerpał dochody z lenna).","l":0,"k":1},{"t":"o","q":"Co to jest hołd lenny?","a":"Uroczysta ceremonia, w której wasal przysięgał wierność seniorowi.","l":0,"k":1},{"t":"o","q":"Czym różnili się wasale od poddanych?","a":"Wasale byli rycerzami związanymi umową z seniorem, a poddani (chłopi pańszczyźniani) podlegali władzy pana.","l":0,"k":1},{"t":"o","q":"Kiedy trwał feudalizm w Europie Zachodniej?","a":"Od IX–X w. do XIV w.","l":0,"k":1},{"t":"o","q":"Kiedy wybuchło powstanie chłopów we Francji?","a":"W 1358 r. (Jakeria, Meaux).","l":0}],"lessons":["Feudalna Europa","Na rycerskim zamku","Średniowieczni mieszczanie i chłopi","Duchowieństwo i kultura średniowiecza"]},{"id":"h6","title":"Polska pierwszych Piastów","icon":"👑","q":[{"t":"s","q":"Ludy słowiańskie, z których wywodzą się m.in. Polacy, zamieszkiwały tereny dzisiejszej Polski od:","a":"Wczesnego średniowiecza","ex":"To okres kształtowania się plemion słowiańskich.","l":0},{"t":"tf","q":"Polanie byli jednym z plemion słowiańskich zamieszkujących ziemie polskie we wczesnym średniowieczu.","a":true,"ex":"Od ich nazwy pochodzi nazwa „Polska”.","l":0},{"t":"s","q":"Dynastia, która jako pierwsza rządziła państwem polskim, nazywała się:","a":"Piastowie","ex":"Rządzili Polską od X do XIV wieku.","l":0},{"t":"f","q":"Pierwsza polska dynastia panująca, od której wywodzi się nazwa najstarszego okresu historii Polski, to _______.","a":"Piastowie","acc":[],"ex":"Rządzili nieprzerwanie przez kilka wieków.","l":0},{"t":"s","q":"Pierwszym historycznym władcą Polski, uznawanym za twórcę państwa polskiego, był:","a":"Mieszko I","ex":"To od niego zaczyna się historia państwowości polskiej.","l":0,"k":1},{"t":"tf","q":"Mieszko I jest uznawany za pierwszego historycznego władcę Polski i twórcę państwa polskiego.","a":true,"ex":"Jego panowanie datuje się na ok. 960–992.","l":0,"k":1},{"t":"s","q":"Mieszko I przyjął chrzest w roku:","a":"966","ex":"To jedna z najważniejszych dat w historii Polski.","l":0,"k":1},{"t":"f","q":"Mieszko I przyjął chrzest w roku _______.","a":"966","acc":[],"ex":"Data ta symbolicznie wyznacza początek historii Polski.","l":0,"k":1},{"t":"s","q":"Żoną Mieszka I, czeską księżniczką, dzięki której doszło do chrztu Polski, była:","a":"Dobrawa","ex":"Jej małżeństwo z Mieszkiem miało duże znaczenie polityczne i religijne.","l":0},{"t":"tf","q":"Dobrawa, czeska księżniczka, była żoną Mieszka I i odegrała ważną rolę w przyjęciu chrztu przez władcę Polski.","a":true,"ex":"Przybyła do Polski już jako chrześcijanka.","l":0},{"t":"o","q":"Wyjaśnij, jakie znaczenie miało przyjęcie chrztu przez Mieszka I dla państwa polskiego.","a":"Przyjęcie chrztu włączyło Polskę do grona państw chrześcijańskich Europy, wzmacniając jej pozycję międzynarodową i chroniąc przed pretekstem do najazdów pod hasłem chrystianizacji; wprowadziło też nową religię, organizację kościelną oraz wpłynęło na rozwój kultury i piśmiennictwa w państwie polskim.","l":0},{"t":"s","q":"Zbrojna drużyna, na której opierała się władza pierwszych Piastów, nazywana jest:","a":"Drużyną książęcą","ex":"To była podstawa militarna władzy pierwszych władców Polski.","l":0},{"t":"tf","q":"Drużyna książęca była zbrojną formacją, na której opierała się władza pierwszych Piastów.","a":true,"ex":"Utrzymanie drużyny wymagało dużych nakładów od państwa.","l":0},{"t":"s","q":"Syn i następca Mieszka I, który jako pierwszy polski władca koronował się na króla, to:","a":"Bolesław Chrobry","ex":"Koronował się w 1025 roku, krótko przed śmiercią.","l":1,"k":1},{"t":"f","q":"Pierwszym koronowanym królem Polski był _______ Chrobry.","a":"Bolesław","acc":[],"ex":"Znacząco umocnił i powiększył terytorium państwa polskiego.","l":1},{"t":"s","q":"Duchowny, którego męczeńska śmierć podczas misji w Prusach w 997 roku miała duże znaczenie dla Polski, to:","a":"Św. Wojciech","ex":"Jego kult przyczynił się do wzrostu znaczenia Gniezna.","l":1},{"t":"tf","q":"Śmierć misyjna św. Wojciecha w Prusach w 997 roku przyczyniła się do wzrostu znaczenia Polski w chrześcijańskiej Europie.","a":true,"ex":"Jego relikwie sprowadzono do Gniezna.","l":1},{"t":"f","q":"Ważne spotkanie Bolesława Chrobrego z cesarzem Ottonem III w 1000 roku nazywamy zjazdem _______.","a":"gnieźnieńskim","acc":[],"ex":"Miało ono duże znaczenie polityczne i kościelne dla Polski.","l":1,"k":1},{"t":"o","q":"Wyjaśnij znaczenie zjazdu gnieźnieńskiego w 1000 roku dla Polski.","a":"Podczas zjazdu gnieźnieńskiego cesarz Otton III odwiedził grób św. Wojciecha, a Bolesław Chrobry umocnił swoją pozycję polityczną — utworzono wtedy samodzielną organizację kościelną w Polsce (arcybiskupstwo w Gnieźnie), co miało duże znaczenie dla niezależności państwa polskiego, zarówno politycznej, jak i kościelnej.","l":1,"k":1},{"t":"s","q":"Bolesław Chrobry koronował się na króla Polski w roku:","a":"1025","ex":"Zmarł niedługo po koronacji.","l":1,"k":1},{"t":"tf","q":"Bolesław Chrobry koronował się na króla Polski w 1025 roku, krótko przed śmiercią.","a":true,"ex":"To ukoronowanie jego wieloletnich starań o wzmocnienie państwa.","l":1,"k":1},{"t":"s","q":"Ważny gród pierwszych Piastów, będący jedną z ich rezydencji, to:","a":"Ostrów Lednicki","ex":"Znajduje się na wyspie na jeziorze Lednica.","l":0},{"t":"f","q":"Ważny gród wczesnopiastowski, znajdujący się na wyspie na jeziorze, to Ostrów _______.","a":"Lednicki","acc":[],"ex":"Archeolodzy odkryli tam ślady wczesnopiastowskiej architektury.","l":0},{"t":"s","q":"Kryzys państwa polskiego po śmierci Bolesława Chrobrego wiązał się z panowaniem:","a":"Mieszka II","ex":"Państwo osłabiły wtedy najazdy sąsiadów i zamieszki wewnętrzne.","l":3,"k":1},{"t":"tf","q":"Za panowania Mieszka II państwo polskie przeżyło poważny kryzys wewnętrzny i zewnętrzny.","a":true,"ex":"Polska utraciła wtedy część zdobyczy Bolesława Chrobrego.","l":3,"k":1},{"t":"s","q":"Władca, który odbudował państwo polskie po kryzysie za czasów Mieszka II, to:","a":"Kazimierz Odnowiciel","ex":"Jego przydomek odzwierciedla dokonania w odbudowie państwa.","l":3,"k":1},{"t":"f","q":"Władca, który odbudował osłabione państwo polskie w połowie XI wieku, nosił przydomek „_______”.","a":"Odnowiciel","acc":[],"ex":"Przywrócił jedność i porządek w państwie.","l":3,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego Kazimierz otrzymał przydomek „Odnowiciel”.","a":"Kazimierz otrzymał ten przydomek, ponieważ po kryzysie i rozpadzie państwa za panowania Mieszka II zdołał odbudować (odnowić) jedność i siłę państwa polskiego, przywracając władzę Piastów i porządek wewnętrzny.","l":3,"k":1},{"t":"s","q":"Ostatni z wielkich władców pierwszych Piastów, który wydał ustawę sukcesyjną dzielącą Polskę między synów, to:","a":"Bolesław Krzywousty","ex":"Jego testament miał zapobiec walkom o władzę.","l":4,"k":1},{"t":"tf","q":"Bolesław Krzywousty wydał ustawę sukcesyjną, dzielącą Polskę na dzielnice między swoich synów.","a":true,"ex":"W praktyce doprowadziło to jednak do rozbicia dzielnicowego.","l":4,"k":1},{"t":"s","q":"Zasada, według której najstarszy z rodu Piastów miał sprawować władzę zwierzchnią nad pozostałymi dzielnicami, nazywała się zasadą:","a":"Senioratu","ex":"Miała utrzymać jedność podzielonego państwa.","l":4,"k":1},{"t":"f","q":"Zasada, według której władzę zwierzchnią miał sprawować najstarszy z rodu, nazywała się zasadą _______.","a":"senioratu","acc":[],"ex":"Wprowadził ją Bolesław Krzywousty w swojej ustawie sukcesyjnej.","l":4,"k":1},{"t":"o","q":"Wyjaśnij, jaki był cel ustawy sukcesyjnej Bolesława Krzywoustego i jakie miała skutki.","a":"Celem ustawy sukcesyjnej było zapobieżenie walkom o władzę między synami Bolesława Krzywoustego poprzez podział Polski na dzielnice, z zasadą senioratu zapewniającą władzę zwierzchnią najstarszemu z rodu — w praktyce jednak ustawa ta doprowadziła z czasem do rozbicia dzielnicowego i osłabienia jedności państwa polskiego.","l":4,"k":1},{"t":"s","q":"Osadę obronną, otoczoną wałem lub murem, w państwie pierwszych Piastów nazywano:","a":"Grodem","ex":"Grody pełniły funkcje obronne i administracyjne.","l":2},{"t":"tf","q":"Gród to średniowieczna osada obronna, otoczona wałem lub murem.","a":true,"ex":"Wiele grodów było siedzibami władzy lokalnej.","l":2},{"t":"s","q":"Osada rzemieślnicza i handlowa, rozwijająca się w pobliżu grodu, nazywana była:","a":"Podgrodziem","ex":"Z czasem niektóre podgrodzia przekształciły się w miasta.","l":2},{"t":"f","q":"Osada rzemieślnicza i handlowa powstająca w pobliżu grodu nazywana była _______.","a":"podgrodziem","acc":[],"ex":"Mieszkali tam m.in. rzemieślnicy i kupcy.","l":2},{"t":"s","q":"Kopiec usypany nad grobem, charakterystyczny dla dawnych obrzędów pogrzebowych, nazywamy:","a":"Kurhanem","ex":"Kurhany są badane przez archeologów.","l":2},{"t":"tf","q":"Kurhan to kopiec usypany nad grobem zmarłego.","a":true,"ex":"Taka forma pochówku była charakterystyczna dla niektórych ludów dawnej Europy.","l":2},{"t":"s","q":"Szczątki ciał świętych lub przedmioty związane z ich życiem, otaczane szczególną czcią religijną, nazywamy:","a":"Relikwiami","ex":"Relikwie świętych sprowadzano często do ważnych kościołów.","l":1},{"t":"f","q":"Szczątki lub przedmioty związane ze świętymi, otaczane czcią religijną, nazywamy _______.","a":"relikwiami","acc":[],"ex":"Relikwie św. Wojciecha sprowadzono do Gniezna.","l":1},{"t":"o","q":"Wyjaśnij, czym są relikwie i dlaczego mają znaczenie religijne.","a":"Relikwie to szczątki ciał osób uznawanych za święte lub przedmioty, z którymi te osoby miały związek za życia; wierni otaczają je szczególną czcią, wierząc, że mają one duchowe znaczenie i mogą być pośrednikiem w kontakcie z daną osobą świętą.","l":1},{"t":"s","q":"Bóg czczony przez Słowian przed przyjęciem chrześcijaństwa, związany z piorunami i wojną, to:","a":"Perun","ex":"Był jednym z głównych bogów słowiańskiego panteonu.","l":2},{"t":"tf","q":"Przed przyjęciem chrześcijaństwa Słowianie czcili wielu bogów, w tym Peruna, związanego z piorunami.","a":true,"ex":"Słowianie byli politeistami przed chrystianizacją.","l":2},{"t":"s","q":"Wielogłowy posąg czczony przez dawnych Słowian, znaleziony m.in. w rejonie rzeki Zbrucz, to:","a":"Światowid","ex":"To jeden z najsłynniejszych zabytków wierzeń słowiańskich.","l":2},{"t":"f","q":"Wielogłowy posąg dawnego bóstwa słowiańskiego to _______.","a":"Światowid","acc":[],"ex":"Przechowywany jest dziś w muzeum w Krakowie.","l":2},{"t":"tf","q":"Słowianie przed przyjęciem chrześcijaństwa byli politeistami, czczącymi wielu bogów, takich jak Perun czy Swarożyc.","a":true,"ex":"Ich wierzenia były ściśle związane z naturą i zjawiskami przyrody.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego przyjęcie chrześcijaństwa przez Mieszka I oznaczało odejście od wcześniejszych wierzeń Słowian.","a":"Przed chrztem Słowianie, w tym mieszkańcy ziem polskich, byli politeistami, czczącymi wielu bogów, takich jak Perun czy Swarożyc; przyjęcie chrześcijaństwa oznaczało przejście na wiarę monoteistyczną, uznającą jednego Boga, co wiązało się z porzuceniem dawnych, pogańskich praktyk religijnych.","l":2},{"t":"s","q":"Obowiązkowa opłata (np. w naturze) składana przez ludność na rzecz władcy w państwie pierwszych Piastów nazywana była:","a":"Daniną","ex":"Mogła być płacona np. w zbożu lub zwierzętach hodowlanych.","l":2},{"t":"tf","q":"Danina była obowiązkową opłatą (często w naturze, np. w zbożu) składaną przez ludność na rzecz władcy.","a":true,"ex":"To jeden z głównych obowiązków ludności wobec władcy.","l":2},{"t":"s","q":"Zbiór spisanych praw lub przepisów wydanych przez władcę nazywamy:","a":"Statutem","ex":"Statuty regulowały ważne kwestie prawne w państwie.","l":4},{"t":"f","q":"Zbiór spisanych praw wydanych przez władcę nazywamy _______.","a":"statutem","acc":[],"ex":"To ważne źródło poznania prawa dawnej Polski.","l":4},{"t":"s","q":"Ród panujący, z którego wywodzą się kolejni władcy danego państwa, nazywamy:","a":"Dynastią","ex":"Piastowie byli pierwszą dynastią panującą w Polsce.","l":0},{"t":"tf","q":"Dynastia to ród panujący, z którego wywodzą się kolejni władcy danego państwa lub narodu.","a":true,"ex":"Kolejne dynastie panujące w Polsce to m.in. Piastowie i Jagiellonowie.","l":0},{"t":"s","q":"Bolesław Śmiały koronował się na króla Polski w roku:","a":"1076","ex":"Był kolejnym, po Bolesławie Chrobrym, koronowanym władcą Polski.","l":3,"k":1},{"t":"f","q":"Kolejnym, po Bolesławie Chrobrym, koronowanym królem Polski był Bolesław _______, w 1076 roku.","a":"Śmiały","acc":[],"ex":"Jego panowanie zakończyło się jednak konfliktem z biskupem krakowskim i wygnaniem.","l":3},{"t":"tf","q":"Bolesław Śmiały koronował się na króla Polski w 1076 roku, w okresie panowania dynastii Piastów.","a":true,"ex":"To kolejna, po Chrobrym, koronacja królewska w dziejach Polski.","l":3,"k":1},{"t":"s","q":"Ziemie przyłączone do Polski przez Bolesława Chrobrego na wschodzie, sporne później z Rusią, nazywano:","a":"Grodami Czerwieńskimi","ex":"Były przedmiotem sporów granicznych przez wieki.","l":null},{"t":"tf","q":"Grody Czerwieńskie to ziemie na wschodzie, przyłączone do Polski przez Bolesława Chrobrego.","a":true,"ex":"Ich przynależność zmieniała się w kolejnych wiekach.","l":null},{"t":"o","q":"Wymień trzy przyczyny, dla których Mieszko I zdecydował się przyjąć chrzest.","a":"Np. chęć wzmocnienia pozycji międzynarodowej państwa poprzez włączenie go do grona chrześcijańskich krajów Europy, uniknięcie pretekstu do najazdów pod hasłem chrystianizacji ze strony sąsiadów, a także umocnienie własnej władzy dzięki nowej, monoteistycznej religii i organizacji kościelnej.","l":0,"k":1},{"t":"s","q":"Większość mieszkańców państwa pierwszych Piastów zajmowała się głównie:","a":"Uprawą roli i hodowlą zwierząt","ex":"Rolnictwo było podstawą gospodarki ówczesnej Polski.","l":2},{"t":"tf","q":"Większość mieszkańców państwa pierwszych Piastów zajmowała się rolnictwem i hodowlą zwierząt.","a":true,"ex":"To typowe zajęcie ludności we wczesnym średniowieczu.","l":2},{"t":"o","q":"Wyjaśnij, jaką rolę pełniła drużyna książęca w państwie pierwszych Piastów.","a":"Drużyna książęca była zbrojną formacją, złożoną z wojowników oddanych władcy, biorących udział w organizowanych przez niego wyprawach wojennych oraz zapewniających mu ochronę — była podstawą militarną władzy pierwszych Piastów.","l":2},{"t":"w","q":"plemię","a":"Grupa ludzi o wspólnym pochodzeniu, języku i obyczajach.","l":0,"k":1},{"t":"w","q":"gród","a":"Obronna osada otoczona wałami i palisadą.","l":2,"k":1},{"t":"w","q":"drużyna","a":"Oddział wojowników służących władcy.","l":2,"k":1},{"t":"w","q":"Piastowie","a":"Pierwsza polska dynastia panująca.","l":0,"k":1},{"t":"w","q":"chrzest Polski","a":"Przyjęcie chrześcijaństwa przez Mieszka I w 966 roku.","l":0,"k":1},{"t":"w","q":"denar","a":"Średniowieczna srebrna moneta.","l":2,"k":1},{"t":"w","q":"biskupstwo","a":"Okręg kościelny podlegający biskupowi.","l":0,"k":1},{"t":"w","q":"zjazd gnieźnieński","a":"Spotkanie Bolesława Chrobrego z cesarzem Ottonem III w 1000 roku.","l":1,"k":1},{"t":"w","q":"koronacja","a":"Uroczystość nałożenia korony na władcę.","l":1,"k":1},{"t":"w","q":"relikwie","a":"Szczątki świętego lub przedmioty związane z jego życiem, otaczane czcią.","l":1,"k":1},{"t":"w","q":"książę","a":"Władca państwa, mający niższy tytuł niż król.","l":0,"k":1},{"t":"w","q":"państwo","a":"Zorganizowana wspólnota ludzi na określonym terytorium z władzą.","l":0,"k":1},{"t":"o","q":"Kim był Mieszko II i co mu się nie udało?","a":"Król Polski 1025–1034. W 1031 r. po ataku Niemiec i Rusi Kijowskiej utracił zdobycze Bolesława Chrobrego.","l":3,"k":1},{"t":"o","q":"Co działo się w państwie w latach 1034–1039?","a":"Upadek państwa: powstanie ludowe w Wielkopolsce przeciwko duchowieństwu i możnowładcom (ok. 1038) oraz najazd Brzetysława w 1039 r.","l":3},{"t":"o","q":"Czego dokonał Kazimierz Odnowiciel?","a":"Książę Polski 1039–1058. Odnowił państwo, przeniósł siedzibę do Krakowa, nadawał ziemię wojom (rycerzom) i duchowieństwu.","l":3,"k":1},{"t":"o","q":"Co zrobił Bolesław Śmiały i dlaczego musiał uciekać z kraju?","a":"Król Polski 1076–1079. Poparł papieża Grzegorza VII w walce z Henrykiem IV. Skazał na śmierć biskupa krakowskiego Stanisława, przez co musiał uciekać na Węgry (1079).","l":3,"k":1},{"t":"o","q":"Kto po Władysławie Hermanie rządził Polską i jak podzielono kraj w 1102 r.?","a":"Dwaj synowie: starszy Zbigniew rządził północą, młodszy Bolesław Krzywousty – południem. Byli przyrodnimi braćmi.","l":4,"k":1},{"t":"o","q":"Jaką politykę prowadził Władysław Herman?","a":"Nie miał wielkich ambicji, nie myślał o tytule królewskim i podkreślał zależność od cesarza. Rządził od 1079 r.","l":4},{"t":"o","q":"Dlaczego wybuchła wojna domowa między Zbigniewem a Bolesławem i jak się skończyła?","a":"Każdy z braci chciał zjednoczyć kraj pod swoimi rządami. Zakończyła się klęską i wygnaniem Zbigniewa w 1108 r.","l":4},{"t":"o","q":"Dlaczego Bolesław Krzywousty nie spełnił żądań Henryka V w 1109 r.?","a":"Cesarz Henryk V chciał oddania połowy państwa Zbigniewowi i trybutu (300 rycerzy rocznie). Bolesław odmówił, bo zgoda oznaczałaby podporządkowanie Polski cesarzowi.","l":4,"k":1},{"t":"f","q":"Wojna polsko-niemiecka, w której obroniono Głogów, odbyła się w _______ roku.","a":"1109","acc":[],"ex":"Henryk V nie zdobył Głogowa i musiał się wycofać.","l":4},{"t":"o","q":"Kim był Anonim tzw. Gall?","a":"Kronikarz, który mieszkał na dworze Bolesława Krzywoustego i napisał po łacinie „Kronikę polską” – najstarsze źródło o dziejach Polski.","l":4,"k":1},{"t":"o","q":"Co zrobił Krzywousty ze Zbigniewem po powrocie do Polski?","a":"Ok. 1111 r. kazał go oślepić, a potem odbył publiczną pokutę (pielgrzymka).","l":4,"k":1},{"t":"o","q":"Jak Bolesław Krzywousty zdobył Pomorze?","a":"Prowadził wyprawy na Pomorze, do 1123 r. podbił Pomorze Gdańskie. Chrystianizację Pomorza prowadził św. Otton z Bambergu.","l":4,"k":1},{"t":"o","q":"Co to jest ustawa sukcesyjna i kiedy weszła w życie?","a":"Dokument ustalający następstwo tronu; Krzywousty wydał go przed śmiercią, weszła w życie w 1138 r.","l":4,"k":1},{"t":"o","q":"Co ustalała ustawa sukcesyjna?","a":"Zasadę senioratu (najstarszy z dynastii Piastów – senior – panuje nad dzielnicą senioralną i ma władzę nad innymi książętami) oraz dzielnice dziedziczne dla synów (pięciu).","l":4,"k":1},{"t":"o","q":"Jakie były skutki ustawy sukcesyjnej?","a":"Polska przestała być własnością króla, a młodsi synowie szybko obalili zasadę senioratu; państwo zaczęło się rozpadać na odrębne księstwa.","l":4,"k":1},{"t":"tf","q":"Bolesław Krzywousty zmarł w 1138 roku.","a":true,"ex":"Żył w latach 1086–1138.","l":4,"k":1}],"lessons":["Początki Polski","Polska Bolesława Chrobrego","W najdawniejszej Polsce","Upadek i odbudowa państwa","Polska Bolesława Krzywoustego"]},{"id":"h7","title":"Polska rozbita na dzielnice i zjednoczona","icon":"🗡️","q":[{"t":"s","q":"Okres podziału Polski na liczne, niezależne od siebie dzielnice, trwający od XII do początku XIV wieku, nazywamy:","a":"Rozbiciem dzielnicowym","ex":"Osłabiał on jedność i obronność państwa.","l":0},{"t":"tf","q":"Rozbicie dzielnicowe Polski trwało od śmierci Bolesława Krzywoustego do zjednoczenia kraju na przełomie XIII i XIV wieku.","a":true,"ex":"To okres znacznego osłabienia centralnej władzy w Polsce.","l":0,"k":1},{"t":"f","q":"Zakon rycerski sprowadzony przez Konrada Mazowieckiego do ziemi chełmińskiej nazywał się zakonem _______.","a":"krzyżackim","acc":[],"ex":"Z czasem zbudował silne, niezależne państwo na tych ziemiach.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego sprowadzenie Krzyżaków na ziemie polskie okazało się problematyczne dla Polski.","a":"Krzyżacy, sprowadzeni pierwotnie do obrony przed pogańskimi Prusami, z czasem zbudowali silne, niezależne państwo zakonne na ziemiach polskich (w tym na ziemi chełmińskiej), a następnie zajęli Pomorze Gdańskie, stając się poważnym zagrożeniem militarnym i politycznym dla Polski.","l":1},{"t":"s","q":"Osadnictwo ludności niemieckiej na ziemiach polskich w XIII wieku, związane z zakładaniem miast i wsi na prawie niemieckim, nazywamy:","a":"Kolonizacją niemiecką","ex":"Przyczyniło się do rozwoju gospodarczego wielu regionów Polski.","l":1},{"t":"tf","q":"Kolonizacja niemiecka w XIII wieku wiązała się z zakładaniem miast i wsi na prawie niemieckim (lokacja).","a":true,"ex":"Wprowadzała nowe zasady organizacji miast i wsi.","l":1},{"t":"s","q":"Śląski książę, który wspierał rozwój cywilizacyjny swojej dzielnicy w XIII wieku, m.in. poprzez kolonizację niemiecką, to:","a":"Henryk Brodaty","ex":"Śląsk pod jego rządami rozwijał się gospodarczo.","l":1},{"t":"f","q":"Proces zakładania nowych miast i wsi według wzorców prawa niemieckiego nazywano _______ na prawie niemieckim.","a":"lokacją","acc":[],"ex":"Ustalała ona m.in. zasady zarządzania miastem czy wysokość czynszów.","l":1},{"t":"s","q":"Władca, który w 1295 roku koronował się na króla Polski, choć wkrótce potem zginął w wyniku zamachu, to:","a":"Przemysł II","ex":"Jego koronacja była ważnym krokiem w kierunku zjednoczenia Polski.","l":2,"k":1},{"t":"tf","q":"Przemysł II koronował się na króla Polski w 1295 roku, ale rok później zginął w wyniku zamachu.","a":true,"ex":"Jego śmierć przerwała proces zjednoczenia na wiele lat.","l":2,"k":1},{"t":"s","q":"Władca, który stopniowo jednoczył ziemie polskie i koronował się na króla w 1320 roku, to:","a":"Władysław Łokietek","ex":"Jego koronacja zakończyła okres rozbicia dzielnicowego.","l":3,"k":1},{"t":"f","q":"Władca, który zjednoczył większość ziem polskich i koronował się na króla w 1320 roku, to Władysław _______.","a":"Łokietek","acc":[],"ex":"Był ojcem Kazimierza Wielkiego.","l":3,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego zjednoczenie ziem polskich przez Władysława Łokietka było trudnym procesem.","a":"Po okresie rozbicia dzielnicowego poszczególne dzielnice Polski miały własnych, niezależnych władców i silne poczucie odrębności, a dodatkowo Polska musiała zmagać się z zagrożeniem ze strony sąsiadów, w tym Krzyżaków, dlatego zjednoczenie wymagało od Władysława Łokietka wielu lat walk i zabiegów politycznych.","l":3},{"t":"s","q":"Syn i następca Władysława Łokietka, znany z rozbudowy Polski i licznych reform, to:","a":"Kazimierz Wielki","ex":"Znacząco umocnił i rozbudował państwo polskie.","l":4,"k":1},{"t":"tf","q":"Kazimierz Wielki, syn Władysława Łokietka, jest znany z rozwoju gospodarczego i licznych reform w Polsce.","a":true,"ex":"To ostatni król z dynastii Piastów.","l":4,"k":1},{"t":"s","q":"Kazimierz Wielki założył w 1364 roku w Krakowie:","a":"Akademię Krakowską (uniwersytet)","ex":"To jedna z pierwszych uczelni wyższych w tej części Europy.","l":4,"k":1},{"t":"f","q":"Uczelnia wyższa założona przez Kazimierza Wielkiego w Krakowie w 1364 roku nazywała się Akademią _______.","a":"Krakowską","acc":[],"ex":"Późniejsza nazwa tej uczelni to Uniwersytet Jagielloński.","l":4,"k":1},{"t":"tf","q":"Kazimierz Wielki założył w Krakowie w 1364 roku Akademię Krakowską, jedną z pierwszych uczelni wyższych w tej części Europy.","a":true,"ex":"To ważny krok w rozwoju polskiej nauki i kultury.","l":4,"k":1},{"t":"s","q":"Za panowania Kazimierza Wielkiego do Polski przyłączono:","a":"Ruś Halicką","ex":"Znacząco powiększyło to terytorium państwa polskiego.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego o Kazimierzu Wielkim mówi się czasem, że „zastał Polskę drewnianą, a zostawił murowaną”.","a":"Powiedzenie to podkreśla, jak duże zmiany wprowadził Kazimierz Wielki — za jego panowania wzniesiono i przebudowano wiele zamków, murów miejskich oraz innych budowli murowanych, a także znacząco rozwinięto gospodarkę i administrację państwa, w porównaniu z wcześniejszym, słabiej rozwiniętym okresem.","l":4,"k":1},{"t":"s","q":"Kazimierz Wielki panował w Polsce w latach:","a":"1333–1370","ex":"To ponad 35 lat intensywnych rządów i reform.","l":4,"k":1},{"t":"tf","q":"Kazimierz Wielki panował w Polsce w latach 1333–1370.","a":true,"ex":"Był ostatnim władcą Polski z dynastii Piastów.","l":4,"k":1},{"t":"s","q":"W 1343 roku Kazimierz Wielki zawarł z Krzyżakami:","a":"Pokój kaliski","ex":"Regulował on relacje polsko-krzyżackie na kolejne dziesięciolecia.","l":4,"k":1},{"t":"f","q":"Pokój zawarty przez Kazimierza Wielkiego z Krzyżakami w 1343 roku nazywamy pokojem _______.","a":"kaliskim","acc":[],"ex":"Zakończył wcześniejszy konflikt z zakonem krzyżackim.","l":4},{"t":"o","q":"Podsumuj najważniejsze dokonania Kazimierza Wielkiego.","a":"Kazimierz Wielki umocnił i rozbudował państwo polskie — rozbudował system obronny (liczne zamki i mury miejskie), założył Akademię Krakowską, przyłączył do Polski Ruś Halicką, zawarł korzystny pokój z Krzyżakami oraz zreformował administrację i gospodarkę kraju, znacząco podnosząc znaczenie Polski w Europie.","l":4,"k":1},{"t":"s","q":"Zjazd monarchów, który odbył się w Krakowie w 1364 roku, świadczył o:","a":"Rosnącym międzynarodowym znaczeniu Polski za czasów Kazimierza Wielkiego","ex":"Na zjeździe gościło wielu ważnych europejskich władców.","l":4,"k":1},{"t":"tf","q":"Zjazd monarchów w Krakowie w 1364 roku świadczył o wzroście międzynarodowego znaczenia Polski za panowania Kazimierza Wielkiego.","a":true,"ex":"To pokazywało silną pozycję Polski w Europie tamtych czasów.","l":4,"k":1},{"t":"o","q":"Ułóż chronologicznie koronacje trzech władców: Przemysła II (1295) i Władysława Łokietka (1320), i wyjaśnij, dlaczego rządy Kazimierza Wielkiego (od 1333) przypadają na końcu tej kolejności.","a":"Najpierw koronował się Przemysł II (1295), następnie Władysław Łokietek (1320), a rządy Kazimierza Wielkiego rozpoczęły się później, w 1333 roku, gdyż był on synem Władysława Łokietka i objął tron po jego śmierci.","l":3,"k":1},{"t":"w","q":"rozbicie dzielnicowe","a":"Okres, w którym państwo polskie było podzielone na niezależne dzielnice.","l":0,"k":1},{"t":"w","q":"dzielnica","a":"Część państwa rządzona przez księcia z dynastii Piastów.","l":0,"k":1},{"t":"w","q":"testament Krzywoustego","a":"Dokument podziału państwa między synów Bolesława Krzywoustego z 1138 roku.","l":0,"k":1},{"t":"w","q":"zakon krzyżacki","a":"Rycerski zakon sprowadzony do Polski przez Konrada Mazowieckiego.","l":1,"k":1},{"t":"w","q":"najazd tatarski","a":"Napad Tatarów na ziemie polskie w XIII wieku.","l":1,"k":1},{"t":"w","q":"wójt","a":"Osoba zarządzająca w imieniu księcia osadą założoną na prawie niemieckim.","l":1,"k":1},{"t":"w","q":"lokacja na prawie niemieckim","a":"Zakładanie miast i wsi na zasadach zapożyczonych z prawa niemieckiego.","l":1,"k":1},{"t":"w","q":"zjednoczenie państwa","a":"Połączenie rozdrobnionych dzielnic w jedno państwo.","l":2,"k":1},{"t":"w","q":"koronacja Łokietka","a":"Wydarzenie z 1320 roku, po którym Polska znów miała króla.","l":3,"k":1},{"t":"w","q":"Kazimierz Wielki","a":"Król Polski, który wzmocnił państwo, a w 1364 roku założył uniwersytet w Krakowie.","l":4,"k":1},{"t":"o","q":"Który władca koronował się w 1300 r. w Gnieźnie na króla Polski?","a":"Wacław II, król Czech.","l":2},{"t":"o","q":"Kto po śmierci Wacława III w 1306 r. zajął Kraków?","a":"Władysław Łokietek.","l":2,"k":1},{"t":"o","q":"Co symbolizowała korona dla państwa polskiego?","a":"Symbolizowała jedność państwa pod władzą jednego króla.","l":2},{"t":"o","q":"Co to było rozbicie dzielnicowe?","a":"Rozpad państwa na niezależne księstwa; zaczęło się w 1138 r., trwało do końca XIII w.","l":0,"k":1},{"t":"o","q":"Co się stało z zasadą senioratu?","a":"Młodsi synowie Krzywoustego jej nie przestrzegali. Najstarszy, Władysław Wygnaniec, próbował zjednoczyć rządy, ale został wygnany.","l":0,"k":1},{"t":"o","q":"Dlaczego Polska dzieliła się na coraz mniejsze księstwa?","a":"Książęta dzielili swoje państwa między synów; często dochodziło do wojen. Dzielnice dziedziczne zamieniały się w odrębne księstwa.","l":0},{"t":"o","q":"Dlaczego rozbicie dzielnicowe trwało tak długo?","a":"Książęta woleli rządzić swoimi państewkami, a rycerze i urzędnicy robili kariery na dworach lokalnych książąt.","l":0,"k":1},{"t":"o","q":"Jakie ziemie Polska straciła w czasie rozbicia dzielnicowego?","a":"Pomorze Zachodnie (zwierzchność cesarstwa), księstwa śląskie (zależne od Czech) i ziemię lubuską (Brandenburgia).","l":0},{"t":"o","q":"Kim byli Krzyżacy i kiedy powstał ich zakon?","a":"Zakon szpitala NMP Domu Niemieckiego, założony w 1190 r. w Palestynie; członków nazywano Krzyżakami (czarne krzyże na białych płaszczach).","l":0},{"t":"o","q":"Kto sprowadził Krzyżaków do Polski i po co?","a":"Książę Konrad Mazowiecki, aby bronili Mazowsza przed pogańskimi Prusami (ziemia chełmińska).","l":0,"k":1},{"t":"f","q":"Krzyżacy rozpoczęli podbój Prusów w _______ r.","a":"1230","acc":[],"ex":"Całe Prusy podbili do 1283 r.","l":0},{"t":"o","q":"Co to było państwo zakonne?","a":"Własne państwo Krzyżaków w Prusach, do którego dołączyli Kawalerów Mieczowych (1237) i które rządził wielki mistrz.","l":0},{"t":"o","q":"Kim był Hermann von Salza?","a":"Wielkim mistrzem zakonu krzyżackiego (1210–1239), jednym z najwybitniejszych polityków XIII w.","l":0},{"t":"o","q":"Kim był Henryk Brodaty?","a":"Książę śląski (ok. 1168–1238), władca Śląska od 1201 r., mąż św. Jadwigi Śląskiej. Wspierał rozwój górnictwa i hutnictwa.","l":1},{"t":"o","q":"Co to jest kolonizacja niemiecka?","a":"Napływ osadników z Niemiec na Śląsk, a potem do innych dzielnic Polski w XIII w.","l":1},{"t":"o","q":"Co oznacza lokacja wsi i miast na prawie niemieckim?","a":"Założenie osady przez zasadźcę na prawie niemieckim: mieszkańcy płacili czynsz zamiast pańszczyzny, byli wolni.","l":1},{"t":"o","q":"Jakie zmiany w rolnictwie przyniosła kolonizacja?","a":"Żelazny pług zamiast drewnianego radła, więcej żywności i wzrost liczby ludności.","l":1},{"t":"o","q":"Jakie skutki miała kolonizacja niemiecka?","a":"Rozwój rolnictwa i miast, wzrost ludności, nowe prawo, ale też konflikty polsko-niemieckie.","l":1},{"t":"o","q":"Co to jest gospodarka towarowo-pieniężna?","a":"Gospodarka, w której towary kupuje się za pieniądze, a nie wymienia.","l":1},{"t":"o","q":"Co Polska wywoziła, a co przywoziła w XIII w.?","a":"Wywoziła zboże, futra, drewno, wosk. Sprowadzała z Zachodu sukno, wyroby rzemieślnicze, ryby morskie i wino, a ze Wschodu jedwabie, broń i przyprawy.","l":1},{"t":"o","q":"Na czym polegało prawo składu?","a":"Kupcy przejeżdżający przez miasto musieli wystawić swoje towary na sprzedaż.","l":1},{"t":"o","q":"Kto najechał Polskę w 1241 r.?","a":"Mongołowie (Tatarzy), pod wodzą następców Czyngis-chana.","l":2,"k":1},{"t":"o","q":"Co wydarzyło się pod Legnicą?","a":"W 1241 r. rycerstwo Henryka Pobożnego zostało pokonane przez Mongołów, a książę zginął.","l":2,"k":1},{"t":"o","q":"Dlaczego Mongołowie byli groźnymi przeciwnikami?","a":"Byli świetnymi jeźdźcami i łucznikami, stosowali wywiad, zasadzki i dyscyplinę, a rycerze walczyli bez wspólnej taktyki.","l":2},{"t":"o","q":"Jakie straty poniosła Polska w czasie najazdu?","a":"Zniszczono południową część kraju (spalono Kraków), zginął Henryk Pobożny; Śląsk podzielono na kilkanaście księstw.","l":2},{"t":"o","q":"Jaką rolę w dążeniu do zjednoczenia odgrywał Kościół?","a":"Hierarchia była jedna dla całego kraju (arcybiskupstwo w Gnieźnie od 1000 r.), kult patronów (św. Wojciech, św. Stanisław), kroniki i język polski.","l":2},{"t":"o","q":"Kim był Wincenty Kadłubek?","a":"Biskupem krakowskim i autorem „Kroniki polskiej” (do 1202 r.).","l":2},{"t":"o","q":"Dlaczego chłopi i mieszczanie pragnęli zjednoczenia?","a":"Cierpieli z powodu wojen między książętami i łatwiej byłoby bronić się jednym państwem.","l":2},{"t":"o","q":"Kim był Przemysł II?","a":"Książę wielkopolski, który w 1295 r. koronował się na króla Polski w Gnieźnie. Zamordowano go w 1296 r.","l":3,"k":1},{"t":"o","q":"Kto zabił Przemysła II?","a":"Mordercy nasłani przez Brandenburczyków (1296).","l":3},{"t":"o","q":"Kto rządził Polską po Przemyśle II?","a":"Król Czech Wacław II – koronowany na króla Polski w 1300 r., zmarł w 1305 r.","l":3},{"t":"o","q":"Jak rządził Wacław II?","a":"Obsadzał stanowiska Czechami, wprowadził urząd starosty, ale zaprowadził porządek.","l":3},{"t":"o","q":"Kim był Władysław Łokietek?","a":"Książę z dynastii Piastów, zjednoczył kraj; koronowany na króla w Krakowie w 1320 r. Panował do 1333 r.","l":3,"k":1},{"t":"f","q":"Łokietek został koronowany na króla w _______ roku.","a":"1320","acc":[],"ex":"W 1300 r. koronowano Wacława II, a w 1295 – Przemysła II.","l":3,"k":1},{"t":"o","q":"Co wydarzyło się w 1308–1309 r.?","a":"Krzyżacy zajęli Gdańsk (rzeź Gdańska 1308) i całe Pomorze Gdańskie (1309).","l":3},{"t":"o","q":"Co wydarzyło się w 1331 r.?","a":"Bitwa pod Płowcami z Krzyżakami – nierozstrzygnięta, ale Polacy pokazali, że Krzyżacy są do pokonania.","l":3},{"t":"o","q":"Jakie ziemie objęło państwo Łokietka?","a":"Małopolskę, Wielkopolskę, Kujawy i Pomorze Gdańskie utracone na rzecz Krzyżaków.","l":3},{"t":"o","q":"Kiedy Kazimierz Wielki objął rządy i kiedy zmarł?","a":"Rządził w latach 1333–1370; był ostatnim królem z dynastii Piastów.","l":4,"k":1},{"t":"o","q":"Co postanowił pokój w Kaliszu (1343)?","a":"Krzyżacy zwrócili Polsce Kujawy i ziemię dobrzyńską, a Pomorze Gdańskie pozostało przy zakonie – Kazimierz uznał je za „wieczystą jałmużnę”.","l":4},{"t":"o","q":"Jakie ziemie Kazimierz Wielki przyłączył do Polski na Wschodzie?","a":"Ruś Halicką (od 1340 r.) i część Rusi Włodzimierskiej.","l":4,"k":1},{"t":"o","q":"Jaką politykę wobec ludności ruskiej prowadził król?","a":"Nie narzucał Rusinom katolicyzmu, zapewnił tolerancję religijną.","l":4},{"t":"o","q":"Co oznacza hasło „zastał Polskę drewnianą, a zostawił murowaną”?","a":"Kazimierz Wielki zbudował wiele zamków (ok. 53) i obwarował miasta murami (27 miast).","l":4,"k":1},{"t":"o","q":"Jakie reformy gospodarcze wprowadził Kazimierz Wielki?","a":"Jedną monetę w całym kraju, lokacje miast i wsi, podatki na budowę zamków.","l":4,"k":1},{"t":"o","q":"Jakie prawa wydał Kazimierz Wielki?","a":"Statuty praw – osobno dla Wielkopolski i Małopolski – zamiast prawa ustnego.","l":4,"k":1},{"t":"f","q":"Akademię Krakowską założono w roku _______.","a":"1364","acc":[],"ex":"To pierwszy uniwersytet w Polsce.","l":4,"k":1},{"t":"o","q":"Co wydarzyło się w 1364 r.?","a":"Zjazd monarchów w Krakowie i założenie Akademii Krakowskiej.","l":4,"k":1},{"t":"o","q":"Dlaczego Kazimierza nazwano Wielkim?","a":"Wzmocnił państwo, zbudował zamki, wydał prawa, założył uniwersytet, powiększył kraj dwukrotnie; Polska zyskała znaczenie w Europie.","l":4}],"lessons":["Rozbicie dzielnicowe Polski","Polska w XIII wieku","Dążenie do jedności państwa","Zjednoczona Polska","Polska Kazimierza Wielkiego"]},{"id":"h8","title":"Polska i Litwa","icon":"⚔️","q":[{"t":"s","q":"Unia między Polską a Wielkim Księstwem Litewskim została zawarta w Krewie w roku:","a":"1385","ex":"To początek długotrwałego związku Polski z Litwą.","l":0,"k":1},{"t":"tf","q":"Unia polsko-litewska została zawarta w Krewie w 1385 roku.","a":true,"ex":"Doprowadziła do chrztu Litwy i małżeństwa Jagiełły z Jadwigą.","l":0,"k":1},{"t":"s","q":"Polska królowa, która wyszła za mąż za litewskiego księcia Jagiełłę, umożliwiając unię polsko-litewską, to:","a":"Jadwiga Andegaweńska","ex":"Została koronowana na króla Polski (nie królową), mimo że była kobietą.","l":0,"k":1},{"t":"f","q":"Polska królowa, żona Władysława Jagiełły, dzięki której doszło do unii z Litwą, nazywała się Jadwiga _______.","a":"Andegaweńska","acc":[],"ex":"Pochodziła z dynastii andegaweńskiej.","l":0,"k":1},{"t":"s","q":"Litewski książę, który dzięki unii z Polską został polskim królem pod imieniem Władysław Jagiełło, wcześniej nosił imię:","a":"Jagiełło","ex":"Przyjął imię Władysław po chrzcie.","l":0,"k":1},{"t":"tf","q":"Władysław Jagiełło, wcześniej litewski książę, został królem Polski dzięki unii z Litwą i małżeństwu z Jadwigą Andegaweńską.","a":true,"ex":"Zapoczątkował dynastię Jagiellonów.","l":0,"k":1},{"t":"o","q":"Wyjaśnij, jakie korzyści przynosiła unia polsko-litewska obu stronom.","a":"Dzięki unii Litwa przyjęła chrzest i zyskała silnego sojusznika w walce z Krzyżakami, natomiast Polska zyskała potężnego, rozległego terytorialnie sojusznika, co znacząco wzmocniło pozycję obu państw w regionie, zwłaszcza wobec wspólnego zagrożenia ze strony zakonu krzyżackiego.","l":0},{"t":"s","q":"Wielka wojna z zakonem krzyżackim toczyła się w latach:","a":"1409–1411","ex":"Jej kulminacją była bitwa pod Grunwaldem.","l":1},{"t":"tf","q":"Wielka wojna z zakonem krzyżackim toczyła się w latach 1409–1411.","a":true,"ex":"Zakończyła się pierwszym pokojem toruńskim.","l":1},{"t":"s","q":"Decydująca bitwa wielkiej wojny z zakonem krzyżackim, stoczona 15 lipca 1410 roku, to bitwa:","a":"Pod Grunwaldem","ex":"To jedno z najsłynniejszych zwycięstw w historii Polski.","l":1,"k":1},{"t":"f","q":"Zwycięska bitwa wojsk polsko-litewskich z Krzyżakami, stoczona 15 lipca 1410 roku, to bitwa pod _______.","a":"Grunwaldem","acc":[],"ex":"Była jedną z największych bitew średniowiecznej Europy.","l":1,"k":1},{"t":"tf","q":"W bitwie pod Grunwaldem w 1410 roku wojska polsko-litewskie pokonały zakon krzyżacki.","a":true,"ex":"To zwycięstwo znacząco osłabiło potęgę Krzyżaków.","l":1,"k":1},{"t":"s","q":"Wielka wojna z zakonem krzyżackim zakończyła się w 1411 roku:","a":"Pierwszym pokojem toruńskim","ex":"Traktat ten nie w pełni wykorzystał zwycięstwo grunwaldzkie.","l":1},{"t":"f","q":"Wielką wojnę z zakonem krzyżackim zakończył w 1411 roku pierwszy pokój _______.","a":"toruński","acc":[],"ex":"Nie przyniósł on stronie zwycięskiej dużych korzyści terytorialnych.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego mimo zwycięstwa pod Grunwaldem, postanowienia pierwszego pokoju toruńskiego były dla Polski i Litwy rozczarowujące.","a":"Mimo miażdżącego zwycięstwa militarnego pod Grunwaldem, pierwszy pokój toruński przyniósł stronie polsko-litewskiej stosunkowo niewielkie korzyści terytorialne, ponieważ nie wykorzystano w pełni przewagi wojskowej do trwałego osłabienia państwa krzyżackiego.","l":1,"k":1},{"t":"s","q":"Konflikt zbrojny Polski z Krzyżakami w latach 1454–1466, zakończony odzyskaniem Pomorza Gdańskiego, nazywamy:","a":"Wojną trzynastoletnią","ex":"Trwała, jak sama nazwa wskazuje, trzynaście lat.","l":2,"k":1},{"t":"tf","q":"Wojna trzynastoletnia (1454–1466) zakończyła się odzyskaniem przez Polskę Pomorza Gdańskiego.","a":true,"ex":"To dało Polsce dostęp do Bałtyku na kolejne wieki.","l":2,"k":1},{"t":"s","q":"Związek miast i szlachty pruskiej, który wystąpił przeciwko Krzyżakom, wywołując wojnę trzynastoletnią, nazywał się:","a":"Związek Pruski","ex":"Zwrócił się o pomoc do króla polskiego.","l":2},{"t":"f","q":"Organizacja miast i szlachty pruskiej, która wystąpiła przeciw Krzyżakom, nazywała się Związkiem _______.","a":"Pruskim","acc":[],"ex":"To on zainicjował wojnę trzynastoletnią.","l":2},{"t":"s","q":"Wojnę trzynastoletnią zakończył w 1466 roku:","a":"Drugi pokój toruński","ex":"Na jego mocy Polska odzyskała Pomorze Gdańskie.","l":2,"k":1},{"t":"tf","q":"Wojna trzynastoletnia zakończyła się w 1466 roku drugim pokojem toruńskim, na mocy którego Polska odzyskała Pomorze Gdańskie.","a":true,"ex":"To ważny sukces terytorialny Polski w XV wieku.","l":2,"k":1},{"t":"o","q":"Wyjaśnij znaczenie odzyskania Pomorza Gdańskiego i dostępu do ujścia Wisły dla Polski.","a":"Odzyskanie Pomorza Gdańskiego i dostępu do ujścia Wisły dało Polsce bezpośredni dostęp do Morza Bałtyckiego, co miało ogromne znaczenie dla handlu (zwłaszcza eksportu zboża) oraz dla rozwoju gospodarczego i politycznego kraju w kolejnych wiekach.","l":2},{"t":"s","q":"Przywilej nadany szlachcie przez Ludwika Węgierskiego w 1374 roku, ograniczający podatki szlacheckie, nazywał się przywilejem:","a":"Koszyckim","ex":"Jeden z pierwszych ważnych przywilejów szlacheckich.","l":3,"k":1},{"t":"tf","q":"Przywilej koszycki z 1374 roku był jednym z pierwszych ważnych przywilejów nadanych polskiej szlachcie.","a":true,"ex":"Rozpoczął serię przywilejów zwiększających znaczenie szlachty.","l":3,"k":1},{"t":"s","q":"Grupa społeczna, która w wyniku licznych przywilejów zyskiwała coraz większy wpływ na rządy w Polsce od XIV do XVI wieku, to:","a":"Szlachta","ex":"Jej pozycja rosła kosztem władzy króla i innych stanów.","l":3,"k":1},{"t":"f","q":"Stan społeczny, który dzięki licznym przywilejom zyskał w Polsce ogromny wpływ na politykę państwa, to _______.","a":"szlachta","acc":[],"ex":"Jej władza osiągnęła szczyt w kolejnych stuleciach.","l":3,"k":1},{"t":"s","q":"Ogólnopolskie zgromadzenie przedstawicieli szlachty, mające duży wpływ na sprawy państwowe, nazywano:","a":"Sejmem walnym","ex":"Uczestniczyli w nim posłowie z całego kraju.","l":3},{"t":"tf","q":"Sejm walny, w którym uczestniczyli przedstawiciele szlachty, miał duży wpływ na sprawy państwowe w Polsce od XV–XVI wieku.","a":true,"ex":"Z czasem jego znaczenie stale rosło.","l":3},{"t":"s","q":"Konstytucja Nihil novi, uchwalona w 1505 roku, stanowiła, że:","a":"Król nie może uchwalać nowych praw bez zgody sejmu","ex":"To istotne ograniczenie władzy królewskiej.","l":3,"k":1},{"t":"f","q":"Konstytucja z 1505 roku, ograniczająca władzę króla na rzecz sejmu, nazywa się „Nihil _______”.","a":"novi","acc":[],"ex":"Nazwa po łacinie oznacza „nic nowego”.","l":3,"k":1},{"t":"o","q":"Wyjaśnij znaczenie konstytucji Nihil novi z 1505 roku dla ustroju Polski.","a":"Konstytucja Nihil novi stanowiła, że król nie może wydawać nowych praw bez zgody sejmu (izby poselskiej i senatu), co znacząco ograniczyło władzę monarszą na rzecz szlachty reprezentowanej w sejmie, umacniając ustrój określany jako monarchia szlachecka.","l":3,"k":1},{"t":"s","q":"Ustrój polityczny Polski od XV–XVI wieku, w którym duży wpływ na rządy miała szlachta reprezentowana w sejmie, nazywamy:","a":"Monarchią szlachecką","ex":"To specyficzny dla Polski system władzy.","l":3},{"t":"tf","q":"Od XV–XVI wieku ustrój Polski określa się często jako monarchię szlachecką, ze względu na duży wpływ szlachty na rządy.","a":true,"ex":"Odróżniało to Polskę od wielu monarchii absolutnych w Europie.","l":3},{"t":"s","q":"W średniowiecznej Polsce, w porównaniu z Europą Zachodnią, tolerancja religijna wobec mniejszości (np. Żydów) była:","a":"Stosunkowo duża","ex":"Polska przyciągała m.in. osadników żydowskich uciekających przed prześladowaniami.","l":null},{"t":"tf","q":"Średniowieczna Polska charakteryzowała się stosunkowo dużą tolerancją religijną w porównaniu z częścią krajów Europy Zachodniej.","a":true,"ex":"To jedna z cech wyróżniających Polskę na tle innych krajów tamtej epoki.","l":null},{"t":"o","q":"Podsumuj najważniejsze wydarzenia związane z unią polsko-litewską i wojnami z zakonem krzyżackim w XIV–XV wieku.","a":"Unia w Krewie (1385) połączyła Polskę i Litwę, prowadząc do chrztu Litwy i wzmocnienia obu państw wobec zagrożenia krzyżackiego. Sojusz ten doprowadził do zwycięstwa pod Grunwaldem (1410) w wielkiej wojnie z Krzyżakami, choć pierwszy pokój toruński (1411) nie w pełni wykorzystał to zwycięstwo. Dopiero wojna trzynastoletnia (1454–1466), zakończona drugim pokojem toruńskim, przyniosła Polsce odzyskanie Pomorza Gdańskiego i dostępu do morza.","l":0,"k":1},{"t":"w","q":"unia","a":"Związek dwóch państw.","l":0,"k":1},{"t":"w","q":"Unia w Krewie","a":"Umowa z 1385 roku łącząca Polskę i Litwę przez małżeństwo Jadwigi i Jagiełły.","l":0,"k":1},{"t":"w","q":"Jagiellonowie","a":"Dynastia, która panowała w Polsce i na Litwie od Władysława Jagiełły.","l":0,"k":1},{"t":"w","q":"Wielkie Księstwo Litewskie","a":"Państwo litewskie, którym rządził wielki książę.","l":0,"k":1},{"t":"w","q":"bitwa pod Grunwaldem","a":"Wielkie zwycięstwo Polski i Litwy nad Krzyżakami w 1410 roku.","l":1,"k":1},{"t":"w","q":"chrzest Litwy","a":"Przyjęcie chrześcijaństwa przez Litwinów po unii w Krewie.","l":0,"k":1},{"t":"w","q":"wielki książę","a":"Tytuł władcy Litwy.","l":0,"k":1},{"t":"w","q":"Władysław Jagiełło","a":"Wielki książę litewski, który został królem Polski.","l":0,"k":1},{"t":"w","q":"Jadwiga","a":"Młoda królowa Polski, żona Jagiełły.","l":0,"k":1},{"t":"o","q":"Co to jest unia personalna?","a":"Połączenie dwóch państw wspólnym monarchą, przy czym każde ma własne urzędy, prawa, skarb i armię.","l":0},{"t":"o","q":"Kim był Ludwik Węgierski i co stało się po jego śmierci?","a":"Król Węgier, od 1370 r. także król Polski, z dynastii Andegawenów. Po jego śmierci (1382) unia wygasła, a tron odziedziczyła Jadwiga.","l":0,"k":1},{"t":"f","q":"Jadwiga została królową Polski w _______ r.","a":"1384","acc":[],"ex":"Miała wtedy 10 lat.","l":0,"k":1},{"t":"o","q":"Dlaczego Polacy szukali męża dla Jadwigi?","a":"Aby miała wsparcie w rządzeniu i by zawrzeć sojusz; Jadwiga ostatecznie wyszła za Jagiełłę.","l":0,"k":1},{"t":"o","q":"Kto zawarł unię w Krewie i kiedy?","a":"W 1385 r. posłowie polscy i litewscy podpisali unię w Krewie; Jagiełło obiecał przyjąć chrzest, odzyskać ziemie i uwolnić jeńców.","l":0,"k":1},{"t":"o","q":"Jakie warunki obiecał Jagiełło w Krewie?","a":"Przyjąć chrzest z poddanymi, odzyskać utracone ziemie, uwolnić polskich jeńców i przyłączyć Litwę do Polski.","l":0,"k":1},{"t":"o","q":"Kiedy Jagiełło został królem Polski?","a":"W 1386 r. przyjął chrzest, imię Władysław, ożenił się z Jadwigą i został koronowany na króla Polski.","l":0,"k":1},{"t":"o","q":"Dlaczego Polska i Litwa zawarły unię?","a":"Oba państwa zagrażał zakon krzyżacki; Polacy chcieli odzyskać ziemie, a Litwini obrony przed Krzyżakami i Moskwą.","l":0},{"t":"o","q":"Jacy ludzie mieszkali w Wielkim Księstwie Litewskim?","a":"Litwini (poganie, bez pisma) oraz Rusini (Słowianie, prawosławni, mieli pismo).","l":0},{"t":"o","q":"Czego dokonała Jadwiga dla Polski?","a":"Dbała o chrystianizację Litwy i o Polskę, odnowiła uniwersytet (testament). Zmarła w 1399 r.","l":0,"k":1},{"t":"o","q":"Dlaczego między Polską a zakonem krzyżackim wybuchła wojna?","a":"Krzyżacy mieli Pomorze Gdańskie, byli rywalami Polski i Litwy, a chrzest Litwy odebrał im pretekst do wypraw.","l":1},{"t":"f","q":"Bitwa pod Grunwaldem odbyła się 15 lipca _______ roku.","a":"1410","acc":[],"ex":"Wielka wojna z zakonem trwała w latach 1409–1411.","l":1,"k":1},{"t":"o","q":"Kto dowodził wojskami w bitwie pod Grunwaldem?","a":"Król Władysław Jagiełło i wielki książę litewski Witold.","l":1,"k":1},{"t":"o","q":"Jak przebiegała bitwa pod Grunwaldem?","a":"Krzyżacy przysłali Jagielle dwa miecze, rycerze polscy i litewscy zwyciężyli, wielki mistrz poległ; mimo zwycięstwa Malborka nie zdobyto.","l":1,"k":1},{"t":"o","q":"Jakie były postanowienia pierwszego pokoju toruńskiego (1411)?","a":"Polska odzyskała ziemię dobrzyńską, Litwa – Żmudź (dożywotnio), a Krzyżacy musieli zapłacić Polsce wielkie odszkodowanie.","l":1},{"t":"o","q":"Dlaczego pokój toruński nie dał Polsce i Litwie wielkich korzyści?","a":"Odzyskano tylko niewielkie ziemie, Pomorze Gdańskie pozostało w rękach Krzyżaków.","l":1},{"t":"o","q":"Czym był zamek w Malborku?","a":"Stolicą państwa krzyżackiego od 1309 r.; potężną twierdzą z Zamkiem Wysokim, Średnim i Przedzamczem, nad rzeką Nogat.","l":1},{"t":"o","q":"Jakie skutki miała klęska Krzyżaków pod Grunwaldem?","a":"Zakon ogromnie osłabł, jego potęga już nigdy nie wróciła.","l":1,"k":1},{"t":"o","q":"Czym różni się monarchia elekcyjna od dziedzicznej?","a":"W dziedzicznej tron obejmuje syn lub inny krewny, w elekcyjnej – władcę wybierają (elekcja).","l":2},{"t":"o","q":"Dlaczego po śmierci Jagiełły tron objął jego syn Władysław?","a":"Możnowładcy wybrali jego syna na króla; w 1434 r. został nim 10-letni Władysław.","l":2,"k":1},{"t":"o","q":"Kim byli Turcy osmańscy?","a":"Muzułmanami z Azji, którzy zdobywali kolejne tereny w Europie; ich państwo to imperium osmańskie.","l":2},{"t":"o","q":"Dlaczego Władysław Warneńczyk został królem Węgier?","a":"W 1440 r. 16-letni król zawarł z Węgrami unię personalną, bo Węgrzy potrzebowali obrońcy przed Turkami.","l":2,"k":1},{"t":"o","q":"Co wydarzyło się pod Warną?","a":"W 1444 r. wojska węgiersko-polskie poniosły klęskę z Turkami, a Władysław zginął.","l":2},{"t":"f","q":"Wojna trzynastoletnia trwała w latach 1454–_______.","a":"1466","acc":[],"ex":"Zakończył ją drugi pokój toruński.","l":2,"k":1},{"t":"o","q":"Dlaczego wybuchła wojna trzynastoletnia?","a":"Mieszkańcy Prus Królewskich utworzyli Związek Pruski i zbuntowali się przeciw Krzyżakom; Kazimierz Jagiellończyk wydał akt inkorporacji Prus do Polski (1454).","l":2},{"t":"o","q":"Co to jest pospolite ruszenie i jak wypadło pod Chojnicami?","a":"Zbrojny zaciąg szlachty. Pod Chojnicami w 1454 r. poniosło klęskę, bo było słabo wyszkolone.","l":2},{"t":"o","q":"Jakie były postanowienia drugiego pokoju toruńskiego (1466)?","a":"Polska odzyskała Pomorze Gdańskie, ziemię chełmińską, Malbork, Elbląg i Warmię; reszta państwa zakonnego (Prusy Zakonne) została lennem Polski.","l":2,"k":1},{"t":"o","q":"Co to jest przywilej?","a":"Królewski dokument przyznający wyjątkowe prawa jednemu ze stanów.","l":3,"k":1},{"t":"o","q":"Wymień cztery stany średniowieczne.","a":"Duchowieństwo, rycerstwo (szlachta), mieszczanie i chłopi.","l":3},{"t":"o","q":"Jakie przywileje wydali królowie w XIV i XV w.?","a":"Koszycki (1374, Ludwik Węgierski) – jeden stały niewielki podatek; czerwiński (1422) i jedlneńsko-krakowski (1430, 1433) – nie wolno bez wyroku sądu konfiskować majątku ani więzić szlachcica; cerekwicko-nieszawski (1454) – król nie nałoży nowych podatków ani nie zwoła pospolitego ruszenia bez zgody szlachty.","l":3,"k":1},{"t":"o","q":"Co zmieniło się dzięki przywilejom?","a":"Szlachta (dawne rycerstwo) zyskała prawa, współrządziła państwem i ograniczyła władzę króla.","l":3,"k":1},{"t":"o","q":"Co to są sejmiki?","a":"Zjazdy szlachty danego województwa lub ziemi; wybierały posłów na sejm.","l":3},{"t":"o","q":"Z czego składał się sejm walny?","a":"Z króla, izby senatorskiej (senatorowie – magnaci świeccy i duchowni) i izby poselskiej (posłowie wybrani przez sejmiki).","l":3},{"t":"f","q":"Konstytucję Nihil novi uchwalono w roku _______.","a":"1505","acc":[],"ex":"Po łacinie „nic nowego”.","l":3,"k":1},{"t":"o","q":"Co postanowiła konstytucja Nihil novi?","a":"Król nie może uchwalić „nic nowego” bez zgody senatorów i posłów – sejmu.","l":3,"k":1},{"t":"o","q":"Czym była monarchia stanowa i dlaczego w Polsce nie powstała?","a":"W niej król dzieli władzę ze stanami. W Polsce mieszczanie nie mieli praw w sejmie, więc rządziła tylko szlachta – powstała monarchia szlachecka.","l":3},{"t":"o","q":"Co to jest tolerancja religijna i jak wyglądała w Polsce i Litwie?","a":"Poszanowanie wierzeń innych religii. W Polsce i Litwie żyli katolicy, prawosławni, Żydzi i muzułmanie, których nie nawracano siłą; Kazimierz Wielki przyjął Żydów.","l":4,"k":1},{"t":"o","q":"Jakie szkoły istniały w średniowiecznej Polsce?","a":"Parafialne (podstawowa nauka czytania i pisania po łacinie), katedralne (wyższy poziom) i Akademia Krakowska.","l":4,"k":1},{"t":"o","q":"Kto się uczył w szkołach parafialnych?","a":"Zazwyczaj synowie chłopów.","l":4},{"t":"o","q":"Kim był Paweł Włodkowic?","a":"Prawnikiem z Akademii Krakowskiej, który w sporach z Krzyżakami bronił prawa pogan do własnej władzy i przeciwko nawracaniu siłą.","l":4},{"t":"o","q":"Kim był Jan Długosz?","a":"Historykiem, autorem „Roczników, czyli kronik sławnego Królestwa Polskiego”.","l":4},{"t":"o","q":"Kim był Mikołaj Kopernik?","a":"Absolwentem Akademii Krakowskiej, astronomem; udowodnił, że Ziemia i inne planety krążą wokół Słońca.","l":4},{"t":"o","q":"Co to jest ołtarz Wita Stwosza?","a":"Gotycki ołtarz Mariacki w kościele w Krakowie, który Wit Stwosz tworzył w latach 1477–1489.","l":4},{"t":"o","q":"Co zmieniło odnowienie uniwersytetu w 1400 r.?","a":"Akademia Krakowska została odnowiona dzięki Jadwidze i Jagielle (późniejszy Uniwersytet Jagielloński).","l":4}],"lessons":["Unia Polski z Litwą","Wielka wojna z zakonem krzyżackim","Synowie Jagiełły","Od rycerstwa do szlachty","Polska i Litwa w XV wieku"]}]};

function test(k,id){
 const sec=DATA[k].find(s=>s.id===id),G={};
 shuffle(sec.q.map((q,i)=>({q,i}))).forEach(x=>{if(x.q.t==='w')return;const g=keyOf(x.q);(G[g]||(G[g]=[])).push(x.i);});

function start(k,id){

 let seen=store.seen[id]||[];const t=today();

  body=`<span class="tag">${q.t==='w'?'Słowniczek':q.t==='o'?'Pytanie otwarte':'Krótka odpowiedź'}</span><div class="q">${esc(stem)}</div><textarea id="ans" placeholder="Napisz swoją odpowiedź pełnym zdaniem…" oninput="chk()"></textarea>`;
 }
 app.innerHTML=`<button class="back" onclick="leave()">${['sec','test'].includes(S.orig||S.mode)?'← Lekcje':'← Menu'}</button><div class="hint">Pytanie ${S.i+1} z ${S.items.length}${S.mixed?' · '+SUBJ[it.k].name+' – '+esc(it.sec.title):''}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="card" style="cursor:default">${q.k?'<div class="hint" style="color:#b7791f;font-weight:700">⭐ Kluczowe – pogrubione w podręczniku</div>':''}${imgH(q)}${body}${SR?'<button class="mic" id="mic" onclick="dictate()">🎤 Mów zamiast pisać</button> <span class="hint" id="micmsg"></span>':''}<div id="act" class="row2"><button class="btn" id="chkb" disabled onclick="check()">Sprawdź ✓</button>${S.mode==='test'?'':'<button class="btn ghost" onclick="peek()">💡 Pokaż odpowiedź</button><button class="btn ghost" onclick="skip()">⏭ Pomiń</button>'}</div><div id="fb"></div></div>`;
 const a=document.getElementById('ans');if(a)a.focus();
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopRec(){if(rec){try{rec.stop();}catch(e){}rec=null;}const m=document.getElementById('mic');if(m){m.classList.remove('rec');m.textContent='🎤 Mów zamiast pisać';}}
function dictate(){
 const a=document.getElementById('ans'),m=document.getElementById('mic'),msg=document.getElementById('micmsg');
 if(rec){stopRec();return;}
 try{
  const r=new SR();r.lang='pl-PL';r.continuous=true;r.interimResults=true;
  const base=a.value.trim()?a.value.trim()+' ':'';
  r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;a.value=base+t.trim();chk();};
  r.onerror=e=>{msg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Brak zgody na mikrofon – zezwól w ustawieniach przeglądarki.':'Nie udało się nagrać ('+e.error+').';stopRec();};
  r.onend=()=>{if(rec===r){rec=null;m.classList.remove('rec');m.textContent='🎤 Mów zamiast pisać';}};
  rec=r;r.start();m.classList.add('rec');m.textContent='⏹ Nagrywam… (kliknij, aby zakończyć)';msg.textContent='';
 }catch(e){msg.textContent='Nagrywanie nie działa w tej przeglądarce.';rec=null;}
}
function modelText(q){return q.t==='tf'?(q.a?'Prawda':'Fałsz'):q.a;}
function peek(){
 stopRec();const q=S.cur.q,c=S.cur;c.done=true;c.peek=true;c.rated=0;c.val=(document.getElementById('ans').value||'').trim();
 document.getElementById('ans').disabled=true;
 if(q.t==='tf'){document.getElementById(q.a?'bp':'bf').className='good';document.getElementById('bp').disabled=document.getElementById('bf').disabled=true;}
 document.getElementById('fb').innerHTML=`<div class="fb mid"><h4>👁 Odpowiedź (bez punktu)</h4><b>${esc(q.t==='tf'?'To jest '+(q.a?'prawda':'fałsz')+'.':q.a)}</b>${q.ex?`<div class="lbl">Wyjaśnienie</div>${esc(q.ex)}`:''}</div>`;
 document.getElementById('act').innerHTML=`<button class="btn" id="nx" onclick="next()">${S.i+1<S.items.length?'Dalej →':'Zobacz wynik'}</button>`;
 const mic=document.getElementById('mic');if(mic)mic.style.display='none';
}
function skip(){
 stopRec();const c=S.cur;
 S.log.push({q:c.q,it:c.it,val:'',pf:null,r:0,skip:true});
 S.i++;if(S.i<S.items.length)render();else finish();
}
function pick(v){S.cur.pf=v;document.getElementById('bp').className=v===true?'on':'';document.getElementById('bf').className=v===false?'on':'';chk();}
function chk(){
 const q=S.cur.q,v=(document.getElementById('ans').value||'').trim();
 let ok=v.length>=(q.t==='f'?1:3);
 if(q.t==='tf'&&S.cur.pf===null)ok=false;
 document.getElementById('chkb').disabled=!ok;
}
function kw(model,mine){
 const stop=['który','która','które','ponieważ','którym','której','dlatego','jest','oraz','także','również','między','podczas','dzięki','przez'];
 const w=[...new Set(norm(model).split(' ').filter(x=>x.length>=5&&!stop.includes(x)).map(x=>strip(x).slice(0,5)))];
 if(!w.length)return null;
 const m=strip(mine);let h=0;w.forEach(x=>{if(m.includes(x))h++;});
 return {h,n:w.length};
}
function check(){
 stopRec();const q=S.cur.q,c=S.cur;
 const val=document.getElementById('ans').value.trim();c.val=val;c.done=true;
 document.getElementById('ans').disabled=true;
 let html='',auto=null,verdictCls='';
 if(q.t==='f'){
  const opts=[q.a].concat(q.acc||[]);
  const exact=opts.some(o=>norm(o)===norm(val));
  const loose=!exact&&opts.some(o=>strip(o)===strip(val));
  auto=(exact||loose)?1:0;
  verdictCls=auto?'':'no';
  html=`<div class="fb ${verdictCls}"><h4>${exact?'✅ Dobrze!':loose?'✅ Prawie idealnie – uważaj na polskie znaki: „'+esc(q.a)+'”':'❌ Poprawna odpowiedź: '+esc(q.a)}</h4>${q.ex?`<div class="lbl">Wyjaśnienie</div>${esc(q.ex)}`:''}</div>`;
  if(!auto)html+=`<button class="link" onclick="override()">Moja odpowiedź znaczy to samo – zaliczam</button>`;
 }else if(q.t==='tf'){
  const good=c.pf===q.a;auto=good?1:0;
  document.getElementById(q.a?'bp':'bf').className='good';
  if(!good)document.getElementById(c.pf?'bp':'bf').className='wrong';
  verdictCls=good?'':'no';
  html=`<div class="fb ${verdictCls}"><h4>${good?'✅ Dobrze – to jest '+(q.a?'prawda':'fałsz')+'!':'❌ To jest '+(q.a?'prawda':'fałsz')+'.'}</h4><div class="lbl">Twoje uzasadnienie</div><div class="mine">${esc(val)}</div>${q.ex?`<div class="lbl">Wzorowe uzasadnienie</div>${esc(q.ex)}`:''}</div>`;
 }else{
  const k=kw(q.a+' '+(q.ex||''),val);
  const hint=k?`<div class="hint">Podpowiedź: w Twojej odpowiedzi znalazłam ${k.h} z ${k.n} ważnych słów kluczowych.</div>`:'';
  html=`<div class="fb mid"><div class="lbl" style="margin-top:0">Twoja odpowiedź</div><div class="mine">${esc(val)}</div><div class="lbl">Odpowiedź wzorcowa</div><b>${esc(q.a)}</b>${q.ex?`<div class="lbl">Wyjaśnienie</div>${esc(q.ex)}`:''}${hint}</div>
  <div class="hint" style="margin-top:12px">Porównaj uczciwie. Jak sobie poszło?</div>
  <div class="rate"><button onclick="rate(1,this)">✅ Wiedziałam</button><button onclick="rate(.5,this)">🟡 Częściowo</button><button onclick="rate(0,this)">❌ Nie wiedziałam</button></div>`;
 }
 document.getElementById('fb').innerHTML=html;
 const act=document.getElementById('act');
 if(auto!==null){c.rated=auto;act.innerHTML=`<button class="btn" id="nx" onclick="next()">${S.i+1<S.items.length?'Dalej →':'Zobacz wynik'}</button>`;}
 else act.innerHTML=`<button class="btn" id="nx" disabled onclick="next()">${S.i+1<S.items.length?'Dalej →':'Zobacz wynik'}</button>`;
}
function override(){S.cur.rated=1;const b=document.querySelector('.fb h4');b.textContent='✅ Zaliczone po Twojej decyzji (poprawna odpowiedź: '+S.cur.q.a+')';document.querySelector('.fb').className='fb';document.querySelector('.link').remove();}
function rate(v,btn){S.cur.rated=v;document.querySelectorAll('.rate button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('nx').disabled=false;}
function next(){
 const c=S.cur,q=c.q;
 S.pts+=c.rated||0;
 S.log.push({q,it:c.it,val:c.val,pf:c.pf,r:c.rated||0,peek:!!c.peek});
 const it=c.it;const seen=store.seen[it.id]||(store.seen[it.id]=[]);if(!seen.includes(it.i))seen.push(it.i);
 leitner(it,c.rated||0);
 S.i++;
 if(S.i<S.items.length)render();else finish();
}
function finish(){
 const pct=Math.round(S.pts/S.items.length*100);
 if(!S.mixed&&(store.best[S.id]==null||pct>store.best[S.id]))store.best[S.id]=pct;save();
 if(S.mode==='test'){(store.tests[S.id]||(store.tests[S.id]=[])).push({d:today(),p:pct});save();}
 const msg=(S.mode==='test'?'<b>Ocena: '+grade(pct)+'</b><br>':'')+(pct>=90?'Znakomicie! 🌟':pct>=70?'Bardzo dobrze! 👏':pct>=50?'Dobrze, ale warto powtórzyć 📖':'Warto jeszcze poćwiczyć – dasz radę! 💪');
 const rev=S.log.map(l=>{const q=l.q;const mark=l.skip?'⏭':l.peek?'👁':l.r===1?'✅':l.r>0?'🟡':'❌';
  const stem=q.t==='f'?q.q.replace('_______','……'):q.t==='w'?'Co oznacza: '+q.q+'?':q.q;
  const model=q.t==='tf'?(q.a?'Prawda':'Fałsz')+(q.ex?'. '+q.ex:''):q.t==='f'?q.a+(q.ex?'. '+q.ex:''):q.a+(q.ex&&q.t==='s'?'. '+q.ex:'');
  return `<div class="rev"><b>${mark} ${esc(stem)}</b><div class="m">${l.skip?'(pominięte)':esc(q.t==='tf'&&l.pf!==null?(l.pf?'Prawda':'Fałsz')+' – '+l.val:l.val||'(bez odpowiedzi)')}</div><div class="hint">Wzór: ${esc(model)}</div></div>`}).join('');
 app.innerHTML=`<button class="back" onclick="leave()">${['sec','test'].includes(S.orig||S.mode)?'← Lekcje':'← Menu'}</button><div class="card" style="cursor:default"><div class="score"><div class="n">${pct}%</div><div>${S.pts%1?S.pts.toFixed(1):S.pts} z ${S.items.length} punktów</div><p>${msg}</p></div>${finishBtns()}</div><h2 style="margin-top:20px">Twoje odpowiedzi</h2><div class="card" style="cursor:default">${rev}</div>`;
}
home();
</script>
</body>
</html>
