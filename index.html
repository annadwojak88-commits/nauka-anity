o","a":"Najstarsza, zabytkowa część miasta.","l":4,"k":1}]},{"id":"g3","title":"Krajobrazy wyżynne i górskie Polski","icon":"⛰️","lessons":["Krajobraz miejsko-przemysłowy","Krajobraz rolniczy","Krajobraz krasowy","Krajobraz górski","Ocena najbliższego krajobrazu"],"q":[{"t":"tf","q":"Rzeźba terenu najbliższej okolicy może obejmować zarówno wzniesienia, jak i doliny.","a":true,"ex":"Nawet niewielki obszar może mieć zróżnicowaną rzeźbę terenu.","l":4},{"t":"s","q":"Obserwując środowisko przyrodnicze swojej okolicy, geograf zwraca uwagę m.in. na:","a":"Ukształtowanie terenu, wody, roślinność i klimat","ex":"To elementy środowiska przyrodniczego, które razem tworzą krajobraz danej okolicy.","l":4},{"t":"tf","q":"Krajobraz najbliższej okolicy może się zmieniać na skutek działalności człowieka, np. budowy dróg czy osiedli.","a":true,"ex":"Działalność człowieka stale przekształca otaczający nas krajobraz.","l":4},{"t":"s","q":"Punkty charakterystyczne w terenie (np. wieża kościoła, maszt) wykorzystuje się do:","a":"Orientacji w terenie","ex":"Widoczne z daleka obiekty pomagają ustalić, w którą stronę idziemy.","l":4},{"t":"s","q":"Wycieczkę terenową warto zaplanować, uwzględniając:","a":"Trasę, cel obserwacji i niezbędny sprzęt","ex":"Dobre zaplanowanie wycieczki zwiększa bezpieczeństwo i pozwala lepiej wykorzystać czas.","l":4},{"t":"s","q":"Do form ochrony przyrody w najbliższej okolicy mogą należeć:","a":"Pomniki przyrody i rezerwaty","ex":"Pomniki przyrody i rezerwaty chronią cenne, unikatowe elementy przyrody w danej okolicy.","l":4},{"t":"tf","q":"Rzeka płynąca przez najbliższą okolicę może wpływać na ukształtowanie terenu, np. tworząc dolinę.","a":true,"ex":"Płynąca woda stopniowo żłobi koryto i kształtuje otaczający teren.","l":4},{"t":"s","q":"Najwyższym pasmem górskim w Polsce są:","a":"Tatry","ex":"Tatry to jedyne w Polsce góry o charakterze wysokogórskim, z najwyższym szczytem kraju.","l":3},{"t":"f","q":"Najwyższy szczyt Polski, znajdujący się w Tatrach, to _______.","a":"Rysy","acc":[],"ex":"Rysy mają wysokość 2499 m n.p.m.","l":3,"k":1},{"t":"s","q":"Charakterystycznym elementem krajobrazu wyżynnego, zbudowanego ze skał wapiennych, mogą być:","a":"Jaskinie i skały wapienne (np. na Wyżynie Krakowsko-Częstochowskiej)","ex":"Skały wapienne łatwo rozpuszczają się pod wpływem wody, tworząc jaskinie i malownicze ostańce.","l":2},{"t":"s","q":"Krajobraz wysokogórski w Polsce (skały, hale, kosodrzewina) można zaobserwować przede wszystkim w:","a":"Tatrach","ex":"Tatry to jedyne w Polsce pasmo o charakterze wysokogórskim, sięgające ponad 2000 m n.p.m.","l":3,"k":1,"img":"tatry"},{"t":"s","q":"Najwyższym szczytem Polski są:","a":"Rysy","ex":"Rysy mają wysokość 2499 m n.p.m.","l":3,"k":1},{"t":"tf","q":"Rysy są najwyższym szczytem Polski, znajdującym się w Tatrach.","a":true,"ex":"To najwyższy punkt na terenie całego kraju.","l":3,"k":1},{"t":"f","q":"Najwyższy szczyt Polski, Rysy, znajduje się w paśmie górskim zwanym _______.","a":"Tatrami","acc":[],"ex":"Tatry są częścią Karpat.","l":3,"k":1},{"t":"o","q":"Podaj nazwę najwyższego szczytu Polski oraz pasma górskiego, w którym się znajduje.","a":"Najwyższy szczyt Polski to Rysy, znajdujący się w Tatrach.","l":3,"k":1},{"t":"s","q":"Do gór w Polsce zaliczamy m.in.:","a":"Tatry i Sudety","ex":"To dwa główne pasma górskie na terenie Polski.","l":3},{"t":"tf","q":"Tatry i Sudety to pasma górskie znajdujące się w Polsce.","a":true,"ex":"Tatry są częścią Karpat.","l":3},{"t":"s","q":"Krajobraz wyżynny, np. Wyżyny Krakowsko-Częstochowskiej, charakteryzuje się:","a":"Urozmaiconym terenem z charakterystycznymi skałami wapiennymi i jaskiniami","ex":"To region znany z licznych formacji skalnych i jaskiń.","l":2},{"t":"tf","q":"Wyżyna Krakowsko-Częstochowska charakteryzuje się skałami wapiennymi i licznymi jaskiniami.","a":true,"ex":"To region bogaty w formy krasowe.","l":2},{"t":"s","q":"Charakterystyczne formacje skalne na Wyżynie Krakowsko-Częstochowskiej powstały głównie ze skał:","a":"Wapiennych","ex":"Wapień jest podatny na rozpuszczanie przez wodę, co tworzy ciekawe formy skalne.","l":2},{"t":"f","q":"Charakterystyczne formacje skalne na Wyżynie Krakowsko-Częstochowskiej powstały głównie ze skał _______.","a":"wapiennych","acc":[],"ex":"To dlatego region ten obfituje też w jaskinie.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego na Wyżynie Krakowsko-Częstochowskiej można znaleźć liczne jaskinie.","a":"Wyżyna Krakowsko-Częstochowska zbudowana jest w dużej mierze ze skał wapiennych, które są rozpuszczalne w wodzie zawierającej dwutlenek węgla — z czasem woda wyżłobiła w wapieniu liczne szczeliny i jaskinie.","l":2},{"t":"f","q":"Najwyżej położonym parkiem narodowym w Polsce, obejmującym najwyższe góry kraju, jest Park Narodowy _______.","a":"Tatrzański","acc":[],"ex":"Obejmuje polską część Tatr, w tym Rysy.","l":3},{"t":"s","q":"Sudety różnią się od Karpat m.in. tym, że:","a":"Są generalnie niższe i starsze geologicznie","ex":"To jedna z podstawowych różnic między obydwoma pasmami.","l":3},{"t":"tf","q":"Sudety są generalnie niższe i starsze geologicznie niż Karpaty.","a":true,"ex":"Najwyższy szczyt Sudetów, Śnieżka, jest niższy niż Rysy w Tatrach (Karpatach).","l":3},{"t":"s","q":"Najwyższym szczytem Sudetów jest:","a":"Śnieżka","ex":"Śnieżka znajduje się w Karkonoszach, części Sudetów.","l":3},{"t":"f","q":"Najwyższym szczytem Sudetów jest _______.","a":"Śnieżka","acc":[],"ex":"Jest niższa niż najwyższy szczyt Tatr.","l":3},{"t":"o","q":"Porównaj krótko Tatry i Sudety pod względem wysokości i wieku geologicznego.","a":"Tatry są wyższe niż Sudety (najwyższy szczyt Tatr, Rysy, ma 2499 m, a najwyższy szczyt Sudetów, Śnieżka, około 1600 m) i są młodszym pasmem górskim, natomiast Sudety są niższe i geologicznie starsze.","l":3,"k":1},{"t":"s","q":"Charakterystycznym elementem krajobrazu Wyżyny Lubelskiej są:","a":"Wąwozy lessowe","ex":"Powstały w podatnej na erozję glebie lessowej.","l":1,"k":1},{"t":"f","q":"Charakterystyczne dla Wyżyny Lubelskiej głębokie, wąskie doliny wyżłobione w podatnej na erozję glebie lessowej nazywamy wąwozami _______.","a":"lessowymi","acc":[],"ex":"To jeden z charakterystycznych elementów krajobrazu tego regionu.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, w jaki sposób powstają wąwozy lessowe na Wyżynie Lubelskiej.","a":"Wąwozy lessowe powstają w wyniku erozji wodnej — woda opadowa i spływająca po zboczach żłobi głębokie, wąskie doliny w miękkiej, podatnej na rozmywanie glebie lessowej, charakterystycznej dla Wyżyny Lubelskiej.","l":1,"k":1},{"t":"s","q":"Gleba lessowa, charakterystyczna dla Wyżyny Lubelskiej, jest:","a":"Żyzna, ale podatna na erozję wodną","ex":"To dlatego region ten jest zarówno rolniczy, jak i pełen wąwozów.","l":1,"k":1},{"t":"tf","q":"Gleba lessowa jest żyzna, ale jednocześnie podatna na erozję wodną, co sprzyja powstawaniu wąwozów.","a":true,"ex":"Te dwie cechy współistnieją na Wyżynie Lubelskiej.","l":1,"k":1},{"t":"s","q":"Krajobraz rolniczy Wyżyny Lubelskiej sprzyja przede wszystkim:","a":"Uprawie roślin, dzięki żyznym glebom lessowym","ex":"Żyzne gleby lessowe są bardzo cenione w rolnictwie.","l":1,"k":1},{"t":"tf","q":"Żyzne gleby lessowe Wyżyny Lubelskiej sprzyjają rozwojowi rolnictwa.","a":true,"ex":"To dlatego region ten ma charakter rolniczy.","l":1,"k":1},{"t":"s","q":"Wyżyna Śląska jest znana przede wszystkim z:","a":"Rozwiniętego przemysłu i górnictwa","ex":"To jeden z najbardziej uprzemysłowionych regionów Polski.","l":0},{"t":"tf","q":"Wyżyna Śląska jest regionem o silnie rozwiniętym przemyśle i górnictwie węgla.","a":true,"ex":"To odróżnia ją od rolniczego charakteru Wyżyny Lubelskiej.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego krajobraz Wyżyny Śląskiej różni się od krajobrazu rolniczego Wyżyny Lubelskiej.","a":"Wyżyna Śląska jest regionem silnie uprzemysłowionym, z rozwiniętym górnictwem węgla i przemysłem, co wiąże się z gęstą zabudową przemysłową i miejską, natomiast Wyżyna Lubelska ma żyzne gleby lessowe sprzyjające rolnictwu, dlatego dominuje tam krajobraz rolniczy, z polami uprawnymi i mniejszą gęstością zabudowy.","l":0,"k":1},{"t":"o","q":"Jaki surowiec wydobywa się na Wyżynie Śląskiej?","a":"Węgiel kamienny.","l":0,"k":1},{"t":"o","q":"Dlaczego krajobraz Wyżyny Śląskiej nazywamy miejsko-przemysłowym?","a":"Jest tam wiele gęsto zaludnionych, połączonych ze sobą miast oraz kopalni, hut i fabryk.","l":0},{"t":"o","q":"Co to jest hałda?","a":"Sztuczne wzniesienie usypane ze skał wydobytych podczas górniczej eksploatacji.","l":0,"k":1},{"t":"o","q":"Jakie zagrożenia dla środowiska powstają na obszarach przemysłowych?","a":"Np. zanieczyszczenie powietrza i wód oraz przekształcenie powierzchni terenu.","l":0},{"t":"o","q":"Co oznacza rekultywacja terenów pogórniczych?","a":"Przywracanie takim terenom wartości przyrodniczych i użytkowych, np. przez zalesianie.","l":0},{"t":"o","q":"Dlaczego gleby lessowe są cenne dla rolnictwa?","a":"Są bardzo żyzne, dlatego dobrze plonują na nich uprawy.","l":1,"k":1},{"t":"o","q":"Podaj dwie rośliny uprawiane na Wyżynie Lubelskiej.","a":"Np. pszenica i buraki cukrowe.","l":1},{"t":"o","q":"Jaką wysokość nad poziomem morza mają zwykle wyżyny?","a":"Powyżej 300 m n.p.m.","l":1,"k":1},{"t":"o","q":"Z jakich skał zbudowana jest Wyżyna Krakowsko-Częstochowska?","a":"Głównie z wapieni jurajskich.","l":2},{"t":"o","q":"Co to są ostańce skalne?","a":"Samotne skały pozostałe po zniszczeniu otaczających je mniej odpornych skał.","l":2},{"t":"o","q":"Jak nazywa się szlak łączący dawne zamki na Wyżynie Krakowsko-Częstochowskiej?","a":"Szlak Orlich Gniazd.","l":2,"k":1},{"t":"o","q":"Jaki park narodowy w pobliżu Krakowa chroni skałki i jaskinie?","a":"Ojcowski Park Narodowy.","l":2,"k":1},{"t":"o","q":"Jaki park narodowy chroni polskie Tatry?","a":"Tatrzański Park Narodowy.","l":3,"k":1},{"t":"o","q":"Podaj dwa zwierzęta chronione żyjące w Tatrach.","a":"Np. kozica i świstak.","l":3},{"t":"o","q":"Wymień piętra roślinne w Tatrach od podnóża ku szczytom.","a":"Regiel dolny, regiel górny, piętro kosodrzewiny, hale (piętro alpejskie) i piętro turni.","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Dlaczego w górach jest chłodniej niż u ich podnóża?","a":"Wraz ze wzrostem wysokości temperatura powietrza spada.","l":3},{"t":"o","q":"Jak nazywa się jedno z najbardziej znanych jezior tatrzańskich?","a":"Morskie Oko.","l":3},{"t":"o","q":"Co wyróżnia krajobraz wysokogórski Tatr?","a":"Skaliste, ostre szczyty i granie, doliny polodowcowe oraz jeziora.","l":3},{"t":"o","q":"Jak można opisać krajobraz najbliższej okolicy?","a":"Wskazać rzeźbę terenu, wody, roślinność, zabudowę i działalność człowieka.","l":4},{"t":"o","q":"Podaj po dwa elementy przyrodnicze i dwa wytworzone przez człowieka w krajobrazie okolicy.","a":"Np. przyrodnicze: rzeka, las; wytworzone przez człowieka: domy, drogi.","l":4},{"t":"o","q":"Jak zmienia się krajobraz okolicy w ciągu roku?","a":"Zmieniają się pory roku, więc zmieniają się pogoda i wygląd roślin.","l":4},{"t":"o","q":"Po co sporządza się szkic lub plan okolicy?","a":"Aby pokazać, jak rozmieszczone są ważne obiekty, i łatwiej się po niej poruszać.","l":4},{"t":"o","q":"Jakie formy ochrony przyrody mogą występować w okolicy?","a":"Np. pomniki przyrody, rezerwaty i parki krajobrazowe.","l":4},{"t":"o","q":"Gdzie w Polsce występuje pas wyżyn i na jakiej wysokości leżą wyżyny?","a":"W południowej części Polski, między 300 a 500 m n.p.m. Wyróżniamy Wyżynę Śląską, Krakowsko-Częstochowską, Małopolską i Lubelską.","l":0,"k":1},{"t":"o","q":"Gdzie leży Wyżyna Śląska?","a":"Na zachodzie pasa wyżyn, od zachodu ogranicza ją dolina Odry, a od wschodu Wyżyna Krakowsko-Częstochowska.","l":0},{"t":"o","q":"Jak powstał węgiel kamienny?","a":"Ok. 300 mln lat temu z obumarłych roślin. Jest cennym surowcem mineralnym, który stał się podstawą przemysłu.","l":0,"k":1},{"t":"o","q":"Kiedy zaczęto wydobywać węgiel kamienny na masową skalę i do czego go używano?","a":"W XIX wieku. Początkowo do napędzania maszyn parowych, potem do ogrzewania budynków i wytopu stali.","l":0,"k":1},{"t":"o","q":"Co to jest przemysł?","a":"Działalność człowieka polegająca na wydobywaniu i przetwarzaniu zasobów przyrody; wytwarza się produkty przy użyciu maszyn na masową skalę.","l":0},{"t":"o","q":"Wymień rodzaje przemysłu rozwiniętego na Wyżynie Śląskiej.","a":"Górniczy, hutniczy, energetyczny, maszynowy i chemiczny. Razem tworzą przemysł ciężki.","l":0},{"t":"o","q":"Co wytwarza się z węgla kamiennego?","a":"Energię elektryczną i ciepło, koks, smołę, gaz, paliwa silnikowe, materiały wybuchowe, barwniki, kosmetyki, leki, środki ochrony roślin i nawozy sztuczne.","l":0},{"t":"o","q":"Co to jest konurbacja i jak nazywa się ta na Wyżynie Śląskiej?","a":"Konurbacja to aglomeracja złożona z wielu miast o podobnej wielkości. Na Wyżynie Śląskiej jest to konurbacja górnośląska (Górny Śląsk).","l":0,"k":1},{"t":"o","q":"Co to jest aglomeracja?","a":"Duży obszar o charakterze miejskim, złożony z jednego lub wielu miast i osiedli połączonych liniami kolejowymi i drogami.","l":0},{"t":"o","q":"Wymień największe miasta konurbacji górnośląskiej.","a":"Katowice, Gliwice, Chorzów, Bytom, Zabrze (i inne).","l":0,"k":1},{"t":"o","q":"Jak nazywa się Górnośląski Okręg Przemysłowy?","a":"GOP – tworzą go zakłady przemysłowe i miasta Górnego Śląska.","l":0},{"t":"o","q":"Co to jest nikiszowiec i familoki?","a":"Nikiszowiec – dawne osiedle dla górników w Katowicach. Familoki – wielorodzinne budynki dla robotników z cegły.","l":0},{"t":"o","q":"Jak zmieniał się krajobraz Wyżyny Śląskiej od XVII do XXI wieku?","a":"XVII w. – lasy; XVIII w. – pierwsze kopalnie; XIX–XX w. – rozwój przemysłu i miast; XXI w. – nowoczesna aglomeracja.","l":0},{"t":"o","q":"Jakie są negatywne skutki rozwoju przemysłu na Wyżynie Śląskiej?","a":"Hałdy, zanieczyszczenie powietrza i wody oraz szkody górnicze (zapadanie się terenu, uszkodzenia budynków).","l":0,"k":1},{"t":"o","q":"Co to są hałdy i szkody górnicze?","a":"Hałdy – formy terenu z nasypanych odpadów górniczych. Szkody górnicze – uszkodzenia obiektów na powierzchni po wydobyciu węgla pod ziemią.","l":0,"k":1},{"t":"o","q":"Co to jest rewitalizacja?","a":"Odnowa dawnych terenów przemysłowych, które zamieniono np. w obiekty rekreacyjne, muzea, ośrodki kultury i centra handlowe.","l":0},{"t":"o","q":"Podaj przykłady rewitalizacji na Górnym Śląsku.","a":"Muzeum Śląskie w Katowicach na terenie dawnej kopalni, Szlak Zabytków Techniki, wieża widokowa na dawnej kopalni.","l":0},{"t":"o","q":"Kim są Ślązacy i czym się wyróżniają?","a":"Mieszkańcy Śląska. Mają gwarę (gwary śląskie), tradycje górnicze, np. Barbórka 4 grudnia, i kuchnię (np. kluski śląskie, karminadle).","l":0},{"t":"f","q":"Barbórkę obchodzą górnicy w dniu św. Barbary – _______ grudnia.","a":"4","acc":["4 grudnia"],"ex":"Św. Barbara jest patronką górników.","l":0},{"t":"tf","q":"Krajobraz miejsko-przemysłowy to krajobraz przekształcony przez człowieka.","a":true,"ex":"Zakłady przemysłowe, hałdy, duże skupiska miast i gęsta sieć komunikacyjna.","l":0},{"t":"w","q":"przemysł","a":"Działalność człowieka polegająca na wydobywaniu i przetwarzaniu zasobów przyrody oraz wytwarzaniu produktów przy użyciu maszyn na masową skalę.","l":0,"k":1},{"t":"w","q":"konurbacja","a":"Aglomeracja złożona z wielu miast o podobnej wielkości i liczbie ludności.","l":0,"k":1},{"t":"w","q":"hałda","a":"Antropogeniczna forma terenu powstała z nasypanych odpadów górniczych i przemysłowych.","l":0,"k":1},{"t":"w","q":"szkody górnicze","a":"Uszkodzenia obiektów na powierzchni lub pod ziemią powstałe na skutek wydobycia np. węgla kamiennego.","l":0,"k":1},{"t":"w","q":"familoki","a":"Budynki wielorodzinne budowane dla pracowników i ich rodzin, zatrudnionych w kopalniach i fabrykach.","l":0,"k":1},{"t":"o","q":"Gdzie leży Wyżyna Lubelska?","a":"Na wschód od doliny Wisły; powierzchnia jest urozmaicona licznymi wąwozami. Największym miastem jest Lublin.","l":1},{"t":"o","q":"Czym jest less?","a":"Skałą osadową zbudowaną z bardzo drobnych ziarenek pyłu o żółtym odcieniu. Łatwo ją podcinać wodami opadowymi; pokrywa Wyżynę Lubelską warstwą o grubości 10–20 m.","l":1,"k":1},{"t":"o","q":"Jak powstaje wąwóz?","a":"Po ulewnych deszczach w lessie powstają wąskie bruzdy; w kolejnych opadach pogłębiają się i poszerzają, aż przekształcą się w wąwóz.","l":1,"k":1},{"t":"o","q":"Gdzie znajduje się Kazimierzowski Park Krajobrazowy i co go wyróżnia?","a":"Koło Kazimierza Dolnego nad Wisłą; ma gęstą sieć wąwozów z odgałęzieniami.","l":1},{"t":"o","q":"Jaka gleba występuje na Wyżynie Lubelskiej i czemu jest cenna?","a":"Czarnoziem – powstał na lessie; jest najżyźniejszą glebą w Polsce, ma gruby poziom próchniczny.","l":1,"k":1},{"t":"o","q":"Dlaczego na Wyżynie Lubelskiej rozwinęło się rolnictwo?","a":"Dzięki żyznym czarnoziemom i sprzyjającemu klimatowi; Wyżynę nazywa się zagłębiem rolniczym Polski.","l":1,"k":1},{"t":"o","q":"Wymień rośliny uprawiane na Wyżynie Lubelskiej i ich przeznaczenie.","a":"Burak cukrowy – cukier; chmiel – składnik piwa; pszenica – mąka; tytoń – papierosy; len – włókno i olej; rzepak – olej i biopaliwo.","l":1},{"t":"o","q":"Jakie zwierzęta hoduje się na Wyżynie Lubelskiej?","a":"Bydło (mleko, mięso), trzodę chlewną (mięso) i drób (mięso, jaja).","l":1},{"t":"o","q":"Jakie są cechy krajobrazu wiejskiego Wyżyny Lubelskiej?","a":"Małe zaludnienie, niska i rozproszona zabudowa, duże otwarte przestrzenie, przewaga pól uprawnych, łąk i sadów, obecność zwierząt i zabudowań gospodarskich, roślinność zależna od pory roku.","l":1},{"t":"o","q":"Co to jest krajobraz rolniczy?","a":"Krajobraz wiejski, w którym przeważają pola uprawne, łąki i sady, przekształcony przez człowieka.","l":1},{"t":"o","q":"Jakie miasta warto zwiedzić na Wyżynie Lubelskiej?","a":"Lublin, Zamość (Stare Miasto na Liście światowego dziedzictwa UNESCO), Kazimierz Dolny i Nałęczów (uzdrowisko).","l":1},{"t":"o","q":"Co zobaczymy w Muzeum Wsi Lubelskiej i w Muzeum Kowalstwa w Wojciechowie?","a":"W Lublinie dawne budynki wiejskie; w Wojciechowie kuźnię i wyroby kowalstwa artystycznego.","l":1},{"t":"o","q":"Jakie surowce wydobywa się poza rolnictwem na Wyżynie Lubelskiej?","a":"Węgiel kamienny (Bogdanka koło Łęcznej).","l":1,"k":1},{"t":"f","q":"Gleba utworzona na lessie to _______.","a":"czarnoziem","acc":[],"ex":"Jest najżyźniejsza w Polsce.","l":1,"k":1},{"t":"tf","q":"Na Wyżynie Lubelskiej jest dużo lasów.","a":false,"ex":"Lasów jest bardzo mało – wycięto je pod uprawy.","l":1},{"t":"w","q":"less","a":"Skała osadowa zbudowana z drobnych, pylastych ziarenek o żółtej barwie.","l":1,"k":1},{"t":"w","q":"wąwóz","a":"Wcięta forma terenu, rodzaj suchej doliny o stromych zboczach i wąskim, płaskim dnie.","l":1,"k":1},{"t":"w","q":"czarnoziem","a":"Najżyźniejsza gleba w Polsce, powstała na lessie, ma gruby poziom próchniczny.","l":1,"k":1},{"t":"o","q":"Gdzie leży Wyżyna Krakowsko-Częstochowska?","a":"Na południu Polski, między Częstochową a Krakowem; ma ją przecinać Warta i Pilica (źródła).","l":2},{"t":"o","q":"Co to jest jura i skąd się wzięła nazwa?","a":"Okres w dziejach Ziemi sprzed ponad 150 mln lat; na terenie Wyżyny było wtedy płytkie morze, z którego powstały skały wapienne. Stąd nazwa Jura Krakowsko-Częstochowska.","l":2},{"t":"o","q":"Czym są skamieniałości?","a":"Szczątkami organizmów sprzed milionów lat zachowanymi w skałach (np. amonit).","l":2},{"t":"o","q":"Co to jest krasowienie?","a":"Proces rozpuszczania skał wapiennych przez wodę zawierającą dwutlenek węgla.","l":2,"k":1},{"t":"o","q":"Wymień formy krasu powierzchniowego.","a":"Ostańce krasowe, żłobki krasowe, ponory, wywierzyska (oraz doliny rzeczne).","l":2,"k":1},{"t":"o","q":"Wymień formy krasu podziemnego.","a":"Jaskinie, a w nich formy naciekowe: stalaktyty, stalagmity, stalagnaty.","l":2,"k":1},{"t":"o","q":"Czym jest ostaniec krasowy?","a":"Odizolowany pagórek zbudowany z bardziej odpornej skały wapiennej, np. Maczuga Herkulesa.","l":2,"k":1},{"t":"o","q":"Co to jest ponor, a co wywierzysko?","a":"Ponor – otwór, którym woda z potoków i rzek wpływa pod powierzchnię. Wywierzysko – miejsce, gdzie wody podziemne wypływają na powierzchnię (np. źródła Warty).","l":2,"k":1},{"t":"o","q":"Czym jest jaskinia?","a":"Pustą przestrzenią w skale, wydrążoną przez wodę (np. Jaskinia Łokietka); system korytarzy i szczelin.","l":2},{"t":"o","q":"Czym różnią się stalaktyt, stalagmit i stalagnat?","a":"Stalaktyt zwisa ze stropu jaskini; stalagmit rośnie od dna do góry; stalagnat to kolumna powstała z połączenia obu.","l":2,"k":1},{"t":"o","q":"Jak powstają formy naciekowe?","a":"Woda z rozpuszczonym wapieniem skapuje ze stropu, osadza węglan wapnia (kalcyt); rośnie to bardzo wolno, ok. 1–3 mm na rok.","l":2},{"t":"o","q":"Co to jest Ojcowski Park Narodowy i jaki jest jego symbol?","a":"Najmniejszy park narodowy w Polsce, chroni przyrodę Jury; symbolem jest nietoperz.","l":2,"k":1},{"t":"o","q":"Co zobaczymy w Ojcowskim Parku Narodowym?","a":"Bramę Krakowską, Dolinę Prądnika, Jaskinię Łokietka, Maczugę Herkulesa i zamek w Pieskowej Skale.","l":2,"k":1},{"t":"o","q":"Co to jest Szlak Orlich Gniazd?","a":"Turystyczny szlak łączący zamki i warownie na Jurze (od Krakowa do Częstochowy), zbudowane w średniowieczu jako system obronny; budowane z wapienia.","l":2,"k":1},{"t":"o","q":"Podaj przykłady zamków na Szlaku Orlich Gniazd.","a":"Bobolice, Mirów, Ogrodzieniec, Smoleń, Pieskowa Skała, Olsztyn.","l":2,"k":1},{"t":"tf","q":"Wyżyna Krakowsko-Częstochowska zbudowana jest ze skał wapiennych.","a":true,"ex":"Dlatego występuje tam krajobraz krasowy.","l":2},{"t":"w","q":"krasowienie","a":"Proces rozpuszczania skał wapiennych przez wodę zawierającą dwutlenek węgla.","l":2,"k":1},{"t":"w","q":"jaskinia","a":"Pusta przestrzeń w skale, wydrążona przez wodę i połączona systemem szczelin i korytarzy.","l":2,"k":1},{"t":"w","q":"ostaniec krasowy","a":"Odizolowany pagórek zbudowany z odpornej skały wapiennej.","l":2,"k":1},{"t":"w","q":"skamieniałości","a":"Szczątki organizmów zachowane w skałach.","l":2,"k":1},{"t":"o","q":"Jaką wysokość mają góry w Polsce i gdzie biegnie południowa granica?","a":"Powyżej 500 m n.p.m., duże wysokości względne (>300 m). Granica na południu biegnie wzdłuż Sudetów i Karpat.","l":3,"k":1},{"t":"o","q":"Jakie pasma górskie leżą w Polsce i które jest najwyższe?","a":"Sudety (południowy zachód) i Karpaty (południe). Najwyższym pasmem Sudetów są Karkonosze, a Karpat – Tatry.","l":3},{"t":"o","q":"Co wyróżnia Tatry?","a":"Są najwyższymi górami w Polsce o krajobrazie wysokogórskim – ostre, skaliste szczyty; mają charakter alpejski.","l":3},{"t":"f","q":"Najwyższy szczyt polskich Tatr to _______ (2499 m n.p.m.).","a":"Rysy","acc":[],"ex":"Leży na granicy ze Słowacją.","l":3,"k":1},{"t":"o","q":"Jak dzielą się Tatry?","a":"Na Tatry Wysokie i Tatry Zachodnie; granicę stanowi Przełęcz Liliowe.","l":3,"k":1},{"t":"o","q":"Czym różnią się Tatry Zachodnie od Wysokich?","a":"Zachodnie: z wapieni, łagodniejsze, trawiaste szczyty, jaskinie (Jaskinia Śnieżna), niższe (Starorobociański Wierch 2176 m). Wysokie: z granitu, strome, ostre szczyty, stawy, wodospady, wyższe (Rysy 2499 m).","l":3,"k":1},{"t":"o","q":"Wymień formy terenu w krajobrazie wysokogórskim.","a":"Grań, turnia, przełęcz, żleb, stożek piargowy, kocioł lodowcowy.","l":3,"k":1},{"t":"o","q":"Co to jest grań, turnia i przełęcz?","a":"Grań – wąski grzbiet górski. Turnia – ostry, skalisty szczyt. Przełęcz – obniżenie między szczytami.","l":3,"k":1},{"t":"o","q":"Co to jest żleb i stożek piargowy?","a":"Żleb – pionowe wcięcie w stoku. Stożek piargowy – odłamki skalne usypane poniżej wylotu żlebu.","l":3,"k":1},{"t":"o","q":"Co to jest staw tatrzański?","a":"Górskie jezioro polodowcowe wypełniające kocioł lodowcowy (np. Morskie Oko).","l":3},{"t":"o","q":"Jaka jest pogoda w górach?","a":"Kapryśna i często się zmienia; im wyżej, tym chłodniej i więcej opadów. Zawsze trzeba zabrać ciepłe ubranie i kurtkę przeciwdeszczową.","l":3},{"t":"o","q":"Co to jest wiatr halny?","a":"Silny, porywisty wiatr wiejący w Tatrach z południa; opada ze szczytów, staje się suchy i ciepły.","l":3,"k":1},{"t":"o","q":"Jak układa się roślinność w Tatrach?","a":"Piętrowo: pogórze, regiel dolny, regiel górny, piętro kosodrzewiny, hale, turnie. Im wyżej, tym roślinność uboższa.","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Jakie jest piętro regla dolnego i górnego?","a":"Regiel dolny – lasy mieszane z przewagą świerków i buków. Regiel górny – lasy iglaste ze świerków, jodeł i sosen limb.","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Czym jest kosodrzewina, a czym hale?","a":"Kosodrzewina – krzewiasta sosna. Hale – łąki wysokogórskie (trawy i zioła).","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Jakie rośliny i zwierzęta żyją w Tatrach?","a":"Rośliny: krokus spiski, szarotka alpejska, goryczka krótkołodygowa. Zwierzęta: kozica tatrzańska, niedźwiedź brunatny, świstak.","l":3},{"t":"o","q":"Jak chronione są Tatry?","a":"Utworzono Tatrzański Park Narodowy; po parku wolno chodzić tylko wyznaczonymi szlakami, aby nie niszczyć roślin i nie płoszyć zwierząt.","l":3,"k":1},{"t":"o","q":"Kim są górale podhalańscy i jak się wyróżniają?","a":"Mieszkańcy Tatr i Podhala; mają gwarę, stroje, muzykę, domy z drewna i tradycje (np. oscypek – ser z mleka owczego).","l":3,"k":1},{"t":"o","q":"Co to jest Podhale?","a":"Region kulturowy rozciągający się od północnego podnóża Tatr do pasma Gorców.","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Co to jest oscypek?","a":"Regionalny ser z mleka owczego, produkt górali podhalańskich.","l":3,"k":1},{"t":"f","q":"Miasto u podnóża Tatr, uznawane za zimową stolicę Polski, to _______.","a":"Zakopane","acc":[],"ex":"","l":3},{"t":"w","q":"grań","a":"Wąski, ostry grzbiet górski.","l":3,"k":1},{"t":"w","q":"turnia","a":"Ostry, skalisty szczyt lub skałka o stromych, czasem pionowych ścianach.","l":3,"k":1},{"t":"w","q":"przełęcz","a":"Obniżenie grzbietu górskiego między dwoma szczytami.","l":3,"k":1},{"t":"w","q":"żleb","a":"Pionowe, wąskie wcięcie w stoku.","l":3,"k":1},{"t":"w","q":"stożek piargowy","a":"Rumowisko skalne usypane u ujścia żlebu.","l":3,"k":1},{"t":"w","q":"regiel","a":"Leśne piętro roślinności w górach; dzieli się na regiel dolny (lasy liściaste i mieszane) i górny (lasy iglaste).","l":3,"k":1,"img":"tatry"},{"t":"w","q":"wiatr halny","a":"Lokalna nazwa ciepłego, suchego i porywistego wiatru w Tatrach.","l":3,"k":1},{"t":"w","q":"gwara","a":"Odmiana języka polskiego.","l":3,"k":1},{"t":"w","q":"granit","a":"Skała magmowa występująca m.in. w Tatrach.","l":3,"k":1},{"t":"w","q":"hale","a":"Łąki wysokogórskie.","l":3,"k":1,"img":"tatry"},{"t":"o","q":"Po co dokonujemy oceny krajobrazu?","a":"Aby lepiej zrozumieć i docenić walory przyrodnicze i kulturowe okolicy oraz planować działania poprawiające jakość życia i środowiska.","l":4},{"t":"o","q":"Kto wykorzystuje ocenę krajobrazu?","a":"Specjaliści i jednostki samorządu terytorialnego (gminy, powiaty, województwa) przy tworzeniu planów zagospodarowania przestrzennego.","l":4},{"t":"o","q":"Czym jest plan zagospodarowania przestrzennego?","a":"Dokumentem określającym przeznaczenie terenu w obrębie danej jednostki administracyjnej; wskazuje, które obszary chronić, a które przeznaczyć na zabudowę, rolnictwo, przemysł.","l":4,"k":1},{"t":"o","q":"Na co zwracamy uwagę przy ocenie najbliższego krajobrazu?","a":"Na przyrodę (drzewa, zwierzęta), architekturę (budynki, ich stan) i przestrzeń (otwarte tereny, miejsca wypoczynku).","l":4},{"t":"o","q":"Wymień elementy oceny krajobrazu w tabeli.","a":"Elementy przyrodnicze, architektoniczne, przestrzeń i użytkowanie oraz estetyka. Oceniamy w skali od 1 do 6.","l":4},{"t":"o","q":"Jak przeprowadzić ocenę krajobrazu okolicy szkoły?","a":"Określić położenie, wyznaczyć obszar i trasę, obserwować w terenie z mapą, zebrać kwestionariusze z grup, porównać oceny i zaprezentować wyniki jako pomysł zmiany.","l":4},{"t":"o","q":"Jak możemy zmienić najbliższy krajobraz?","a":"Obserwować, dostrzegać problemy i proponować rozwiązania, np. sprzątanie okolicy, sadzenie drzew, budowa placu zabaw; pomagają projekty finansowane z budżetu obywatelskiego.","l":4},{"t":"o","q":"Jakie czynniki bierzemy pod uwagę oceniając krajobraz?","a":"Przyrodnicze, architektoniczne, przestrzenne, estetyczne i kulturowe.","l":4},{"t":"tf","q":"Każdy z nas może mieć wpływ na pozytywne zmiany w krajobrazie najbliższej okolicy.","a":true,"ex":"","l":4},{"t":"o","q":"Wymień cztery wyżyny w pasie wyżyn.","a":"Wyżyna Śląska, Krakowsko-Częstochowska, Małopolska i Lubelska.","l":null},{"t":"o","q":"Czym różnią się wyżyny od gór pod względem wysokości?","a":"Wyżyny leżą na wysokości 300–500 m n.p.m. i mają urozmaiconą rzeźbę; góry leżą powyżej 500 m n.p.m. i mają duże wysokości względne (ponad 300 m).","l":null,"k":1},{"t":"o","q":"Podaj cechy krajobrazu miejsko-przemysłowego Wyżyny Śląskiej.","a":"Zakłady przemysłowe, konurbacja górnośląska, hałdy, liczne kopalnie (dawniej), zanieczyszczenie środowiska, odrębność kulturowa Ślązaków.","l":null,"k":1},{"t":"o","q":"Podaj cechy Wyżyny Lubelskiej.","a":"Lessy, wąwozy, czarnoziemy, rolnictwo (pszenica, burak cukrowy, tytoń, chmiel, rzepak), atrakcyjne miasta: Lublin, Zamość, Kazimierz Dolny, Nałęczów.","l":null,"k":1},{"t":"o","q":"Jak powstał krajobraz krasowy na Wyżynie Krakowsko-Częstochowskiej?","a":"W podłożu są skały wapienne, które rozpuszcza woda z dwutlenkiem węgla (krasowienie); powstają formy krasu powierzchniowego i podziemnego.","l":null,"k":1},{"t":"o","q":"Wymień pozytywne zmiany w krajobrazach związane z działalnością człowieka.","a":"Rewitalizacja terenów poprzemysłowych, ochrona zabytkowej architektury, tworzenie parków narodowych (Ojcowski, Tatrzański), zakładanie skansenów i muzeów regionalnych.","l":null,"k":1},{"t":"o","q":"Wymień negatywne zmiany w krajobrazach związane z działalnością człowieka.","a":"Zanieczyszczenie powietrza, wód i gleb, hałdy i szkody górnicze, wycinanie lasów pod pola i sady, zadeptywanie roślinności, płoszenie zwierząt przez turystykę.","l":null,"k":1},{"t":"tf","q":"Sudety i Karpaty to łańcuchy górskie leżące w południowej Polsce.","a":true,"ex":"","l":null},{"t":"tf","q":"Szlak Orlich Gniazd to najtrudniejszy szlak w Tatrach.","a":false,"ex":"To szlak turystyczny z zamkami na Jurze Krakowsko-Częstochowskiej.","l":null,"k":1}]},{"id":"g4","title":"Krajobrazy świata, część 1","icon":"🌍","lessons":["Strefowość i piętrowość klimatyczno-roślinna na świecie","Wilgotne lasy równikowe","Lasy strefy umiarkowanej","Sawanna i step"],"q":[{"t":"s","q":"Różnica między pogodą a klimatem polega na tym, że:","a":"Pogoda to stan atmosfery w danym miejscu i czasie, a klimat to uśrednione warunki pogodowe z wielu lat","ex":"To podstawowe rozróżnienie w geografii.","l":0},{"t":"tf","q":"Pogoda to stan atmosfery w danym miejscu i momencie, a klimat to uśrednione warunki pogodowe charakterystyczne dla danego obszaru na przestrzeni wielu lat.","a":true,"ex":"Klimat opisuje typowe, długoterminowe warunki, a nie chwilowy stan.","l":0},{"t":"f","q":"Uśrednione warunki pogodowe charakterystyczne dla danego obszaru, obserwowane przez wiele lat, nazywamy _______.","a":"klimatem","acc":[],"ex":"Klimat różni się od chwilowej pogody.","l":0},{"t":"o","q":"Wyjaśnij różnicę między pogodą a klimatem.","a":"Pogoda to aktualny stan atmosfery w danym miejscu i czasie (np. dziś pada deszcz), natomiast klimat to uśrednione, typowe warunki pogodowe dla danego obszaru, ustalone na podstawie obserwacji z wielu lat (np. klimat równikowy jest zawsze gorący i wilgotny).","l":0},{"t":"s","q":"Strefa klimatyczna równikowa charakteryzuje się:","a":"Wysoką temperaturą i dużą ilością opadów przez cały rok","ex":"To najcieplejsza i najbardziej wilgotna strefa klimatyczna.","l":1,"k":1,"img":"strefy"},{"t":"tf","q":"W strefie klimatu równikowego panuje wysoka temperatura i duża ilość opadów przez cały rok.","a":true,"ex":"Sprzyja to bujnej roślinności lasów równikowych.","l":1,"img":"strefy"},{"t":"s","q":"Wilgotny las równikowy charakteryzuje się:","a":"Bogatą, wielowarstwową roślinnością i dużą różnorodnością gatunków","ex":"To jeden z najbardziej zróżnicowanych ekosystemów na Ziemi.","l":1},{"t":"f","q":"Las równikowy cechuje ogromna różnorodność gatunków roślin i _______.","a":"zwierząt","acc":[],"ex":"To dlatego nazywa się go czasem „płucami Ziemi”.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego w wilgotnym lesie równikowym występuje tak duża różnorodność gatunków roślin i zwierząt.","a":"Wysoka temperatura i duża ilość opadów przez cały rok stwarzają w lesie równikowym wyjątkowo sprzyjające warunki do rozwoju roślinności, co z kolei zapewnia bogatą bazę pokarmową i siedliska dla ogromnej liczby gatunków zwierząt.","l":1},{"t":"s","q":"Sawanna to krajobraz charakterystyczny dla strefy:","a":"Zwrotnikowej, z wyraźną porą suchą i porą deszczową","ex":"Sezonowość opadów jest kluczową cechą tej strefy.","l":3,"k":1},{"t":"tf","q":"Sawanna charakteryzuje się naprzemiennymi porami: suchą i deszczową.","a":true,"ex":"To odróżnia ją od lasu równikowego z opadami przez cały rok.","l":3,"k":1},{"t":"s","q":"Charakterystyczną roślinnością sawanny są:","a":"Wysokie trawy oraz pojedyncze drzewa, np. baobaby","ex":"To typowy krajobraz np. we wschodniej Afryce.","l":3,"k":1},{"t":"f","q":"Charakterystycznym drzewem sawanny afrykańskiej jest _______.","a":"baobab","acc":[],"ex":"Baobaby mają bardzo grube pnie magazynujące wodę.","l":3,"k":1},{"t":"o","q":"Opisz krótko krajobraz sawanny i typowe dla niej warunki klimatyczne.","a":"Sawanna to krajobraz z wysokimi trawami i pojedynczymi drzewami (np. baobabami), występujący w strefie klimatu zwrotnikowego z wyraźnie zaznaczoną porą suchą i porą deszczową.","l":3,"k":1},{"t":"s","q":"Step to krajobraz charakterystyczny dla obszarów:","a":"O klimacie umiarkowanym, suchszym, z rozległymi trawami","ex":"Step ma zwykle żyzne, ale suchsze gleby.","l":3},{"t":"tf","q":"Step charakteryzuje się rozległymi obszarami traw, przy stosunkowo niewielkiej ilości opadów.","a":true,"ex":"Brak drzew jest typowy dla stepu.","l":3},{"t":"tf","q":"W miarę oddalania się od równika w kierunku biegunów, krajobrazy na Ziemi zmieniają się, m.in. od lasu równikowego, przez sawannę i step, aż po tajgę i tundrę.","a":true,"ex":"To odzwierciedla zmieniające się warunki klimatyczne.","l":0,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego różne strefy krajobrazowe na Ziemi (las równikowy, sawanna, pustynia, step, tajga, tundra) mają różną roślinność.","a":"Roślinność w danej strefie krajobrazowej jest przystosowana do panujących tam warunków klimatycznych — ilości opadów i temperatury. Tam, gdzie jest ciepło i wilgotno (np. las równikowy), roślinność jest bujna i różnorodna, natomiast tam, gdzie jest sucho lub bardzo zimno (np. pustynia, tundra), roślinność jest uboższa i lepiej przystosowana do trudnych warunków.","l":0,"k":1},{"t":"s","q":"Który czynnik ma największy wpływ na rodzaj krajobrazu (strefę krajobrazową) występującego w danym miejscu na Ziemi?","a":"Klimat (temperatura i opady)","ex":"Klimat determinuje, jaka roślinność może się tam rozwinąć.","l":0},{"t":"tf","q":"Klimat, a zwłaszcza temperatura i ilość opadów, ma decydujący wpływ na to, jaki krajobraz (strefa krajobrazowa) występuje w danym miejscu na Ziemi.","a":true,"ex":"To fundamentalna zależność w geografii fizycznej.","l":0},{"t":"s","q":"Strefy klimatyczne na Ziemi układają się głównie:","a":"Równoleżnikowo, od równika ku biegunom","ex":"To efekt zmieniającej się ilości energii słonecznej wraz z szerokością geograficzną.","l":0,"k":1,"img":"strefy"},{"t":"f","q":"Strefy klimatyczne na Ziemi układają się głównie _______, od równika w stronę biegunów.","a":"równoleżnikowo","acc":[],"ex":"To odzwierciedla zmieniający się kąt padania promieni słonecznych.","l":0,"k":1,"img":"strefy"},{"t":"o","q":"Wyjaśnij, dlaczego strefy klimatyczne na Ziemi układają się głównie równoleżnikowo.","a":"Ilość energii słonecznej docierającej do powierzchni Ziemi zależy głównie od szerokości geograficznej — okolice równika otrzymują najwięcej energii słonecznej, a im bliżej biegunów, tym jej mniej, dlatego strefy klimatyczne (i związane z nimi krajobrazy) układają się głównie równoleżnikowo.","l":0,"k":1,"img":"strefy"},{"t":"s","q":"Który krajobraz jest typowy dla obszarów wokół równika?","a":"Wilgotny las równikowy","ex":"To najcieplejszy i najbardziej wilgotny krajobraz na Ziemi.","l":1},{"t":"tf","q":"Wilgotny las równikowy jest typowym krajobrazem obszarów leżących blisko równika.","a":true,"ex":"Przykładem jest Amazonia w Ameryce Południowej.","l":1},{"t":"tf","q":"Step, w odróżnieniu od sawanny, charakteryzuje się mniejszą ilością opadów i praktycznym brakiem drzew.","a":true,"ex":"To odróżnia go od sawanny z pojedynczymi drzewami.","l":3,"k":1},{"t":"s","q":"Rolnictwo na stepach, dzięki żyznym glebom, jest często wykorzystywane do uprawy:","a":"Zbóż, np. pszenicy","ex":"Żyzne czarnoziemy stepowe sprzyjają uprawie zbóż.","l":3},{"t":"f","q":"Żyzne gleby stepowe sprzyjają uprawie _______, np. pszenicy.","a":"zbóż","acc":[],"ex":"To dlatego wiele stepów przekształcono w pola uprawne.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego obszary stepowe są często wykorzystywane rolniczo.","a":"Step ma zwykle żyzne gleby (np. czarnoziemy), co w połączeniu z odpowiednią ilością opadów sprzyja uprawie zbóż, takich jak pszenica, dlatego wiele obszarów stepowych zostało przekształconych w tereny rolnicze.","l":3,"k":1},{"t":"s","q":"Zwierzęta żyjące na sawannie, np. antylopy czy lwy, są przystosowane do:","a":"Życia na otwartych, trawiastych terenach","ex":"Otwarty teren sawanny wymaga innych przystosowań niż las.","l":3,"k":1},{"t":"tf","q":"Zwierzęta sawanny, jak antylopy czy lwy, są przystosowane do życia na otwartych, trawiastych terenach.","a":true,"ex":"Szybkość i czujność są tam kluczowe dla przetrwania.","l":3,"k":1},{"t":"tf","q":"Każda strefa klimatyczna ma charakterystyczną dla siebie roślinność i świat zwierząt, przystosowane do panujących tam warunków.","a":true,"ex":"To efekt długotrwałej adaptacji organizmów do środowiska.","l":0,"k":1,"img":"strefy"},{"t":"tf","q":"Zróżnicowanie klimatu, zależne m.in. od szerokości geograficznej i wysokości nad poziomem morza, jest główną przyczyną występowania różnych stref krajobrazowych na Ziemi.","a":true,"ex":"To podsumowanie mechanizmu kształtującego krajobrazy świata.","l":0},{"t":"o","q":"Podsumuj, dlaczego na Ziemi występuje tak wiele różnych krajobrazów (stref krajobrazowych).","a":"Różnorodność krajobrazów na Ziemi wynika przede wszystkim ze zróżnicowania klimatu w zależności od szerokości geograficznej (ilości docierającej energii słonecznej) oraz wysokości nad poziomem morza — różne temperatury i ilości opadów sprzyjają rozwojowi odmiennej roślinności i świata zwierząt, tworząc charakterystyczne strefy krajobrazowe, od lasu równikowego po pustynię lodową.","l":0},{"t":"tf","q":"Lew jest zwierzęciem charakterystycznym dla krajobrazu sawanny.","a":true,"ex":"Sawanna to naturalne środowisko życia lwów.","l":3,"k":1},{"t":"o","q":"Podaj po jednym przykładzie zwierzęcia typowego dla sawanny, tundry i lasu równikowego.","a":"Sawanna: np. lew lub antylopa. Tundra: np. renifer. Las równikowy: np. papuga ara lub jaguar.","l":0,"k":1},{"t":"s","q":"Charakterystyczna roślinność danej strefy krajobrazowej pomaga:","a":"Rozpoznać, w jakiej strefie krajobrazowej się znajdujemy","ex":"Np. kaktusy kojarzą się z pustynią, a palmy z klimatem tropikalnym.","l":0},{"t":"tf","q":"Charakterystyczna roślinność danej strefy krajobrazowej pomaga ją rozpoznać, np. kaktusy kojarzą się z pustynią, a palmy z klimatem tropikalnym.","a":true,"ex":"To praktyczna wskazówka przy rozpoznawaniu krajobrazów na zdjęciach.","l":0},{"t":"s","q":"Klimat monsunowy charakteryzuje się:","a":"Wyraźnym podziałem na porę suchą i porę intensywnych opadów (monsun)","ex":"Monsun to sezonowy wiatr przynoszący obfite opady.","l":0},{"t":"tf","q":"Klimat monsunowy występuje m.in. w południowej i południowo-wschodniej Azji.","a":true,"ex":"To region silnie zależny od pory monsunowej.","l":0},{"t":"s","q":"Wylesianie lasów równikowych (deforestacja) prowadzi m.in. do:","a":"Utraty siedlisk wielu gatunków roślin i zwierząt","ex":"To jeden z poważniejszych problemów ekologicznych na świecie.","l":1},{"t":"tf","q":"Wylesianie lasów równikowych prowadzi do utraty siedlisk wielu unikatowych gatunków roślin i zwierząt.","a":true,"ex":"Las równikowy jest domem dla ogromnej liczby gatunków.","l":1},{"t":"tf","q":"Klimat umiarkowany, w którym leży Polska, charakteryzuje się czterema wyraźnymi porami roku.","a":true,"ex":"Wiosna, lato, jesień i zima są typowe dla klimatu umiarkowanego.","l":2,"img":"strefy"},{"t":"f","q":"Las równikowy ma znacznie większą różnorodność _______ niż tundra, ze względu na sprzyjający klimat.","a":"gatunkową","acc":[],"ex":"To efekt korzystnych warunków klimatycznych dla rozwoju życia.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, dlaczego las równikowy ma dużo większą różnorodność biologiczną niż tundra.","a":"Las równikowy ma stale wysoką temperaturę i dużo opadów przez cały rok, co sprzyja rozwojowi ogromnej liczby gatunków roślin i zwierząt, podczas gdy tundra ma bardzo surowe, zimne warunki, które mogą znieść tylko nieliczne, wyspecjalizowane gatunki.","l":1,"k":1},{"t":"tf","q":"Zwierzęta stepowe, jak konie czy antylopy, są zwykle dobrze przystosowane do szybkiego biegu po otwartym terenie.","a":true,"ex":"Brak schronienia na stepie wymaga szybkiej ucieczki przed drapieżnikami.","l":3},{"t":"o","q":"Podsumuj, w jaki sposób klimat wpływa na rozmieszczenie stref krajobrazowych na Ziemi.","a":"Klimat, a zwłaszcza temperatura i ilość opadów, decyduje o tym, jaka roślinność i jakie zwierzęta mogą żyć w danym miejscu — dlatego strefy krajobrazowe (las równikowy, sawanna, step, pustynia, tajga, tundra) układają się głównie zgodnie ze strefami klimatycznymi, zmieniającymi się od równika ku biegunom oraz wraz z wysokością nad poziomem morza.","l":0,"k":1},{"t":"w","q":"klimat","a":"Typowy układ pogody w danym miejscu, obserwowany przez wiele lat.","l":0,"k":1},{"t":"w","q":"sawanna","a":"Obszar z trawami i rozproszonymi drzewami w ciepłym klimacie z porami suchą i deszczową.","l":3,"k":1},{"t":"w","q":"step","a":"Rozległy obszar trawiasty o klimacie suchym.","l":3,"k":1},{"t":"w","q":"las równikowy","a":"Wilgotny, gęsty las przy równiku, z wieloma gatunkami roślin i zwierząt.","l":1,"k":1},{"t":"w","q":"pora deszczowa","a":"Okres w roku z obfitymi opadami.","l":3,"k":1},{"t":"w","q":"pora sucha","a":"Okres w roku z bardzo małą ilością opadów.","l":3,"k":1},{"t":"o","q":"Wymień elementy pogody.","a":"Temperatura powietrza, opady atmosferyczne, ciśnienie, wiatr, zachmurzenie i wilgotność powietrza.","l":0},{"t":"o","q":"Dlaczego pogoda może zmieniać się z dnia na dzień, a klimat nie?","a":"Pogoda to stan atmosfery w danym miejscu i czasie, a klimat to typowy układ pogody z wielu lat.","l":0},{"t":"o","q":"Co to jest prognoza pogody?","a":"Przewidywanie pogody na najbliższy czas na podstawie obserwacji i pomiarów.","l":0},{"t":"o","q":"Jak nazywa się wykres pokazujący przebieg temperatury i opadów w ciągu roku?","a":"Klimatogram.","l":0,"k":1},{"t":"o","q":"Od czego zależy klimat danego miejsca?","a":"Np. od szerokości geograficznej, odległości od morza i wysokości nad poziomem morza.","l":0},{"t":"o","q":"Wymień drzewa liściaste typowe dla lasu strefy umiarkowanej.","a":"Np. dąb, buk, grab i brzoza.","l":2},{"t":"o","q":"Co dzieje się z liśćmi drzew liściastych jesienią?","a":"Żółkną i opadają, co pomaga drzewom przetrwać zimę.","l":2},{"t":"o","q":"Dlaczego las strefy umiarkowanej zmienia wygląd w ciągu roku?","a":"Występują w nim wyraźne cztery pory roku.","l":2},{"t":"o","q":"Podaj dwa zwierzęta żyjące w lesie strefy umiarkowanej.","a":"Np. jeleń, sarna, dzik, lis lub wiewiórka.","l":2},{"t":"o","q":"Czym różni się las strefy umiarkowanej od wilgotnego lasu równikowego?","a":"Ma mniej gatunków roślin i zwierząt, występują w nim pory roku, a drzewa liściaste zrzucają liście.","l":2},{"t":"o","q":"Jakie znaczenie ma las dla człowieka?","a":"Dostarcza drewna, tlenu i miejsca wypoczynku oraz zatrzymuje wodę.","l":2},{"t":"o","q":"Dlaczego powierzchnia Ziemi jest nagrzewana nierównomiernie?","a":"Promienie słoneczne padają pod różnymi kątami. Między zwrotnikami dociera najwięcej energii, im dalej na północ i południe, tym mniej. Na równiku jest bardzo gorąco, a w strefach podbiegunowych najchłodniej.","l":0},{"t":"o","q":"Jak układają się strefy oświetlenia Ziemi i klimatyczne?","a":"Równoleżnikowo, czyli rozciągają się ze wschodu na zachód wzdłuż równoleżników. Podobnie układa się rozkład temperatury powietrza.","l":0,"k":1},{"t":"o","q":"Wymień strefy klimatyczne Ziemi.","a":"Równikowa, zwrotnikowa, podzwrotnikowa, umiarkowana i okołobiegunowa.","l":0,"img":"strefy"},{"t":"o","q":"Od czego zależą warunki klimatyczne na danym obszarze?","a":"Od temperatury powietrza i wysokości opadów atmosferycznych.","l":0},{"t":"o","q":"Jaka formacja roślinna występuje w strefie równikowej?","a":"Wilgotne lasy równikowe.","l":0,"k":1},{"t":"o","q":"Jaka formacja roślinna występuje na terenach, gdzie opady są rzadsze (strefa zwrotnikowa)?","a":"Sawanna.","l":0,"k":1},{"t":"o","q":"Co występuje w pobliżu zwrotników, gdzie opadów jest bardzo mało?","a":"Pustynie gorące.","l":0},{"t":"o","q":"Jaka roślinność panuje w strefie klimatów podzwrotnikowych?","a":"Roślinność śródziemnomorska – makia.","l":0,"k":1,"img":"strefy"},{"t":"o","q":"Jaka roślinność panuje w strefie klimatu umiarkowanego?","a":"Lasy liściaste i mieszane, stepy oraz tajga (w chłodnej odmianie).","l":0,"img":"strefy"},{"t":"o","q":"Co rośnie w strefie okołobiegunowej?","a":"Tundra, a na obszarach najzimniejszych pustynie lodowe (bez roślin).","l":0,"k":1},{"t":"o","q":"Czym jest tundra, a czym tajga?","a":"Tundra – bezleśna formacja roślinna (trawy, mchy, porosty). Tajga – las z przewagą drzew iglastych.","l":0,"k":1},{"t":"o","q":"Jak zmienia się temperatura i opady w górach wraz z wysokością?","a":"Temperatura spada, a suma opadów rośnie.","l":0},{"t":"o","q":"Co to jest piętrowość klimatyczno-roślinna?","a":"Układanie się roślinności w górach w piętra, podobnie jak strefy klimatyczne – od dołu lasy, potem krzewy i trawy, a najwyżej mchy i porosty.","l":0,"k":1,"img":"tatry"},{"t":"o","q":"Gdzie leży pustynia Atacama i jak wyglądają tam opady?","a":"W Ameryce Południowej (Chile); jest uznawana za najbardziej suche miejsce na Ziemi, na wielu obszarach nigdy nie spadł deszcz.","l":0},{"t":"tf","q":"Strefy klimatyczne i roślinne na Ziemi układają się równoleżnikowo.","a":true,"ex":"Podobnie piętra klimatyczne układają się w górach.","l":0,"k":1,"img":"strefy"},{"t":"tf","q":"Im wyżej w górach, tym cieplej.","a":false,"ex":"Temperatura wraz z wysokością spada.","l":0},{"t":"w","q":"strefa klimatyczna","a":"Obszar o podobnych temperaturach powietrza i opadach, rozciągający się równoleżnikowo.","l":0,"k":1,"img":"strefy"},{"t":"w","q":"piętrowość","a":"Układ roślinności i klimatu w górach w piętra, zmieniający się wraz z wysokością.","l":0,"k":1,"img":"pietr"},{"t":"o","q":"Gdzie rosną wilgotne lasy równikowe?","a":"W strefie równikowej. Trzy główne obszary: Amazonia w Ameryce Południowej, Kotlina Konga w Afryce i Archipelag Malajski w Azji.","l":1,"k":1},{"t":"o","q":"Jaki jest klimat równikowy?","a":"Gorąco i bardzo wilgotno przez cały rok, nie ma pór roku innych niż lato, roczna suma opadów jest 4–5 razy większa niż w Polsce, często występują burze. Temperatura nie spada poniżej 20 °C.","l":1,"img":"strefy"},{"t":"o","q":"Dlaczego las równikowy nazywamy „wiecznie zielonym”?","a":"Bo przez cały rok panuje tam wysoka temperatura i wilgotność, więc drzewa utrzymują liście; liście zrzucane są stopniowo.","l":1},{"t":"o","q":"Dlaczego wilgotne lasy równikowe są ważne?","a":"Są najbogatszym i najbardziej złożonym środowiskiem na naszej planecie; ich ochrona jest niezbędna dla zachowania różnorodności gatunkowej.","l":1,"k":1},{"t":"o","q":"Wymień warstwy roślinne w wilgotnym lesie równikowym.","a":"Drzewa olbrzymy (70–80 m), korony drzew (30–50 m), niskie drzewa (do 20 m), podszyt i runo leśne.","l":1,"k":1},{"t":"o","q":"Jak rośliny radzą sobie z niedostatkiem światła słonecznego?","a":"Drzewa olbrzymy rosną bardzo wysoko; epifity rosną na pniach drzew; liany wspinają się po pniach i gałęziach; drzewa mają korzenie podporowe.","l":1,"k":1},{"t":"o","q":"Co to są epifity i liany?","a":"Epifity – rośliny rosnące na innych roślinach (np. storczyki). Liany – rośliny wspinające się po drzewach ku światłu.","l":1,"k":1},{"t":"o","q":"Do czego służą korzenie podporowe?","a":"Pomagają drzewom olbrzymom utrzymać równowagę.","l":1},{"t":"o","q":"Jakie zwierzęta żyją w wilgotnym lesie równikowym?","a":"Goryle (Kotlina Konga), orangutany (Borneo i Sumatra), małpy kapucynki, ary, anakondy, jaguary i tukany (Ameryka Południowa).","l":1},{"t":"o","q":"Dlaczego orangutany są zagrożone?","a":"Bo wycina się lasy równikowe, a orangutany żyją tylko w lasach Archipelagu Malajskiego (Sumatra i Borneo).","l":1},{"t":"o","q":"Jak żyją mieszkańcy lasów równikowych?","a":"W zgodzie z przyrodą: domy budują z lokalnych materiałów, żywność zdobywają przez zbieractwo i łowiectwo, korzystają z roślin leczniczych.","l":1},{"t":"o","q":"Co to jest klimatogram?","a":"Graficzne przedstawienie średnich miesięcznych temperatur (linia) i sumy opadów (słupki) w danej miejscowości, np. Kuala Lumpur.","l":1,"k":1},{"t":"o","q":"Jakie zagrożenie niosą dla lasów równikowych działania firm?","a":"Wycinanie drzew i wydobywanie surowców powodują zanikanie lasów oraz tradycji plemion.","l":1},{"t":"tf","q":"Dno wilgotnego lasu równikowego jest bardzo jasne.","a":false,"ex":"Korony drzew są tak gęste, że do runa dociera mało światła.","l":1},{"t":"f","q":"Największy obszar lasów równikowych na świecie to _______.","a":"Amazonia","acc":[],"ex":"Leży w Ameryce Południowej.","l":1},{"t":"w","q":"drzewa olbrzymy","a":"Bardzo wysokie drzewa (ponad 70 m), tworzące najwyższą warstwę lasu równikowego.","l":1,"k":1},{"t":"w","q":"epifity","a":"Rośliny rosnące na innych roślinach, służących im jako podpory, np. storczyki.","l":1,"k":1},{"t":"w","q":"liany","a":"Rośliny wspinające się po pniach i gałęziach drzew w stronę światła.","l":1,"k":1},{"t":"w","q":"klimatogram","a":"Wykres temperatury (linia) i opadów (słupki) w kolejnych miesiącach roku.","l":1,"k":1},{"t":"o","q":"Gdzie występują lasy strefy umiarkowanej?","a":"W Europie, Azji i Ameryce Północnej; lasy liściaste i mieszane w cieplejszej odmianie klimatu, lasy iglaste (tajga) w chłodniejszej.","l":2},{"t":"o","q":"Jakie są pory roku w strefie umiarkowanej?","a":"Wiosna i jesień: 5–15 °C; lato: powyżej 15 °C; zima: poniżej 0 °C; przedwiośnie i przedzimie: 0–5 °C.","l":2},{"t":"o","q":"Jak zmienia się klimat umiarkowany?","a":"Temperatura zmienia się znacznie w ciągu roku, ale nigdy nie osiąga bardzo wysokich lub niskich wartości; opady występują przez cały rok.","l":2,"img":"strefy"},{"t":"o","q":"Czym różnią się wilgotny las równikowy od lasu strefy umiarkowanej?","a":"W równikowym opady są wysokie przez cały rok (ok. 2500 mm), temperatura stała, nie ma pór roku; w umiarkowanym opady ok. 600 mm, są cztery pory roku i temperatura się zmienia.","l":2,"k":1},{"t":"o","q":"Ile warstw roślinności występuje w lesie strefy umiarkowanej?","a":"Cztery: korony drzew, niskie drzewa, podszyt i runo leśne.","l":2},{"t":"o","q":"Podaj przykłady roślin lasu strefy umiarkowanej.","a":"Dąb szypułkowy, buk zwyczajny, sosna zwyczajna, lipa, grab, klon, świerk, modrzew, kruszyna, paprocie, nerecznica samcza, zawilec gajowy.","l":2},{"t":"o","q":"Jak zmienia się las w strefie umiarkowanej w ciągu roku?","a":"Wczesną wiosną rośliny runa kwitną, zanim drzewa wypuszczą liście; latem las jest zielony; jesienią drzewa zrzucają liście; zimą rośliny spoczywają.","l":2},{"t":"o","q":"Dlaczego drzewa liściaste zrzucają liście na zimę?","a":"Chronią się przed przemarznięciem – zima jest znacznie chłodniejsza od lata.","l":2},{"t":"o","q":"Jak powstaje próchnica i czemu gleba jest żyzna?","a":"Opadłe liście są rozkładane przez organizmy glebowe (bakterie, grzyby); z rozłożonych szczątków powstaje próchnica, która czyni glebę żyzną.","l":2,"k":1},{"t":"o","q":"Dlaczego wiele lasów w strefie umiarkowanej zamieniono w pola uprawne?","a":"Gleby leśne są żyzne, dlatego ludzie wykarczowali lasy i zamienili je w pola uprawne (np. krajobraz rolniczy centralnej Polski).","l":2},{"t":"o","q":"Jakie zwierzęta żyją w lasach strefy umiarkowanej?","a":"Dziki, jelenie, sarny, łosie, wilki, rysie, bobry, niedźwiedzie brunatne, czarne; ptaki: puszczyki, drozdy, zięby; rzekotka drzewna, zaskroniec, żmija zygzakowata.","l":2},{"t":"tf","q":"W lasach strefy umiarkowanej zima jest znacznie chłodniejsza od lata.","a":true,"ex":"","l":2},{"t":"tf","q":"W lesie strefy umiarkowanej są tylko dwie pory roku.","a":false,"ex":"Są cztery pory roku.","l":2},{"t":"w","q":"próchnica","a":"Składnik gleby powstający z rozłożonych szczątków organizmów.","l":2,"k":1},{"t":"w","q":"runo leśne","a":"Najniższa warstwa lasu: rośliny zielne, mchy, paprocie i grzyby.","l":2,"k":1},{"t":"o","q":"Jaki jest klimat sawanny?","a":"Gorąco i występuje pora sucha i deszczowa. Przez kilka miesięcy nie pada deszcz, trawy wysychają; po nadejściu pory deszczowej ożywają.","l":3,"k":1},{"t":"o","q":"Jak wygląda krajobraz sawanny?","a":"Rozległe trawiaste obszary z pojedynczymi drzewami, np. akacjami i baobabami; liczne zwierzęta.","l":3,"k":1},{"t":"o","q":"Jakie są odmiany sawanny?","a":"Sucha sawanna – kolczaste krzewy i drzewa magazynujące wodę (baobaby); sawanna akacjowa – głównie trawy i akacje; sawanna parkowa – im dalej od równika, tym drzewa niższe, rosną w większych odstępach.","l":3,"k":1},{"t":"o","q":"Jakie zwierzęta żyją na sawannie?","a":"Antylopy gnu, zebry, słonie, nosorożce, żyrafy, a z drapieżników lwy i gepardy.","l":3,"k":1},{"t":"o","q":"Gdzie leży Park Narodowy Serengeti i co tam można zobaczyć?","a":"We wschodniej Afryce (Tanzania); wielkie stada antylop i zebr oraz słonie, nosorożce, lwy.","l":3},{"t":"o","q":"Gdzie występuje step i w jakim klimacie się wykształcił?","a":"W klimacie umiarkowanym, tam gdzie opadów jest mało dla drzew: w Europie Wschodniej, Azji i Ameryce Północnej (preria), a w Ameryce Południowej – pampa.","l":3},{"t":"o","q":"Jakie zwierzęta żyją na stepie?","a":"Suhak, nieświszczuk, drop, onager (osioł azjatycki), lis stepowy, orzeł stepowy.","l":3},{"t":"o","q":"Jakie gleby występują na stepie?","a":"Bardzo żyzne czarnoziemy; stepy w Europie przekształcono w pola uprawne (pszenica, kukurydza, rzepak, słoneczniki).","l":3,"k":1},{"t":"o","q":"Czym różni się step od sawanny?","a":"Step – klimat umiarkowany, zima mroźna, brak drzew. Sawanna – klimat gorący, pora sucha i deszczowa, pojedyncze drzewa.","l":3,"k":1},{"t":"o","q":"Jak ludzie żyją na sawannie i stepie?","a":"Zajmują się rolnictwem (tam, gdzie można nawadniać) i pasterstwem; koczownicy (nomadzi) przemieszczają się ze stadami; Masajowie w Kenii, jurty w Mongolii.","l":3,"k":1},{"t":"o","q":"Kim są nomadzi i czym jest jurta?","a":"Nomadzi – ludzie prowadzący koczowniczy tryb życia. Jurta – dom z drewna i skór, który można łatwo złożyć i przenieść.","l":3,"k":1},{"t":"o","q":"Jaki jest największy problem ludzi na sawannie i stepie?","a":"Niedostatek wody.","l":3,"k":1},{"t":"f","q":"Stepy w Ameryce Północnej nazywamy _______.","a":"prerią","acc":["preria","prerie"],"ex":"W Ameryce Południowej – pampa.","l":3},{"t":"tf","q":"Na stepie lato jest chłodne, a zima ciepła.","a":false,"ex":"Na stepie zima bywa bardzo mroźna, a różnica temperatur jest duża.","l":3},{"t":"w","q":"nomadzi","a":"Ludzie prowadzący koczowniczy tryb życia, przemieszczający się ze stadami zwierząt.","l":3,"k":1},{"t":"w","q":"pasterstwo","a":"Hodowla zwierząt wypasanych na pastwiskach.","l":3,"k":1},{"t":"w","q":"jurta","a":"Dom o konstrukcji z drewna, tkanin i skór, typowy dla mieszkańców stepów Azji.","l":3,"k":1},{"t":"w","q":"pora sucha","a":"Okres w roku, gdy przez kilka miesięcy nie pada deszcz.","l":3,"k":1}]},{"id":"g5","title":"Krajobrazy świata, część 2","icon":"🏜️","lessons":["Pustynie gorące i lodowe","Tajga i tundra","Krajobraz śródziemnomorski","Himalaje i ich mieszkańcy"],"q":[{"t":"s","q":"Pustynia gorąca, np. Sahara, charakteryzuje się:","a":"Bardzo małą ilością opadów i wysokimi temperaturami w dzień","ex":"To jeden z najbardziej suchych krajobrazów na Ziemi.","l":0,"k":1},{"t":"f","q":"Pustynie gorące, jak Sahara, charakteryzują się bardzo małą ilością _______.","a":"opadów","acc":[],"ex":"To główna cecha wszystkich pustyń.","l":0},{"t":"tf","q":"Na pustyniach gorących temperatura w dzień bywa bardzo wysoka, a w nocy może gwałtownie spadać.","a":true,"ex":"Suche powietrze sprzyja szybkiej utracie ciepła nocą.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego na pustyniach gorących występują duże różnice temperatury między dniem a nocą.","a":"Suche powietrze pustynne i brak roślinności powodują, że w dzień powierzchnia szybko się nagrzewa od słońca, natomiast w nocy, bez osłony chmur i wilgoci, ciepło równie szybko ucieka, przez co temperatura gwałtownie spada.","l":0},{"t":"s","q":"Pustynia lodowa, np. obszar Antarktydy, różni się od pustyni gorącej tym, że:","a":"Ma bardzo niską temperaturę, mimo że opadów również jest tam niewiele","ex":"Obie strefy łączy niewielka ilość opadów, ale różni temperatura.","l":0,"k":1},{"t":"tf","q":"Pustynia lodowa, jak Antarktyda, ma bardzo niską temperaturę, choć opadów (w postaci śniegu) jest tam niewiele, podobnie jak na pustyni gorącej.","a":true,"ex":"Dlatego Antarktydę można też nazwać pustynią, mimo lodu.","l":0,"k":1},{"t":"s","q":"Krajobraz śródziemnomorski charakteryzuje się:","a":"Łagodną, wilgotną zimą i gorącym, suchym latem","ex":"To typowy klimat np. Włoch czy Grecji.","l":2,"k":1},{"t":"f","q":"Klimat śródziemnomorski charakteryzuje się łagodną zimą i gorącym, _______ latem.","a":"suchym","acc":[],"ex":"To odróżnia go np. od klimatu umiarkowanego.","l":2,"k":1},{"t":"o","q":"Opisz typowe cechy klimatu śródziemnomorskiego.","a":"Klimat śródziemnomorski cechuje się łagodną, wilgotną zimą oraz gorącym i suchym latem — to charakterystyczne warunki dla obszarów wokół Morza Śródziemnego.","l":2,"k":1},{"t":"s","q":"Tajga to:","a":"Rozległy las iglasty, typowy dla chłodnego klimatu umiarkowanego","ex":"Tajga zajmuje ogromne obszary np. w Rosji i Kanadzie.","l":1},{"t":"tf","q":"Tajga to rozległy las iglasty, występujący w chłodniejszym klimacie umiarkowanym, np. w Rosji czy Kanadzie.","a":true,"ex":"To jedna z największych stref roślinnych na Ziemi.","l":1},{"t":"s","q":"Tundra charakteryzuje się:","a":"Niską roślinnością (mchy, porosty, karłowate krzewy) i chłodnym klimatem","ex":"Surowy klimat uniemożliwia wzrost wysokich drzew.","l":1,"k":1},{"t":"f","q":"Roślinność tundry to głównie mchy, porosty i _______ krzewy.","a":"karłowate","acc":[],"ex":"Niska roślinność jest przystosowana do surowego klimatu.","l":1},{"t":"o","q":"Porównaj krajobraz tajgi i tundry.","a":"Tajga to rozległy las iglasty typowy dla chłodnego klimatu umiarkowanego, natomiast tundra to krajobraz jeszcze chłodniejszy, gdzie ze względu na surowe warunki rosną głównie niskie rośliny — mchy, porosty i karłowate krzewy, a drzewa praktycznie nie występują.","l":1,"k":1},{"t":"s","q":"Krajobraz wysokogórski, np. Himalajów, charakteryzuje się:","a":"Dużymi różnicami temperatury i roślinności wraz ze wzrostem wysokości","ex":"To efekt zmieniającej się temperatury wraz z wysokością.","l":3,"k":1},{"t":"tf","q":"W krajobrazie wysokogórskim, wraz ze wzrostem wysokości, zmieniają się warunki klimatyczne i roślinność (piętra roślinne).","a":true,"ex":"To zjawisko nazywamy piętrowością roślinności.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego w górach, np. w Himalajach, można zaobserwować różne piętra roślinności wraz ze wzrostem wysokości.","a":"Wraz ze wzrostem wysokości w górach temperatura powietrza się obniża, a warunki stają się coraz trudniejsze, dlatego roślinność zmienia się od lasów u podnóża, przez łąki i kosodrzewinę, aż po nagie skały i wieczny śnieg na najwyższych partiach.","l":3,"k":1,"img":"him"},{"t":"s","q":"Który krajobraz jest typowy dla obszarów okołobiegunowych?","a":"Tundra i pustynia lodowa","ex":"To najzimniejsze krajobrazy na Ziemi.","l":1,"k":1},{"t":"f","q":"Typowymi krajobrazami obszarów okołobiegunowych są tundra oraz pustynia _______.","a":"lodowa","acc":[],"ex":"Oba te krajobrazy charakteryzują się niską temperaturą.","l":1,"k":1},{"t":"o","q":"Podaj przykład krajobrazu typowego dla okolic równika i przykład krajobrazu typowego dla obszarów okołobiegunowych.","a":"Okolice równika: wilgotny las równikowy. Obszary okołobiegunowe: tundra lub pustynia lodowa.","l":1,"k":1},{"t":"tf","q":"Rośliny pustynne, jak kaktusy, mają grube, mięsiste łodygi magazynujące wodę oraz długie korzenie sięgające głęboko w poszukiwaniu wody.","a":true,"ex":"To przystosowania do życia w suchym środowisku.","l":0},{"t":"o","q":"Wyjaśnij, jak rośliny pustynne, np. kaktusy, przystosowały się do życia w suchym klimacie.","a":"Kaktusy i inne rośliny pustynne mają zwykle grube, mięsiste łodygi lub liście, w których magazynują wodę, zredukowane liście (czasem w postaci kolców, co ogranicza parowanie), oraz rozbudowany, głęboki lub szeroko rozprzestrzeniony system korzeniowy, umożliwiający pobieranie wody z dużego obszaru lub głębszych warstw gleby.","l":0},{"t":"s","q":"Zwierzęta żyjące w tundrze i pustyni lodowej, np. renifery czy pingwiny, są przystosowane do:","a":"Niskich temperatur, np. dzięki grubej warstwie tłuszczu lub futra","ex":"To pozwala im przetrwać w bardzo zimnym klimacie.","l":1},{"t":"f","q":"Zwierzęta obszarów zimnych, np. renifery, są przystosowane do niskich temperatur dzięki grubemu futru lub warstwie _______.","a":"tłuszczu","acc":[],"ex":"To izoluje je od zimna.","l":1},{"t":"o","q":"Podaj przykład zwierzęcia przystosowanego do życia w zimnym klimacie i wyjaśnij, na czym polega jego przystosowanie.","a":"Np. niedźwiedź polarny ma grubą warstwę tłuszczu i gęste futro, które chronią go przed utratą ciepła w bardzo zimnym środowisku Arktyki.","l":1},{"t":"o","q":"Opisz, jak zmienia się roślinność wraz ze wzrostem wysokości w górach wysokich, jak Himalaje.","a":"U podnóża gór wysokich, jak Himalaje, mogą występować lasy, wyżej łąki górskie i kosodrzewina, jeszcze wyżej roślinność zanika niemal całkowicie, a na samych szczytach panuje wieczny śnieg i lód — to efekt malejącej temperatury wraz ze wzrostem wysokości.","l":3,"k":1},{"t":"f","q":"Pingwiny są zwierzętami charakterystycznymi dla obszarów _______, np. Antarktydy.","a":"zimnych","acc":[],"ex":"To ptaki przystosowane do bardzo niskich temperatur.","l":0},{"t":"tf","q":"Klimat śródziemnomorski sprzyja roślinności odpornej na suszę, np. drzewom oliwnym czy krzewom o twardych liściach.","a":true,"ex":"To typowa roślinność wokół Morza Śródziemnego.","l":2,"k":1},{"t":"f","q":"Krajobraz śródziemnomorski jest typowy dla obszarów wokół Morza _______.","a":"Śródziemnego","acc":[],"ex":"To skąd pochodzi nazwa tego krajobrazu.","l":2,"k":1},{"t":"o","q":"Podaj przykład kraju lub regionu, w którym można spotkać krajobraz śródziemnomorski.","a":"Np. Włochy, Grecja lub Hiszpania — kraje leżące wokół Morza Śródziemnego.","l":2,"k":1},{"t":"s","q":"Zależność między wysokością nad poziomem morza a temperaturą w górach jest taka, że:","a":"Im wyżej w górach, tym niższa temperatura","ex":"To dlatego szczyty gór bywają ośnieżone nawet latem.","l":3},{"t":"tf","q":"Im wyżej w górach, tym niższa jest temperatura powietrza.","a":true,"ex":"To podstawowa zasada klimatologii górskiej.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego mimo bliskości równika, na wysokich szczytach górskich (np. Kilimandżaro w Afryce) można spotkać śnieg i lód.","a":"Temperatura powietrza spada wraz ze wzrostem wysokości, dlatego nawet w gorącym klimacie równikowym czy zwrotnikowym, na bardzo wysokich szczytach górskich temperatura może być na tyle niska, że utrzymuje się tam śnieg i lód przez cały rok, mimo niewielkiej odległości od równika.","l":3},{"t":"s","q":"Wieczna zmarzlina (permafrost) występuje typowo w:","a":"Tundrze","ex":"To trwale zamarznięty grunt, typowy dla bardzo zimnych obszarów.","l":1,"k":1},{"t":"f","q":"Trwale zamarznięta warstwa gruntu w tundrze nazywana jest wieczną _______.","a":"zmarzliną","acc":[],"ex":"Latem odmarza tylko jej cienka, powierzchniowa warstwa.","l":1,"k":1},{"t":"o","q":"Wyjaśnij, czym jest wieczna zmarzlina i dlaczego jest charakterystyczna dla tundry.","a":"Wieczna zmarzlina to warstwa gruntu, która pozostaje zamarznięta przez cały rok, nawet latem odmarza tylko jej cienka, powierzchniowa warstwa — występuje w tundrze ze względu na bardzo niskie średnie roczne temperatury tego regionu.","l":1,"k":1},{"t":"f","q":"Typowym mieszkańcem tajgi, dużym ssakiem roślinożernym, jest _______.","a":"łoś","acc":[],"ex":"Łosie żyją m.in. w lasach Skandynawii, Rosji i Kanady.","l":1},{"t":"tf","q":"Wielbłąd jest zwierzęciem przystosowanym do długiego przetrwania bez wody, magazynując tłuszcz w garbie.","a":true,"ex":"To klasyczny przykład przystosowania do życia na pustyni.","l":0,"k":1},{"t":"o","q":"Wyjaśnij, w jaki sposób wielbłąd jest przystosowany do życia na pustyni.","a":"Wielbłąd magazynuje tłuszcz w garbie, co pozwala mu przetrwać długi czas bez jedzenia, a jego organizm potrafi oszczędnie gospodarować wodą, dzięki czemu może obywać się bez picia przez wiele dni.","l":0,"k":1},{"t":"w","q":"pustynia","a":"Obszar o bardzo małej ilości opadów i skąpej roślinności.","l":0,"k":1},{"t":"w","q":"oaza","a":"Miejsce na pustyni z dostępem do wody i roślinnością.","l":0,"k":1},{"t":"w","q":"tundra","a":"Strefa chłodnego klimatu z wieczną zmarzliną, bez drzew, z mchami i porostami.","l":1,"k":1},{"t":"w","q":"tajga","a":"Rozległy las iglasty strefy chłodnej.","l":1,"k":1},{"t":"w","q":"wieczna zmarzlina","a":"Warstwa gruntu, która przez cały rok pozostaje zamarznięta.","l":1,"k":1},{"t":"w","q":"dzień polarny","a":"Okres, gdy Słońce nie zachodzi za horyzont przez co najmniej dobę, występuje w pobliżu biegunów.","l":1,"k":1},{"t":"w","q":"noc polarna","a":"Okres, gdy Słońce nie wschodzi nad horyzont przez co najmniej dobę.","l":1,"k":1},{"t":"o","q":"Jakie rośliny uprawia się w krajobrazie śródziemnomorskim?","a":"Np. oliwki, winorośl i drzewa cytrusowe.","l":2,"k":1},{"t":"o","q":"Jakie lato i jaką zimę ma klimat śródziemnomorski?","a":"Lato jest gorące i suche, a zima łagodna i deszczowa.","l":2,"k":1},{"t":"o","q":"Dlaczego rośliny śródziemnomorskie mają często małe, twarde liście?","a":"Dzięki temu ograniczają parowanie wody podczas letniej suszy.","l":2,"k":1},{"t":"o","q":"Dlaczego kraje śródziemnomorskie są popularne wśród turystów?","a":"Mają ciepły, słoneczny klimat, plaże i wiele zabytków.","l":2,"k":1},{"t":"o","q":"Na jakim kontynencie leżą Himalaje?","a":"W Azji.","l":3,"k":1},{"t":"o","q":"Jak nazywa się najwyższy szczyt świata i jaką ma wysokość?","a":"Mount Everest, ok. 8849 m n.p.m.","l":3,"k":1},{"t":"o","q":"Dlaczego wysoko w górach trudniej oddychać?","a":"Powietrze jest tam rozrzedzone, więc zawiera mniej tlenu.","l":3},{"t":"o","q":"Co to jest piętrowość roślinna w górach?","a":"Zmiana roślinności wraz ze wzrostem wysokości, tworząca kolejne piętra.","l":3,"k":1},{"t":"o","q":"Wymień drzewa typowe dla tajgi.","a":"Np. świerk, jodła, sosna i modrzew.","l":1},{"t":"o","q":"Dlaczego drzewa tajgi mają igły zamiast szerokich liści?","a":"Igły ograniczają parowanie wody i dobrze znoszą mróz, więc drzewa mogą rosnąć w surowym klimacie.","l":1},{"t":"o","q":"Podaj dwa zwierzęta żyjące w tajdze.","a":"Np. łoś, niedźwiedź brunatny, ryś lub wilk.","l":1},{"t":"o","q":"Jaka jest zima w tajdze?","a":"Długa, mroźna i śnieżna.","l":1},{"t":"o","q":"Na jakich obszarach występują największe lasy tajgi?","a":"W północnej Azji (Syberia) i w Kanadzie.","l":1},{"t":"o","q":"Gdzie leżą pustynie gorące, a gdzie lodowe?","a":"Gorące – w pobliżu zwrotników (np. Sahara, Namib, Atacama, Mojave, Wielka Pustynia Piaszczysta); lodowe – za kołami podbiegunowymi (Antarktyda, Grenlandia).","l":0},{"t":"o","q":"Jak powstają pustynie?","a":"Z powodu braku wody (bardzo niskie opady), a na lodowych – z powodu bardzo niskiej temperatury.","l":0},{"t":"o","q":"Jaki jest klimat pustyni gorących?","a":"Opady bardzo niskie, temperatury bardzo wysokie.","l":0},{"t":"o","q":"Jaki jest klimat pustyni lodowych?","a":"Temperatura bardzo niska przez cały rok.","l":0},{"t":"o","q":"Jak wygląda krajobraz Sahary?","a":"Typowy element to piaszczysta wydma; woda występuje w oazach.","l":0,"k":1},{"t":"o","q":"Jakie zwierzęta żyją na pustyniach gorących i jak się przystosowały?","a":"Fenek (duże uszy – termoregulacja), wielbłąd (garby z tłuszczem, grube rzęsy, szerokie stopy), oryks, skorpion, moloch straszliwy (zbiera rosę).","l":0,"k":1},{"t":"o","q":"Jakie zwierzęta żyją na pustyniach lodowych?","a":"Niedźwiedź polarny (futro), pingwin (gruba warstwa tłuszczu i wodoszczelne pióra).","l":0},{"t":"o","q":"Jak rośliny przystosowały się do życia na pustyni?","a":"Opuncje i kaktusy magazynują wodę; welwicja pochłania wilgoć z mgły; nasiona czekają na deszcz; biegacz pustynny rozsiewa nasiona; wiele roślin ukrytych pod ziemią.","l":0},{"t":"o","q":"Jak ludzie radzą sobie na pustyni gorącej?","a":"Osiedlają się w oazach, wykorzystują nawadnianie pól, wodę z odsalania wody morskiej, wody podziemne; koczownicy budują namioty. Przykładem jest Dubaj.","l":0,"k":1},{"t":"o","q":"Kim są Inuici i jak żyją?","a":"Rdzenni mieszkańcy Arktyki (Grenlandia, Kanada, Alaska); zajmują się łowiectwem i rybołówstwem oraz turystyką. Stolicą Grenlandii jest Nuuk.","l":0,"k":1},{"t":"o","q":"Dlaczego na Antarktydzie nie ma stałych mieszkańców?","a":"Obowiązuje traktat zabraniający budowy miast i wsi; są tylko stacje badawcze (np. polska stacja im. Arctowskiego).","l":0},{"t":"f","q":"Największa pustynia gorąca na świecie to _______.","a":"Sahara","acc":[],"ex":"Leży w Afryce.","l":0,"k":1},{"t":"tf","q":"Pustynie lodowe leżą w pobliżu zwrotników.","a":false,"ex":"Leżą za kołami podbiegunowymi.","l":0},{"t":"w","q":"oaza","a":"Obszar na pustyni, na którym jest dostęp do wody – rosną tam rośliny.","l":0,"k":1},{"t":"w","q":"pustynia","a":"Obszar o dużej powierzchni, pozbawiony roślinności, o niskich opadach lub niskiej temperaturze.","l":0,"k":1},{"t":"w","q":"termoregulacja","a":"Utrzymywanie stałej temperatury ciała, np. dzięki dużym uszom fenka.","l":0,"k":1},{"t":"o","q":"Gdzie występują tajga i tundra?","a":"Na północy Europy, Azji i Ameryki Północnej; tajga zajmuje większy obszar niż tundra, a tundra leży bliżej koła podbiegunowego.","l":1,"k":1},{"t":"o","q":"Jaki jest klimat tajgi i tundry?","a":"Zima bardzo zimna, temperatura spada do kilkudziesięciu stopni poniżej zera, lato krótkie i chłodne; opady niewielkie.","l":1},{"t":"o","q":"Jakie rośliny rosną w tajdze?","a":"Drzewa iglaste, np. świerki, modrzewie, jodły i sosny; także brzoza i olcha na podmokłych terenach.","l":1},{"t":"o","q":"Jakie rośliny rosną w tundrze?","a":"Trawy, mchy, porosty, krzewinki i karłowate odmiany drzew (np. wierzba, brzoza); brak dużych drzew.","l":1},{"t":"o","q":"Co to jest lasotundra?","a":"Strefa przejściowa między tajgą a tundrą, w której drzewa rosną w dużych odstępach.","l":1,"k":1},{"t":"o","q":"Jakie zwierzęta żyją w tajdze i tundrze?","a":"Niedźwiedź grizzly, łoś, puszczyk mszarny (tajga); renifer i lemingi (tundra).","l":1,"k":1},{"t":"o","q":"Czym zajmują się mieszkańcy tajgi i tundry?","a":"Łowiectwem i chowem zwierząt (renifery), wycinką drzew oraz wydobywaniem surowców (ropa, gaz, węgiel, rudy, diamenty).","l":1},{"t":"o","q":"Co to jest wieloletnia zmarzlina?","a":"Warstwa gruntu, w której przez cały czas utrzymuje się ujemna temperatura.","l":1,"k":1},{"t":"o","q":"Jak wieloletnia zmarzlina utrudnia życie?","a":"Budynki ogrzewane rozmrażają grunt, który zamienia się w błoto; dlatego buduje się je na palach wbitych głęboko w ziemię. Powstają też mokradła i rozlewiska.","l":1,"k":1},{"t":"o","q":"Dlaczego w tajdze i tundrze uciążliwe są komary i meszki?","a":"Latem w rozmarzniętym gruncie tworzą się podmokłe tereny, a one są prawdziwym utrapieniem.","l":1},{"t":"tf","q":"Tundra to formacja leśna.","a":false,"ex":"Tundra jest bezleśna; las iglasty to tajga.","l":1,"k":1},{"t":"f","q":"Tajga to formacja _______, w której dominują drzewa iglaste.","a":"leśna","acc":[],"ex":"","l":1},{"t":"w","q":"tajga","a":"Las z przewagą drzew iglastych tworzący strefę roślinną w chłodnym klimacie umiarkowanym.","l":1,"k":1},{"t":"w","q":"tundra","a":"Bezleśna formacja roślinna w strefie okołobiegunowej, z trawami, mchami i porostami.","l":1,"k":1},{"t":"w","q":"wieloletnia zmarzlina","a":"Warstwa gruntu, w której przez cały czas utrzymuje się ujemna temperatura.","l":1,"k":1},{"t":"o","q":"Gdzie występuje klimat śródziemnomorski?","a":"Na południu Europy oraz w niewielkich obszarach w Afryce, Ameryce Północnej, Azji i Australii; największe obszary leżą nad Morzem Śródziemnym.","l":2,"k":1},{"t":"o","q":"Jaki jest klimat śródziemnomorski?","a":"Gorące, suche lato i łagodna, deszczowa zima (temperatura nie spada poniżej 0 °C); na północnej półkuli opady występują od listopada do marca.","l":2,"k":1},{"t":"o","q":"Dlaczego w Perth (Australia) lato przypada na styczeń?","a":"Bo Perth leży na półkuli południowej – pory roku są odwrócone w stosunku do północnej.","l":2},{"t":"o","q":"Jak rośliny przystosowały się do klimatu śródziemnomorskiego?","a":"Mają skórkę pokrytą woskiem, rozbudowane systemy korzeniowe sięgające głęboko, liście z twardą skórką, wydzielają olejki eteryczne; rośliny zimozielone nie zrzucają liści na zimę.","l":2,"k":1},{"t":"o","q":"Czym jest makia?","a":"Wtórną formacją roślinną, która powstała po zniszczeniu lasów dębowych, cedrowych i pinii; składa się z krzewów (np. mirt, oleander, wawrzyn).","l":2,"k":1},{"t":"o","q":"Jakie rośliny uprawia się w regionie Morza Śródziemnego?","a":"Winorośl, drzewa oliwne, cytrusy (cytryny, mandarynki), pomarańcze oraz dąb korkowy.","l":2},{"t":"o","q":"Do czego służy dąb korkowy?","a":"Jego kora służy do produkcji korka.","l":2},{"t":"o","q":"Dlaczego domy w regionie Morza Śródziemnego są białe?","a":"Jasne barwy odbijają światło słoneczne i utrzymują niższą temperaturę wewnątrz; domy mają małe okna z okiennicami.","l":2},{"t":"o","q":"Dlaczego turystyka nad Morzem Śródziemnym jest ważna?","a":"Dzięki słonecznej pogodzie, ciepłemu morzu, pięknym krajobrazom, zabytkom, kuchni i wydarzeniom kulturalnym.","l":2},{"t":"o","q":"Na czym opiera się kuchnia śródziemnomorska?","a":"Na świeżych, nieprzetworzonych produktach: oliwie, warzywach, rybach i owocach morza, ziołach (bazylia), cytrusach.","l":2,"k":1},{"t":"tf","q":"W klimacie śródziemnomorskim zima jest mroźna.","a":false,"ex":"Zima jest łagodna i deszczowa.","l":2,"k":1},{"t":"w","q":"makia","a":"Wtórna formacja roślinna z krzewów i zarośli, powstała po zniszczeniu lasów w klimacie śródziemnomorskim.","l":2,"k":1},{"t":"w","q":"rośliny zimozielone","a":"Rośliny, które nie zrzucają liści na zimę.","l":2,"k":1},{"t":"o","q":"Gdzie leżą Himalaje?","a":"W Azji; łańcuch górski rozciąga się na długości 2500 km i oddziela ciepłą i wilgotną Azję Południową od chłodniejszej i suchej Azji Środkowej. Na północy leży Wyżyna Tybetańska.","l":3,"k":1},{"t":"o","q":"Czym wyróżniają się Himalaje?","a":"Są najwyższym łańcuchem górskim świata; Mount Everest ma 8849 m n.p.m.; jest tam 10 szczytów ponad 8000 m (14 na świecie).","l":3,"k":1},{"t":"o","q":"Ile lat mają Himalaje?","a":"Zaczęły powstawać ok. 50 mln lat temu; proces trwa nadal, góry rosną ok. 4 mm rocznie.","l":3,"k":1},{"t":"o","q":"Jaka jest pogoda na szczycie Mount Everestu?","a":"Temperatura nigdy nie przekracza 0 °C, w styczniu i lutym spada do −50 °C; wieją huraganowe wiatry do 290 km/h; powietrze jest rozrzedzone.","l":3,"k":1},{"t":"o","q":"Co to jest choroba wysokościowa?","a":"Zespół niebezpiecznych skutków (zdrowotnych) spowodowanych niskim ciśnieniem i niedoborem tlenu na dużych wysokościach (zwykle powyżej 2500 m n.p.m.).","l":3,"k":1},{"t":"o","q":"Jak układa się piętrowość w Himalajach?","a":"Od dołu: wilgotne lasy monsunowe, las mieszany, las iglasty, kosodrzewina, trawy, skały i turnie, lodowce i wieczne śniegi. Jest znacznie wyższa niż w Tatrach.","l":3,"k":1,"img":"him"},{"t":"o","q":"Czym różnią się piętra w Himalajach od tatrzańskich?","a":"Himalaje leżą bliżej równika, więc piętra są wyżej; u podnóża występują wilgotne lasy monsunowe, a granica śniegu wyżej.","l":3,"k":1,"img":"him"},{"t":"o","q":"Co to jest lodowiec górski?","a":"Masa lodu, powstała z gromadzącego się przez wiele lat śniegu, przemieszczająca się w dolinach; stanowi wyzwanie dla wspinaczy.","l":3},{"t":"o","q":"Jakie zwierzęta żyją w Himalajach?","a":"Jaki (hodowlane i dzikie), pantera śnieżna, orłosęp, ośnieżak himalajski (ptak).","l":3,"k":1},{"t":"o","q":"Jak jaki są przystosowane do gór?","a":"Mają gęstą sierść i grube futro chroniące przed mrozem, korzystają z pastwisk na dużych wysokościach (do 6200 m); ludzie używają ich do transportu ciężkich ładunków.","l":3},{"t":"o","q":"Jak mieszkańcy Himalajów uprawiają rośliny?","a":"Tworzą tarasy na stromych stokach, uprawiają m.in. odmiany ryżu; hodują owce, kozy i jaki.","l":3,"k":1},{"t":"o","q":"Kim są Szerpowie?","a":"Ludem mieszkającym w Himalajach, znanym jako przewodnicy i tragarze wspinaczy; dobrze radzą sobie na dużych wysokościach (osady do ok. 4000 m n.p.m.).","l":3,"k":1},{"t":"o","q":"Jaka religia dominuje w Himalajach?","a":"Buddyzm – widoczne są świątynie, klasztory i kolorowe flagi modlitewne.","l":3,"k":1},{"t":"o","q":"Z czego buduje się domy w Himalajach?","a":"Z lokalnych materiałów – kamienia, drewna i gliny; łatwo je odbudować po trzęsieniach ziemi.","l":3,"k":1},{"t":"f","q":"Najwyższy szczyt świata to Mount _______ (8849 m n.p.m.).","a":"Everest","acc":[],"ex":"Leży w Himalajach.","l":3,"k":1},{"t":"tf","q":"Himalaje są młodszymi górami niż Tatry.","a":true,"ex":"Himalaje powstają od ok. 50 mln lat i wciąż rosną.","l":3,"k":1},{"t":"w","q":"buddyzm","a":"System wierzeń rozpowszechniony w Azji Południowej i Wschodniej; wyznawcy dążą do szczęścia przez pracę nad umysłem.","l":3,"k":1},{"t":"w","q":"choroba wysokościowa","a":"Zespół niebezpiecznych skutków zdrowotnych na wysokościach ponad 2500 m n.p.m., spowodowany niskim ciśnieniem i niedoborem tlenu.","l":3,"k":1},{"t":"w","q":"lodowiec górski","a":"Masa lodu w górach, powstała z gromadzącego się przez wiele lat śniegu.","l":3,"k":1},{"t":"w","q":"Szerpowie","a":"Lud z Himalajów; przewodnicy i tragarze wypraw wysokogórskich.","l":3,"k":1}]}],"historia":[{"id":"h1","title":"Początki cywilizacji","icon":"🏺","q":[{"t":"s","q":"Wydarzenie, które dało początek obowiązującemu w Europie systemowi datacji, to:","a":"Narodziny Jezusa Chrystusa","ex":"Od tego wydarzenia liczymy lata n.e. i p.n.e.","l":0,"k":1},{"t":"tf","q":"Rok, w którym urodził się Jezus Chrystus, jest punktem odniesienia w systemie datacji używanym w Europie (podział na n.e. i p.n.e.).","a":true,"ex":"To podstawa europejskiego systemu liczenia lat.","l":0,"k":1},{"t":"f","q":"Skrót „n.e.” oznacza „naszej _______”.","a":"ery","acc":[],"ex":"To lata liczone od narodzin Chrystusa.","l":0},{"t":"s","q":"Skrót „p.n.e.” oznacza:","a":"Przed naszą erą","ex":"Te lata liczymy wstecz od narodzin Chrystusa.","l":0},{"t":"o","q":"Wyjaśnij różnicę między latami liczonymi „p.n.e.” i „n.e.”.","a":"Lata „n.e.” (naszej ery) liczymy od narodzin Chrystusa w górę (im wyższa liczba, tym później), a lata „p.n.e.” (przed naszą erą) liczymy wstecz od tego punktu (im wyższa liczba, tym dawniej).","l":0},{"t":"s","q":"Prehistoria różni się od historii tym, że:","a":"Prehistoria to okres, z którego nie zachowały się źródła pisane","ex":"Historię wyznacza pojawienie się pisma.","l":0},{"t":"tf","q":"Historia zaczyna się wraz z pojawieniem się pisma i źródeł pisanych, a wcześniejszy okres nazywamy prehistorią.","a":true,"ex":"To umow
