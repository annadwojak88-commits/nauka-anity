t":"o","q":"Podaj przykład rośliny zapylanej przez owady i przykład rośliny zapylanej przez wiatr.","a":"Zapylana przez owady: np. jabłoń lub wiśnia. Zapylana przez wiatr: np. sosna, brzoza lub trawy (np. żyto).","l":3},{"t":"s","q":"Kwiaty zapylane przez ptaki (np. kolibry) są zwykle:","a":"Rurkowate, jaskrawe i wytwarzają dużo nektaru","ex":"Ptaki potrzebują dużo energii, dlatego takie kwiaty oferują obfity nektar.","l":3},{"t":"tf","q":"Kwiaty zapylane przez ptaki, np. kolibry, są często rurkowate i intensywnie zabarwione.","a":true,"ex":"Kształt kwiatu dopasowany jest do budowy dzioba ptaka.","l":3},{"t":"s","q":"Które stwierdzenie o kwiatostanach jest prawdziwe?","a":"Mogą ułatwiać zapylenie, gromadząc wiele kwiatów w jednym miejscu","ex":"Duży, widoczny kwiatostan łatwiej przyciąga zapylaczy.","l":3},{"t":"f","q":"Zgromadzenie wielu drobnych kwiatów w jednym kwiatostanie, np. u słonecznika, ułatwia ich zapylenie przez _______.","a":"owady","acc":[],"ex":"Duży kwiatostan jest bardziej widoczny dla zapylaczy.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego zgromadzenie wielu małych kwiatów w kwiatostanie może być korzystne dla rośliny.","a":"Duży, widoczny kwiatostan złożony z wielu małych kwiatów łatwiej przyciąga uwagę owadów zapylających niż pojedynczy, mały kwiat, co zwiększa szansę na skuteczne zapylenie wielu kwiatów naraz.","l":3},{"t":"s","q":"Który element kwiatu jest bezpośrednio odpowiedzialny za produkcję pyłku?","a":"Pręcik (główka pręcika)","ex":"Główka pręcika jest miejscem powstawania pyłku.","l":3},{"t":"tf","q":"Pyłek powstaje w główce pręcika.","a":true,"ex":"To podstawowa funkcja pręcika w kwiecie.","l":3},{"t":"s","q":"Zapylenie krzyżowe (obce) sprzyja:","a":"Większej różnorodności genetycznej potomstwa","ex":"To ważna ewolucyjna korzyść zapylenia krzyżowego.","l":3},{"t":"f","q":"Zapylenie krzyżowe zwiększa różnorodność _______ potomstwa.","a":"genetyczną","acc":[],"ex":"To pomaga populacji lepiej radzić sobie ze zmianami środowiska.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego zapylenie krzyżowe (obce) jest korzystne dla gatunku.","a":"Zapylenie krzyżowe łączy materiał genetyczny dwóch różnych roślin, co zwiększa różnorodność genetyczną potomstwa — dzięki temu populacja lepiej radzi sobie ze zmieniającymi się warunkami środowiska i chorobami.","l":3},{"t":"tf","q":"Zalążnia i zalążki słupka oraz pyłek z pręcików biorą bezpośredni udział w powstaniu nasienia i owocu.","a":true,"ex":"To kluczowe elementy w procesie rozmnażania rośliny.","l":3},{"t":"s","q":"Rośliny wiatropylne wytwarzają zwykle:","a":"Bardzo dużą ilość lekkiego pyłku","ex":"To rekompensuje niską skuteczność zapylenia przez wiatr.","l":3},{"t":"f","q":"Rośliny wiatropylne wytwarzają dużą ilość lekkiego pyłku, ponieważ tylko niewielka jego część dotrze do _______ innego kwiatu.","a":"znamienia","acc":[],"ex":"Zapylenie przez wiatr jest mało precyzyjne.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego rośliny wiatropylne muszą wytwarzać znacznie więcej pyłku niż owadopylne.","a":"Zapylenie przez wiatr jest mało precyzyjne — większość pyłku unoszonego przez wiatr nie trafia na znamię słupka innego kwiatu, dlatego rośliny wiatropylne wytwarzają go w ogromnych ilościach, by zwiększyć szansę na skuteczne zapylenie.","l":3},{"t":"tf","q":"Prawidłowa kolejność to: zapylenie, wzrost łagiewki pyłkowej, zapłodnienie, a następnie rozwój nasienia.","a":true,"ex":"Każdy z tych etapów jest niezbędny do powstania kolejnego.","l":3},{"t":"s","q":"Kwiaty niektórych roślin mają charakterystyczny zapach, który:","a":"Przywabia konkretne gatunki zapylaczy","ex":"Zapach, podobnie jak barwa, może przyciągać zapylaczy.","l":3},{"t":"f","q":"Zapach kwiatu, podobnie jak jego barwa, może służyć przywabianiu _______.","a":"zapylaczy","acc":[],"ex":"To jedna z funkcji zapachu kwiatowego.","l":3},{"t":"o","q":"Podaj dwa sposoby, w jakie kwiat może przyciągać zapylaczy.","a":"Barwą płatków korony oraz zapachem, a także oferowaniem nektaru jako nagrody dla zapylacza.","l":3},{"t":"s","q":"Który element kwiatu chroni pąk przed jego przedwczesnym rozwinięciem?","a":"Działki kielicha","ex":"To zewnętrzna, ochronna część kwiatu.","l":3},{"t":"tf","q":"Działki kielicha, zwykle zielone, znajdują się na zewnątrz kwiatu i chronią pąk przed rozwinięciem.","a":true,"ex":"Działki kielicha osłaniają młody, jeszcze niekwitnący kwiat.","l":3},{"t":"f","q":"Komórka powstająca w wyniku połączenia komórki jajowej z plemnikową nazywa się _______.","a":"zygotą","acc":[],"ex":"Zygota to pierwsza komórka nowego pokolenia rośliny.","l":3},{"t":"tf","q":"Zygota, powstała w wyniku zapłodnienia, rozwija się w zarodek nasienia.","a":true,"ex":"To kolejny etap po zapłodnieniu.","l":3},{"t":"o","q":"Wyjaśnij, czym jest zygota i co się z niej rozwija.","a":"Zygota to komórka powstająca w wyniku połączenia komórki jajowej z komórką plemnikową podczas zapłodnienia; z zygoty rozwija się zarodek, który jest częścią rozwijającego się nasienia.","l":3},{"t":"tf","q":"Zapylenie to przeniesienie pyłku na znamię słupka, a zapłodnienie to połączenie komórek rozrodczych, żeńskiej i męskiej.","a":true,"ex":"Zapylenie zawsze poprzedza zapłodnienie.","l":3},{"t":"s","q":"Rośliny owadopylne mają zwykle kwiaty:","a":"Większe, barwne, często pachnące, wytwarzające nektar","ex":"To cechy przyciągające uwagę owadów.","l":3},{"t":"f","q":"Kwiaty owadopylne są zwykle większe i _______ niż kwiaty wiatropylne.","a":"barwniejsze","acc":[],"ex":"To ułatwia im przyciąganie uwagi zapylaczy.","l":3},{"t":"o","q":"Porównaj cechy kwiatów owadopylnych i wiatropylnych.","a":"Kwiaty owadopylne są zwykle duże, barwne, pachnące i produkują nektar, by przywabić owady, natomiast kwiaty wiatropylne są małe, niepozorne, pozbawione zapachu i nektaru, ale wytwarzają bardzo dużo lekkiego pyłku.","l":3},{"t":"tf","q":"Pręcik jest męskim organem rozrodczym kwiatu, wytwarzającym pyłek.","a":true,"ex":"Pyłek zawiera męskie komórki rozrodcze.","l":3},{"t":"f","q":"Słupek jest żeńskim organem rozrodczym kwiatu, zawierającym _______ z zalążkami.","a":"zalążnię","acc":[],"ex":"W zalążni znajdują się zalążki z komórkami jajowymi.","l":3},{"t":"o","q":"Opisz funkcje pręcika i słupka w kwiecie.","a":"Pręcik jest męskim organem rozrodczym kwiatu — w jego główce powstaje pyłek. Słupek jest żeńskim organem rozrodczym — zawiera zalążnię z zalążkami, w których znajdują się komórki jajowe, oraz szyjkę i znamię, na które trafia pyłek podczas zapylenia.","l":3},{"t":"tf","q":"W typowym kwiecie okrytonasiennym, od zewnątrz do wewnątrz, znajdują się: kielich, korona, pręciki, a w środku słupek.","a":true,"ex":"To standardowa budowa większości kwiatów.","l":3},{"t":"s","q":"Kwiat, w którym brakuje pręcików (jest wyłącznie żeński), nazywamy kwiatem:","a":"Jednopłciowym żeńskim","ex":"Ma tylko słupek, bez organów męskich.","l":3},{"t":"f","q":"Kwiat, który ma tylko słupek, bez pręcików, nazywamy kwiatem jednopłciowym _______.","a":"żeńskim","acc":[],"ex":"To przeciwieństwo kwiatu jednopłciowego męskiego.","l":3},{"t":"o","q":"Wyjaśnij, czym różni się kwiat jednopłciowy żeński od jednopłciowego męskiego.","a":"Kwiat jednopłciowy żeński ma wyłącznie słupek (żeński organ rozrodczy), natomiast kwiat jednopłciowy męski ma wyłącznie pręciki (męski organ rozrodczy) — żaden z nich nie ma jednocześnie obu rodzajów organów rozrodczych.","l":3},{"t":"tf","q":"Barwa płatków korony u roślin owadopylnych pełni funkcję przywabiania zapylaczy.","a":true,"ex":"Zwierzęta zapylające kierują się m.in. kolorem kwiatu.","l":3},{"t":"s","q":"Dlaczego niektóre rośliny inwestują dużo energii w produkcję nektaru?","a":"Nektar jest „opłatą” za usługę zapylenia świadczoną przez zwierzęta","ex":"To inwestycja opłacająca się roślinie dzięki skutecznemu zapyleniu.","l":3},{"t":"f","q":"Nektar można traktować jako rodzaj „zapłaty” rośliny dla zwierzęcia za usługę _______.","a":"zapylenia","acc":[],"ex":"To korzystna wymiana dla obu stron.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego relację między rośliną kwitnącą a owadem zapylającym często określa się jako korzystną dla obu stron.","a":"Roślina zyskuje możliwość zapylenia (a więc rozmnażania), a owad w zamian otrzymuje pokarm w postaci nektaru lub pyłku — obie strony odnoszą korzyść z tej współpracy, dlatego mówi się o relacji korzystnej dla obu stron.","l":3},{"t":"tf","q":"Po zapyleniu i zapłodnieniu zalążek rozwija się w nasiono, a zalążnia w owoc.","a":true,"ex":"To kluczowy efekt procesu rozmnażania płciowego rośliny.","l":3},{"t":"o","q":"Podsumuj, jaką rolę pełni kwiat w rozmnażaniu się rośliny okrytonasiennej.","a":"Kwiat jest organem generatywnym rośliny — umożliwia produkcję i wymianę komórek rozrodczych (poprzez zapylenie), ich połączenie (zapłodnienie), a w efekcie rozwój nasion chronionych przez owoc, co zapewnia roślinie możliwość rozmnażania płciowego.","l":3},{"t":"tf","q":"Kwiat pełni kluczową rolę w rozmnażaniu płciowym roślin okrytonasiennych.","a":true,"ex":"To główna funkcja kwiatu w cyklu życiowym rośliny.","l":3},{"t":"s","q":"Po zapłodnieniu z zalążka rozwija się:","a":"Nasiono","ex":"Zalążek zawiera komórkę jajową, z której po zapłodnieniu powstaje zarodek wewnątrz nasienia.","l":4},{"t":"s","q":"Po zapłodnieniu z zalążni rozwija się:","a":"Owoc","ex":"Zalążnia rozrasta się i przekształca w owoc, chroniący nasiona.","l":4},{"t":"tf","q":"Nasiono zawiera zarodek, substancje zapasowe i łupinę nasienną.","a":true,"ex":"To trzy podstawowe elementy budowy typowego nasienia.","l":4},{"t":"f","q":"Zewnętrzna warstwa nasienia, chroniąca jego wnętrze, to łupina _______.","a":"nasienna","acc":[],"ex":"Łupina nasienna chroni zarodek przed uszkodzeniami i wysychaniem.","l":4},{"t":"s","q":"Substancje zapasowe zgromadzone w nasieniu są wykorzystywane przede wszystkim przez:","a":"Rozwijający się zarodek","ex":"Dają one energię potrzebną do kiełkowania, zanim młoda roślina zacznie sama fotosyntetyzować.","l":4},{"t":"s","q":"Do rozpoczęcia kiełkowania większość nasion potrzebuje:","a":"Wody, tlenu i odpowiedniej temperatury","ex":"To trzy podstawowe warunki, bez których nasiono zwykle nie wykiełkuje.","l":4},{"t":"tf","q":"Każde nasiono potrzebuje światła, by rozpocząć kiełkowanie.","a":false,"ex":"Większość nasion kiełkuje również w ciemności — kluczowe są woda, tlen i temperatura.","l":4},{"t":"tf","q":"Owoc może pomagać w rozsiewaniu nasion, np. dzięki soczystemu miąższowi zjadanemu przez zwierzęta.","a":true,"ex":"Zwierzęta zjadają owoce, a nasiona przechodzą przez ich układ pokarmowy i trafiają w nowe miejsca.","l":4},{"t":"s","q":"Cechą ułatwiającą rozsiewanie nasion przez wiatr jest zwykle:","a":"Niewielki ciężar lub obecność „skrzydełka\"","ex":"Lekkie nasiona lub nasiona ze „skrzydełkami” łatwiej unoszą się na wietrze.","l":4},{"t":"s","q":"Pierwszym widocznym etapem kiełkowania jest zwykle:","a":"Pojawienie się korzenia zarodkowego","ex":"Korzeń zarodkowy zwykle jako pierwszy przebija łupinę nasienną.","l":4},{"t":"f","q":"Owoce mogą być przystosowane do rozsiewania przez zwierzęta, np. dzięki haczykom, lub przez wiatr, dzięki lekkim _______.","a":"skrzydełkom","acc":["nasionom"],"ex":"Skrzydełka spowalniają opadanie nasiona, dzięki czemu wiatr unosi je dalej.","l":4},{"t":"s","q":"Dlaczego nasiono potrzebuje tlenu podczas kiełkowania?","a":"Do oddychania komórkowego, dostarczającego energii potrzebnej do wzrostu","ex":"Kiełkujące nasiono intensywnie oddycha, zużywając zapasy energii z substancji zapasowych.","l":4},{"t":"tf","q":"Nasiono może pozostawać przez pewien czas w stanie spoczynku, zanim zacznie kiełkować.","a":true,"ex":"Dzięki temu nasiona mogą przetrwać niekorzystne warunki, np. zimę.","l":4},{"t":"s","q":"Główną funkcją owocu jest:","a":"Ochrona nasion i pomoc w ich rozsiewaniu","ex":"Owoc powstaje z zalążni i chroni rozwijające się w nim nasiona.","l":4},{"t":"s","q":"Nasiona rozsiewane przez zwierzęta często mają:","a":"Haczyki umożliwiające przyczepianie się do sierści","ex":"Haczyki pozwalają nasionom przyczepić się do futra przechodzącego zwierzęcia i podróżować na duże odległości.","l":4},{"t":"tf","q":"Wszystkie owoce są soczyste i jadalne dla człowieka.","a":false,"ex":"Wiele owoców jest suchych (np. orzechy) lub niejadalnych dla ludzi.","l":4},{"t":"s","q":"Dlaczego niektóre owoce mają jaskrawe kolory?","a":"By przyciągać zwierzęta, które je zjedzą i rozsieją nasiona","ex":"Jaskrawy kolor sygnalizuje zwierzętom, że owoc jest dojrzały i gotowy do zjedzenia.","l":4},{"t":"s","q":"Co dzieje się z substancjami zapasowymi w nasieniu podczas kiełkowania?","a":"Są zużywane jako źródło energii dla rozwijającego się zarodka","ex":"To dzięki nim młoda roślina ma energię, zanim zacznie samodzielnie fotosyntetyzować.","l":4},{"t":"s","q":"Nasiono zawiera:","a":"Zarodek oraz materiały zapasowe, otoczone łupiną nasienną","ex":"To podstawowe elementy budowy nasiona.","l":4},{"t":"tf","q":"Nasiono zawiera zarodek przyszłej rośliny oraz materiały zapasowe potrzebne do kiełkowania.","a":true,"ex":"Substancje zapasowe dają energię, zanim roślina zacznie fotosyntetyzować.","l":4},{"t":"f","q":"Zewnętrzna, ochronna warstwa nasiona nazywa się łupiną _______.","a":"nasienną","acc":[],"ex":"Chroni ona zarodek i materiały zapasowe przed uszkodzeniem.","l":4},{"t":"s","q":"Funkcją łupiny nasiennej jest:","a":"Ochrona zarodka i materiałów zapasowych przed uszkodzeniem i wysychaniem","ex":"Łupina chroni nasiono, dopóki nie znajdzie się w sprzyjających warunkach do kiełkowania.","l":4},{"t":"tf","q":"Łupina nasienna chroni zarodek przed uszkodzeniami mechanicznymi i nadmierną utratą wody.","a":true,"ex":"To pozwala nasieniu przetrwać nawet długi czas w niesprzyjających warunkach.","l":4},{"t":"o","q":"Wymień trzy elementy budowy nasiona.","a":"Zarodek, materiały zapasowe (np. bielmo) oraz łupina nasienna.","l":4},{"t":"s","q":"Owoc powstaje z:","a":"Zalążni kwiatu, po zapłodnieniu","ex":"Zalążnia rozrasta się, tworząc owoc.","l":4},{"t":"tf","q":"Owoc rozwija się z zalążni słupka po zapłodnieniu.","a":true,"ex":"To bezpośredni efekt udanego zapłodnienia.","l":4},{"t":"s","q":"Główną funkcją owocu jest:","a":"Ochrona nasion i pomoc w ich rozsiewaniu","ex":"Owoc chroni rozwijające się nasiona i często ułatwia ich rozprzestrzenianie.","l":4},{"t":"f","q":"Owoc chroni nasiona oraz często pomaga w ich _______.","a":"rozsiewaniu","acc":[],"ex":"Np. dzięki zjadaniu owoców przez zwierzęta.","l":4},{"t":"o","q":"Wyjaśnij dwie główne funkcje owocu dla rośliny.","a":"Owoc chroni rozwijające się wewnątrz niego nasiona przed uszkodzeniami i wysychaniem oraz często ułatwia rozsiewanie nasion, np. poprzez zjadanie przez zwierzęta, przyczepianie się do sierści lub unoszenie przez wiatr.","l":4},{"t":"s","q":"Owoce mięsiste, np. jabłko, są zwykle rozsiewane przez:","a":"Zwierzęta, które je zjadają","ex":"Zwierzęta zjadają owoc, a nasiona wydalają w innym miejscu.","l":4},{"t":"tf","q":"Owoce mięsiste są często zjadane przez zwierzęta, które w ten sposób przyczyniają się do rozsiewania nasion.","a":true,"ex":"Nasiona przechodzą przez przewód pokarmowy zwierzęcia i są wydalane w innym miejscu.","l":4},{"t":"s","q":"Owoce suche z haczykowatymi wyrostkami, np. u łopianu, są przystosowane do rozsiewania przez:","a":"Przyczepianie się do sierści zwierząt lub ubrania człowieka","ex":"Haczyki umożliwiają im „podróżowanie” na futrze zwierząt.","l":4},{"t":"f","q":"Owoce z haczykowatymi wyrostkami rozsiewają się dzięki przyczepianiu się do sierści zwierząt lub _______ człowieka.","a":"ubrania","acc":[],"ex":"To sprytny sposób na rozprzestrzenianie się nasion.","l":4},{"t":"s","q":"Owoce ze skrzydełkami, np. u klonu, są przystosowane do rozsiewania przez:","a":"Wiatr","ex":"Skrzydełka umożliwiają im szybowanie na dalsze odległości.","l":4},{"t":"tf","q":"Owoce klonu mają skrzydełka ułatwiające ich rozsiewanie przez wiatr.","a":true,"ex":"Dzięki temu nasiona mogą wirować i oddalać się od drzewa macierzystego.","l":4},{"t":"o","q":"Podaj trzy przykłady sposobów rozsiewania owoców i nasion oraz przystosowania z nimi związane.","a":"Przez zwierzęta (zjadanie owoców mięsistych, np. jabłka); przez przyczepianie się do sierści (haczykowate owoce, np. łopianu); przez wiatr (owoce ze skrzydełkami, np. klonu, lub bardzo lekkie nasiona, np. mniszka).","l":4},{"t":"s","q":"Owoce roślin wodnych, np. niektórych turzyc, mogą być rozsiewane przez:","a":"Wodę","ex":"Pływające owoce lub nasiona mogą być przenoszone przez prądy wodne.","l":4},{"t":"tf","q":"Niektóre nasiona i owoce mogą unosić się na wodzie i być przenoszone przez prądy wodne.","a":true,"ex":"To kolejny sposób rozprzestrzeniania się roślin.","l":4},{"t":"s","q":"Do kiełkowania nasiona zwykle potrzebne są:","a":"Woda, odpowiednia temperatura i tlen","ex":"To trzy podstawowe warunki niezbędne do wykiełkowania większości nasion.","l":4},{"t":"f","q":"Do kiełkowania nasiona potrzebują wody, odpowiedniej temperatury oraz _______.","a":"tlenu","acc":[],"ex":"Bez dostępu do tlenu zarodek nie mógłby oddychać.","l":4},{"t":"s","q":"Woda jest niezbędna do kiełkowania, ponieważ:","a":"Powoduje pęcznienie nasiona i uruchamia procesy życiowe zarodka","ex":"Woda „budzi” zarodek do życia.","l":4},{"t":"tf","q":"Woda powoduje pęcznienie nasiona i uruchamia procesy życiowe zarodka podczas kiełkowania.","a":true,"ex":"To pierwszy widoczny etap kiełkowania.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego woda jest niezbędna do rozpoczęcia kiełkowania nasienia.","a":"Woda wnika do nasiona, powodując jego pęcznienie, co uruchamia procesy życiowe zarodka — umożliwia to aktywację enzymów rozkładających materiały zapasowe, z których zarodek czerpie energię do wzrostu.","l":4},{"t":"s","q":"Pierwszym widocznym etapem kiełkowania jest zwykle:","a":"Pęcznienie nasiona i pękanie łupiny nasiennej","ex":"To pierwszy widoczny znak, że nasiono zaczyna kiełkować.","l":4},{"t":"tf","q":"Pierwszym widocznym etapem kiełkowania jest zwykle pęcznienie nasiona i pękanie łupiny nasiennej.","a":true,"ex":"Dopiero potem pojawia się korzeń zarodkowy.","l":4},{"t":"s","q":"Podczas kiełkowania z nasienia jako pierwszy wyrasta zwykle:","a":"Korzeń zarodkowy","ex":"Korzeń zarodkowy umożliwia roślinie pobieranie wody z gleby.","l":4},{"t":"f","q":"Podczas kiełkowania z nasienia jako pierwszy wyrasta zwykle _______ zarodkowy.","a":"korzeń","acc":[],"ex":"To umożliwia młodej roślinie pobieranie wody z podłoża.","l":4},{"t":"o","q":"Opisz kolejne, widoczne etapy kiełkowania nasienia fasoli.","a":"Nasiono pęcznieje, pobierając wodę, następnie pęka łupina nasienna, z nasienia wyrasta korzeń zarodkowy, a potem łodyżka z liścieniami, które później rozwijają pierwsze prawdziwe liście.","l":4},{"t":"s","q":"Kiełkowanie zostaje zahamowane, gdy: ","a":"Brakuje wody, odpowiedniej temperatury lub tlenu","ex":"Brak choćby jednego z warunków może uniemożliwić kiełkowanie.","l":4},{"t":"tf","q":"Brak wody, zbyt niska lub zbyt wysoka temperatura oraz brak tlenu mogą uniemożliwić kiełkowanie nasienia.","a":true,"ex":"Wszystkie te warunki muszą być spełnione jednocześnie.","l":4},{"t":"s","q":"Niektóre nasiona potrzebują okresu chłodu (stratyfikacji), aby: ","a":"Móc później skutecznie wykiełkować","ex":"To naturalny mechanizm zapobiegający kiełkowaniu przed nadejściem wiosny.","l":4},{"t":"f","q":"Proces wystawienia nasion na działanie niskiej temperatury, potrzebny niektórym gatunkom do skutecznego kiełkowania, nazywamy _______.","a":"stratyfikacją","acc":[],"ex":"To naturalny mechanizm związany z porami roku.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego niektóre nasiona potrzebują okresu chłodu (stratyfikacji), zanim będą mogły wykiełkować.","a":"Okres chłodu jest naturalnym sygnałem, że minęła zima — dzięki temu nasiona niektórych gatunków „wiedzą”, że nadeszła wiosna i warunki są sprzyjające do wzrostu, co zapobiega przedwczesnemu kiełkowaniu jesienią, gdy młoda roślina mogłaby zginąć od mrozu.","l":4},{"t":"s","q":"Substancje zapasowe w nasieniu (np. skrobia) są magazynowane głównie w:","a":"Liścieniach lub bielmie","ex":"To stamtąd zarodek czerpie energię podczas kiełkowania.","l":4},{"t":"tf","q":"Substancje zapasowe nasienia są magazynowane w liścieniach lub w bielmie.","a":true,"ex":"Zależy to od gatunku rośliny.","l":4},{"t":"s","q":"Bielmo nasienia to: ","a":"Tkanka magazynująca substancje zapasowe, wykorzystywane przez kiełkujący zarodek","ex":"Bielmo jest bogate w skrobię lub inne substancje odżywcze.","l":4},{"t":"f","q":"Tkanka magazynująca substancje zapasowe wewnątrz nasienia, wykorzystywana przez kiełkujący zarodek, nazywa się _______.","a":"bielmem","acc":[],"ex":"Bielmo występuje np. w ziarnach zbóż.","l":4},{"t":"o","q":"Wyjaśnij, jaką rolę pełni bielmo lub liścienie w kiełkującym nasieniu.","a":"Bielmo lub liścienie magazynują substancje zapasowe (np. skrobię, tłuszcze, białka), które dostarczają energii i budulca kiełkującemu zarodkowi, zanim młoda roślina rozwinie liście zdolne do samodzielnej fotosyntezy.","l":4},{"t":"tf","q":"Młoda roślina, zanim rozwinie własne liście zdolne do fotosyntezy, korzysta z substancji zapasowych zgromadzonych w nasieniu.","a":true,"ex":"Substancje te są stopniowo zużywane podczas kiełkowania.","l":4},{"t":"f","q":"Owady zapylające są potrzebne wcześniej, do powstania nasienia, a nie do samego procesu _______.","a":"kiełkowania","acc":[],"ex":"To odróżnia rolę zapylaczy od warunków kiełkowania.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego zapylenie nie jest bezpośrednio potrzebne do kiełkowania nasienia, mimo że jest niezbędne do jego powstania.","a":"Zapylenie i zapłodnienie są potrzebne wcześniej — prowadzą do powstania samego nasienia. Gdy nasiono jest już uformowane, do jego kiełkowania potrzebne są zupełnie inne warunki: odpowiednia woda, temperatura i dostęp do tlenu, a nie ponowne zapylenie.","l":4},{"t":"s","q":"Owoc suchy, pękający i uwalniający nasiona, to np.:","a":"Strąk grochu","ex":"Strąk grochu pęka wzdłuż, uwalniając nasiona.","l":4},{"t":"tf","q":"Strąk grochu jest przykładem owocu suchego, pękającego, uwalniającego nasiona.","a":true,"ex":"To odróżnia go od owoców mięsistych, jak jabłko czy śliwka.","l":4},{"t":"s","q":"Owoc mięsisty, niepękający, o soczystym miąższu, to np.:","a":"Jabłko","ex":"Jabłko jest typowym owocem mięsistym.","l":4},{"t":"f","q":"Jabłko jest przykładem owocu _______, w odróżnieniu od suchych owoców, jak strąk grochu.","a":"mięsistego","acc":[],"ex":"Owoce mięsiste mają soczysty miąższ.","l":4},{"t":"o","q":"Podaj przykład owocu suchego i owocu mięsistego.","a":"Owoc suchy: np. strąk grochu lub orzech. Owoc mięsisty: np. jabłko lub śliwka.","l":4},{"t":"tf","q":"Po zapłodnieniu zalążek rozwija się w nasiono, a zalążnia w owoc.","a":true,"ex":"To bezpośredni skutek udanego zapłodnienia.","l":4},{"t":"s","q":"Nasiona niektórych roślin pustynnych mogą czekać na kiełkowanie przez wiele lat, ponieważ:","a":"Kiełkują dopiero, gdy warunki (np. opad deszczu) staną się sprzyjające","ex":"To strategia przetrwania w trudnym, suchym środowisku.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego zdolność nasion do „czekania” na sprzyjające warunki (np. u roślin pustynnych) jest korzystna. Podaj przykład takiej sytuacji.","a":"Dzięki zdolności do „czekania” nasiona nie kiełkują w niesprzyjających warunkach, w których młoda roślina szybko by zginęła — np. nasiona roślin pustynnych mogą pozostawać uśpione przez lata, aż pojawi się wystarczający opad deszczu, dający szansę na przetrwanie siewki.","l":4},{"t":"tf","q":"Nasiono zawiera zarodek i rozwija się z zalążka, a owoc otacza nasiona i rozwija się z zalążni.","a":true,"ex":"To kluczowa różnica w pochodzeniu obu struktur.","l":4},{"t":"f","q":"Kiełkowanie rozpoczyna rozwój nowego pokolenia rośliny z _______.","a":"nasienia","acc":[],"ex":"To pierwszy etap życia nowej rośliny.","l":4},{"t":"o","q":"Podsumuj, jakie znaczenie ma proces kiełkowania w cyklu życiowym rośliny.","a":"Kiełkowanie jest momentem, w którym zarodek zawarty w nasieniu, korzystając z zapasów substancji odżywczych i sprzyjających warunków (wody, temperatury, tlenu), zaczyna aktywnie rosnąć, rozwijając korzeń i pęd — jest to początek rozwoju nowego, samodzielnego pokolenia rośliny.","l":4},{"t":"tf","q":"Nasiona mniszka lekarskiego (dmuchawca) mają puchate wyrostki ułatwiające ich rozsiewanie przez wiatr.","a":true,"ex":"To bardzo skuteczne przystosowanie do rozprzestrzeniania się na duże odległości.","l":4},{"t":"o","q":"Wyjaśnij, w jaki sposób budowa orzecha kokosowego umożliwia mu rozsiewanie przez wodę morską.","a":"Orzech kokosowy ma twardą, wodoodporną skorupę oraz włóknistą warstwę wypełnioną powietrzem, dzięki czemu może unosić się na powierzchni wody morskiej i być przenoszony przez prądy morskie na duże odległości, zanim dotrze do brzegu i wykiełkuje.","l":4},{"t":"tf","q":"Pełny cykl obejmuje kolejno: zapylenie, zapłodnienie, rozwój nasienia i owocu, rozsiewanie, a na końcu kiełkowanie.","a":true,"ex":"To podsumowanie całego procesu rozmnażania rośliny okrytonasiennej.","l":4},{"t":"o","q":"Podsumuj cały cykl od zapylenia kwiatu do wykiełkowania nowej rośliny.","a":"Zapylenie (przeniesienie pyłku na znamię) prowadzi do zapłodnienia (połączenia komórek rozrodczych), po którym zalążek rozwija się w nasiono, a zalążnia w owoc. Owoc chroni nasiona i pomaga w ich rozsiewaniu (np. przez zwierzęta, wiatr lub wodę), a gdy nasiono trafi w sprzyjające warunki (odpowiednia woda, temperatura i tlen), kiełkuje, dając początek nowej roślinie.","l":4},{"t":"tf","q":"Duże nasiona mają zwykle więcej zgromadzonych materiałów zapasowych niż nasiona bardzo drobne.","a":true,"ex":"To daje dużym nasionom przewagę na starcie, choć drobne nasiona produkowane są zwykle w większej liczbie.","l":4},{"t":"o","q":"Wyjaśnij, jaką korzyść może dawać roślinie produkcja dużej liczby drobnych nasion, mimo że każde z nich ma mało materiałów zapasowych.","a":"Produkcja dużej liczby drobnych nasion zwiększa szansę, że przynajmniej niektóre z nich trafią w sprzyjające warunki do kiełkowania i przetrwania, mimo że pojedyncze nasiono, mając mało materiałów zapasowych, ma mniejszą szansę na przeżycie niż duże nasiono.","l":4},{"t":"f","q":"Nasiona i owoce umożliwiają roślinom rozprzestrzenianie się i kolonizowanie nowych _______.","a":"terenów","acc":[],"ex":"To dzięki nim gatunek może się rozprzestrzeniać.","l":4},{"t":"tf","q":"Nasiona i owoce umożliwiają roślinom rozprzestrzenianie się i kolonizowanie nowych terenów.","a":true,"ex":"To jedna z kluczowych funkcji ewolucyjnych tych struktur.","l":4},{"t":"tf","q":"Wiele nasion przechodzi przez przewód pokarmowy zwierzęcia bez uszkodzenia i może wykiełkować po wydaleniu w nowym miejscu.","a":true,"ex":"To skuteczny sposób rozsiewania nasion na duże odległości.","l":4},{"t":"s","q":"Dlaczego niedojrzałe owoce są często zielone, twarde i kwaśne?","a":"To zniechęca zwierzęta do zjadania ich, zanim nasiona dojrzeją","ex":"Dopiero dojrzałe owoce zmieniają barwę i smak, sygnalizując gotowość do rozsiewania.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego niedojrzałe owoce są zwykle mniej atrakcyjne dla zwierząt niż owoce dojrzałe.","a":"Niedojrzałe owoce są zwykle twarde, kwaśne i mało pożywne, co zniechęca zwierzęta do ich zjadania, zanim znajdujące się w nich nasiona zdążą w pełni dojrzeć — dopiero dojrzały, słodki i miękki owoc sygnalizuje zwierzętom, że nasiona są gotowe do rozsiania.","l":4},{"t":"f","q":"Dojrzewanie owocu wiąże się zwykle ze zmianą barwy, konsystencji i _______ na słodszy.","a":"smaku","acc":[],"ex":"To sygnał dla zwierząt, że owoc (i nasiona w nim) są gotowe.","l":4},{"t":"tf","q":"Rośliny wytwarzające małe nasiona produkują ich zwykle znacznie więcej niż rośliny z dużymi nasionami.","a":true,"ex":"To rekompensuje mniejszą szansę przetrwania pojedynczego, drobnego nasiona.","l":4},{"t":"o","q":"Podsumuj, dlaczego różnorodność sposobów rozsiewania nasion i owoców jest korzystna dla przetrwania gatunków roślin.","a":"Różnorodne sposoby rozsiewania (przez wiatr, wodę, zwierzęta) zwiększają szansę, że przynajmniej część nasion trafi do miejsc sprzyjających kiełkowaniu i wzrostowi, a także pozwalają roślinom kolonizować nowe, odległe tereny, co zwiększa zasięg występowania i szanse przetrwania całego gatunku.","l":4},{"t":"s","q":"Rośliny mogą rozmnażać się:","a":"Zarówno płciowo, jak i bezpłciowo","ex":"Wiele roślin potrafi rozmnażać się na oba sposoby, w zależności od gatunku i warunków.","l":null},{"t":"s","q":"Rozmnażanie wegetatywne (bezpłciowe) zachodzi z wykorzystaniem:","a":"Organów wegetatywnych rośliny","ex":"Nowa roślina powstaje z fragmentu rośliny macierzystej, np. z łodygi lub korzenia.","l":null},{"t":"tf","q":"Truskawka może rozmnażać się za pomocą rozłogów.","a":true,"ex":"Rozłogi to płożące się pędy, na których powstają nowe rośliny.","l":null},{"t":"s","q":"Ziemniak rozmnaża się wegetatywnie za pomocą:","a":"Bulw","ex":"Bulwa ziemniaka to zgrubiała, podziemna część łodygi wykorzystywana do rozmnażania.","l":null},{"t":"tf","q":"Potomstwo powstałe z rozmnażania wegetatywnego jest zwykle bardzo podobne do rośliny macierzystej.","a":true,"ex":"Nowa roślina powstaje z fragmentu rośliny macierzystej, więc dziedziczy identyczny materiał genetyczny.","l":null},{"t":"s","q":"Rozmnażanie płciowe, w odróżnieniu od wegetatywnego, prowadzi do:","a":"Większego zróżnicowania potomstwa","ex":"Połączenie materiału genetycznego dwóch roślin daje bardziej zróżnicowane potomstwo.","l":null},{"t":"s","q":"Nasiono rośliny jednoliściennej zawiera:","a":"Jeden liścień","ex":"Liczba liścieni w zarodku to podstawa podziału na jedno- i dwuliścienne.","l":5},{"t":"s","q":"Nasiono rośliny dwuliściennej zawiera:","a":"Dwa liścienie","ex":"Dwa liścienie widać wyraźnie np. w kiełkującej fasoli.","l":5},{"t":"tf","q":"Kukurydza i pszenica należą do roślin jednoliściennych.","a":true,"ex":"Trawy, w tym zboża, są klasycznym przykładem roślin jednoliściennych.","l":5},{"t":"s","q":"Do roślin dwuliściennych należy:","a":"Fasola","ex":"Fasola i groch to typowe przykłady roślin dwuliściennych.","l":5},{"t":"f","q":"Rośliny okrytonasienne dzielimy między innymi na jednoliścienne i _______.","a":"dwuliścienne","acc":[],"ex":"To dwa główne podtypy roślin okrytonasiennych.","l":5},{"t":"tf","q":"Rozmnażanie wegetatywne jest korzystne w rolnictwie, bo pozwala szybko namnożyć rośliny o pożądanych cechach.","a":true,"ex":"Dzięki temu rolnik czy ogrodnik ma pewność, że nowa roślina będzie identyczna jak roślina macierzysta.","l":null},{"t":"s","q":"Cebula jest przykładem:","a":"Przekształconej łodygi wykorzystywanej do rozmnażania wegetatywnego","ex":"Cebula to zgrubiała, podziemna łodyga magazynująca substancje zapasowe.","l":null},{"t":"tf","q":"Rozmnażanie wegetatywne nie wymaga udziału kwiatów ani zapylenia.","a":true,"ex":"Nowa roślina powstaje bezpośrednio z fragmentu rośliny macierzystej.","l":null},{"t":"s","q":"Liczba liścieni w zarodku nasienia pozwala odróżnić:","a":"Rośliny jednoliścienne od dwuliściennych","ex":"To podstawa podziału roślin okrytonasiennych na dwie duże grupy.","l":5},{"t":"f","q":"Liść zarodkowy znajdujący się w nasieniu nazywamy _______.","a":"liścieniem","acc":[],"ex":"Liczba liścieni decyduje o tym, czy roślina jest jedno- czy dwuliścienna.","l":5},{"t":"tf","q":"Groch, podobnie jak fasola, jest rośliną dwuliścienną.","a":true,"ex":"Groch i fasola należą do rodziny roślin strączkowych, które są dwuliścienne.","l":5},{"t":"s","q":"Dlaczego rozmnażanie płciowe może być korzystne dla gatunku w zmieniającym się środowisku?","a":"Zwiększa różnorodność genetyczną potomstwa, dając większe szanse na przetrwanie zmian","ex":"Zróżnicowane potomstwo ma większą szansę, że część osobników przetrwa nowe warunki.","l":null},{"t":"s","q":"Rozmnażanie płciowe roślin wymaga:","a":"Połączenia komórki jajowej z komórką plemnikową","ex":"To podstawa rozmnażania płciowego u roślin.","l":null},{"t":"tf","q":"Rozmnażanie płciowe roślin prowadzi do powstania nasion, dzięki połączeniu komórek rozrodczych.","a":true,"ex":"To efekt zapylenia i zapłodnienia.","l":null},{"t":"f","q":"Rozmnażanie płciowe roślin prowadzi do powstania _______, zawierających nowy materiał genetyczny.","a":"nasion","acc":[],"ex":"Nasiona powstają w wyniku zapłodnienia.","l":null},{"t":"s","q":"Rozmnażanie bezpłciowe (wegetatywne) roślin polega na:","a":"Powstaniu nowej rośliny z fragmentu rośliny macierzystej, bez udziału komórek rozrodczych","ex":"To zupełnie inny mechanizm niż rozmnażanie płciowe.","l":null},{"t":"tf","q":"Rozmnażanie wegetatywne nie wymaga połączenia komórek rozrodczych.","a":true,"ex":"Nowa roślina powstaje bezpośrednio z fragmentu rośliny macierzystej.","l":null},{"t":"o","q":"Wyjaśnij główną różnicę między rozmnażaniem płciowym a wegetatywnym u roślin.","a":"Rozmnażanie płciowe wymaga połączenia komórki jajowej z komórką plemnikową (po zapyleniu i zapłodnieniu) i prowadzi do powstania nasion o nowej kombinacji genów, natomiast rozmnażanie wegetatywne (bezpłciowe) polega na powstaniu nowej rośliny z fragmentu rośliny macierzystej (np. rozłogu, bulwy, sadzonki), bez udziału komórek rozrodczych, przez co potomstwo jest genetycznie identyczne z rośliną macierzystą.","l":null},{"t":"s","q":"Zaletą rozmnażania płciowego jest:","a":"Większa różnorodność genetyczna potomstwa","ex":"To pomaga populacji przystosować się do zmian.","l":null},{"t":"tf","q":"Rozmnażanie płciowe zwiększa różnorodność genetyczną potomstwa, co może pomóc w przystosowaniu się do zmieniających się warunków.","a":true,"ex":"To ważna ewolucyjna korzyść tego typu rozmnażania.","l":null},{"t":"s","q":"Zaletą rozmnażania wegetatywnego jest:","a":"Szybkość i pewność uzyskania rośliny o dokładnie tych samych cechach co roślina macierzysta","ex":"To przydatne np. w ogrodnictwie i rolnictwie.","l":null},{"t":"f","q":"Rozmnażanie wegetatywne pozwala szybko uzyskać rośliny identyczne _______ z rośliną macierzystą.","a":"genetycznie","acc":[],"ex":"To dlatego jest chętnie stosowane do namnażania wybranych odmian.","l":null},{"t":"o","q":"Podaj po jednej zalecie rozmnażania płciowego i wegetatywnego u roślin.","a":"Rozmnażanie płciowe: zwiększa różnorodność genetyczną potomstwa, co pomaga przystosować się do zmian środowiska. Rozmnażanie wegetatywne: pozwala szybko i pewnie uzyskać rośliny o dokładnie tych samych, pożądanych cechach co roślina macierzysta.","l":null},{"t":"s","q":"Sadzonka jest przykładem:","a":"Rozmnażania wegetatywnego","ex":"Sadzonka to fragment rośliny wykorzystywany do namnażania.","l":null},{"t":"tf","q":"Sadzonka to fragment rośliny (np. łodygi), z którego może wyrosnąć nowa, samodzielna roślina.","a":true,"ex":"To popularna metoda rozmnażania wegetatywnego w ogrodnictwie.","l":null},{"t":"s","q":"Rozłogi, np. u truskawki, umożliwiają:","a":"Rozmnażanie wegetatywne","ex":"Rozłogi to płożące się pędy, na których powstają nowe rośliny.","l":null},{"t":"f","q":"Truskawka rozmnaża się wegetatywnie za pomocą _______.","a":"rozłogów","acc":[],"ex":"To płożące się pędy tworzące nowe, ukorzenione rośliny.","l":null},{"t":"s","q":"Podział rośliny okrytonasiennej na jednoliścienne i dwuliścienne opiera się głównie na:","a":"Liczbie liścieni w nasieniu","ex":"To podstawowe kryterium tego podziału.","l":5},{"t":"tf","q":"Podział na rośliny jednoliścienne i dwuliścienne opiera się na liczbie liścieni w nasieniu.","a":true,"ex":"To definicyjna cecha obu grup.","l":5},{"t":"o","q":"Wyjaśnij, na czym polega główna różnica między roślinami jednoliściennymi a dwuliściennymi.","a":"Główna różnica dotyczy liczby liścieni w nasieniu: rośliny jednoliścienne mają jeden liścień, a dwuliścienne — dwa. Wiąże się to też z innymi różnicami, np. w unerwieniu liści czy budowie systemu korzeniowego.","l":5},{"t":"s","q":"Liście roślin jednoliściennych mają zwykle unerwienie:","a":"Równoległe","ex":"To typowa cecha liści traw i innych jednoliściennych.","l":5},{"t":"s","q":"Liście roślin dwuliściennych mają zwykle unerwienie:","a":"Siatkowate","ex":"To typowa cecha liści fasoli czy dębu.","l":5},{"t":"tf","q":"Rośliny jednoliścienne mają zwykle liście z unerwieniem równoległym, a dwuliścienne — z unerwieniem siatkowatym.","a":true,"ex":"To jedna z cech pomocnych w rozpoznawaniu obu grup.","l":5},{"t":"f","q":"Liście traw, będących roślinami jednoliściennymi, mają charakterystyczne unerwienie _______.","a":"równoległe","acc":[],"ex":"To ułatwia rozpoznanie traw wśród innych roślin.","l":5},{"t":"s","q":"System korzeniowy roślin jednoliściennych jest zwykle:","a":"Wiązkowy","ex":"Wiele podobnej grubości korzeni wyrasta z podstawy łodygi.","l":5},{"t":"s","q":"System korzeniowy roślin dwuliściennych jest zwykle:","a":"Palowy","ex":"Wyraźnie zaznaczony korzeń główny jest typowy dla dwuliściennych.","l":5},{"t":"tf","q":"Rośliny jednoliścienne mają zwykle system korzeniowy wiązkowy, a dwuliścienne — palowy.","a":true,"ex":"To kolejna cecha odróżniająca obie grupy roślin.","l":5},{"t":"o","q":"Porównaj system korzeniowy i unerwienie liści roślin jednoliściennych i dwuliściennych.","a":"Rośliny jednoliścienne mają zwykle system korzeniowy wiązkowy i liście z unerwieniem równoległym (np. trawy), natomiast rośliny dwuliścienne mają zwykle system korzeniowy palowy i liście z unerwieniem siatkowatym (np. fasola, dąb).","l":5},{"t":"s","q":"Do roślin jednoliściennych zaliczamy m.in.:","a":"Pszenicę, kukurydzę i cebulę","ex":"Wszystkie trzy mają jeden liścień w nasieniu.","l":5},{"t":"tf","q":"Pszenica, kukurydza i cebula są przykładami roślin jednoliściennych.","a":true,"ex":"Wszystkie mają charakterystyczne cechy tej grupy roślin.","l":5},{"t":"s","q":"Do roślin dwuliściennych zaliczamy m.in.:","a":"Fasolę, groch i dąb","ex":"Wszystkie trzy mają dwa liścienie w nasieniu.","l":5},{"t":"f","q":"Fasola, groch i dąb są przykładami roślin _______.","a":"dwuliściennych","acc":[],"ex":"Wszystkie mają dwa liścienie w nasieniu.","l":5},{"t":"o","q":"Podaj po trzy przykłady roślin jednoliściennych i dwuliściennych.","a":"Jednoliścienne: np. pszenica, kukurydza, cebula (lub tulipan, trawa). Dwuliścienne: np. fasola, groch, dąb (lub jabłoń, róża).","l":5},{"t":"s","q":"Kwiaty roślin jednoliściennych mają zwykle liczbę elementów (np. płatków) będącą wielokrotnością:","a":"Trzech","ex":"To typowa cecha budowy kwiatu roślin jednoliściennych, np. tulipana.","l":5},{"t":"tf","q":"Kwiaty roślin jednoliściennych, np. tulipana, mają zwykle liczbę płatków będącą wielokrotnością trzech.","a":true,"ex":"Tulipan ma zwykle 6 płatków, czyli wielokrotność trzech.","l":5},{"t":"s","q":"Kwiaty roślin dwuliściennych mają zwykle liczbę elementów będącą wielokrotnością:","a":"Czterech lub pięciu","ex":"To typowa cecha budowy kwiatu roślin dwuliściennych, np. róży.","l":5},{"t":"f","q":"Kwiaty roślin dwuliściennych mają zwykle liczbę płatków będącą wielokrotnością _______ lub pięciu.","a":"czterech","acc":[],"ex":"To odróżnia je od kwiatów jednoliściennych.","l":5},{"t":"o","q":"Porównaj liczbę elementów kwiatu (np. płatków) typową dla roślin jedno- i dwuliściennych.","a":"U roślin jednoliściennych liczba elementów kwiatu, np. płatków, jest zwykle wielokrotnością trzech (np. 3 lub 6), natomiast u roślin dwuliściennych — wielokrotnością czterech lub pięciu (np. 4, 5 lub ich wielokrotności).","l":5},{"t":"s","q":"Nasienie fasoli (rośliny dwuliściennej) po przekrojeniu ukazuje:","a":"Dwa wyraźne liścienie","ex":"To dobrze widoczna cecha nasienia fasoli.","l":5},{"t":"tf","q":"Po przekrojeniu nasienia fasoli można zobaczyć dwa wyraźne liścienie.","a":true,"ex":"To praktyczny sposób sprawdzenia liczby liścieni.","l":5},{"t":"s","q":"Nasienie kukurydzy (rośliny jednoliściennej) zawiera:","a":"Jeden liścień","ex":"To typowa cecha nasion roślin jednoliściennych.","l":5},{"t":"f","q":"Ziarno zbóż, np. pszenicy, zawiera _______ liścień, typowy dla roślin jednoliściennych.","a":"jeden","acc":[],"ex":"To odróżnia zboża od roślin dwuliściennych, jak fasola.","l":5},{"t":"o","q":"Wyjaśnij, jak można rozpoznać po przekroju nasienia, czy dana roślina jest jedno- czy dwuliścienna.","a":"Przekrawając nasiono, można policzyć liczbę liścieni: jeśli widoczny jest tylko jeden liścień (np. u kukurydzy), roślina jest jednoliścienna, a jeśli widoczne są dwa liścienie (np. u fasoli), roślina jest dwuliścienna.","l":5},{"t":"s","q":"Liście roślin jednoliściennych są zwykle:","a":"Wąskie, wydłużone","ex":"To typowy kształt liścia u traw i innych roślin jednoliściennych.","l":5},{"t":"tf","q":"Liście roślin jednoliściennych, np. traw, są zwykle wąskie i wydłużone.","a":true,"ex":"To odróżnia je od szerszych liści wielu roślin dwuliściennych.","l":5},{"t":"f","q":"Unerwienie równoległe liści jest charakterystyczne dla roślin _______.","a":"jednoliściennych","acc":[],"ex":"To jedna z podstawowych cech tej grupy.","l":5},{"t":"tf","q":"System korzeniowy palowy jest charakterystyczny dla roślin dwuliściennych.","a":true,"ex":"To odróżnia je od wiązkowego systemu korzeniowego jednoliściennych.","l":5},{"t":"o","q":"Podsumuj różnice między roślinami jedno- i dwuliściennymi.","a":"Jednoliścienne: jeden liścień w nasieniu, unerwienie liści równoległe, system korzeniowy wiązkowy, elementy kwiatu w wielokrotności trzech (np. tulipan, trawa). Dwuliścienne: dwa liścienie w nasieniu, unerwienie liści siatkowate, system korzeniowy palowy, elementy kwiatu w wielokrotności czterech lub pięciu (np. fasola, dąb).","l":5},{"t":"s","q":"Rozmnażanie za pomocą cebul, jak u tulipana, jest przykładem:","a":"Rozmnażania wegetatywnego","ex":"Cebula jest zmodyfikowanym organem wykorzystywanym do rozmnażania wegetatywnego.","l":null},{"t":"tf","q":"Cebula tulipana umożliwia roślinie rozmnażanie wegetatywne.","a":true,"ex":"Z cebuli może wyrosnąć nowa, identyczna genetycznie roślina.","l":null},{"t":"s","q":"Rozmnażanie przez kłącza, jak u niektórych paproci czy traw pełzających, jest przykładem:","a":"Rozmnażania wegetatywnego","ex":"Z kłącza mogą wyrastać nowe, samodzielne rośliny.","l":null},{"t":"f","q":"Rośliny mogą rozmnażać się wegetatywnie za pomocą różnych organów, np. rozłogów, bulw, cebul czy _______.","a":"kłączy","acc":[],"ex":"To kolejny organ wykorzystywany do rozmnażania wegetatywnego.","l":null},{"t":"o","q":"Wymień cztery różne organy roślinne wykorzystywane do rozmnażania wegetatywnego, podając przykład rośliny dla każdego.","a":"Rozłogi — np. truskawka; bulwy — np. ziemniak; cebule — np. tulipan lub cebula zwyczajna; kłącza — np. niektóre trawy lub paprocie.","l":null},{"t":"s","q":"Sadzonki wykorzystywane w ogrodnictwie to zwykle:","a":"Fragmenty łodygi lub korzenia, z których wyrasta nowa roślina","ex":"To popularna metoda namnażania roślin ozdobnych i owocowych.","l":null},{"t":"tf","q":"Sadzonki wykorzystywane w ogrodnictwie to zwykle fragmenty łodygi, z których po ukorzenieniu wyrasta nowa roślina.","a":true,"ex":"To skuteczna i szybka metoda rozmnażania wegetatywnego.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego ogrodnicy często wolą rozmnażać wybrane odmiany roślin (np. owocowych) wegetatywnie, a nie z nasion.","a":"Rozmnażanie z nasion (płciowe) prowadzi do potomstwa o nieco innej kombinacji genów, przez co nowa roślina może różnić się cechami (np. smakiem owoców) od rośliny macierzystej. Rozmnażanie wegetatywne (np. przez sadzonki czy szczepienie) daje pewność, że nowa roślina będzie genetycznie identyczna i zachowa pożądane cechy odmiany.","l":null},{"t":"s","q":"Które stwierdzenie o rozmnażaniu roślin jest prawdziwe?","a":"Rośliny mogą rozmnażać się zarówno płciowo, jak i wegetatywnie, zależnie od gatunku i warunków","ex":"To pokazuje elastyczność strategii rozmnażania u roślin.","l":null},{"t":"tf","q":"Wiele roślin może rozmnażać się zarówno płciowo (przez nasiona), jak i wegetatywnie, zależnie od gatunku i warunków.","a":true,"ex":"To zwiększa szanse rośliny na skuteczne rozmnożenie się.","l":null},{"t":"f","q":"Z węzłów rozłogu truskawki mogą wyrastać nowe, ukorzeniające się _______.","a":"rośliny","acc":[],"ex":"To pozwala truskawce szybko się rozprzestrzeniać.","l":null},{"t":"o","q":"Opisz, w jaki sposób rozłogi umożliwiają truskawce rozmnażanie wegetatywne.","a":"Truskawka wytwarza długie, płożące się po ziemi pędy zwane rozłogami; w miejscach zetknięcia z podłożem (w węzłach) rozłogi wypuszczają korzenie, tworząc nową, samodzielną roślinę, genetycznie identyczną z rośliną macierzystą.","l":null},{"t":"tf","q":"Zarówno rozmnażanie płciowe, jak i wegetatywne dają roślinom różne korzyści, ważne dla przetrwania i rozprzestrzeniania się gatunku.","a":true,"ex":"To dlatego wiele roślin potrafi korzystać z obu strategii.","l":null},{"t":"f","q":"Ziemniaki uprawia się zwykle, sadząc _______, a nie wysiewając nasiona.","a":"bulwy","acc":[],"ex":"To zapewnia powtarzalność cech odmiany.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego ziemniaki uprawia się zwykle z bulw, a nie z nasion.","a":"Sadzenie bulw (rozmnażanie wegetatywne) daje pewność, że nowe rośliny będą genetycznie identyczne z rośliną macierzystą i zachowają pożądane cechy odmiany (np. smak, plenność), podczas gdy rozmnażanie z nasion prowadziłoby do większej zmienności cech potomstwa.","l":null},{"t":"tf","q":"Rośliny jednoliścienne mają jeden liścień w nasieniu, a dwuliścienne — dwa.","a":true,"ex":"To definicyjna cecha obu grup.","l":5},{"t":"f","q":"Typowy liść trawy, jako rośliny jednoliściennej, jest wąski i ma unerwienie _______.","a":"równoległe","acc":[],"ex":"To charakterystyczna cecha liści traw.","l":5},{"t":"o","q":"Podaj przykład rośliny uprawnej rozmnażanej głównie z nasion i przykład rozmnażanej głównie wegetatywnie.","a":"Z nasion: np. pszenica lub fasola. Wegetatywnie: np. ziemniak (z bulw) lub truskawka (z rozłogów/sadzonek).","l":null},{"t":"tf","q":"Większa różnorodność genetyczna, wynikająca z rozmnażania płciowego, może pomóc populacji roślin przystosować się do zmieniających się warunków środowiska.","a":true,"ex":"To dlatego rozmnażanie płciowe jest korzystne ewolucyjnie.","l":null},{"t":"f","q":"Brak różnorodności genetycznej w uprawach rozmnażanych wyłącznie wegetatywnie może zwiększać ich podatność na tę samą _______.","a":"chorobę","acc":[],"ex":"To poważne ryzyko w intensywnym rolnictwie.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego uprawianie tylko jednej, genetycznie identycznej odmiany rośliny (rozmnażanej wegetatywnie) może być ryzykowne.","a":"Ponieważ wszystkie rośliny tej odmiany są genetycznie identyczne, są jednakowo podatne na te same choroby i szkodniki — jeśli pojawi się choroba, na którą ta odmiana nie ma odporności, może zniszczyć całą uprawę, podczas gdy większa różnorodność genetyczna dawałaby przynajmniej części roślin szansę na przetrwanie.","l":null},{"t":"tf","q":"Podział na rośliny jedno- i dwuliścienne pomaga klasyfikować rośliny na podstawie kilku powiązanych ze sobą cech budowy.","a":true,"ex":"Cechy te (liczba liścieni, unerwienie, system korzeniowy) często występują razem.","l":5},{"t":"o","q":"Podsumuj, dlaczego znajomość cech jedno- i dwuliściennych (liczba liścieni, unerwienie liści, system korzeniowy) jest przydatna w rozpoznawaniu roślin.","a":"Cechy te są ze sobą powiązane — rozpoznanie jednej z nich (np. unerwienia liścia) pozwala z dużym prawdopodobieństwem przewidzieć pozostałe cechy rośliny (np. typ systemu korzeniowego), co ułatwia szybkie rozpoznawanie i klasyfikowanie nieznanych roślin w terenie.","l":5},{"t":"tf","q":"Znajomość cech charakterystycznych dla roślin jedno- i dwuliściennych ułatwia ich rozpoznawanie w terenie.","a":true,"ex":"To praktyczna umiejętność przydatna np. podczas wycieczek przyrodniczych.","l":5},{"t":"w","q":"mszaki","a":"Niewielkie rośliny bez prawdziwych korzeni, łodyg i liści, rozmnażające się zarodnikami, np. płonnik.","l":0,"k":1},{"t":"w","q":"paprotniki","a":"Rośliny mające korzenie, łodygi i liście, które rozmnażają się zarodnikami, np. paprocie, skrzypy, widłaki.","l":1,"k":1},{"t":"w","q":"rośliny nagozalążkowe","a":"Rośliny, których nasiona leżą nagie na łuskach szyszek, np. sosna, świerk.","l":2,"k":1},{"t":"w","q":"rośliny okrytozalążkowe","a":"Rośliny wytwarzające kwiaty, a nasiona ukryte w owocach.","l":3,"k":1},{"t":"w","q":"kwiat","a":"Organ rozmnażania płciowego roślin okrytozalążkowych.","l":3,"k":1},{"t":"w","q":"zapylanie","a":"Przeniesienie pyłku z pręcika na znamię słupka.","l":3,"k":1},{"t":"w","q":"zapłodnienie","a":"Połączenie komórki rozrodczej męskiej z żeńską, po którym powstaje zarodek.","l":3,"k":1},{"t":"w","q":"nasiono","a":"Struktura zawierająca zarodek rośliny wraz z zapasem pokarmu.","l":4,"k":1},{"t":"w","q":"owoc","a":"Część rośliny okrytozalążkowej rozwijająca się z zalążni, otaczająca nasiona.","l":4,"k":1},{"t":"w","q":"kiełkowanie","a":"Początek rozwoju rośliny z nasienia, gdy zaczyna ono rosnąć.","l":4,"k":1},{"t":"w","q":"roślina wiatropylna","a":"Roślina, której pyłek jest przenoszony przez wiatr.","l":3,"k":1},{"t":"w","q":"roślina owadopylna","a":"Roślina, której pyłek jest przenoszony przez owady.","l":3,"k":1},{"t":"w","q":"szyszka","a":"Organ rozmnażania roślin nagozalążkowych zbudowany z łusek, na których leżą zalążki lub nasiona.","l":2,"k":1},{"t":"w","q":"rozsiewanie nasion","a":"Przenoszenie nasion lub owoców z dala od rośliny macierzystej, np. przez wiatr, wodę lub zwierzęta.","l":4,"k":1}],"lessons":["Mchy","Paprotniki","Nagonasienne","Okrytonasienne","Rozprzestrzenianie się roślin okrytonasiennych","Znaczenie i przegląd roślin okrytonasiennych"]}],"geografia":[{"id":"g1","title":"Posługuję się mapą","icon":"🧭","lessons":["Mapa źródłem informacji","Skala na mapach i planach","Ukształtowanie powierzchni na mapie","Południki i równoleżniki","Kontynenty i oceany"],"q":[{"t":"s","q":"Skala mapy 1:100 000 oznacza, że:","a":"1 cm na mapie odpowiada 100 000 cm (1 km) w terenie","ex":"Skala liczbowa mówi, ile razy zmniejszono odległości w terenie, by zmieściły się na mapie.","l":1},{"t":"tf","q":"Na mapach fizycznych kolorem zielonym najczęściej oznacza się niziny, a brązowym — góry.","a":true,"ex":"To standardowa kolorystyka hipsometryczna używana na mapach fizycznych.","l":0},{"t":"s","q":"Legenda mapy to:","a":"Zbiór znaków (symboli) użytych na mapie wraz z ich objaśnieniem","ex":"Dzięki legendzie wiemy, co oznaczają poszczególne symbole i kolory na mapie.","l":0},{"t":"s","q":"Kierunek północny na typowej mapie geograficznej znajduje się:","a":"U góry mapy","ex":"Standardowo mapy są zorientowane tak, że góra mapy wskazuje północ.","l":0},{"t":"f","q":"Znaki umowne przedstawiające obiekty terenowe na mapie nazywamy znakami _______.","a":"topograficznymi","acc":["umownymi"],"ex":"Znaki topograficzne pozwalają w prosty sposób pokazać np. drogi, lasy czy rzeki.","l":0},{"t":"tf","q":"Kompas i busola pomagają w wyznaczaniu kierunków w terenie względem stron świata.","a":true,"ex":"Igła kompasu wskazuje kierunek północny magnetyczny, co ułatwia orientację.","l":0},{"t":"s","q":"Poziomice na mapie to linie łączące punkty o:","a":"Tej samej wysokości nad poziomem morza","ex":"Poziomice (izohipsy) pokazują rzeźbę terenu — im gęściej ułożone, tym bardziej strome zbocze.","l":2},{"t":"s","q":"W skali 1:50 000, odcinkowi 2 cm na mapie odpowiada w terenie:","a":"1 km","ex":"2 cm × 50 000 = 100 000 cm = 1000 m = 1 km.","l":1},{"t":"tf","q":"Azymut to kąt mierzony od kierunku północnego, zgodnie z ruchem wskazówek zegara, do wybranego kierunku.","a":true,"ex":"Azymut ułatwia precyzyjne określanie kierunku marszu w terenie.","l":0},{"t":"s","q":"Plan miasta różni się od mapy geograficznej głównie tym, że:","a":"Obejmuje mały obszar i jest bardzo szczegółowy","ex":"Plan pokazuje niewielki obszar (np. jedno miasto) w dużym przybliżeniu, z dużą liczbą szczegółów.","l":0},{"t":"s","q":"Skala mianowana zapisana jako „1 cm – 5 km” oznacza, że:","a":"1 cm na mapie odpowiada 5 km w terenie","ex":"Skala mianowana od razu podaje, ile jednostek w terenie odpowiada 1 cm na mapie.","l":1},{"t":"tf","q":"Im większa skala mapy (mniejszy mianownik), tym więcej szczegółów można na niej przedstawić.","a":true,"ex":"Mapa w skali 1:10 000 pokaże znacznie więcej detali niż mapa w skali 1:1 000 000.","l":1},{"t":"f","q":"Umowna linia na globusie, dzieląca Ziemię na półkulę północną i południową, to _______.","a":"równik","acc":[],"ex":"Równik to najdłuższy równoleżnik, wyznaczający szerokość geograficzną 0°.","l":3},{"t":"s","q":"Główny południk zerowy przechodzi przez:","a":"Greenwich (Londyn)","ex":"Południk zerowy, zwany też południkiem Greenwich, jest punktem odniesienia dla długości geograficznej.","l":3,"k":1},{"t":"tf","q":"Na mapie topograficznej las zwykle oznaczany jest kolorem zielonym.","a":true,"ex":"To jeden z podstawowych, powszechnie stosowanych kolorów na mapach.","l":0},{"t":"s","q":"Do samodzielnego wyznaczenia trasy w terenie przydatne jest:","a":"Użycie mapy, kompasu i punktów orientacyjnych","ex":"Połączenie mapy, kompasu i obserwacji terenu daje najbardziej niezawodną orientację.","l":0},{"t":"s","q":"Odległość rzeczywistą w terenie oblicza się na podstawie:","a":"Odległości na mapie pomnożonej przez podziałkę skali","ex":"Znając skalę mapy, można przeliczyć zmierzoną na niej odległość na odległość rzeczywistą.","l":1},{"t":"tf","q":"Warstwica (poziomica) o wartości 200 m oznacza, że wszystkie punkty na tej linii leżą na wysokości 200 m n.p.m.","a":true,"ex":"Poziomice łączą punkty o jednakowej wysokości nad poziomem morza.","l":2},{"t":"s","q":"Busola różni się od zwykłego kompasu tym, że:","a":"Posiada dodatkowo obracaną tarczę z podziałką kątową, ułatwiającą pomiar azymutu","ex":"Dodatkowa podziałka kątowa busoli pozwala precyzyjnie wyznaczyć azymut marszu.","l":0},{"t":"s","q":"Mapa to:","a":"Zmniejszony, uproszczony obraz terenu przedstawiony za pomocą znaków umownych na płaszczyźnie","ex":"To podstawowa definicja mapy.","l":0},{"t":"tf","q":"Mapa przedstawia teren w sposób zmniejszony i uproszczony, za pomocą znaków umownych.","a":true,"ex":"To odróżnia mapę od np. zwykłej fotografii terenu.","l":0},{"t":"f","q":"Stosunek długości odcinka na mapie do odpowiadającej mu długości w terenie nazywamy _______ mapy.","a":"skalą","acc":[],"ex":"Skala informuje, ile razy teren został zmniejszony na mapie.","l":1},{"t":"s","q":"Skala liczbowa mapy, np. 1:100 000, oznacza, że:","a":"1 cm na mapie odpowiada 100 000 cm w terenie","ex":"To standardowy sposób interpretacji skali liczbowej.","l":1},{"t":"tf","q":"Skala 1:100 000 oznacza, że 1 cm na mapie odpowiada 100 000 cm, czyli 1 km w terenie.","a":true,"ex":"100 000 cm to dokładnie 1 km.","l":1},{"t":"o","q":"Wyjaśnij, co oznacza skala mapy 1:50 000, i oblicz, ile kilometrów w terenie odpowiada 2 cm na tej mapie.","a":"Skala 1:50 000 oznacza, że 1 cm na mapie odpowiada 50 000 cm, czyli 500 m w terenie. Zatem 2 cm na tej mapie odpowiada 1000 m, czyli 1 km w terenie.","l":1,"k":1},{"t":"s","q":"Mapa w skali 1:25 000 jest mapą:","a":"Bardziej szczegółową niż mapa w skali 1:500 000","ex":"Mniejszy mianownik skali oznacza większą szczegółowość.","l":1},{"t":"tf","q":"Im mniejszy mianownik skali (np. 1:10 000), tym mapa jest bardziej szczegółowa.","a":true,"ex":"To podstawowa zasada dotycząca skali map.","l":1},{"t":"s","q":"Skala liniowa na mapie przedstawiona jest w postaci:","a":"Podziałki z zaznaczonymi odległościami","ex":"To ułatwia bezpośredni pomiar odległości linijką.","l":1},{"t":"f","q":"Skala przedstawiona w postaci podziałki z zaznaczonymi odległościami nazywana jest skalą _______.","a":"liniową","acc":[],"ex":"To alternatywa dla skali liczbowej i mianowanej.","l":1},{"t":"s","q":"Zbiór znaków umownych wraz z ich objaśnieniem, umieszczony zwykle na brzegu mapy, nazywamy:","a":"Legendą mapy","ex":"Legenda pomaga poprawnie odczytać treść mapy.","l":0},{"t":"tf","q":"Legenda mapy wyjaśnia znaczenie znaków umownych użytych na danej mapie.","a":true,"ex":"Bez legendy trudno byłoby zrozumieć symbole na mapie.","l":0},{"t":"o","q":"Wyjaśnij, do czego służy legenda mapy.","a":"Legenda mapy zawiera objaśnienia znaków umownych zastosowanych na mapie (np. symboli lasów, rzek, dróg czy miast), dzięki czemu można poprawnie odczytać informacje przedstawione na mapie.","l":0},{"t":"s","q":"Znaki umowne na mapie służą do:","a":"Przedstawienia obiektów terenowych w uproszczony, jednolity sposób","ex":"Dzięki nim mapa jest czytelna i uniwersalna.","l":0},{"t":"tf","q":"Znaki umowne to uproszczone symbole przedstawiające na mapie różne obiekty, np. lasy, rzeki czy drogi.","a":true,"ex":"Ich znaczenie wyjaśnia legenda mapy.","l":0},{"t":"s","q":"Główne kierunki geograficzne to:","a":"Północ, południe, wschód i zachód","ex":"To cztery podstawowe kierunki wykorzystywane w orientacji w terenie.","l":0},{"t":"f","q":"Cztery główne kierunki geograficzne to północ, południe, wschód i _______.","a":"zachód","acc":[],"ex":"To podstawa orientacji przestrzennej.","l":0},{"t":"tf","q":"Na większości map, jeśli nie zaznaczono inaczej, góra mapy odpowiada kierunkowi północnemu.","a":true,"ex":"Wyjątki są zawsze wyraźnie oznaczone strzałką kierunku północnego.","l":0},{"t":"s","q":"Przyrząd służący do wyznaczania kierunków geograficznych w terenie to:","a":"Kompas (busola)","ex":"Kompas wskazuje kierunek północny dzięki igle magnetycznej.","l":0},{"t":"f","q":"Igła magnetyczna kompasu zawsze wskazuje kierunek _______.","a":"północny","acc":[],"ex":"To podstawowa zasada działania kompasu.","l":0},{"t":"o","q":"Wyjaśnij, w jaki sposób kompas pomaga zorientować mapę względem stron świata.","a":"Kompas wskazuje kierunek północny dzięki igle magnetycznej — obracając mapę tak, aby jej górna krawędź (oznaczająca północ) była skierowana zgodnie ze wskazaniem igły kompasu, orientujemy mapę zgodnie z rzeczywistymi stronami świata w terenie.","l":0},{"t":"s","q":"Azymut to:","a":"Kąt mierzony od kierunku północnego zgodnie z ruchem wskazówek zegara do wybranego kierunku","ex":"Azymut pomaga precyzyjnie określić kierunek marszu.","l":0},{"t":"tf","q":"Azymut jest kątem mierzonym od kierunku północnego, zgodnie z ruchem wskazówek zegara.","a":true,"ex":"To podstawowa definicja azymutu.","l":0},{"t":"s","q":"Azymut mierzy się w:","a":"Stopniach","ex":"Azymut to miara kąta, więc wyrażamy go w stopniach.","l":0},{"t":"f","q":"Azymut wyrażamy w _______, w zakresie od 0 do 360.","a":"stopniach","acc":[],"ex":"Pełny obrót wynosi 360 stopni.","l":0},{"t":"o","q":"Wyjaśnij, czym jest azymut i do czego służy w terenie.","a":"Azymut to kąt, mierzony w stopniach od kierunku północnego zgodnie z ruchem wskazówek zegara, wskazujący kierunek do wybranego punktu w terenie — jest wykorzystywany np. podczas orientacji w terenie z użyciem kompasu, gdy chcemy dotrzeć w konkretnym kierunku.","l":0},{"t":"s","q":"Wysokość bezwzględna punktu to:","a":"Wysokość mierzona od poziomu morza","ex":"To standardowy sposób podawania wysokości, np. n.p.m.","l":2},{"t":"tf","q":"Wysokość bezwzględna jest mierzona od poziomu morza.","a":true,"ex":"Stąd skrót n.p.m. — nad poziomem morza.","l":2},{"t":"s","q":"Wysokość względna to:","a":"Różnica wysokości między dwoma punktami w terenie","ex":"To pomaga ocenić np. wysokość wzniesienia nad doliną.","l":2},{"t":"f","q":"Różnicę wysokości między dwoma punktami w terenie nazywamy wysokością _______.","a":"względną","acc":[],"ex":"To odróżnia ją od wysokości bezwzględnej.","l":2},{"t":"o","q":"Wyjaśnij różnicę między wysokością bezwzględną a względną, podając przykład obliczenia.","a":"Wysokość bezwzględna to wysokość punktu mierzona od poziomu morza, natomiast wysokość względna to różnica wysokości między dwoma punktami w terenie. Na przykład, jeśli szczyt góry ma wysokość bezwzględną 800 m n.p.m., a dolina u jej podnóża 300 m n.p.m., to wysokość względna szczytu nad doliną wynosi 800 minus 300, czyli 500 m.","l":2,"k":1},{"t":"s","q":"Linie na mapie łączące punkty o tej samej wysokości nad poziomem morza to:","a":"Poziomice (izohipsy)","ex":"Poziomice pomagają odczytać ukształtowanie terenu z mapy.","l":2},{"t":"tf","q":"Poziomice łączą na mapie punkty o tej samej wysokości nad poziomem morza.","a":true,"ex":"To pozwala odwzorować na płaskiej mapie ukształtowanie terenu.","l":2},{"t":"s","q":"Im poziomice na mapie są gęściej rozmieszczone, tym teren jest:","a":"Bardziej stromy","ex":"Gęste poziomice oznaczają szybką zmianę wysokości na małej odległości.","l":2},{"t":"f","q":"Gęste rozmieszczenie poziomic na mapie oznacza teren bardziej _______.","a":"stromy","acc":[],"ex":"To odwrotna zależność niż przy rzadko rozmieszczonych poziomicach.","l":2},{"t":"o","q":"Wyjaśnij, jak na podstawie rozmieszczenia poziomic można ocenić nachylenie terenu.","a":"Im gęściej rozmieszczone są poziomice (linie łączące punkty o tej samej wysokości), tym bardziej stromy jest dany fragment terenu; im rzadziej rozmieszczone, tym teren jest bardziej płaski, łagodnie nachylony.","l":2},{"t":"s","q":"Plan miejscowości różni się od mapy tym, że:","a":"Przedstawia mały obszar w dużej skali, ze szczegółami","ex":"Plan skupia się na niewielkim, szczegółowo pokazanym obszarze.","l":0},{"t":"tf","q":"Plan przedstawia niewielki obszar (np. miejscowość) w dużej skali i ze szczegółami.","a":true,"ex":"To odróżnia plan od map obejmujących duże obszary.","l":0},{"t":"s","q":"Które urządzenie elektroniczne wykorzystuje sygnały z satelitów do ustalenia dokładnej pozycji użytkownika?","a":"GPS (nawigacja satelitarna)","ex":"GPS jest współcześnie powszechnie wykorzystywany do nawigacji.","l":0},{"t":"f","q":"System nawigacji satelitarnej, ustalający dokładną pozycję na Ziemi, nazywamy _______.","a":"GPS-em","acc":[],"ex":"GPS wykorzystuje sygnały z satelitów.","l":0},{"t":"tf","q":"GPS wykorzystuje sygnały z satelitów krążących wokół Ziemi do ustalenia dokładnej pozycji użytkownika.","a":true,"ex":"To technologia szeroko wykorzystywana m.in. w nawigacji samochodowej.","l":0},{"t":"o","q":"Wyjaśnij, na czym polega działanie systemu GPS.","a":"System GPS wykorzystuje sygnały wysyłane przez satelity krążące wokół Ziemi; odbiornik GPS oblicza swoją odległość od kilku satelitów jednocześnie, co pozwala precyzyjnie określić jego położenie na powierzchni Ziemi.","l":0},{"t":"s","q":"Aby zorientować mapę w terenie bez kompasu, można wykorzystać:","a":"Charakterystyczne obiekty terenowe widoczne zarówno na mapie, jak i w terenie","ex":"To metoda orientacji mapy oparta na porównaniu z rzeczywistym terenem.","l":0},{"t":"tf","q":"Mapę można zorientować w terenie, porównując charakterystyczne obiekty widoczne w terenie z ich odpowiednikami na mapie.","a":true,"ex":"To alternatywa dla orientowania mapy za pomocą kompasu.","l":0},{"t":"f","q":"Kierunki geograficzne, zgodnie z ruchem wskazówek zegara od północy, to: północ, wschód, południe i _______.","a":"zachód","acc":[],"ex":"To zamyka pełny obrót czterech głównych kierunków.","l":0},{"t":"s","q":"Znak umowny lasu na mapie topograficznej jest zwykle przedstawiony kolorem:","a":"Zielonym","ex":"Kolor zielony intuicyjnie kojarzy się z roślinnością.","l":0},{"t":"tf","q":"Lasy na mapach topograficznych są zwykle oznaczane kolorem zielonym.","a":true,"ex":"To powszechna konwencja kartograficzna.","l":0},{"t":"s","q":"Znak umowny rzeki lub jeziora na mapie jest zwykle przedstawiony kolorem:","a":"Niebieskim","ex":"Kolor niebieski kojarzy się z wodą.","l":0},{"t":"f","q":"Obiekty wodne, jak rzeki czy jeziora, są na mapach zwykle oznaczane kolorem _______.","a":"niebieskim","acc":[],"ex":"To ułatwia szybkie rozpoznanie wód na mapie.","l":0},{"t":"o","q":"Podaj przykład dwóch znaków umownych stosowanych na mapach i wyjaśnij, co oznaczają.","a":"Np. zielony kolor lub odpowiedni symbol oznacza las, a niebieska linia lub plama oznacza rzekę lub jezioro.","l":0},{"t":"s","q":"Skala mianowana mapy zapisywana jest np. jako:","a":"„1 cm – 1 km”","ex":"To słowny zapis relacji między mapą a terenem.","l":0},{"t":"tf","q":"Skala mianowana informuje wprost, ile jednostek w terenie odpowiada jednej jednostce długości na mapie, np. „1 cm – 1 km”.","a":true,"ex":"To jeden z trzech sposobów zapisu skali mapy.","l":0},{"t":"s","q":"Który rodzaj skali pozwala łatwo zmierzyć odległość na mapie linijką, bez przeliczania?","a":"Skala liniowa (podziałka)","ex":"Podziałka bezpośrednio pokazuje odległości w terenie.","l":0},{"t":"f","q":"Skala w postaci podziałki, ułatwiająca bezpośredni pomiar odległości na mapie, to skala _______.","a":"liniowa","acc":[],"ex":"To najwygodniejszy rodzaj skali do bezpośredniego pomiaru.","l":0},{"t":"o","q":"Wyjaśnij, jak można zmierzyć odległość między dwoma miejscowościami na mapie za pomocą skali liniowej.","a":"Za pomocą linijki mierzymy odległość między miejscowościami na mapie w centymetrach, a następnie porównujemy zmierzoną długość z podziałką skali liniowej, która bezpośrednio wskazuje, ile kilometrów odpowiada danej długości na mapie.","l":0},{"t":"tf","q":"Plan miejscowości, w przeciwieństwie do mapy ogólnogeograficznej dużego obszaru, pokazuje szczegóły, jak pojedyncze ulice i budynki.","a":true,"ex":"To dlatego plany są przydatne do poruszania się po mieście.","l":0},{"t":"s","q":"Współrzędne geograficzne (szerokość i długość geograficzna):","a":"Pozwalają precyzyjnie określić położenie dowolnego punktu na Ziemi","ex":"To uniwersalny system określania położenia na całej Ziemi.","l":3},{"t":"f","q":"Szerokość i długość geograficzna razem tworzą _______ geograficzne, precyzyjnie określające położenie punktu na Ziemi.","a":"współrzędne","acc":[],"ex":"Dzięki nim każdy punkt na Ziemi ma jednoznaczny „adres”.","l":3},{"t":"o","q":"Wyjaśnij, do czego służą współrzędne geograficzne (szerokość i długość geograficzna).","a":"Współrzędne geograficzne, czyli szerokość i długość geograficzna, pozwalają precyzyjnie i jednoznacznie określić położenie dowolnego punktu na powierzchni Ziemi, niezależnie od tego, w jakim kraju czy na jakim kontynencie się znajduje.","l":3},{"t":"tf","q":"Mapa jest płaskim przedstawieniem terenu, natomiast globus jest trójwymiarowym modelem całej kuli ziemskiej.","a":true,"ex":"Globus wiernie oddaje kulisty kształt Ziemi.","l":3},{"t":"s","q":"Zaletą globusa w porównaniu z mapą świata jest:","a":"Wierne odwzorowanie kształtów i proporcji kontynentów, bez zniekształceń","ex":"Globus, mając kształt kuli, nie wymaga zniekształcania powierzchni Ziemi.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego mapy świata (płaskie) zawsze wprowadzają pewne zniekształcenia w porównaniu z globusem.","a":"Ponieważ Ziemia ma kształt zbliżony do kuli, a mapa jest płaska, nie da się przedstawić powierzchni kuli na płaszczyźnie bez żadnych zniekształceń — zawsze dochodzi do pewnych zniekształceń kształtu, powierzchni lub odległości, podczas gdy globus, mając kształt zbliżony do rzeczywistej Ziemi, wiernie oddaje proporcje kontynentów.","l":3},{"t":"tf","q":"Kierunki pośrednie, takie jak północny-wschód czy południowy-zachód, powstają z połączenia dwóch głównych kierunków geograficznych.","a":true,"ex":"To ułatwia dokładniejsze określanie kierunków w terenie.","l":0},{"t":"s","q":"Jeśli idziemy dokładnie w kierunku azymutu 90°, to poruszamy się w stronę:","a":"Wschodnią","ex":"90° to ćwierć pełnego obrotu od północy, czyli wschód.","l":0},{"t":"f","q":"Azymut 0° (lub 360°) oznacza kierunek _______.","a":"północny","acc":[],"ex":"To punkt odniesienia dla wszystkich innych azymutów.","l":0},{"t":"o","q":"Wyjaśnij, jaki kierunek oznacza azymut 180°, i uzasadnij odpowiedź.","a":"Azymut 180° oznacza kierunek południowy, ponieważ azymut liczony jest od północy (0°) zgodnie z ruchem wskazówek zegara, a 180° to dokładnie połowa pełnego obrotu (360°), co odpowiada kierunkowi przeciwnemu do północy, czyli południu.","l":0},{"t":"s","q":"Mapy turystyczne są szczególnie przydatne do:","a":"Planowania tras wycieczek pieszych lub rowerowych","ex":"Zawierają informacje przydatne turystom, np. szlaki i punkty widokowe.","l":0},{"t":"tf","q":"Mapy turystyczne są szczególnie przydatne do planowania tras pieszych lub rowerowych wycieczek.","a":true,"ex":"Zawierają m.in. oznaczenia szlaków turystycznych.","l":0},{"t":"s","q":"Legenda mapy turystycznej zawiera zwykle symbole oznaczające m.in.:","a":"Szlaki turystyczne, punkty widokowe czy schroniska","ex":"To typowa zawartość legendy mapy turystycznej.","l":0},{"t":"f","q":"Legenda mapy turystycznej wyjaśnia symbole np. szlaków, punktów widokowych i _______.","a":"schronisk","acc":[],"ex":"To przydatne informacje dla turystów górskich.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego przed wyruszeniem na wycieczkę w nieznany teren warto zabrać ze sobą mapę i kompas (lub sprawne urządzenie GPS).","a":"Mapa i kompas (lub GPS) pozwalają zorientować się w terenie, zaplanować bezpieczną trasę, ocenić odległości i ukształtowanie terenu oraz odnaleźć drogę powrotną, co jest szczególnie ważne w nieznanym terenie, gdzie łatwo się zgubić.","l":0},{"t":"tf","q":"Im większa skala mapy (czyli mniejszy mianownik, np. 1:10 000), tym więcej szczegółów można na niej przedstawić.","a":true,"ex":"To dlatego plany miejscowości mają dużą skalę.","l":1},{"t":"s","q":"Mapa ogólnogeograficzna w małej skali (np. 1:1 000 000):","a":"Obejmuje duży obszar, ale z mniejszą liczbą szczegółów","ex":"Mała skala (duży mianownik) oznacza mniejszą szczegółowość, ale większy obszar.","l":1},{"t":"o","q":"Podsumuj, dlaczego wybór odpowiedniej skali mapy zależy od celu jej wykorzystania.","a":"Mapa w dużej skali (mały mianownik) pokazuje niewielki obszar bardzo szczegółowo, co jest przydatne np. do planowania trasy pieszej wycieczki, natomiast mapa w małej skali (duży mianownik) pokazuje duży obszar, ale z mniejszą liczbą szczegółów, co jest przydatne np. do zaplanowania podróży między odległymi miastami lub krajami.","l":1},{"t":"tf","q":"Wybór odpowiedniej skali mapy zależy od tego, jak duży obszar chcemy przedstawić i jak dużo szczegółów potrzebujemy.","a":true,"ex":"To praktyczna zasada przy wyborze mapy do konkretnego celu.","l":1},{"t":"s","q":"Do elementów krajobrazu przekształconego przez człowieka (kulturowego) zaliczamy:","a":"Miasta, drogi i pola uprawne","ex":"Krajobraz kulturowy to taki, który człowiek zmienił swoją działalnością.","l":0},{"t":"tf","q":"Obserwacje pogody prowadzone w terenie obejmują m.in. pomiar temperatury, opadów i kierunku wiatru.","a":true,"ex":"To podstawowe elementy pogody notowane np. w szkolnym kalendarzu pogody.","l":0},{"t":"s","q":"Wiatrowskaz (chorągiewka lub wiatromierz) służy do określania:","a":"Kierunku, z którego wieje wiatr","ex":"Wiatrowskaz obraca się i ustawia zgodnie z kierunkiem wiatru.","l":0},{"t":"f","q":"Przyrząd do pomiaru temperatury powietrza to _______.","a":"termometr","acc":[],"ex":"Termometr mierzy temperaturę, wykorzystując np. rozszerzalność cieczy.","l":0},{"t":"s","q":"Skala Beauforta służy do określania:","a":"Siły wiatru","ex":"Skala Beauforta ocenia siłę wiatru na podstawie obserwowanych skutków, np. ruchu drzew.","l":0},{"t":"s","q":"Deszczomierz to przyrząd służący do:","a":"Pomiaru ilości opadów atmosferycznych","ex":"Deszczomierz zbiera wodę opadową i pozwala odczytać jej ilość, np. w milimetrach.","l":0},{"t":"s","q":"Orientacja w terenie bez mapy i kompasu może opierać się m.in. na:","a":"Położeniu Słońca w ciągu dnia","ex":"Rano Słońce jest mniej więcej na wschodzie, w południe na południu, a wieczorem na zachodzie.","l":0},{"t":"tf","q":"Mech na drzewach rośnie zazwyczaj częściej po stronie północnej pnia.","a":true,"ex":"Strona północna jest zwykle bardziej wilgotna i mniej nasłoneczniona, co sprzyja mchowi.","l":0},{"t":"f","q":"Systematyczny zapis obserwacji pogody w danym miejscu i czasie nazywamy _______ pogody.","a":"kalendarzem","acc":[],"ex":"Kalendarz pogody pozwala zauważyć powtarzające się wzorce i zmiany w czasie.","l":0},{"t":"s","q":"Barometr to przyrząd służący do pomiaru:","a":"Ciśnienia atmosferycznego","ex":"Zmiany ciśnienia atmosferycznego często zapowiadają zmianę pogody.","l":0},{"t":"tf","q":"Krajobraz miejski różni się od krajobrazu wiejskiego m.in. gęstością zabudowy.","a":true,"ex":"W miastach budynki i infrastruktura zajmują znacznie większą część powierzchni niż na wsi.","l":0},{"t":"s","q":"Higrometr służy do pomiaru:","a":"Wilgotności powietrza","ex":"Higrometr pokazuje, ile pary wodnej znajduje się w powietrzu.","l":0},{"t":"s","q":"Obserwacja fenologiczna (np. notowanie, kiedy zakwitają drzewa) pomaga śledzić:","a":"Sezonowe zjawiska przyrodnicze w ciągu roku","ex":"Fenologia bada zjawiska powtarzające się w rytmie pór roku, np. kwitnienie roślin czy przyloty ptaków.","l":0},{"t":"s","q":"Podstawowe elementy, jakie powinna zawierać dobra, czytelna mapa, to:","a":"Tytuł, skala, legenda i treść","ex":"Bez każdego z tych elementów mapa byłaby trudna do poprawnego odczytania.","l":0},{"t":"tf","q":"Dobra, czytelna mapa powinna zawierać tytuł, skalę, legendę, treść oraz siatkę kartograficzną.","a":true,"ex":"To główne elementy mapy.","l":0},{"t":"o","q":"Wymień podstawowe elementy mapy.","a":"Siatka kartograficzna, tytuł, legenda, treść i skala.","l":0},{"t":"s","q":"Znaki na mapie przedstawiające konkretne miejsca, np. przełęcze lub miasta, nazywamy znakami:","a":"Punktowymi","ex":"Odpowiadają one pojedynczym, konkretnym lokalizacjom.","l":0},{"t":"f","q":"Znaki na mapie przedstawiające konkretne miejsca (np. miasta, przełęcze) nazywamy znakami _______.","a":"punktowymi","acc":[],"ex":"To jeden z trzech podstawowych typów znaków kartograficznych.","l":0},{"t":"s","q":"Znaki na mapie przedstawiające obiekty wydłużone, np. rzeki, kanały czy granice państw, nazywamy znakami:","a":"Liniowymi","ex":"Mają one wyraźny, wydłużony kształt.","l":0},{"t":"tf","q":"Rzeki, kanały i granice państw są na mapach przedstawiane za pomocą znaków liniowych.","a":true,"ex":"To typowy sposób przedstawiania obiektów wydłużonych na mapie.","l":0},{"t":"s","q":"Znaki na mapie przedstawiające większe obszary, np. jeziora czy bagna, nazywamy znakami:","a":"Powierzchniowymi","ex":"Pokrywają one na mapie pewien obszar, a nie tylko punkt czy linię.","l":0},{"t":"f","q":"Jeziora i bagna są na mapach przedstawiane za pomocą znaków _______.","a":"powierzchniowych","acc":[],"ex":"Znaki te pokrywają cały obszar danego obiektu.","l":0},{"t":"o","q":"Wyjaśnij różnicę między znakami punktowymi, liniowymi i powierzchniowymi na mapie, podając przykład dla każdego typu.","a":"Znaki punktowe przedstawiają konkretne miejsca, np. miasta lub przełęcze; znaki liniowe przedstawiają obiekty wydłużone, np. rzeki, kanały lub granice państw; znaki powierzchniowe przedstawiają większe obszary, np. jeziora lub bagna.","l":0},{"t":"s","q":"Aby obliczyć odległość w terenie na podstawie mapy w skali 1:2 500 000, jeśli odległość na mapie wynosi 5 cm, należy:","a":"Pomnożyć 5 cm przez 2 500 000, a wynik zamienić na kilometry","ex":"To standardowy sposób przeliczania odległości ze skali mapy.","l":1},{"t":"o","q":"Oblicz rzeczywistą odległość w terenie, jeśli na mapie w skali 1:2 500 000 odległość między dwiema miejscowościami wynosi 5 cm. Pokaż obliczenia.","a":"1 cm na mapie odpowiada 2 500 000 cm w terenie, czyli 25 km. Przy odległości 5 cm na mapie: 5 × 25 km = 125 km. Rzeczywista odległość w terenie wynosi więc 125 km.","l":1},{"t":"s","q":"Mapa w skali 1:25 000 (np. mapa Tatr) oznacza, że:","a":"1 cm na mapie odpowiada 25 000 cm, czyli 250 m w terenie","ex":"To dość szczegółowa, turystyczna skala mapy.","l":1},{"t":"tf","q":"Skala 1:25 000 oznacza, że 1 cm na mapie odpowiada 250 metrom w terenie.","a":true,"ex":"25 000 cm to dokładnie 250 m.","l":1},{"t":"s","q":"Skalę zapisaną jako podziałkę liniową można zamienić na skalę:","a":"Liczbową","ex":"Wszystkie trzy rodzaje skali są ze sobą wzajemnie przeliczalne.","l":1},{"t":"o","q":"Zamień skalę mianowaną „1 cm – 5 km” na skalę liczbową.","a":"5 km to 500 000 cm, więc skala liczbowa to 1:500 000.","l":1},{"t":"s","q":"Skala mianowana „1 cm – 100 m” odpowiada skali liczbowej:","a":"1:10 000","ex":"100 m to 10 000 cm.","l":1},{"t":"tf","q":"Skala mianowana „1 cm – 100 m” odpowiada skali liczbowej 1:10 000.","a":true,"ex":"To wynik zamiany metrów na centymetry.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego przed wyruszeniem w teren warto zapoznać się z legendą używanej mapy.","a":"Legenda wyjaśnia znaczenie poszczególnych znaków użytych na mapie, dzięki czemu można poprawnie odczytać, co przedstawiają poszczególne symbole (np. rodzaj drogi, rzeki czy lasu), co jest niezbędne do prawidłowej orientacji w terenie.","l":0},{"t":"s","q":"Na mapie topograficznej różnice wysokości terenu przedstawia się najczęściej za pomocą:","a":"Poziomic (warstwic)","ex":"Poziomice łączą punkty o tej samej wysokości.","l":2},{"t":"tf","q":"Różnice wysokości terenu na mapach topograficznych przedstawia się najczęściej za pomocą poziomic.","a":true,"ex":"Gęstość poziomic pokazuje, jak bardzo stromy jest dany teren.","l":2},{"t":"w","q":"skala mapy","a":"Liczba pokazująca, ile razy rzeczywiste odległości zostały zmniejszone na mapie.","l":1,"k":1},{"t":"w","q":"legenda mapy","a":"Objaśnienie znaków i kolorów użytych na mapie.","l":0,"k":1},{"t":"w","q":"plan","a":"Bardzo szczegółowy rysunek małego obszaru w dużej skali, np. miasta.","l":0,"k":1},{"t":"w","q":"mapa","a":"Zmniejszony, uproszczony obraz powierzchni Ziemi na płaszczyźnie przy użyciu znaków.","l":0,"k":1},{"t":"w","q":"siatka geograficzna","a":"Układ południków i równoleżników na globusie lub mapie, pozwalający określać położenie.","l":3,"k":1},{"t":"w","q":"równoleżnik","a":"Linia biegnąca równolegle do równika, łącząca punkty o tej samej szerokości geograficznej.","l":3,"k":1},{"t":"w","q":"południk","a":"Linia łącząca bieguny, wszystkie punkty na niej mają tę samą długość geograficzną.","l":3,"k":1},{"t":"w","q":"współrzędne geograficzne","a":"Szerokość i długość geograficzna, które określają położenie punktu na Ziemi.","l":3,"k":1},{"t":"w","q":"poziomica (izohipsa)","a":"Linia na mapie łącząca punkty położone na tej samej wysokości nad poziomem morza.","l":2,"k":1},{"t":"w","q":"wysokość bezwzględna","a":"Wysokość punktu nad poziomem morza.","l":2,"k":1},{"t":"w","q":"mapa hipsometryczna","a":"Mapa pokazująca rzeźbę terenu za pomocą barw.","l":2,"k":1},{"t":"w","q":"azymut","a":"Kąt między kierunkiem północy a kierunkiem do wybranego obiektu, mierzony zgodnie z ruchem wskazówek zegara.","l":0,"k":1},{"t":"w","q":"orientowanie mapy","a":"Ustawienie mapy tak, aby jej kierunki zgadzały się z kierunkami w terenie.","l":0,"k":1},{"t":"w","q":"rzeźba terenu","a":"Układ wzniesień, dolin i obniżeń na powierzchni Ziemi.","l":2,"k":1},{"t":"s","q":"Na Ziemi wyróżniamy kontynenty, do których zaliczamy m.in.:","a":"Europę, Azję i Afrykę","ex":"To trzy z siedmiu kontynentów na Ziemi.","l":4},{"t":"tf","q":"Europa, Azja i Afryka to przykłady kontynentów.","a":true,"ex":"Kontynenty to duże, zwarte obszary lądu.","l":4},{"t":"f","q":"Największym kontynentem na Ziemi jest _______.","a":"Azja","acc":[],"ex":"Azja obejmuje m.in. Chiny, Indie i Rosję azjatycką.","l":4},{"t":"s","q":"Najmniejszym kontynentem na Ziemi jest:","a":"Australia","ex":"Australia jest wyraźnie mniejsza od pozostałych kontynentów.","l":4},{"t":"tf","q":"Australia jest najmniejszym kontynentem na Ziemi.","a":true,"ex":"Jest zarazem jedynym krajem zajmującym cały kontynent.","l":4},{"t":"o","q":"Wymień nazwy kontynentów na Ziemi.","a":"Europa, Azja, Afryka, Ameryka Północna, Ameryka Południowa, Australia i Antarktyda.","l":4},{"t":"s","q":"Kontynent, na którym leży Polska, to:","a":"Europa","ex":"Polska leży w środkowej Europie.","l":4},{"t":"tf","q":"Polska leży na kontynencie europejskim.","a":true,"ex":"To podstawowa informacja o położeniu Polski.","l":4},{"t":"f","q":"Kontynent położony w rejonie bieguna południowego, pokryty grubą warstwą lodu, to _______.","a":"Antarktyda","acc":[],"ex":"Przebywają tam głównie naukowcy na stacjach badawczych.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego na Antarktydzie nie ma stałych mieszkańców.","a":"Antarktyda jest niemal całkowicie pokryta grubą warstwą lodu, panują tam ekstremalnie niskie temperatury i trudne warunki do życia, dlatego nie ma tam stałej ludności — przebywają tam jedynie naukowcy prowadzący badania na stacjach polarnych.","l":4},{"t":"s","q":"Morze obmywające wybrzeża Polski (Bałtyckie) jest częścią zlewiska:","a":"Oceanu Atlantyckiego","ex":"Bałtyk łączy się z Atlantykiem poprzez cieśniny duńskie.","l":4},{"t":"tf","q":"
