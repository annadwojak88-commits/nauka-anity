<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odpowiedzi pisemne – klasa 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfdfb;--card:#ffffff;--ink:#1d2a44;--muted:#5d6b86;--moss:#17a673;--moss-d:#0e7a54;--amber:#ffc83d;--sky:#3b82f6;--rose:#ef476f;--line:#1d2a44;--soft:#dbe6f7}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5;background-color:var(--bg);background-image:linear-gradient(#cfe0f5 1px,transparent 1px),linear-gradient(90deg,#cfe0f5 1px,transparent 1px);background-size:24px 24px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{text-align:center;padding:18px 0 8px}
header .em{display:inline-block;font-size:34px;background:var(--amber);border:3px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:4px 4px 0 var(--line);transform:rotate(-4deg)}
h1{font-family:'Baloo 2',Nunito,sans-serif;margin:10px 0 0;font-size:34px;line-height:1.1;letter-spacing:-.5px}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-family:'Baloo 2',Nunito,sans-serif;margin:0 0 6px;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:20px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;box-shadow:5px 5px 0 var(--line);transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line)}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.card .big{font-size:36px}
.card.bio{background:#d9f5e8}.card.geo{background:#dbe9ff}.card.hist{background:#ffe9bd}
.card p{margin:4px 0 0;color:var(--muted);font-size:14px}
.note{background:var(--amber);border:3px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:22px;font-size:14px;box-shadow:4px 4px 0 var(--line)}
.back{background:#fff;border:3px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;padding:5px 12px;margin:4px 0 10px;box-shadow:3px 3px 0 var(--line)}
.sec{display:flex;gap:12px;align-items:center}
.sec .ic{font-size:30px;background:#fff;border:3px solid var(--line);border-radius:14px;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.sec .meta{flex:1}
.sec .meta b{display:block;font-size:16px}
.sec .meta span{color:var(--muted);font-size:13px}
.badge{font-size:13px;color:#fff;background:var(--moss-d);border:2px solid var(--line);border-radius:20px;padding:2px 10px;font-weight:800}
.bar{height:16px;background:#fff;border:3px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 16px}
.pbar{height:10px;background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.pbar i{display:block;height:100%;background:var(--moss);width:0}
.plab{font-size:12px;opacity:.75}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--moss),var(--moss) 8px,#27c28a 8px,#27c28a 16px);width:0;transition:width .25s}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;background:var(--sky);color:#fff;border:2px solid var(--line);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.q{font-family:'Baloo 2',Nunito,sans-serif;font-size:22px;line-height:1.3;margin:6px 0 14px;font-weight:700}
.q .blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--rose);margin:0 4px}
textarea,input[type=text]{width:100%;font-family:'Patrick Hand',Caveat,cursive;font-size:23px;line-height:1.35;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:#fffbe6;color:#1d2a44;resize:vertical;background-image:repeating-linear-gradient(transparent,transparent 30px,#e7d98c 31px)}
textarea{min-height:130px}
textarea:focus,input[type=text]:focus{outline:none;box-shadow:0 0 0 4px #b9d3ff}
.btn{background:var(--moss);color:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 20px;font:inherit;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{background:#d6dbe6;color:#7b86a0;cursor:not-allowed;box-shadow:none}
.btn.alt,.btn.ghost{background:#fff;color:var(--ink)}
.pf{display:flex;gap:10px;margin-bottom:12px}
.pf button{flex:1;padding:12px;border-radius:14px;border:3px solid var(--line);background:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.pf button.on{background:#bcd7ff}
.pf button.good{background:#9ee8c6}
.pf button.wrong{background:#ffb3c3}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;background:#d9f5e8;border:3px solid var(--line)}
.fb.no{background:#ffd9e0}
.fb.mid{background:#fff3c4}
.fb h4{margin:0 0 6px;font-size:16px}
.fb .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:8px;font-weight:800}
.fb .mine{font-family:'Patrick Hand',Caveat,cursive;font-size:22px;color:#1d2a44;white-space:pre-wrap}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rate button{flex:1;min-width:110px;padding:10px;border-radius:14px;border:3px solid var(--line);background:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.rate button.on{background:#9ee8c6}
.hint{font-size:13px;color:var(--muted)}
.link{background:none;border:none;color:var(--sky);text-decoration:underline;font:inherit;font-weight:800;cursor:pointer;padding:0;margin-top:8px}
.score{text-align:center;padding:10px 0}
.score .n{font-family:'Baloo 2',sans-serif;font-size:72px;line-height:1;color:var(--rose);-webkit-text-stroke:2px var(--line)}
.rev{border-top:2px dashed var(--line);padding:10px 0;font-size:14px}
.rev .m{font-family:'Patrick Hand',Caveat,cursive;font-size:20px;color:#1d2a44;white-space:pre-wrap}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row2 .btn{margin-top:0}
.mic{background:#fff;border:3px solid var(--line);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;margin-top:10px;box-shadow:3px 3px 0 var(--line)}
.mic.rec{background:var(--rose);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.dash{background:#fff7d6;cursor:default;margin-top:14px}.dbar{display:flex;gap:6px;align-items:flex-end;height:90px;margin:10px 0 4px}.dbar div{flex:1;text-align:center;font-size:11px}.dbar i{display:block;background:var(--moss);border:2px solid var(--line);border-radius:6px 6px 0 0;min-height:2px}table.st{width:100%;border-collapse:collapse;font-size:14px}table.st td,table.st th{border-bottom:2px dashed var(--soft);padding:6px 4px;text-align:left}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--soft);cursor:pointer}
.lrow input{width:24px;height:24px;margin-top:3px;accent-color:var(--moss);flex:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}

/* ===== jasny, przejrzysty styl pastelowy ===== */
:root{--bg:#f6f8fc;--ink:#26324a;--muted:#6b7893;--line:#dfe6f2;--moss:#34b27b;--moss-d:#23915f;--sky:#5b8def}
body{background:var(--bg)!important;background-image:none!important;font-size:17px}
header .em{background:#fff3cf;border:0;box-shadow:0 4px 14px rgba(60,80,120,.12);transform:none;border-radius:18px}
h1{font-size:30px}
.card,.note,.back,.btn,.pf button,.sec .ic,.fb,.bar,.pbar{border-width:1.5px!important;border-color:var(--line)!important;box-shadow:0 3px 12px rgba(60,80,120,.08)!important}
.card{border-radius:20px;padding:18px}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,80,120,.14)!important}
.card:active{transform:scale(.99)}
.card.bio{background:#e6f7ee}.card.geo{background:#e6effd}.card.hist{background:#fff1d6}
.note{background:#fff7dc;border-radius:16px}
.back{border-radius:12px;color:var(--muted);box-shadow:none!important;background:transparent}
.btn{border-radius:14px;padding:13px 20px;border-color:transparent!important;font-size:16px}
.btn.alt,.btn.ghost{border-color:var(--line)!important;background:#fff}
.btn.alt{color:#2f5fc4}
.btn:disabled{box-shadow:none!important}
.bar,.pbar{background:#e8edf6;height:12px;border-radius:8px}
.bar i,.pbar i{background:var(--moss)!important;border-radius:8px}
.q{font-size:21px}
textarea,input[type=text]{border:2px solid #cdd8ec!important;border-radius:14px;background:#fff!important;font-size:21px}
textarea:focus,input[type=text]:focus{border-color:var(--sky)!important;box-shadow:0 0 0 4px #dce8ff}
.tag{border:0;background:#e3ecfd;color:#2f5fc4}
.fb{border-radius:14px;background:#e6f7ee}.fb.no{background:#fdeaee}.fb.mid{background:#fff6d6}
.lrow{padding:10px 8px;border-radius:12px}
.lrow:hover{background:#f1f5fc}
.badge{border:0!important;font-size:12px}
.sec .ic{background:#fff;border-radius:14px}
.pf button.on{background:#dce8ff}.pf button.good{background:#c9f0dc}.pf button.wrong{background:#ffd8e0}
h2{font-size:22px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="em">✏️ klasa 5</div><h1>Odpowiedzi pisemne</h1><p class="sub">Biologia, geografia i historia — klasa 5. Sama piszesz odpowiedzi!</p></header>
<main id="app"></main>
<footer>Pytania autorskie, przygotowane do samodzielnej powtórki materiału klasy 5.</footer>
</div>
<script>
const DATA = {"biologia":[{"id":"b1","title":"Biologia – nauka o życiu","icon":"🔬","q":[{"t":"s","q":"Obserwacja w biologii polega na:","a":"Uważnym poznawaniu obiektu za pomocą zmysłów i przyrządów","ex":"Obserwacja to zbieranie informacji o obiekcie lub zjawisku bez ingerowania w jego przebieg.","l":1},{"t":"s","q":"Do obserwacji bardzo małych obiektów, niewidocznych gołym okiem, służy:","a":"Mikroskop","ex":"Mikroskop pozwala uzyskać dużo większe powiększenie niż lupa.","l":2},{"t":"f","q":"Powiększenie mikroskopu obliczamy, mnożąc powiększenie okularu przez powiększenie _______.","a":"obiektywu","acc":[],"ex":"Np. okular 10× i obiektyw 40× dają powiększenie 400×.","l":2},{"t":"s","q":"Okular mikroskopu ma powiększenie 10×, a obiektyw 40×. Całkowite powiększenie wynosi:","a":"400×","ex":"10 × 40 = 400×.","l":2},{"t":"s","q":"Okular 10× i obiektyw 20× dają powiększenie:","a":"200×","ex":"10 × 20 = 200×.","l":2},{"t":"tf","q":"Preparat do obserwacji mikroskopowej umieszcza się na stoliku mikroskopu.","a":true,"ex":"Stolik mikroskopu podtrzymuje szkiełko z preparatem podczas obserwacji.","l":2},{"t":"tf","q":"Obiektyw mikroskopu znajduje się pod stolikiem, a nie nad preparatem.","a":false,"ex":"Obiektyw znajduje się nad preparatem, najbliżej obserwowanego obiektu.","l":2},{"t":"s","q":"Prawidłowa kolejność etapów badania naukowego to:","a":"Problem badawczy → hipoteza → doświadczenie → wnioski","ex":"Najpierw stawiamy pytanie (problem badawczy), potem przypuszczenie (hipotezę), sprawdzamy je doświadczeniem, a na końcu wyciągamy wnioski.","l":1},{"t":"s","q":"Doświadczenie biologiczne pozwala przede wszystkim:","a":"Sprawdzić postawioną hipotezę","ex":"Wynik doświadczenia może hipotezę potwierdzić albo obalić — obie możliwości są wartościowe naukowo.","l":1},{"t":"tf","q":"Wyniki doświadczenia zawsze potwierdzają postawioną hipotezę.","a":false,"ex":"Doświadczenie może też wykazać, że hipoteza była błędna — to również ważny wynik.","l":1},{"t":"s","q":"Grupa, na którą działa badany czynnik, to:","a":"Próba badawcza","ex":"Próba badawcza to ta, w której wprowadzono zmianę, którą chcemy zbadać.","l":1},{"t":"s","q":"W poprawnie zaplanowanym doświadczeniu należy zmieniać:","a":"Tylko badany czynnik","ex":"Zmiana tylko jednego czynnika pozwala jednoznacznie stwierdzić, co wpłynęło na wynik.","l":1},{"t":"tf","q":"Pozostałe warunki doświadczenia (poza badanym czynnikiem) powinny być możliwie takie same w obu próbach.","a":true,"ex":"Tylko wtedy można być pewnym, że to badany czynnik odpowiada za różnicę w wynikach.","l":1},{"t":"f","q":"Krok w metodzie naukowej, w którym formułuje się przypuszczenie odpowiadające na problem badawczy, nazywamy _______.","a":"hipotezą","acc":[],"ex":"Hipotezę sprawdza się następnie za pomocą doświadczenia.","l":1},{"t":"f","q":"Po przeprowadzeniu doświadczenia analizuje się jego _______, a następnie formułuje wniosek.","a":"wyniki","acc":[],"ex":"Analiza wyników pozwala stwierdzić, czy hipoteza się potwierdziła.","l":1},{"t":"tf","q":"W dobrze zaplanowanym doświadczeniu warto powtórzyć pomiar kilka razy, by upewnić się co do wyniku.","a":true,"ex":"Powtarzalność wyniku zwiększa wiarygodność wniosków.","l":1},{"t":"s","q":"Przygotowanie preparatu mikroskopowego polega m.in. na:","a":"Umieszczeniu próbki na szkiełku podstawowym i przykryciu szkiełkiem nakrywkowym","ex":"To podstawowy sposób przygotowania preparatu do obserwacji mikroskopowej.","l":2},{"t":"s","q":"Który przyrząd służy do obserwacji obiektów nieco większych niż te wymagające mikroskopu, np. drobnych zwierząt?","a":"Lupa","ex":"Lupa daje mniejsze powiększenie niż mikroskop, ale jest wygodna w terenie.","l":2},{"t":"tf","q":"Lupa daje mniejsze powiększenie niż typowy mikroskop szkolny.","a":true,"ex":"Mikroskop pozwala zobaczyć znacznie więcej szczegółów niż lupa.","l":2},{"t":"s","q":"Część mikroskopu, przez którą patrzymy okiem, to:","a":"Okular","ex":"Okular znajduje się na górze mikroskopu, najbliżej oka obserwatora.","l":2},{"t":"s","q":"Część mikroskopu znajdująca się najbliżej obserwowanego preparatu to:","a":"Obiektyw","ex":"Obiektyw jest skierowany bezpośrednio na preparat.","l":2},{"t":"f","q":"Płaska część mikroskopu, na której umieszcza się preparat, to _______.","a":"stolik","acc":[],"ex":"Stolik podtrzymuje szkiełko z preparatem podczas obserwacji.","l":2},{"t":"tf","q":"Statyw mikroskopu stanowi jego podstawową konstrukcję, na której zamontowane są pozostałe elementy.","a":true,"ex":"Statyw łączy ze sobą wszystkie części mikroskopu.","l":2},{"t":"s","q":"Źródło światła w mikroskopie (lusterko lub lampka) służy do:","a":"Oświetlenia preparatu od dołu","ex":"Odpowiednie oświetlenie jest niezbędne do dobrej obserwacji preparatu.","l":2},{"t":"o","q":"Wymień cztery podstawowe elementy budowy mikroskopu optycznego.","a":"Okular, obiektyw, stolik oraz statyw (można dodać źródło światła i śruby ustawiające ostrość).","l":2},{"t":"s","q":"Okular mikroskopu ma powiększenie 15×, a obiektyw 10×. Całkowite powiększenie wynosi:","a":"150×","ex":"15 × 10 = 150×.","l":2},{"t":"tf","q":"Przy powiększeniu okularu 15× i obiektywu 10×, całkowite powiększenie wynosi 150×.","a":true,"ex":"Mnożymy powiększenie okularu przez powiększenie obiektywu.","l":2},{"t":"s","q":"Jeśli mikroskop daje powiększenie 400×, a obiektyw ma powiększenie 40×, to okular ma powiększenie:","a":"10×","ex":"400 podzielone przez 40 daje 10×.","l":2},{"t":"f","q":"Aby obliczyć powiększenie okularu, gdy znamy całkowite powiększenie i powiększenie obiektywu, należy całkowite powiększenie _______ przez powiększenie obiektywu.","a":"podzielić","acc":[],"ex":"To odwrotność mnożenia użytego do obliczenia całkowitego powiększenia.","l":2},{"t":"s","q":"Preparat mikroskopowy przygotowuje się, umieszczając próbkę:","a":"Na szkiełku podstawowym i przykrywając szkiełkiem nakrywkowym","ex":"To standardowa metoda przygotowania preparatu.","l":2},{"t":"tf","q":"Szkiełko nakrywkowe przykrywa próbkę umieszczoną na szkiełku podstawowym.","a":true,"ex":"Chroni to próbkę i obiektyw mikroskopu.","l":2},{"t":"s","q":"Regulację ostrości obrazu w mikroskopie umożliwiają:","a":"Śruby (pokrętła) ustawiania ostrości","ex":"Dzięki nim można wyraźnie zobaczyć obserwowany preparat.","l":2},{"t":"o","q":"Opisz kolejne kroki przygotowania prostego preparatu mikroskopowego, np. ze skórki cebuli.","a":"Należy zdjąć cienki fragment skórki z łuski cebuli, umieścić go na szkiełku podstawowym, dodać kroplę wody, przykryć szkiełkiem nakrywkowym, a następnie obserwować preparat pod mikroskopem, zaczynając od najmniejszego powiększenia.","l":2},{"t":"s","q":"Obserwację bezpośrednią (gołym okiem) od obserwacji mikroskopowej odróżnia przede wszystkim:","a":"Możliwość zobaczenia znacznie mniejszych szczegółów dzięki mikroskopowi","ex":"Mikroskop pozwala zobaczyć struktury niewidoczne gołym okiem.","l":2},{"t":"tf","q":"Obserwacja z użyciem mikroskopu pozwala dostrzec znacznie więcej szczegółów niż obserwacja gołym okiem.","a":true,"ex":"To główna zaleta obserwacji mikroskopowej.","l":2},{"t":"s","q":"Który etap metody naukowej następuje bezpośrednio po sformułowaniu problemu badawczego?","a":"Postawienie hipotezy","ex":"Hipotezę stawiamy zaraz po sformułowaniu pytania badawczego.","l":1},{"t":"f","q":"Etap metody naukowej następujący bezpośrednio po postawieniu hipotezy to przeprowadzenie _______.","a":"doświadczenia","acc":[],"ex":"Doświadczenie pozwala sprawdzić postawioną hipotezę.","l":1},{"t":"tf","q":"Wnioski formułuje się na podstawie analizy wyników przeprowadzonego doświadczenia.","a":true,"ex":"To ostatni etap metody naukowej.","l":1},{"t":"s","q":"Obserwacja różni się od doświadczenia tym, że:","a":"Obserwacja nie ingeruje w badane zjawisko, a doświadczenie polega na celowym wywołaniu i kontrolowaniu warunków","ex":"To kluczowa różnica między tymi dwiema metodami badawczymi.","l":1},{"t":"o","q":"Wyjaśnij różnicę między obserwacją a doświadczeniem.","a":"Obserwacja polega na uważnym poznawaniu zjawiska takim, jakie ono jest, bez ingerowania w jego przebieg, natomiast doświadczenie polega na celowym wywołaniu i kontrolowaniu warunków, w jakich zachodzi badane zjawisko, aby sprawdzić postawioną hipotezę.","l":1},{"t":"s","q":"Grupa, na którą działa badany czynnik w doświadczeniu, to:","a":"Próba badawcza","ex":"To grupa, w której wprowadzono badaną zmianę.","l":1},{"t":"tf","q":"Bez próby kontrolnej trudno jednoznacznie ocenić, czy to badany czynnik wpłynął na wynik doświadczenia.","a":true,"ex":"Porównanie z próbą kontrolną jest kluczowe dla wiarygodności wyniku.","l":1},{"t":"f","q":"Grupa służąca do porównania, w której nie zmieniono badanego czynnika, nazywana jest próbą _______.","a":"kontrolną","acc":[],"ex":"To podstawowy element poprawnie zaplanowanego doświadczenia.","l":1},{"t":"s","q":"W dobrze zaplanowanym doświadczeniu warto:","a":"Zmieniać tylko jeden czynnik na raz","ex":"To jedna z podstawowych zasad prawidłowego eksperymentu.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego w doświadczeniu należy zmieniać tylko jeden czynnik na raz.","a":"Zmiana tylko jednego czynnika pozwala jednoznacznie stwierdzić, że to właśnie ten czynnik jest odpowiedzialny za zaobserwowaną różnicę w wynikach, a nie inne, niekontrolowane zmienne.","l":1},{"t":"s","q":"Wniosek z doświadczenia powinien:","a":"Odnosić się do postawionej wcześniej hipotezy","ex":"Wniosek podsumowuje, czy hipoteza się potwierdziła.","l":1},{"t":"tf","q":"Wniosek z doświadczenia powinien odnosić się do postawionej wcześniej hipotezy, potwierdzając ją lub obalając.","a":true,"ex":"To zamyka logiczny cykl metody naukowej.","l":1},{"t":"f","q":"Ostatnim etapem metody naukowej, podsumowującym całe badanie, jest sformułowanie _______.","a":"wniosku","acc":[],"ex":"Wniosek kończy cały proces badawczy.","l":1},{"t":"s","q":"Mikroskop optyczny, w odróżnieniu od lupy, umożliwia:","a":"Znacznie większe powiększenie obserwowanego obiektu","ex":"Mikroskop daje dużo większe powiększenie niż lupa.","l":2},{"t":"tf","q":"Mikroskop optyczny umożliwia znacznie większe powiększenie niż lupa.","a":true,"ex":"Lupa daje powiększenie kilkukrotne, a mikroskop nawet kilkusetkrotne.","l":2},{"t":"s","q":"Aby zwiększyć całkowite powiększenie obrazu w mikroskopie, należy:","a":"Zastosować obiektyw o większym powiększeniu","ex":"Zmiana obiektywu na mocniejszy zwiększa całkowite powiększenie.","l":2},{"t":"o","q":"Oblicz i zapisz, jakie całkowite powiększenie uzyska się przy użyciu okularu 10× i obiektywu 100×. Pokaż sposób obliczenia.","a":"10 × 100 = 1000×. Powiększenie okularu mnożymy przez powiększenie obiektywu, otrzymując całkowite powiększenie 1000 razy.","l":2},{"t":"s","q":"Okular mikroskopu o powiększeniu 5× i obiektyw o powiększeniu 10× dają razem powiększenie:","a":"50×","ex":"5 × 10 = 50×.","l":2},{"t":"tf","q":"Przy powiększeniu okularu 5× i obiektywu 10×, całkowite powiększenie wynosi 50×.","a":true,"ex":"To wynik mnożenia obu powiększeń.","l":2},{"t":"s","q":"Aby obejrzeć preparat pod mikroskopem, na początku obserwacji warto ustawić:","a":"Najmniejsze dostępne powiększenie","ex":"Ułatwia to znalezienie interesującego fragmentu preparatu.","l":2},{"t":"f","q":"Obserwację mikroskopową rozpoczynamy zwykle od najmniejszego dostępnego _______, a potem stopniowo je zwiększamy.","a":"powiększenia","acc":[],"ex":"To ułatwia zlokalizowanie interesującego fragmentu preparatu.","l":2},{"t":"tf","q":"Obserwację mikroskopową warto zaczynać od najmniejszego powiększenia, by łatwiej znaleźć interesujący fragment preparatu.","a":true,"ex":"Przy małym powiększeniu pole widzenia jest większe.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego przed obejrzeniem preparatu pod dużym powiększeniem warto najpierw znaleźć interesujący fragment przy małym powiększeniu.","a":"Przy małym powiększeniu pole widzenia jest większe, co ułatwia zlokalizowanie interesującego fragmentu preparatu; dopiero po jego znalezieniu warto zwiększyć powiększenie, by przyjrzeć się szczegółom.","l":2},{"t":"s","q":"Nauka biologia zajmuje się badaniem:","a":"Organizmów żywych i procesów w nich zachodzących","ex":"To podstawowa definicja biologii jako nauki.","l":0},{"t":"tf","q":"Biologia jest nauką o organizmach żywych i zachodzących w nich procesach.","a":true,"ex":"To ogólna definicja tej dziedziny nauki.","l":0},{"t":"s","q":"Do metod poznawania przyrody stosowanych w biologii zaliczamy m.in.:","a":"Obserwację i doświadczenie","ex":"To dwie podstawowe metody badawcze w biologii.","l":1},{"t":"f","q":"Dwie podstawowe metody poznawania przyrody w biologii to obserwacja i _______.","a":"doświadczenie","acc":[],"ex":"Obie metody uzupełniają się nawzajem.","l":1},{"t":"s","q":"Wyniki przeprowadzonego doświadczenia należy:","a":"Zapisywać, aby móc je później przeanalizować","ex":"Rzetelne zapisywanie wyników jest podstawą dobrej pracy badawczej.","l":1},{"t":"tf","q":"Zapisywanie wyników doświadczenia jest ważnym elementem pracy badawczej.","a":true,"ex":"Bez tego trudno byłoby przeprowadzić rzetelną analizę.","l":1},{"t":"s","q":"Hipoteza w metodzie naukowej to:","a":"Przypuszczenie, odpowiedź na postawiony problem badawczy, które trzeba jeszcze sprawdzić","ex":"Hipoteza wymaga sprawdzenia za pomocą doświadczenia.","l":1},{"t":"o","q":"Wyjaśnij, czym różni się hipoteza od wniosku.","a":"Hipoteza to przypuszczenie postawione na początku badania, przed przeprowadzeniem doświadczenia, natomiast wniosek to stwierdzenie sformułowane na końcu, na podstawie analizy wyników doświadczenia — wniosek może potwierdzać lub obalać postawioną wcześniej hipotezę.","l":1},{"t":"s","q":"Który przykład ilustruje poprawnie sformułowany problem badawczy?","a":"„Czy temperatura wpływa na szybkość kiełkowania nasion?”","ex":"Problem badawczy zwykle ma formę pytania.","l":1},{"t":"tf","q":"Problem badawczy zwykle formułuje się w formie pytania.","a":true,"ex":"To odróżnia go od hipotezy, formułowanej jako zdanie oznajmujące.","l":1},{"t":"s","q":"Który przykład ilustruje poprawnie sformułowaną hipotezę do problemu „Czy temperatura wpływa na szybkość kiełkowania nasion?”?","a":"„Przypuszczam, że wyższa temperatura przyspiesza kiełkowanie nasion.”","ex":"Hipoteza jest konkretnym przypuszczeniem, które można sprawdzić.","l":1},{"t":"f","q":"Hipoteza jest zwykle formułowana w formie zdania oznajmującego, a problem badawczy — w formie _______.","a":"pytania","acc":[],"ex":"To odróżnia oba te elementy metody naukowej.","l":1},{"t":"o","q":"Sformułuj przykładowy problem badawczy i odpowiadającą mu hipotezę dotyczące wpływu światła na wzrost rośliny.","a":"Problem badawczy: „Czy dostęp do światła wpływa na wzrost rośliny?” Hipoteza: „Przypuszczam, że roślina rosnąca w dobrze oświetlonym miejscu będzie rosła szybciej niż roślina rosnąca w cieniu.”","l":1},{"t":"tf","q":"Metoda naukowa pozwala w usystematyzowany sposób sprawdzać przypuszczenia dotyczące przyrody.","a":true,"ex":"To podstawa rzetelnego poznawania świata przyrody.","l":1},{"t":"s","q":"Preparat mikroskopowy trwały różni się od nietrwałego tym, że:","a":"Można go przechowywać i wielokrotnie oglądać przez dłuższy czas","ex":"Preparaty trwałe są specjalnie utrwalane, by można było je przechowywać.","l":2},{"t":"o","q":"Wyjaśnij, jaką rolę pełni kropla wody dodawana do preparatu mikroskopowego, np. ze skórki cebuli.","a":"Kropla wody zapobiega wysychaniu obserwowanej próbki, ułatwia rozprowadzenie jej pod szkiełkiem nakrywkowym i poprawia przejrzystość obrazu obserwowanego pod mikroskopem.","l":2},{"t":"tf","q":"Doświadczenie pozwala sprawdzić w praktyce, czy postawiona hipoteza jest prawdziwa.","a":true,"ex":"Bez doświadczenia hipoteza pozostaje jedynie przypuszczeniem.","l":1},{"t":"f","q":"Spośród lupy, gołego oka i mikroskopu optycznego, największe powiększenie daje _______.","a":"mikroskop","acc":[],"ex":"Mikroskop pozwala zobaczyć struktury niewidoczne nawet przez lupę.","l":1},{"t":"s","q":"Analiza wyników doświadczenia polega na:","a":"Uważnym przeanalizowaniu zebranych danych, by wyciągnąć z nich wniosek","ex":"To kluczowy etap prowadzący do sformułowania wniosku.","l":1},{"t":"tf","q":"Analiza wyników pozwala stwierdzić, czy dane potwierdzają, czy raczej obalają postawioną hipotezę.","a":true,"ex":"To główny cel analizy wyników.","l":1},{"t":"s","q":"Dlaczego warto powtórzyć doświadczenie kilka razy, zamiast poprzestać na jednym pomiarze?","a":"By upewnić się, że wynik nie jest przypadkowy, i zwiększyć wiarygodność wniosków","ex":"Powtarzalność wyniku zwiększa jego wiarygodność.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego jedno doświadczenie zwykle nie wystarcza, by mieć całkowitą pewność co do słuszności hipotezy.","a":"Wynik pojedynczego doświadczenia może być przypadkowy lub zaburzony przez nieuwzględniony czynnik, dlatego naukowcy powtarzają doświadczenia i porównują wyniki, by mieć większą pewność, że zaobserwowana zależność jest rzeczywista, a nie przypadkowa.","l":1},{"t":"tf","q":"Problem badawczy określa, co dokładnie chcemy sprawdzić w danym doświadczeniu.","a":true,"ex":"To punkt wyjścia całego procesu badawczego.","l":1},{"t":"tf","q":"Wróżenie nie jest naukową metodą poznawania przyrody.","a":true,"ex":"Nauka opiera się na obserwacji, doświadczeniu i logicznym wnioskowaniu.","l":1},{"t":"o","q":"Podsumuj krótko, na czym polega naukowe podejście do badania przyrody.","a":"Naukowe podejście polega na stawianiu pytań (problemów badawczych), formułowaniu opartych na wiedzy przypuszczeń (hipotez), sprawdzaniu ich za pomocą obserwacji i kontrolowanych doświadczeń, a następnie wyciąganiu wniosków na podstawie rzetelnie zebranych i przeanalizowanych wyników.","l":1},{"t":"tf","q":"Naukowe podejście do badania przyrody opiera się na obserwacjach, doświadczeniach i logicznym wnioskowaniu, a nie na przypuszczeniach niepopartych dowodami.","a":true,"ex":"To fundament rzetelnej nauki.","l":1},{"t":"s","q":"Do cech wspólnych wszystkich organizmów żywych zaliczamy:","a":"Oddychanie, odżywianie się i wzrost","ex":"Każdy organizm żywy oddycha, odżywia się, rośnie i rozwija się — niezależnie od tego, czy to bakteria, roślina czy zwierzę.","l":0},{"t":"s","q":"Cecha życia polegająca na zdolności do reagowania na bodźce z otoczenia to:","a":"Drażliwość","ex":"Drażliwość pozwala organizmom reagować np. na światło, dotyk czy zmianę temperatury.","l":0},{"t":"tf","q":"Do opisania budowy i funkcjonowania organizmów służy m.in. obserwacja mikroskopowa.","a":true,"ex":"Mikroskop pozwala zobaczyć struktury niewidoczne gołym okiem, np. komórki.","l":1},{"t":"s","q":"Do wykonania obserwacji mikroskopowej komórek rośliny potrzebujemy m.in.:","a":"Mikroskopu, szkiełka podstawowego i nakrywkowego","ex":"To podstawowy zestaw sprzętu do przygotowania i obejrzenia preparatu mikroskopowego.","l":2},{"t":"tf","q":"Kamień może rosnąć i rozmnażać się, podobnie jak organizm żywy.","a":false,"ex":"Kamień jest materią nieożywioną — nie wykonuje żadnych czynności życiowych.","l":0},{"t":"f","q":"Proces usuwania z organizmu zbędnych i szkodliwych produktów przemiany materii nazywamy _______.","a":"wydalaniem","acc":[],"ex":"Wydalanie jest jedną z podstawowych cech życia.","l":0},{"t":"s","q":"Zdolność organizmu do reagowania na zmiany zachodzące w otoczeniu nazywamy:","a":"Drażliwością","ex":"Drażliwość pozwala organizmom odpowiednio reagować np. na światło, dotyk czy temperaturę.","l":0},{"t":"o","q":"Wyjaśnij, czym różni się organizm żywy od przedmiotu nieożywionego, np. kamienia.","a":"Organizm żywy wykonuje czynności życiowe: oddycha, odżywia się, rośnie, rozwija się, rozmnaża, wydala zbędne produkty i reaguje na bodźce, a kamień nie wykazuje żadnej z tych cech.","l":0},{"t":"s","q":"Suma wszystkich przemian chemicznych zachodzących w organizmie nazywana jest:","a":"Metabolizmem","ex":"Metabolizm obejmuje wszystkie procesy budowy i rozkładu substancji w organizmie.","l":0},{"t":"tf","q":"Każdy organizm żywy zbudowany jest z co najmniej jednej komórki.","a":true,"ex":"Komórka jest podstawową jednostką budowy wszystkich organizmów (poza wirusami).","l":0},{"t":"s","q":"Organizm rosnący i zwiększający liczbę swoich komórek przechodzi proces:","a":"Wzrostu","ex":"Wzrost polega na zwiększaniu rozmiarów i liczby komórek organizmu.","l":0},{"t":"s","q":"Osobniki jednego gatunku, żyjące w tym samym miejscu i czasie, tworzą:","a":"Populację","ex":"Populacja to podstawowe pojęcie ekologiczne, powiązane z klasyfikacją gatunkową.","l":null},{"t":"f","q":"Wszystkie osobniki jednego gatunku żyjące na danym terenie w tym samym czasie tworzą _______.","a":"populację","acc":[],"ex":"Np. wszystkie sarny żyjące w danym lesie tworzą jedną populację.","l":null},{"t":"tf","q":"Populacja to zbiór osobników różnych gatunków żyjących razem.","a":false,"ex":"Populacja obejmuje osobniki tego samego gatunku, nie różnych gatunków.","l":null},{"t":"s","q":"Zbiorowisko populacji różnych gatunków żyjących razem na danym terenie nazywamy:","a":"Biocenozą","ex":"Biocenoza to wszystkie organizmy żyjące razem w danym środowisku, niezależnie od gatunku.","l":null},{"t":"o","q":"Wyjaśnij różnicę między pojęciami „gatunek” i „populacja”.","a":"Gatunek to grupa organizmów o podobnej budowie, zdolnych do krzyżowania się i wydawania płodnego potomstwa, niezależnie od miejsca występowania. Populacja to natomiast osobniki tego samego gatunku żyjące razem, na tym samym terenie, w tym samym czasie.","l":null},{"t":"s","q":"Wyginanie się rośliny w stronę światła jest przykładem:","a":"Reakcji na bodziec, czyli drażliwości","ex":"To dowód na to, że nawet rośliny reagują na zmiany w otoczeniu.","l":0},{"t":"tf","q":"Niektóre rośliny potrafią wykonywać powolne ruchy, np. wyginać się w stronę światła.","a":true,"ex":"Takie ruchy, choć powolne, są przykładem drażliwości u roślin.","l":0},{"t":"f","q":"Wyginanie się rośliny w kierunku źródła światła jest przykładem reagowania na _______.","a":"bodziec","acc":["światlo"],"ex":"To przykład drażliwości — jednej z cech życia.","l":0},{"t":"tf","q":"Fotosynteza jest cechą charakterystyczną wszystkich organizmów żywych, bez wyjątku.","a":false,"ex":"Zwierzęta, grzyby i wiele innych organizmów nie przeprowadza fotosyntezy.","l":0},{"t":"s","q":"Rozwój osobniczy organizmu obejmuje:","a":"Zmiany zachodzące od narodzin do starości","ex":"Rozwój osobniczy to cały cykl życia organizmu, od powstania aż po śmierć.","l":0},{"t":"f","q":"Zespół zmian zachodzących w organizmie od momentu powstania do jego śmierci nazywamy _______ osobniczym.","a":"rozwojem","acc":[],"ex":"Rozwój osobniczy obejmuje wszystkie etapy życia organizmu.","l":0},{"t":"tf","q":"Rozwój osobniczy kończy się w momencie osiągnięcia dojrzałości płciowej.","a":false,"ex":"Rozwój osobniczy trwa właściwie przez całe życie organizmu, aż do jego śmierci.","l":0},{"t":"s","q":"Odżywianie się organizmu polega na:","a":"Pobieraniu i przetwarzaniu substancji potrzebnych do życia","ex":"Dzięki odżywianiu organizm zdobywa energię i materiały budulcowe.","l":0},{"t":"o","q":"Wymień wszystkie poznane cechy życia charakterystyczne dla organizmów żywych.","a":"Budowa komórkowa, odżywianie, oddychanie, wzrost, rozwój, rozmnażanie, wydalanie i reagowanie na bodźce (drażliwość).","l":0},{"t":"tf","q":"Krystalizacja soli jest przykładem procesu życiowego.","a":false,"ex":"Krystalizacja to proces fizyczny, niezwiązany z żadnym organizmem żywym.","l":0},{"t":"f","q":"Bakterie, rośliny i zwierzęta, mimo dużych różnic w budowie, łączy fakt, że wszystkie wykonują podstawowe _______ życiowe.","a":"czynności","acc":[],"ex":"Wszystkie organizmy żywe, niezależnie od królestwa, wykazują te same podstawowe cechy życia.","l":0},{"t":"tf","q":"Grzyby, podobnie jak rośliny i zwierzęta, mają budowę komórkową.","a":true,"ex":"Wszystkie trzy królestwa są zbudowane z komórek — różnią się jednak ich rodzajem i funkcjami.","l":0},{"t":"w","q":"obserwacja","a":"Uważne przyglądanie się organizmom lub zjawiskom za pomocą zmysłów lub przyrządów, bez ingerowania w ich przebieg.","l":1,"k":1},{"t":"w","q":"doświadczenie","a":"Badanie, w którym celowo wywołujemy zjawisko i sprawdzamy, jak zmiana jednego czynnika wpływa na wynik.","l":1,"k":1},{"t":"w","q":"hipoteza","a":"Przypuszczenie, które próbujemy sprawdzić w doświadczeniu; przewidywana odpowiedź na pytanie badawcze.","l":1,"k":1},{"t":"w","q":"próba kontrolna","a":"Zestaw w doświadczeniu, w którym nie zmieniamy badanego czynnika; służy do porównania z próbą badawczą.","l":1,"k":1},{"t":"w","q":"organizm","a":"Każda istota żywa, np. roślina, zwierzę, grzyb czy bakteria.","l":0,"k":1},{"t":"w","q":"mikroskop","a":"Przyrząd optyczny, który bardzo mocno powiększa obraz bardzo małych obiektów niewidocznych gołym okiem.","l":2,"k":1},{"t":"w","q":"preparat mikroskopowy","a":"Cienki fragment badanego materiału umieszczony na szkiełku podstawowym i przykryty szkiełkiem nakrywkowym, przygotowany do obserwacji pod mikroskopem.","l":2,"k":1},{"t":"w","q":"metabolizm (przemiana materii)","a":"Wszystkie reakcje chemiczne zachodzące w organizmie, dzięki którym pobiera on substancje i energię oraz oddaje zbędne produkty.","l":0,"k":1},{"t":"w","q":"bodziec","a":"Zmiana w otoczeniu lub wewnątrz organizmu, na którą organizm reaguje, np. światło, dotyk, temperatura.","l":0,"k":1},{"t":"w","q":"biologia","a":"Nauka o organizmach żywych, ich budowie, czynnościach życiowych i środowisku.","l":0,"k":1}],"lessons":["Biologia jako nauka","Jak poznawać biologię?","Obserwacje mikroskopowe"]},{"id":"b2","title":"Budowa i czynności życiowe organizmów","icon":"🧫","q":[{"t":"s","q":"Do związków chemicznych budujących organizmy zaliczamy m.in.:","a":"Wodę, białka, tłuszcze i cukry","ex":"To podstawowe związki organiczne i nieorganiczne budujące ciała organizmów żywych.","l":0},{"t":"tf","q":"Woda jest związkiem chemicznym, a nie pierwiastkiem.","a":true,"ex":"Cząsteczka wody składa się z dwóch pierwiastków: wodoru i tlenu.","l":0},{"t":"s","q":"Głównym źródłem energii dla organizmu są zazwyczaj:","a":"Cukry","ex":"Cukry (węglowodany) są podstawowym, szybko dostępnym źródłem energii.","l":0},{"t":"s","q":"Podstawową funkcją białek w organizmie jest przede wszystkim funkcja:","a":"Budulcowa","ex":"Białka budują m.in. mięśnie, włosy i paznokcie.","l":0},{"t":"f","q":"Związki chemiczne zawierające informację genetyczną organizmu to kwasy _______.","a":"nukleinowe","acc":[],"ex":"Kwasy nukleinowe (np. DNA) przechowują informację dziedziczną organizmu.","l":0},{"t":"s","q":"Tłuszcze w organizmie mogą pełnić funkcję:","a":"Zapasową i ochronną","ex":"Tłuszcze magazynują energię i mogą chronić np. przed utratą ciepła.","l":0},{"t":"tf","q":"Woda stanowi znaczną część masy większości organizmów żywych.","a":true,"ex":"U wielu organizmów woda stanowi nawet ponad połowę masy ciała.","l":0},{"t":"s","q":"Przykładem produktu spożywczego bogatego w białko jest:","a":"Jajko","ex":"Jajka, mięso i nabiał to typowe źródła białka w diecie.","l":0},{"t":"s","q":"Przykładem produktu bogatego w tłuszcze jest:","a":"Olej","ex":"Oleje roślinne są niemal czystym tłuszczem.","l":0},{"t":"tf","q":"Cukry są jedynym możliwym źródłem energii dla organizmów.","a":false,"ex":"Organizmy mogą czerpać energię również z tłuszczów, a w mniejszym stopniu z białek.","l":0},{"t":"s","q":"Który pierwiastek chemiczny występuje w organizmach w największej ilości?","a":"Tlen","ex":"Tlen wchodzi w skład wody, która stanowi znaczną część masy organizmów.","l":0},{"t":"tf","q":"Do związków chemicznych budujących organizmy zaliczamy m.in. białka, tłuszcze, cukry i kwasy nukleinowe.","a":true,"ex":"To podstawowe związki organiczne obecne w każdym organizmie żywym.","l":0},{"t":"s","q":"Funkcją kwasów nukleinowych w organizmie jest:","a":"Przechowywanie informacji genetycznej","ex":"Kwasy nukleinowe, jak DNA, zawierają zapis dziedzicznej informacji organizmu.","l":0},{"t":"s","q":"Produktem bogatym w cukry jest:","a":"Pieczywo","ex":"Pieczywo, ryż i ziemniaki są bogate w węglowodany.","l":0},{"t":"tf","q":"Białka mogą pełnić funkcję budulcową, budując np. włosy, paznokcie i mięśnie.","a":true,"ex":"To jedna z najważniejszych funkcji białek w organizmie.","l":0},{"t":"f","q":"Związek chemiczny zbudowany z dwóch atomów wodoru i jednego atomu tlenu to _______.","a":"woda","acc":[],"ex":"Woda jest podstawowym związkiem chemicznym budującym organizmy.","l":0},{"t":"s","q":"Które stwierdzenie o tłuszczach jest prawdziwe?","a":"Mogą pełnić funkcję zapasową i ochronną","ex":"Tłuszcze magazynują energię i mogą chronić organizm, np. przed utratą ciepła.","l":0},{"t":"s","q":"Do prawidłowego funkcjonowania organizmu, obok związków organicznych, potrzebne są też:","a":"Sole mineralne i woda","ex":"Sole mineralne i woda są niezbędne obok białek, tłuszczów i cukrów.","l":0},{"t":"s","q":"Do pierwiastków chemicznych budujących organizmy zaliczamy m.in.:","a":"Węgiel, wodór, tlen i azot","ex":"To podstawowe pierwiastki budujące związki organiczne.","l":0},{"t":"tf","q":"Węgiel, wodór, tlen i azot to podstawowe pierwiastki budujące organizmy żywe.","a":true,"ex":"Wchodzą w skład większości związków organicznych.","l":0},{"t":"f","q":"Pierwiastek chemiczny, którego atomy tworzą „szkielet” wszystkich związków organicznych, to _______.","a":"węgiel","acc":[],"ex":"Węgiel jest podstawą chemii organicznej.","l":0},{"t":"s","q":"Związek chemiczny to:","a":"Połączenie co najmniej dwóch różnych pierwiastków","ex":"Np. woda to związek wodoru i tlenu.","l":0},{"t":"tf","q":"Woda jest związkiem chemicznym zbudowanym z wodoru i tlenu.","a":true,"ex":"Cząsteczka wody to H2O.","l":0},{"t":"s","q":"Do związków organicznych budujących organizmy zaliczamy:","a":"Białka, tłuszcze, cukry i kwasy nukleinowe","ex":"To cztery podstawowe grupy związków organicznych.","l":0},{"t":"f","q":"Cztery główne grupy związków organicznych budujących organizmy to białka, tłuszcze, cukry i _______.","a":"kwasy nukleinowe","acc":[],"ex":"Kwasy nukleinowe przechowują informację genetyczną.","l":0},{"t":"s","q":"Podstawowym, szybko dostępnym źródłem energii dla organizmu są:","a":"Cukry","ex":"Cukry są łatwo i szybko wykorzystywane przez organizm jako paliwo.","l":0},{"t":"tf","q":"Cukry (węglowodany) są głównym, szybko dostępnym źródłem energii dla organizmu.","a":true,"ex":"To dlatego węglowodany stanowią podstawę wielu diet.","l":0},{"t":"s","q":"Produktem bogatym w cukry jest:","a":"Chleb","ex":"Pieczywo zawiera dużo węglowodanów.","l":0},{"t":"o","q":"Podaj dwa przykłady produktów spożywczych bogatych w cukry.","a":"Np. pieczywo i ryż (lub ziemniaki, owoce, makaron).","l":0},{"t":"s","q":"Tłuszcze w organizmie mogą pełnić funkcję:","a":"Zapasową (magazynowanie energii)","ex":"Tłuszcz to skoncentrowany magazyn energii.","l":0},{"t":"tf","q":"Tłuszcze mogą stanowić zapas energii w organizmie.","a":true,"ex":"Organizm magazynuje nadmiar energii m.in. w postaci tłuszczu.","l":0},{"t":"s","q":"Produktem bogatym w tłuszcze jest:","a":"Olej","ex":"Olej roślinny jest niemal czystym tłuszczem.","l":0},{"t":"f","q":"Tłuszcze mogą pełnić również funkcję _______, np. chroniąc organizm przed utratą ciepła.","a":"ochronną","acc":[],"ex":"Warstwa tłuszczu może izolować organizm termicznie.","l":0},{"t":"s","q":"Białka pełnią w organizmie głównie funkcję:","a":"Budulcową","ex":"Białka budują wiele struktur organizmu.","l":0},{"t":"tf","q":"Białka budują m.in. mięśnie, włosy i paznokcie.","a":true,"ex":"To jedna z głównych funkcji białek.","l":0},{"t":"s","q":"Produktem bogatym w białko jest:","a":"Jajko","ex":"Jajka są jednym z najbogatszych źródeł białka.","l":0},{"t":"o","q":"Podaj dwa przykłady produktów spożywczych bogatych w białko.","a":"Np. jajka i mięso (lub ryby, mleko, sery, rośliny strączkowe).","l":0},{"t":"s","q":"Kwasy nukleinowe pełnią w organizmie funkcję:","a":"Przechowywania i przekazywania informacji genetycznej","ex":"To m.in. DNA, przechowujące informację dziedziczną.","l":0},{"t":"f","q":"Kwasy nukleinowe, takie jak DNA, zawierają informację _______.","a":"genetyczną","acc":[],"ex":"To podstawowa funkcja tych związków.","l":0},{"t":"tf","q":"DNA jest przykładem kwasu nukleinowego, zawierającego informację genetyczną organizmu.","a":true,"ex":"DNA przekazuje cechy dziedziczne z pokolenia na pokolenie.","l":0},{"t":"s","q":"Woda w organizmach pełni funkcję:","a":"Budulcową i transportową (rozpuszcza i przenosi substancje)","ex":"Woda jest niezbędna do transportu wielu substancji.","l":0},{"t":"tf","q":"Woda umożliwia transport wielu substancji w organizmie.","a":true,"ex":"Większość reakcji chemicznych w organizmie zachodzi w środowisku wodnym.","l":0},{"t":"s","q":"Woda stanowi:","a":"Znaczną część masy większości organizmów żywych","ex":"U wielu organizmów woda stanowi nawet ponad połowę masy ciała.","l":0},{"t":"f","q":"Woda stanowi znaczną część _______ większości organizmów żywych.","a":"masy","acc":[],"ex":"To podkreśla, jak istotnym składnikiem jest woda.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego woda jest niezbędna dla organizmów żywych.","a":"Woda jest składnikiem budującym organizmy, rozpuszcza i transportuje różne substancje wewnątrz organizmu, a także umożliwia przebieg wielu reakcji chemicznych niezbędnych do życia.","l":0},{"t":"tf","q":"Białka, tłuszcze i cukry są związkami organicznymi.","a":true,"ex":"To podstawowe związki organiczne budujące organizmy.","l":0},{"t":"s","q":"Sole mineralne w organizmie:","a":"Są potrzebne w niewielkich ilościach do prawidłowego funkcjonowania organizmu","ex":"Choć potrzebne w małych ilościach, są niezbędne.","l":0},{"t":"f","q":"Substancje takie jak wapń czy żelazo, potrzebne organizmowi w niewielkich ilościach, nazywamy solami _______.","a":"mineralnymi","acc":[],"ex":"Sole mineralne pełnią wiele ważnych funkcji w organizmie.","l":0},{"t":"tf","q":"Sole mineralne, np. wapń, są potrzebne organizmowi, mimo że występują w nim w niewielkich ilościach.","a":true,"ex":"Ich niedobór może prowadzić do poważnych problemów zdrowotnych.","l":0},{"t":"s","q":"Wapń jest solą mineralną szczególnie ważną dla:","a":"Budowy kości i zębów","ex":"Wapń jest głównym budulcem kości i zębów.","l":0},{"t":"o","q":"Podaj przykład soli mineralnej i jej znaczenie dla organizmu.","a":"Np. wapń — buduje kości i zęby; żelazo — jest potrzebne do produkcji czerwonych krwinek transportujących tlen.","l":0},{"t":"tf","q":"Woda jest związkiem nieorganicznym, w odróżnieniu od białek, tłuszczów i cukrów.","a":true,"ex":"To ważne rozróżnienie w chemii organizmów.","l":0},{"t":"s","q":"Do sprawdzenia obecności skrobi (rodzaju cukru) w produkcie spożywczym można użyć:","a":"Płynu Lugola (jodyny)","ex":"Płyn Lugola daje charakterystyczne zabarwienie w obecności skrobi.","l":0},{"t":"f","q":"Płyn Lugola, po dodaniu do produktu zawierającego skrobię, zabarwia go na kolor _______.","a":"granatowy","acc":["niebiesko-czarny","czarny"],"ex":"To charakterystyczna reakcja wykrywająca skrobię.","l":0},{"t":"tf","q":"Płyn Lugola (jodyna) jest wykorzystywany do wykrywania obecności skrobi w produktach spożywczych.","a":true,"ex":"To prosty, popularny test chemiczny.","l":0},{"t":"o","q":"Opisz, jak można sprawdzić obecność skrobi w np. plastrze ziemniaka.","a":"Na plaster ziemniaka nanosi się kilka kropel płynu Lugola (jodyny); jeśli produkt zawiera skrobię, w miejscu kontaktu pojawi się granatowe lub niebiesko-czarne zabarwienie.","l":0},{"t":"s","q":"Do wykrywania obecności tłuszczu w produkcie spożywczym można wykorzystać:","a":"Papierowy test na tłustą plamę","ex":"Tłuszcz pozostawia na papierze charakterystyczną, przezroczystą plamę.","l":0},{"t":"tf","q":"Tłusta plama pozostająca na papierze po potarciu produktem może świadczyć o obecności tłuszczu.","a":true,"ex":"To prosty, domowy sposób wykrywania tłuszczu.","l":0},{"t":"s","q":"Skrobia jest przykładem:","a":"Cukru złożonego, magazynowanego przez rośliny","ex":"Skrobia to forma magazynowania energii przez rośliny.","l":0},{"t":"f","q":"Skrobia jest formą magazynowania _______ przez rośliny.","a":"cukru","acc":["energii"],"ex":"Rośliny gromadzą nadmiar cukru w postaci skrobi.","l":0},{"t":"tf","q":"Zwierzęta magazynują nadmiar energii w postaci glikogenu, a rośliny w postaci skrobi.","a":true,"ex":"Obie substancje pełnią podobną, zapasową funkcję.","l":0},{"t":"o","q":"Wyjaśnij różnicę między sposobem magazynowania cukrów zapasowych u roślin i zwierząt.","a":"Rośliny magazynują nadmiar cukru w postaci skrobi, natomiast zwierzęta magazynują go w postaci glikogenu — obie substancje pełnią podobną funkcję zapasową, ale mają nieco inną budowę chemiczną.","l":0},{"t":"s","q":"Który składnik pokarmowy dostarcza organizmowi najwięcej energii w przeliczeniu na tę samą masę?","a":"Tłuszcze","ex":"Tłuszcze są najbardziej skoncentrowanym źródłem energii.","l":0},{"t":"tf","q":"Tłuszcze dostarczają więcej energii w przeliczeniu na gram niż cukry czy białka.","a":true,"ex":"Dlatego organizm chętnie magazynuje nadmiar energii w postaci tłuszczu.","l":0},{"t":"s","q":"Nadmiar spożywanej energii organizm może magazynować w postaci:","a":"Tkanki tłuszczowej","ex":"To typowy sposób magazynowania nadmiaru energii przez organizm.","l":0},{"t":"f","q":"Nadmiar energii z pożywienia organizm może magazynować w postaci tkanki _______.","a":"tłuszczowej","acc":[],"ex":"To zapas energii na trudniejsze czasy.","l":0},{"t":"tf","q":"Węgiel, wodór i tlen wchodzą w skład większości związków organicznych budujących organizmy.","a":true,"ex":"Azot dodatkowo wchodzi w skład białek i kwasów nukleinowych.","l":0},{"t":"o","q":"Wymień trzy pierwiastki chemiczne wchodzące w skład większości związków organicznych.","a":"Węgiel, wodór i tlen (dodatkowo azot np. w białkach i kwasach nukleinowych).","l":0},{"t":"f","q":"Błony komórkowe zbudowane są głównie z _______ (rodzaju związków tłuszczowych).","a":"lipidów","acc":[],"ex":"Lipidy to związki tłuszczowe budujące m.in. błony komórkowe.","l":0},{"t":"tf","q":"Błony komórkowe są zbudowane głównie z tłuszczów (lipidów).","a":true,"ex":"To podwójna warstwa lipidowa otaczająca komórkę.","l":0},{"t":"s","q":"Enzymy, przyspieszające reakcje chemiczne w organizmie, są zbudowane głównie z:","a":"Białek","ex":"Enzymy to specjalny rodzaj białek.","l":0},{"t":"tf","q":"Enzymy są rodzajem białek przyspieszających reakcje chemiczne w organizmie.","a":true,"ex":"Bez enzymów wiele reakcji zachodziłoby zbyt wolno.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego białka są nazywane „materiałem budulcowym” organizmu.","a":"Białka budują wiele struktur organizmu, np. mięśnie, włosy, paznokcie i skórę, a także pełnią funkcję enzymów przyspieszających reakcje chemiczne — dlatego są niezbędne do wzrostu i odbudowy tkanek.","l":0},{"t":"s","q":"Który składnik pokarmowy jest najważniejszy dla wzrostu i odbudowy mięśni?","a":"Białko","ex":"Białko jest podstawowym budulcem tkanki mięśniowej.","l":0},{"t":"f","q":"Do wzrostu i odbudowy mięśni organizm potrzebuje przede wszystkim odpowiedniej ilości _______.","a":"białka","acc":[],"ex":"Białko jest głównym budulcem mięśni.","l":0},{"t":"tf","q":"Cukry są głównym, szybko dostępnym źródłem energii dla organizmu.","a":true,"ex":"To dlatego węglowodany są ważnym elementem diety.","l":0},{"t":"o","q":"Dopasuj związki chemiczne (cukry, tłuszcze, białka, kwasy nukleinowe) do ich głównych funkcji.","a":"Cukry — źródło energii; tłuszcze — zapas energii i funkcja ochronna; białka — funkcja budulcowa i enzymatyczna; kwasy nukleinowe — przechowywanie informacji genetycznej.","l":0},{"t":"tf","q":"Mleko zawiera zarówno białka, tłuszcze, jak i cukry (np. laktozę).","a":true,"ex":"To dlatego mleko jest wartościowym, wszechstronnym produktem spożywczym.","l":0},{"t":"s","q":"Który proces chemiczny zachodzący w organizmie wymaga udziału wody jako środowiska reakcji?","a":"Większość reakcji chemicznych zachodzących w komórkach","ex":"Woda jest niezbędnym środowiskiem większości reakcji biochemicznych.","l":0},{"t":"f","q":"Woda jest środowiskiem, w którym zachodzi większość reakcji _______ w organizmie.","a":"chemicznych","acc":[],"ex":"Bez wody wiele procesów życiowych nie mogłoby zachodzić.","l":0},{"t":"tf","q":"Sole mineralne i witaminy nie są głównym źródłem energii, ale są niezbędne do prawidłowego funkcjonowania organizmu.","a":true,"ex":"Pełnią funkcje regulacyjne, a nie energetyczne.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego mimo że sole mineralne nie dostarczają energii, są niezbędne dla organizmu.","a":"Sole mineralne pełnią ważne funkcje regulacyjne i budulcowe, np. wapń buduje kości, a żelazo jest potrzebne do produkcji czerwonych krwinek — bez nich organizm nie mógłby prawidłowo funkcjonować, mimo że same nie dostarczają energii.","l":0},{"t":"s","q":"Który proces pozwala sprawdzić, czy dany produkt spożywczy zawiera tłuszcz?","a":"Test tłustej plamy na papierze","ex":"To prosty, domowy sposób wykrywania obecności tłuszczu.","l":0},{"t":"tf","q":"Do wykrycia tłuszczu w produkcie można wykorzystać prosty test tłustej plamy na papierze.","a":true,"ex":"Tłuszcz pozostawia charakterystyczny, przezroczysty ślad na papierze.","l":0},{"t":"f","q":"Ze wszystkich głównych składników pokarmowych, najwięcej energii w przeliczeniu na gram dostarcza _______.","a":"tłuszcz","acc":[],"ex":"To dlatego tłuszcz jest tak wydajnym magazynem energii.","l":0},{"t":"tf","q":"Woda i sole mineralne są związkami nieorganicznymi obecnymi w organizmach.","a":true,"ex":"W odróżnieniu od białek, tłuszczów, cukrów i kwasów nukleinowych, które są organiczne.","l":0},{"t":"o","q":"Wymień cztery grupy związków organicznych i jedną grupę związków nieorganicznych budujących organizmy.","a":"Związki organiczne: białka, tłuszcze, cukry, kwasy nukleinowe. Związek nieorganiczny: woda (można też podać sole mineralne).","l":0},{"t":"s","q":"Podstawową jednostką budowy organizmów jest:","a":"Komórka","ex":"Wszystkie organizmy żywe (poza wirusami) są zbudowane z komórek.","l":1},{"t":"s","q":"Element komórki zawierający materiał genetyczny i kierujący jej czynnościami to:","a":"Jądro komórkowe","ex":"Jądro komórkowe przechowuje DNA i kontroluje procesy zachodzące w komórce.","l":1},{"t":"tf","q":"Błona komórkowa oddziela wnętrze komórki od środowiska zewnętrznego.","a":true,"ex":"Błona komórkowa kontroluje też, co może wejść do komórki, a co z niej wyjść.","l":1},{"t":"s","q":"Ściana komórkowa nadaje komórce roślinnej:","a":"Sztywność i ochronę","ex":"Ściana komórkowa to sztywna, zewnętrzna warstwa otaczająca komórkę roślinną.","l":2},{"t":"f","q":"Wnętrze komórki, w którym znajdują się jej elementy, wypełnia _______.","a":"cytoplazma","acc":[],"ex":"Cytoplazma to galaretowata substancja wypełniająca komórkę.","l":1},{"t":"tf","q":"Duża wakuola jest strukturą charakterystyczną dla typowej komórki roślinnej.","a":true,"ex":"Wakuola magazynuje m.in. wodę i różne substancje, nadając komórce jędrność.","l":2},{"t":"s","q":"Komórka bakteryjna różni się od komórki roślinnej i zwierzęcej tym, że:","a":"Nie ma jądra komórkowego otoczonego błoną","ex":"Materiał genetyczny bakterii nie jest oddzielony błoną jądrową — to organizm prokariotyczny.","l":2},{"t":"tf","q":"Komórka zwierzęca posiada ścianę komórkową, podobnie jak komórka roślinna.","a":false,"ex":"Komórki zwierzęce mają tylko błonę komórkową, bez sztywnej ściany.","l":1},{"t":"s","q":"Element wspólny dla komórki roślinnej i zwierzęcej to:","a":"Jądro komórkowe","ex":"Zarówno komórka roślinna, jak i zwierzęca mają jądro komórkowe, cytoplazmę i błonę komórkową.","l":1},{"t":"f","q":"Zielony barwnik znajdujący się w chloroplastach, umożliwiający pochłanianie energii światła, to _______.","a":"chlorofil","acc":[],"ex":"Dzięki chlorofilowi liście mają zielony kolor i mogą przeprowadzać fotosyntezę.","l":2},{"t":"s","q":"Materiał genetyczny komórki zwierzęcej znajduje się przede wszystkim w:","a":"Jądrze komórkowym","ex":"Jądro komórkowe przechowuje i chroni DNA komórki.","l":1},{"t":"s","q":"Błona komórkowa:","a":"Otacza komórkę i kontroluje wymianę substancji","ex":"Błona komórkowa jest zewnętrzną granicą komórki.","l":1},{"t":"tf","q":"Cytoplazma znajduje się wewnątrz komórki, otoczona błoną komórkową.","a":true,"ex":"Cytoplazma wypełnia wnętrze komórki i zawiera jej organelle.","l":1},{"t":"s","q":"Komórka bakteryjna, w odróżnieniu od komórki roślinnej i zwierzęcej:","a":"Nie ma jądra komórkowego otoczonego błoną","ex":"Bakterie są organizmami prokariotycznymi — ich materiał genetyczny nie jest otoczony błoną jądrową.","l":2},{"t":"s","q":"Wakuola komórki roślinnej może magazynować:","a":"Wodę i różne substancje","ex":"Duża wakuola nadaje komórce jędrność i pełni funkcję magazynową.","l":2},{"t":"tf","q":"Każda komórka, niezależnie od rodzaju, wykonuje podstawowe czynności życiowe.","a":true,"ex":"Komórka jest podstawową, żywą jednostką budującą organizm.","l":1},{"t":"s","q":"Podstawową jednostką budowy organizmów jest:","a":"Komórka","ex":"Wszystkie organizmy żywe (poza wirusami) są zbudowane z komórek.","l":1},{"t":"tf","q":"Komórka jest najmniejszą jednostką budowy i funkcjonowania organizmów żywych.","a":true,"ex":"To fundamentalna zasada biologii komórki.","l":1},{"t":"f","q":"Najmniejsza jednostka budowy organizmu, zdolna do wykonywania czynności życiowych, to _______.","a":"komórka","acc":[],"ex":"Komórka jest podstawą budowy wszystkich organizmów żywych.","l":1},{"t":"s","q":"Jądro komórkowe:","a":"Zawiera materiał genetyczny i kieruje czynnościami komórki","ex":"Jądro komórkowe przechowuje DNA i kontroluje procesy zachodzące w komórce.","l":1},{"t":"tf","q":"Jądro komórkowe kieruje czynnościami życiowymi komórki.","a":true,"ex":"Dzieje się to dzięki informacji genetycznej zapisanej w DNA.","l":1},{"t":"s","q":"Błona komórkowa:","a":"Oddziela wnętrze komórki od środowiska i kontroluje wymianę substancji","ex":"Błona komórkowa jest zewnętrzną granicą każdej komórki.","l":1},{"t":"f","q":"Błona komórkowa kontroluje wymianę substancji między komórką a jej _______.","a":"środowiskiem","acc":["otoczeniem"],"ex":"To jedna z głównych funkcji błony komórkowej.","l":1},{"t":"s","q":"Cytoplazma:","a":"Wypełnia wnętrze komórki","ex":"Cytoplazma to galaretowata substancja wypełniająca wnętrze komórki.","l":1},{"t":"tf","q":"Cytoplazma wypełnia wnętrze komórki i zawiera jej organelle.","a":true,"ex":"To w cytoplazmie zanurzone są struktury komórkowe.","l":1},{"t":"o","q":"Wymień trzy elementy wspólne dla komórki roślinnej i zwierzęcej.","a":"Błona komórkowa, cytoplazma i jądro komórkowe.","l":1},{"t":"s","q":"Ściana komórkowa:","a":"Występuje u komórek roślinnych, nadając im sztywność","ex":"Ściana komórkowa nadaje komórce roślinnej stały kształt.","l":2},{"t":"tf","q":"Ściana komórkowa nadaje komórce roślinnej sztywność i ochronę.","a":true,"ex":"Dzięki niej rośliny mogą utrzymać stały kształt.","l":2},{"t":"s","q":"Chloroplasty występują w:","a":"Komórkach roślinnych","ex":"Chloroplasty umożliwiają roślinom przeprowadzanie fotosyntezy.","l":2},{"t":"f","q":"Miejscem, w którym zachodzi fotosynteza w komórce roślinnej, jest _______.","a":"chloroplast","acc":[],"ex":"To właśnie w chloroplastach znajduje się chlorofil.","l":2},{"t":"s","q":"Duża wakuola jest strukturą charakterystyczną dla:","a":"Typowej komórki roślinnej","ex":"Wakuola magazynuje wodę i różne substancje w komórce roślinnej.","l":2},{"t":"tf","q":"Wakuola komórki roślinnej magazynuje m.in. wodę i różne substancje.","a":true,"ex":"To jedna z głównych funkcji wakuoli.","l":2},{"t":"o","q":"Podaj trzy elementy charakterystyczne dla komórki roślinnej, których nie ma typowa komórka zwierzęca.","a":"Ściana komórkowa, chloroplasty oraz duża, centralna wakuola.","l":2},{"t":"tf","q":"Typowa komórka zwierzęca nie posiada chloroplastów.","a":true,"ex":"Zwierzęta nie przeprowadzają fotosyntezy.","l":1},{"t":"f","q":"Mitochondria są często nazywane „elektrowniami komórki”, ponieważ produkują w nich _______.","a":"energię","acc":[],"ex":"To dzięki mitochondriom komórka ma energię do pracy.","l":1},{"t":"tf","q":"Mitochondria występują zarówno w komórkach roślinnych, jak i zwierzęcych.","a":true,"ex":"Oddychanie komórkowe zachodzi w obu typach komórek.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego mitochondria są ważne dla komórki.","a":"W mitochondriach zachodzi oddychanie tlenowe, podczas którego uwalniana jest energia potrzebna do wszystkich procesów życiowych komórki.","l":1},{"t":"tf","q":"Błona komórkowa, cytoplazma i jądro komórkowe występują zarówno w komórce roślinnej, jak i zwierzęcej.","a":true,"ex":"To elementy wspólne dla obu typów komórek eukariotycznych.","l":1},{"t":"s","q":"Komórka bakteryjna różni się od komórki roślinnej i zwierzęcej tym, że:","a":"Nie ma jądra komórkowego otoczonego błoną","ex":"To podstawowa różnica między organizmami prokariotycznymi a eukariotycznymi.","l":2},{"t":"f","q":"Organizmy, których komórki nie mają jądra otoczonego błoną, nazywamy organizmami _______.","a":"prokariotycznymi","acc":[],"ex":"Przykładem są bakterie.","l":2},{"t":"s","q":"Organizmy, których komórki mają jądro otoczone błoną, nazywamy:","a":"Eukariotycznymi","ex":"Rośliny, zwierzęta i grzyby są organizmami eukariotycznymi.","l":2},{"t":"tf","q":"Rośliny i zwierzęta są organizmami eukariotycznymi, a bakterie — prokariotycznymi.","a":true,"ex":"To podstawowy podział organizmów ze względu na budowę komórki.","l":2},{"t":"o","q":"Wyjaśnij różnicę między organizmem prokariotycznym a eukariotycznym.","a":"Organizmy prokariotyczne (np. bakterie) mają komórki bez jądra komórkowego otoczonego błoną, natomiast organizmy eukariotyczne (np. rośliny, zwierzęta, grzyby) mają komórki z prawdziwym jądrem komórkowym, w którym znajduje się materiał genetyczny.","l":2},{"t":"s","q":"Który element komórki roślinnej odpowiada za jej sztywny kształt?","a":"Ściana komórkowa","ex":"Sztywna ściana komórkowa utrzymuje kształt komórki roślinnej.","l":2},{"t":"tf","q":"Dzięki ścianie komórkowej komórki roślinne zachowują sztywny, regularny kształt.","a":true,"ex":"To odróżnia je od komórek zwierzęcych, które mają tylko elastyczną błonę.","l":2},{"t":"s","q":"Zielony barwnik znajdujący się w chloroplastach, umożliwiający fotosyntezę, to:","a":"Chlorofil","ex":"Chlorofil pochłania energię światła potrzebną do fotosyntezy.","l":2},{"t":"f","q":"Zielony barwnik roślin, niezbędny do fotosyntezy, to _______.","a":"chlorofil","acc":[],"ex":"Chlorofil znajduje się w chloroplastach.","l":2},{"t":"tf","q":"Ściana komórkowa, chloroplasty i duża wakuola to elementy charakterystyczne dla komórki roślinnej.","a":true,"ex":"Żadnego z tych elementów nie ma typowa komórka zwierzęca.","l":2},{"t":"o","q":"Porównaj komórkę roślinną i zwierzęcą — podaj jedno podobieństwo i dwie różnice.","a":"Podobieństwo: obie mają błonę komórkową, cytoplazmę i jądro komórkowe. Różnice: komórka roślinna ma dodatkowo ścianę komórkową i chloroplasty, których nie ma komórka zwierzęca; komórka roślinna ma zwykle jedną dużą wakuolę, a komórka zwierzęca — małe, liczne wakuole lub żadnych.","l":2},{"t":"s","q":"Który element komórki pełni funkcję „centrum sterowania” komórką?","a":"Jądro komórkowe","ex":"Jądro zawiera instrukcje potrzebne do funkcjonowania całej komórki.","l":1},{"t":"f","q":"Jądro komórkowe pełni funkcję „centrum sterowania”, ponieważ zawiera _______ genetyczny.","a":"materiał","acc":[],"ex":"To DNA zawarte w jądrze reguluje pracę komórki.","l":1},{"t":"s","q":"Który proces zachodzi w chloroplastach?","a":"Fotosynteza","ex":"Chloroplasty są miejscem fotosyntezy.","l":2},{"t":"tf","q":"Fotosynteza zachodzi w chloroplastach, a oddychanie tlenowe w mitochondriach.","a":true,"ex":"To dwa różne procesy zachodzące w różnych organellach.","l":2},{"t":"s","q":"Materiał genetyczny (DNA) w komórce eukariotycznej znajduje się:","a":"W jądrze komórkowym","ex":"Jądro komórkowe chroni i przechowuje DNA.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego jądro komórkowe jest tak ważne dla funkcjonowania całej komórki.","a":"Jądro komórkowe zawiera materiał genetyczny (DNA), który stanowi „instrukcję” dla wszystkich procesów zachodzących w komórce — reguluje produkcję białek i kontroluje wszystkie czynności życiowe komórki.","l":1},{"t":"s","q":"Który organizm ma komórki bez jądra komórkowego otoczonego błoną?","a":"Bakteria","ex":"Bakterie są organizmami prokariotycznymi.","l":2},{"t":"tf","q":"Bakterie mają komórki bez jądra komórkowego otoczonego błoną.","a":true,"ex":"To definicyjna cecha organizmów prokariotycznych.","l":2},{"t":"f","q":"Duża, centralna wakuola nadaje komórce roślinnej odpowiednią _______ (twardość, sprężystość).","a":"jędrność","acc":[],"ex":"Dzięki temu roślina wygląda świeżo, gdy ma wystarczająco wody.","l":2},{"t":"s","q":"Który element komórki roślinnej pozwala jej zachować kształt, nawet gdy brakuje wody?","a":"Ściana komórkowa","ex":"Ściana komórkowa daje komórce mechaniczne wsparcie.","l":2},{"t":"tf","q":"Dzięki ścianie komórkowej roślina zachowuje pewien kształt, nawet przy niedoborze wody, choć może więdnąć.","a":true,"ex":"Sama ściana komórkowa nie zapobiega jednak całkowicie więdnięciu.","l":2},{"t":"o","q":"Wymień elementy typowej komórki zwierzęcej.","a":"Błona komórkowa, cytoplazma, jądro komórkowe oraz mitochondria (i inne organelle).","l":1},{"t":"s","q":"Który proces zachodzi zarówno w komórce roślinnej, jak i zwierzęcej?","a":"Oddychanie komórkowe","ex":"Oddychanie komórkowe jest wspólne dla obu typów komórek.","l":1},{"t":"tf","q":"Oddychanie komórkowe zachodzi zarówno w komórkach roślinnych, jak i zwierzęcych.","a":true,"ex":"Obie grupy organizmów potrzebują energii z oddychania.","l":1},{"t":"s","q":"Fotosynteza zachodzi:","a":"Wyłącznie w komórkach zawierających chloroplasty","ex":"Bez chloroplastów fotosynteza nie jest możliwa.","l":2},{"t":"f","q":"Fotosynteza może zachodzić wyłącznie w komórkach posiadających _______.","a":"chloroplasty","acc":[],"ex":"To dlatego zwierzęta, nie mając chloroplastów, nie przeprowadzają fotosyntezy.","l":2},{"t":"s","q":"Który element budowy komórki bakteryjnej jest podobny do elementu komórki roślinnej?","a":"Ściana komórkowa","ex":"Obie komórki mają ścianę komórkową, choć o innej budowie chemicznej.","l":2},{"t":"tf","q":"Zarówno komórka bakteryjna, jak i roślinna mają ścianę komórkową, choć zbudowaną z innych substancji.","a":true,"ex":"To interesujące podobieństwo mimo wielu różnic.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego mimo posiadania ściany komórkowej przez bakterie i rośliny, ich komórki znacząco się różnią.","a":"Mimo że obie mają ścianę komórkową, komórka bakteryjna nie ma jądra komórkowego otoczonego błoną (jest prokariotyczna) ani chloroplastów, podczas gdy komórka roślinna ma prawdziwe jądro komórkowe i chloroplasty umożliwiające fotosyntezę.","l":2},{"t":"s","q":"Który element komórki roślinnej odpowiada za magazynowanie substancji zapasowych, np. wody czy barwników?","a":"Wakuola","ex":"Wakuola pełni funkcję magazynową w komórce roślinnej.","l":2},{"t":"f","q":"Wakuola komórki roślinnej może magazynować wodę oraz różne _______.","a":"substancje","acc":[],"ex":"To m.in. barwniki czy substancje zapasowe.","l":2},{"t":"tf","q":"Płetwa nie jest elementem budowy komórki — to organ całego zwierzęcia.","a":true,"ex":"Płetwy zbudowane są z wielu komórek i tkanek.","l":null},{"t":"s","q":"Który proces zachodzi w mitochondriach obu typów komórek (roślinnej i zwierzęcej)?","a":"Oddychanie tlenowe, uwalniające energię","ex":"Mitochondria pełnią tę samą funkcję w obu typach komórek.","l":2},{"t":"o","q":"Porównaj rolę chloroplastów i mitochondriów w komórce roślinnej.","a":"Chloroplasty umożliwiają fotosyntezę, czyli wytwarzanie substancji pokarmowych z wykorzystaniem energii światła, natomiast mitochondria umożliwiają oddychanie komórkowe, czyli uwalnianie energii zgromadzonej w tych substancjach pokarmowych — oba procesy są ze sobą powiązane.","l":2},{"t":"tf","q":"Komórka bakteryjna ma błonę komórkową, cytoplazmę i materiał genetyczny, ale nie ma jądra otoczonego błoną.","a":true,"ex":"To odróżnia ją od komórek eukariotycznych.","l":2},{"t":"f","q":"Najbardziej charakterystycznymi elementami odróżniającymi komórkę roślinną od zwierzęcej są ściana komórkowa i _______.","a":"chloroplasty","acc":[],"ex":"Obu tych elementów nie ma typowa komórka zwierzęca.","l":2},{"t":"tf","q":"Komórka bakteryjna, w odróżnieniu od komórek roślin, zwierząt i grzybów, nie ma jądra otoczonego błoną.","a":true,"ex":"To kluczowa różnica między prokariotami a eukariotami.","l":2},{"t":"o","q":"Wyjaśnij funkcję błony komórkowej.","a":"Błona komórkowa otacza komórkę, oddzielając jej wnętrze od środowiska zewnętrznego, oraz kontroluje, jakie substancje mogą wejść do komórki lub z niej wyjść.","l":1},{"t":"tf","q":"Komórka roślinna różni się od zwierzęcej przede wszystkim obecnością ściany komórkowej, chloroplastów i dużej wakuoli.","a":true,"ex":"To trzy główne cechy wyróżniające komórkę roślinną.","l":2},{"t":"f","q":"Błona komórkowa występuje we wszystkich typach komórek, w tym w komórkach _______.","a":"bakteryjnych","acc":[],"ex":"To jeden z niewielu elementów wspólnych dla wszystkich typów komórek.","l":2},{"t":"s","q":"Dlaczego komórki w organizmie wielokomórkowym mogą mieć różny kształt i budowę?","a":"Są przystosowane do pełnienia różnych funkcji w organizmie","ex":"Wyspecjalizowane komórki lepiej wykonują swoje konkretne zadania.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego różne komórki organizmu wielokomórkowego mogą mieć różny kształt i budowę.","a":"Komórki organizmu wielokomórkowego są wyspecjalizowane do pełnienia różnych funkcji (np. komórki mięśniowe, nerwowe, roślinne komórki liścia), dlatego ich kształt i budowa wewnętrzna są dostosowane do tych konkretnych zadań.","l":null},{"t":"tf","q":"Komórka jest mniejszą jednostką organizacyjną niż tkanka, a tkanka mniejszą niż organ.","a":true,"ex":"To odzwierciedla rosnący poziom złożoności budowy organizmu.","l":null},{"t":"o","q":"Uzupełnij i wyjaśnij schemat: komórka → tkanka → organ → organizm.","a":"Komórki o podobnej budowie i funkcji tworzą tkankę; tkanki razem tworzą organ pełniący określoną funkcję (np. liść, serce); organy współpracujące ze sobą tworzą cały organizm.","l":null},{"t":"s","q":"Samożywność polega na:","a":"Wytwarzaniu pokarmu z prostych związków nieorganicznych","ex":"Organizmy samożywne, jak rośliny, same produkują pokarm np. w procesie fotosyntezy.","l":3},{"t":"s","q":"Organizmem samożywnym jest:","a":"Roślina zielona","ex":"Rośliny zielone wytwarzają pokarm same, dzięki fotosyntezie.","l":3},{"t":"tf","q":"Fotosynteza jest przykładem sposobu odżywiania samożywnego.","a":true,"ex":"Podczas fotosyntezy roślina sama wytwarza substancje pokarmowe.","l":3},{"t":"f","q":"Rośliny nazywane są producentami, ponieważ same wytwarzają związki _______ z prostych substancji nieorganicznych.","a":"organiczne","acc":[],"ex":"To właśnie czyni je podstawą łańcuchów pokarmowych w przyrodzie.","l":3},{"t":"s","q":"Cudzożywność polega na:","a":"Pobieraniu gotowych związków organicznych","ex":"Organizmy cudzożywne, jak zwierzęta czy grzyby, muszą pobierać gotowy pokarm z otoczenia.","l":4},{"t":"s","q":"Do organizmów cudzożywnych zaliczamy:","a":"Pieczarkę","ex":"Grzyby, w tym pieczarka, nie mają chlorofilu i muszą pobierać gotowe substancje odżywcze.","l":4},{"t":"tf","q":"Wszystkie rośliny zielone są organizmami cudzożywnymi.","a":false,"ex":"Rośliny zielone są samożywne — same wytwarzają pokarm dzięki fotosyntezie.","l":4},{"t":"s","q":"Organizm pobierający pokarm od innego organizmu i szkodzący mu, prowadzi tryb życia:","a":"Pasożytniczy","ex":"Pasożyt czerpie korzyści kosztem żywego organizmu gospodarza.","l":4},{"t":"s","q":"Do fotosyntezy roślina potrzebuje:","a":"Wody, dwutlenku węgla i światła","ex":"To trzy niezbędne składniki reakcji fotosyntezy.","l":3},{"t":"tf","q":"Podczas fotosyntezy roślina pobiera tlen jako główny substrat.","a":false,"ex":"Roślina pobiera dwutlenek węgla — tlen jest produktem ubocznym fotosyntezy.","l":3},{"t":"tf","q":"Grzyby są organizmami cudzożywnymi, ponieważ nie mają chlorofilu.","a":true,"ex":"Bez chlorofilu grzyby nie mogą przeprowadzać fotosyntezy i muszą pobierać gotowe substancje odżywcze.","l":4},{"t":"s","q":"Przykładem organizmu pasożytniczego jest:","a":"Tasiemiec","ex":"Tasiemiec żyje kosztem organizmu gospodarza, czerpiąc z niego pokarm.","l":4},{"t":"f","q":"Organizmy, które same wytwarzają związki organiczne, nazywamy _______.","a":"samożywnymi","acc":[],"ex":"Rośliny zielone są klasycznym przykładem organizmów samożywnych.","l":3},{"t":"s","q":"Organizmy pobierające gotowe związki organiczne z otoczenia nazywamy:","a":"Cudzożywnymi","ex":"Zwierzęta i grzyby są przykładami organizmów cudzożywnych.","l":4},{"t":"tf","q":"Rośliny zielone są producentami w ekosystemie, ponieważ same wytwarzają materię organiczną.","a":true,"ex":"To dlatego rośliny stanowią podstawę większości łańcuchów pokarmowych.","l":3},{"t":"s","q":"Podczas fotosyntezy roślina pobiera dwutlenek węgla i wydziela:","a":"Tlen","ex":"Tlen jest produktem ubocznym fotosyntezy, uwalnianym do atmosfery.","l":3},{"t":"tf","q":"Człowiek jest organizmem cudzożywnym.","a":true,"ex":"Człowiek, jak wszystkie zwierzęta, musi pobierać gotowy pokarm z otoczenia.","l":4},{"t":"s","q":"Samożywność polega na:","a":"Wytwarzaniu pokarmu z prostych związków nieorganicznych","ex":"Organizmy samożywne, jak rośliny, same produkują pokarm.","l":3},{"t":"tf","q":"Rośliny zielone są organizmami samożywnymi.","a":true,"ex":"Same wytwarzają pokarm dzięki fotosyntezie.","l":3},{"t":"f","q":"Organizmy, które same wytwarzają pokarm, nazywamy organizmami _______.","a":"samożywnymi","acc":[],"ex":"Rośliny zielone i niektóre bakterie są samożywne.","l":3},{"t":"s","q":"Organizmem samożywnym jest:","a":"Roślina zielona","ex":"Rośliny zielone wytwarzają pokarm same, dzięki fotosyntezie.","l":3},{"t":"tf","q":"Fotosynteza jest podstawowym sposobem odżywiania samożywnego roślin.","a":true,"ex":"Dzięki fotosyntezie rośliny same produkują substancje pokarmowe.","l":3},{"t":"s","q":"Rośliny nazywane są producentami, ponieważ:","a":"Same wytwarzają związki organiczne z prostych substancji nieorganicznych","ex":"To definicja roli producenta w ekosystemie.","l":3},{"t":"f","q":"Organizmy samożywne, wytwarzające materię organiczną, nazywamy w ekosystemie _______.","a":"producentami","acc":[],"ex":"Producenci stanowią podstawę większości łańcuchów pokarmowych.","l":3},{"t":"s","q":"Cudzożywność polega na:","a":"Pobieraniu gotowych związków organicznych z otoczenia","ex":"Organizmy cudzożywne muszą zdobywać gotowy pokarm.","l":4},{"t":"tf","q":"Zwierzęta są organizmami cudzożywnymi.","a":true,"ex":"Muszą pobierać pokarm z otoczenia, nie mogą go wytworzyć same.","l":4},{"t":"o","q":"Wyjaśnij różnicę między organizmem samożywnym a cudzożywnym.","a":"Organizm samożywny sam wytwarza pokarm (związki organiczne) z prostych substancji nieorganicznych, np. w procesie fotosyntezy, natomiast organizm cudzożywny musi pobierać gotowe substancje odżywcze z otoczenia, np. zjadając inne organizmy.","l":3},{"t":"s","q":"Organizmy cudzożywne w ekosystemie nazywamy:","a":"Konsumentami","ex":"Konsumenci odżywiają się innymi organizmami.","l":4},{"t":"f","q":"Organizmy odżywiające się innymi organizmami nazywamy w ekosystemie _______.","a":"konsumentami","acc":[],"ex":"To organizmy cudzożywne w ekosystemie.","l":4},{"t":"s","q":"Do organizmów cudzożywnych zaliczamy:","a":"Zwierzęta i grzyby","ex":"Zarówno zwierzęta, jak i grzyby są cudzożywne.","l":4},{"t":"tf","q":"Grzyby, podobnie jak zwierzęta, są organizmami cudzożywnymi.","a":true,"ex":"Grzyby nie mają chlorofilu i muszą pobierać gotowy pokarm.","l":4},{"t":"s","q":"Fotosynteza wymaga:","a":"Wody, dwutlenku węgla i energii świetlnej","ex":"To trzy niezbędne składniki reakcji fotosyntezy.","l":3},{"t":"f","q":"Do fotosyntezy roślina potrzebuje wody, dwutlenku węgla oraz energii _______.","a":"świetlnej","acc":[],"ex":"Energia świetlna jest niezbędna do przebiegu fotosyntezy.","l":3},{"t":"s","q":"Produktem fotosyntezy są:","a":"Substancje pokarmowe (cukry) i tlen","ex":"To dwa główne produkty fotosyntezy.","l":3},{"t":"tf","q":"Podczas fotosyntezy roślina wytwarza cukry oraz uwalnia tlen.","a":true,"ex":"Tlen jest produktem ubocznym fotosyntezy.","l":3},{"t":"o","q":"Zapisz słownie, co roślina pobiera, a co wytwarza podczas fotosyntezy.","a":"Roślina pobiera wodę i dwutlenek węgla, wykorzystując energię światła słonecznego, a wytwarza substancje pokarmowe (cukry) oraz uwalnia tlen jako produkt uboczny.","l":3},{"t":"tf","q":"Pasożyt czerpie substancje odżywcze z organizmu żywiciela, szkodząc mu.","a":true,"ex":"To definicja pasożytnictwa.","l":4},{"t":"s","q":"Pasożytnictwo to szczególny rodzaj:","a":"Cudzożywności, w którym organizm szkodzi żywicielowi","ex":"Pasożyt jest cudzożywny, ale dodatkowo szkodzi żywicielowi.","l":4},{"t":"f","q":"Organizm żyjący kosztem innego organizmu i szkodzący mu nazywamy _______.","a":"pasożytem","acc":[],"ex":"Pasożyt czerpie korzyści kosztem żywiciela.","l":4},{"t":"s","q":"Grzyb saprotroficzny odżywia się:","a":"Szczątkami obumarłych organizmów","ex":"Saprotrofy rozkładają martwą materię organiczną.","l":4},{"t":"tf","q":"Grzyby saprotroficzne, jak wiele bakterii, rozkładają martwą materię organiczną.","a":true,"ex":"To ważna funkcja ekologiczna tych organizmów.","l":4},{"t":"s","q":"Organizmy rozkładające martwą materię organiczną w ekosystemie nazywamy:","a":"Destruentami (rozkładającymi)","ex":"Destruenci zamykają obieg materii w przyrodzie.","l":4},{"t":"f","q":"Organizmy rozkładające szczątki innych organizmów, np. niektóre bakterie i grzyby, nazywamy w ekosystemie _______.","a":"destruentami","acc":[],"ex":"To trzecia, obok producentów i konsumentów, grupa organizmów w ekosystemie.","l":4},{"t":"o","q":"Wyjaśnij rolę destruentów (organizmów rozkładających) w ekosystemie.","a":"Destruenci, np. bakterie i grzyby saprotroficzne, rozkładają martwą materię organiczną (szczątki roślin i zwierząt) na prostsze związki, które wracają do środowiska i mogą być ponownie wykorzystane przez producentów — dzięki temu materia krąży w przyrodzie.","l":4},{"t":"s","q":"Euglena jest ciekawym organizmem, ponieważ:","a":"Może być zarówno samożywna (fotosynteza), jak i cudzożywna (pobieranie pokarmu)","ex":"Euglena łączy cechy organizmów samo- i cudzożywnych.","l":4},{"t":"tf","q":"Euglena, w zależności od warunków, może przeprowadzać fotosyntezę lub pobierać gotowy pokarm.","a":true,"ex":"To wyjątkowa cecha wśród protistów.","l":4},{"t":"s","q":"Które stwierdzenie o roślinach zielonych jest prawdziwe?","a":"Są samożywne, dzięki fotosyntezie wytwarzają własny pokarm","ex":"To podstawowa, prawdziwa cecha roślin zielonych.","l":3},{"t":"f","q":"Rośliny zielone są samożywne, ponieważ przeprowadzają _______.","a":"fotosyntezę","acc":[],"ex":"To dzięki fotosyntezie same wytwarzają pokarm.","l":3},{"t":"s","q":"Do producentów w typowym ekosystemie lądowym zaliczamy przede wszystkim:","a":"Rośliny zielone","ex":"Rośliny zielone są głównymi producentami na lądzie.","l":3},{"t":"tf","q":"Rośliny zielone są głównymi producentami w większości ekosystemów lądowych.","a":true,"ex":"To one wytwarzają większość materii organicznej dostępnej dla innych organizmów.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego rośliny są nazywane podstawą łańcucha pokarmowego.","a":"Rośliny, jako producenci, same wytwarzają materię organiczną w procesie fotosyntezy, którą następnie wykorzystują roślinożercy, a tych z kolei zjadają drapieżnicy — dlatego wszystkie wyższe poziomy łańcucha pokarmowego zależą pośrednio od roślin.","l":3},{"t":"s","q":"Zwierzę roślinożerne odżywiające się wyłącznie roślinami jest przykładem organizmu:","a":"Cudzożywnego","ex":"Zjadanie roślin nie czyni zwierzęcia samożywnym — nadal musi pobierać gotowy pokarm.","l":4},{"t":"tf","q":"Zwierzęta roślinożerne są organizmami cudzożywnymi, mimo że jedzą rośliny, a nie inne zwierzęta.","a":true,"ex":"Cudzożywność dotyczy sposobu zdobywania pokarmu, niezależnie od jego rodzaju.","l":4},{"t":"f","q":"Grzyby są cudzożywne, ponieważ nie mają _______, niezbędnego do fotosyntezy.","a":"chlorofilu","acc":[],"ex":"To kluczowa różnica między grzybami a roślinami.","l":4},{"t":"s","q":"Który proces jest bezpośrednio związany z samożywnością większości roślin?","a":"Fotosynteza","ex":"Fotosynteza jest podstawą samożywności roślin.","l":3},{"t":"tf","q":"Fotosynteza jest podstawowym procesem umożliwiającym samożywność roślin zielonych.","a":true,"ex":"Dzięki niej roślina sama wytwarza pokarm.","l":3},{"t":"s","q":"Bakterie fotosyntetyzujące, np. sinice, są przykładem organizmów:","a":"Samożywnych","ex":"Sinice, mimo że są bakteriami, przeprowadzają fotosyntezę.","l":3},{"t":"o","q":"Podaj przykład organizmu samożywnego niebędącego rośliną.","a":"Np. sinice (bakterie zdolne do fotosyntezy) lub niektóre protisty, jak euglena w warunkach umożliwiających fotosyntezę.","l":3},{"t":"tf","q":"Wilk jest przykładem zwierzęcia drapieżnego, odżywiającego się innymi zwierzętami.","a":true,"ex":"To typowy przykład drapieżnika w polskich lasach.","l":4},{"t":"f","q":"Sosna, trawa i pokrzywa są przykładami organizmów _______.","a":"samożywnych","acc":[],"ex":"Wszystkie trzy przeprowadzają fotosyntezę.","l":3},{"t":"tf","q":"Pies, pieczarka i tasiemiec są przykładami organizmów cudzożywnych.","a":true,"ex":"Żaden z nich nie przeprowadza fotosyntezy.","l":4},{"t":"o","q":"Podaj po jednym przykładzie: organizmu samożywnego, cudzożywnego drapieżnego, cudzożywnego roślinożernego i pasożytniczego.","a":"Samożywny: sosna. Cudzożywny drapieżny: wilk. Cudzożywny roślinożerny: sarna. Pasożytniczy: tasiemiec.","l":3},{"t":"s","q":"Który proces zachodzący w liściach roślin dostarcza materii organicznej całej roślinie?","a":"Fotosynteza","ex":"To w liściach zachodzi większość fotosyntezy rośliny.","l":3},{"t":"tf","q":"Substancje pokarmowe wytworzone w liściach podczas fotosyntezy są transportowane do innych części rośliny.","a":true,"ex":"Transportuje je łyko.","l":3},{"t":"s","q":"Dlaczego rośliny są niezbędnym elementem większości ekosystemów lądowych?","a":"Są głównym źródłem materii organicznej i tlenu dla innych organizmów","ex":"Rośliny są podstawą łańcuchów pokarmowych i źródłem tlenu.","l":3},{"t":"f","q":"Rośliny są niezbędne dla ekosystemu, ponieważ produkują materię
