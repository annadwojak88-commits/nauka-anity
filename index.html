"negatywne","acc":[],"ex":"Przykładem negatywnego wpływu jest zaraza ziemniaka.","l":2},{"t":"o","q":"Podaj przykład pożytecznego i szkodliwego oddziaływania protistów.","a":"Pożyteczne: okrzemki i inne glony jednokomórkowe produkują tlen w wodzie i mogą być podstawą łańcucha pokarmowego (chlorella bywa też wykorzystywana jako suplement diety). Szkodliwe: lęgniowiec ziemniaczany wywołuje groźną chorobę roślin — zarazę ziemniaka.","l":2},{"t":"tf","q":"Jedyną wspólną cechą łączącą wszystkie protisty jest budowa eukariotyczna — poza tym są bardzo zróżnicowane.","a":true,"ex":"To dlatego protisty bywają nazywane „grupą zbiorczą” w klasyfikacji organizmów.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego pieczarka nie jest zaliczana do protistów, mimo że oba są organizmami eukariotycznymi.","a":"Pieczarka jest grzybem — organizmem wielokomórkowym o specyficznej budowie (grzybnia, owocnik) i sposobie odżywiania (cudzożywność przez wydzielanie enzymów na zewnątrz ciała), podczas gdy protisty to zwykle proste, jednokomórkowe organizmy eukariotyczne, niezaliczane do królestwa grzybów.","l":2},{"t":"w","q":"wirus","a":"Bardzo mały twór, który nie ma budowy komórkowej i namnaża się tylko wewnątrz żywych komórek.","l":1,"k":1},{"t":"w","q":"bakteria","a":"Jednokomórkowy organizm bez jądra komórkowego; może być pożyteczny lub chorobotwórczy.","l":1,"k":1},{"t":"w","q":"pasożyt","a":"Organizm żyjący kosztem innego organizmu (żywiciela), któremu szkodzi.","l":null,"k":1},{"t":"w","q":"saprofit (saprobiont)","a":"Organizm odżywiający się martwą materią organiczną i ją rozkładający.","l":null,"k":1},{"t":"w","q":"protisty","a":"Organizmy jednokomórkowe z jądrem komórkowym, np. pantofelek, euglena.","l":2,"k":1},{"t":"w","q":"grzybnia","a":"Splot cienkich nitek grzyba (strzępek), który rośnie w podłożu.","l":3,"k":1},{"t":"w","q":"owocnik","a":"Część grzyba wyrastająca nad podłoże, w której powstają zarodniki, np. kapelusz z trzonem.","l":3,"k":1},{"t":"w","q":"zarodnik","a":"Mała komórka służąca do rozmnażania i rozprzestrzeniania się grzybów, a także niektórych roślin.","l":3,"k":1},{"t":"w","q":"pleśń","a":"Grzyb wielokomórkowy tworzący puszystą grzybnię, często na zepsutej żywności.","l":3,"k":1},{"t":"w","q":"drożdże","a":"Jednokomórkowe grzyby wykorzystywane do wypieku chleba i produkcji napojów.","l":3,"k":1},{"t":"w","q":"porost","a":"Organizm złożony z grzyba i glonu, które żyją we współpracy.","l":3,"k":1},{"t":"w","q":"symbioza","a":"Współżycie dwóch organizmów, z którego oba odnoszą korzyść.","l":3,"k":1},{"t":"w","q":"szczepionka","a":"Preparat uczący układ odpornościowy rozpoznawania drobnoustroju, który chroni przed chorobą.","l":1,"k":1},{"t":"w","q":"antybiotyk","a":"Lek zwalczający bakterie; nie działa na wirusy.","l":1,"k":1},{"t":"s","q":"Klucz do oznaczania organizmów jest szczególnie przydatny do:","a":"Rozpoznawania nieznanego gatunku na podstawie jego cech","ex":"Klucz prowadzi krok po kroku do ustalenia nazwy gatunku.","_rm":true,"l":0},{"t":"f","q":"Klucz do oznaczania organizmów prowadzi użytkownika przez kolejne _______ dotyczące cech danego organizmu.","a":"pytania","acc":[],"ex":"Odpowiedzi na te pytania prowadzą do rozpoznania gatunku.","_rm":true,"l":0},{"t":"tf","q":"Korzystając z klucza do oznaczania, odpowiadamy na kolejne pytania dotyczące cech organizmu, aż uda się ustalić jego nazwę.","a":true,"ex":"To typowy sposób działania klucza do oznaczania.","_rm":true,"l":0},{"t":"s","q":"Klucz do oznaczania organizmów zwykle prowadzi od:","a":"Pytań ogólnych do coraz bardziej szczegółowych, aż do ustalenia gatunku","ex":"Taka struktura ułatwia stopniowe zawężanie możliwości.","_rm":true,"l":0},{"t":"f","q":"Klucze do oznaczania organizmów prowadzą zwykle od pytań ogólnych do coraz bardziej _______.","a":"szczegółowych","acc":[],"ex":"To ułatwia dojście do właściwej nazwy gatunku.","_rm":true,"l":0},{"t":"tf","q":"Wirusy zaliczamy do jednego z pięciu królestw organizmów.","a":false,"ex":"Wirusy nie mają budowy komórkowej, dlatego stoją poza systemem pięciu królestw.","_rm":true,"l":0},{"t":"s","q":"Podstawową jednostką klasyfikacji biologicznej jest:","a":"Gatunek","ex":"Gatunek to najmniejsza i podstawowa jednostka systematyczna.","_rm":true,"l":0},{"t":"s","q":"Jednostki klasyfikacji uszeregowane od najmniejszej do największej to:","a":"Gatunek, rodzaj, rodzina, rząd, gromada, typ, królestwo","ex":"Od najmniejszej: gatunek → rodzaj → rodzina → rząd → gromada → typ → królestwo.","_rm":true,"l":0},{"t":"f","q":"Nazwa gatunkowa organizmu składa się z nazwy rodzajowej i nazwy _______.","a":"gatunkowej","acc":[],"ex":"Np. w nazwie „niedźwiedź brunatny” słowo „brunatny” to właśnie nazwa gatunkowa.","_rm":true,"l":0},{"t":"s","q":"W nazwie „niedźwiedź brunatny” nazwą rodzajową jest:","a":"Niedźwiedź","ex":"Pierwszy człon nazwy (tu: niedźwiedź) to nazwa rodzajowa.","_rm":true,"l":0},{"t":"tf","q":"Osobniki należące do tego samego gatunku mogą się krzyżować i wydawać płodne potomstwo.","a":true,"ex":"To jedna z definicji gatunku w biologii.","_rm":true,"l":0},{"t":"tf","q":"Klasyfikacją (systematyką) organizmów zajmuje się dział biologii zwany systematyką.","a":true,"ex":"Systematyka porządkuje różnorodność organizmów, grupując je według pokrewieństwa i podobieństwa cech.","_rm":true,"l":0},{"t":"f","q":"Nauka zajmująca się opisywaniem różnorodności organizmów i ich klasyfikowaniem to _______.","a":"systematyka","acc":[],"ex":"Systematyka porządkuje gatunki w większe grupy, np. rodzaje, rodziny czy rzędy.","_rm":true,"l":0},{"t":"s","q":"Do królestwa roślin zaliczamy m.in.:","a":"Paprocie i mchy","ex":"Paprocie i mchy to rośliny zarodnikowe, należące do królestwa roślin.","_rm":true,"l":0},{"t":"tf","q":"Klucz do oznaczania organizmów pomaga ustalić przynależność gatunkową na podstawie widocznych cech.","a":true,"ex":"Klucze do oznaczania krok po kroku prowadzą do rozpoznania gatunku na podstawie jego cech.","_rm":true,"l":0},{"t":"s","q":"Karol Linneusz jest twórcą:","a":"Dwuczłonowego (binominalnego) nazewnictwa gatunków","ex":"Linneusz wprowadził system nazywania gatunków dwoma słowami — nazwą rodzajową i gatunkową.","_rm":true,"l":0},{"t":"tf","q":"Grzyby stanowią odrębne królestwo organizmów, różne od roślin i zwierząt.","a":true,"ex":"Grzyby różnią się od roślin (brak chlorofilu) i od zwierząt (sposób odżywiania i budowa) na tyle, że tworzą osobne królestwo.","_rm":true,"l":0},{"t":"f","q":"Wymień jedno z pięciu królestw organizmów, do którego zaliczamy m.in. pieczarki i pleśnie: królestwo _______.","a":"grzybów","acc":[],"ex":"Grzyby, mimo podobieństwa do roślin, tworzą osobne królestwo.","_rm":true,"l":0},{"t":"s","q":"Do królestwa protistów zaliczamy m.in.:","a":"Amebę i pantofelka","ex":"Ameba i pantofelek to klasyczne przykłady protistów.","_rm":true,"l":0},{"t":"tf","q":"Rośliny i zwierzęta to dwa z pięciu królestw organizmów.","a":true,"ex":"Obok nich wyróżniamy jeszcze bakterie, protisty i grzyby.","_rm":true,"l":0},{"t":"s","q":"Ile królestw organizmów wyróżnia się we współczesnej klasyfikacji biologicznej?","a":"Pięć","ex":"Bakterie, protisty, grzyby, rośliny i zwierzęta — razem pięć królestw.","_rm":true,"l":0},{"t":"o","q":"Wymień pięć królestw organizmów i podaj po jednym przykładzie organizmu z każdego z nich.","a":"Bakterie (np. pałeczka okrężnicy), protisty (np. pantofelek), grzyby (np. pieczarka), rośliny (np. sosna), zwierzęta (np. pies).","_rm":true,"l":0},{"t":"tf","q":"Wirusy są zaliczane do królestwa bakterii.","a":false,"ex":"Wirusy stoją poza systemem pięciu królestw — nie mają budowy komórkowej.","_rm":true,"l":0},{"t":"f","q":"Wirusy stoją poza systemem pięciu królestw, ponieważ nie mają budowy _______.","a":"komórkowej","acc":[],"ex":"To kluczowa cecha odróżniająca wirusy od organizmów komórkowych.","_rm":true,"l":0},{"t":"s","q":"Jednostki klasyfikacji biologicznej uszeregowane od najmniejszej do największej to:","a":"Gatunek, rodzaj, rodzina, rząd, gromada, typ, królestwo","ex":"To podstawowa drabina jednostek systematycznych w biologii.","_rm":true,"l":0},{"t":"s","q":"Największą jednostką klasyfikacji biologicznej jest:","a":"Królestwo","ex":"Królestwo obejmuje najszerszą grupę organizmów spośród wymienionych jednostek.","_rm":true,"l":0},{"t":"s","q":"Najmniejszą, podstawową jednostką klasyfikacji biologicznej jest:","a":"Gatunek","ex":"Gatunek to fundament, na którym opiera się cała klasyfikacja biologiczna.","_rm":true,"l":0},{"t":"tf","q":"Rodzaj jest jednostką większą od gatunku, ale mniejszą od rodziny.","a":true,"ex":"To środkowy szczebel w drabinie: gatunek → rodzaj → rodzina.","_rm":true,"l":0},{"t":"f","q":"Jednostka klasyfikacji biologicznej większa od rodziny, a mniejsza od gromady, to _______.","a":"rząd","acc":[],"ex":"Rząd grupuje kilka spokrewnionych rodzin.","_rm":true,"l":0},{"t":"s","q":"Która kolejność jednostek jest poprawna, idąc od największej do najmniejszej?","a":"Królestwo, typ, gromada, rząd, rodzina, rodzaj, gatunek","ex":"To odwrócona kolejność drabiny systematycznej — od najszerszej do najwęższej jednostki.","_rm":true,"l":0},{"t":"o","q":"Wymień w kolejności rosnącej (od najmniejszej do największej) siedem podstawowych jednostek klasyfikacji biologicznej.","a":"Gatunek, rodzaj, rodzina, rząd, gromada, typ, królestwo.","_rm":true,"l":0},{"t":"s","q":"Gatunek to grupa organizmów, które:","a":"Mają podobną budowę i mogą się krzyżować, dając płodne potomstwo","ex":"To klasyczna definicja gatunku wykorzystywana w biologii.","_rm":true,"l":0},{"t":"tf","q":"Osobniki należące do różnych gatunków zawsze mogą się krzyżować i dawać płodne potomstwo.","a":false,"ex":"To właśnie niemożność wydania płodnego potomstwa jest jedną z granic między gatunkami.","_rm":true,"l":0},{"t":"f","q":"Podstawowym kryterium przynależności do tego samego gatunku jest zdolność do krzyżowania się i wydawania _______ potomstwa.","a":"płodnego","acc":[],"ex":"Płodność potomstwa jest kluczowym testem przynależności gatunkowej.","_rm":true,"l":0},{"t":"s","q":"Dwa osobniki należą do tego samego gatunku, jeśli:","a":"Mają podobną budowę i mogą wydać płodne potomstwo","ex":"Miejsce zamieszkania, kolor czy wiek nie decydują o przynależności gatunkowej.","_rm":true,"l":0},{"t":"s","q":"Twórcą dwuczłonowego systemu nazewnictwa gatunków był:","a":"Karol Linneusz","ex":"Linneusz w XVIII wieku wprowadził system nazw dwuczłonowych, używany do dziś.","_rm":true,"l":0},{"t":"s","q":"Nazwa gatunkowa organizmu, według systemu Linneusza, składa się z:","a":"Dwóch wyrazów: nazwy rodzajowej i gatunkowej","ex":"To właśnie nazywamy nazewnictwem dwuczłonowym (binominalnym).","_rm":true,"l":0},{"t":"f","q":"W nazwie „Panthera leo” (lew) pierwszy wyraz to nazwa _______.","a":"rodzajowa","acc":[],"ex":"Panthera to nazwa rodzajowa, wspólna np. dla lwów, tygrysów i lampartów.","_rm":true,"l":0},{"t":"tf","q":"W nazwie dwuczłonowej drugi wyraz to nazwa gatunkowa.","a":true,"ex":"Pierwszy wyraz to nazwa rodzajowa, drugi — gatunkowa.","_rm":true,"l":0},{"t":"s","q":"W nazwie „niedźwiedź brunatny” nazwą gatunkową jest:","a":"Brunatny","ex":"Drugi człon nazwy określa konkretny gatunek w obrębie rodzaju.","_rm":true,"l":0},{"t":"o","q":"Wyjaśnij, na czym polega dwuczłonowe nazewnictwo gatunków wprowadzone przez Linneusza.","a":"Każdy gatunek otrzymuje nazwę złożoną z dwóch wyrazów: nazwy rodzajowej (wspólnej dla organizmów blisko spokrewnionych) i nazwy gatunkowej (dokładnie określającej dany gatunek).","_rm":true,"l":0},{"t":"s","q":"Dział biologii zajmujący się klasyfikowaniem organizmów nazywamy:","a":"Systematyką","ex":"Systematyka porządkuje różnorodność organizmów według ich podobieństwa i pokrewieństwa.","_rm":true,"l":0},{"t":"tf","q":"Systematyka porządkuje organizmy według ich podobieństwa i pokrewieństwa.","a":true,"ex":"To główne zadanie tej dziedziny biologii.","_rm":true,"l":0},{"t":"f","q":"Nauka zajmująca się opisywaniem różnorodności organizmów i ich klasyfikowaniem to _______.","a":"systematyka","acc":[],"ex":"Dzięki systematyce łatwiej poruszać się w ogromnej różnorodności organizmów.","_rm":true,"l":0},{"t":"s","q":"Klucz do oznaczania organizmów pomaga:","a":"Ustalić przynależność gatunkową na podstawie widocznych cech","ex":"Klucz prowadzi krok po kroku, eliminując kolejne możliwości, aż zostanie jeden pasujący gatunek.","_rm":true,"l":0},{"t":"tf","q":"Korzystając z klucza do oznaczania, zwykle odpowiadamy na kolejne pytania dotyczące cech organizmu.","a":true,"ex":"To typowy sposób działania klucza — pytanie po pytaniu, aż do rozpoznania gatunku.","_rm":true,"l":0},{"t":"o","q":"Wyjaśnij, w jaki sposób klucz do oznaczania organizmów pomaga ustalić gatunek nieznanej rośliny lub zwierzęcia.","a":"Klucz prowadzi krok po kroku przez pytania dotyczące widocznych cech organizmu (np. kształt liścia, liczba nóg), eliminując kolejne możliwości, aż pozostanie jedna pasująca nazwa gatunku.","_rm":true,"l":0},{"t":"s","q":"Człowiek jako gatunek biologiczny nosi łacińską nazwę:","a":"Homo sapiens","ex":"Homo sapiens to naukowa nazwa gatunkowa człowieka.","_rm":true,"l":0},{"t":"tf","q":"Homo sapiens to naukowa (łacińska) nazwa gatunkowa człowieka.","a":true,"ex":"To przykład zastosowania systemu Linneusza do naszego własnego gatunku.","_rm":true,"l":0},{"t":"f","q":"Grupa spokrewnionych rodzajów tworzy jednostkę zwaną _______.","a":"rodziną","acc":[],"ex":"Rodzina to szczebel powyżej rodzaju w klasyfikacji biologicznej.","_rm":true,"l":0},{"t":"tf","q":"Typ jest jednostką mniejszą od gromady.","a":false,"ex":"Typ jest jednostką większą od gromady — to gromada mieści się w obrębie typu.","_rm":true,"l":0},{"t":"s","q":"Do jakiego królestwa należy człowiek?","a":"Zwierząt","ex":"Człowiek jest ssakiem, a więc należy do królestwa zwierząt.","_rm":true,"l":0},{"t":"f","q":"Człowiek, podobnie jak pies czy kot, należy do królestwa _______.","a":"zwierząt","acc":[],"ex":"Wszystkie te organizmy są cudzożywne i mają zdolność ruchu.","_rm":true,"l":0},{"t":"tf","q":"Sosna i dąb należą do królestwa roślin.","a":true,"ex":"Oba te drzewa są organizmami samożywnymi, przeprowadzającymi fotosyntezę.","_rm":true,"l":0},{"t":"s","q":"Do królestwa bakterii zaliczamy organizmy:","a":"O budowie komórkowej, bez jądra komórkowego","ex":"Bakterie to organizmy prokariotyczne — mają komórki, ale bez jądra otoczonego błoną.","_rm":true,"l":0},{"t":"o","q":"Na czym polega różnica między klasyfikacją naukową a potocznym nazywaniem zwierząt i roślin (np. „robaczek”, „kwiatek”)?","a":"Klasyfikacja naukowa opiera się na ścisłych kryteriach (budowa, pokrewieństwo, zdolność do krzyżowania) i nadaje każdemu gatunkowi jedną, precyzyjną nazwę łacińską, podczas gdy nazwy potoczne bywają nieprecyzyjne i różnią się w zależności od regionu czy języka.","_rm":true,"l":0},{"t":"s","q":"Przynależność organizmu do danego gatunku ustala się przede wszystkim na podstawie:","a":"Podobieństwa budowy i zdolności do wydawania płodnego potomstwa","ex":"To kryteria biologiczne, a nie cechy zewnętrzne czy geograficzne, decydują o przynależności gatunkowej.","_rm":true,"l":0},{"t":"tf","q":"Dwa osobniki mogą wyglądać bardzo podobnie, ale należeć do różnych gatunków.","a":true,"ex":"Podobieństwo wyglądu nie zawsze oznacza przynależność do tego samego gatunku.","_rm":true,"l":0},{"t":"s","q":"Które stwierdzenie o systematyce jest prawdziwe?","a":"Systematyka porządkuje różnorodność organizmów według ich podobieństwa i pokrewieństwa","ex":"To główne zadanie systematyki jako działu biologii.","_rm":true,"l":0},{"t":"f","q":"Grupa rodzin o wspólnych cechach tworzy jednostkę systematyczną zwaną _______.","a":"rzędem","acc":[],"ex":"Rząd to jednostka pośrednia między rodziną a gromadą.","_rm":true,"l":0},{"t":"tf","q":"Rząd jest jednostką większą od rodziny, a mniejszą od gromady.","a":true,"ex":"To kolejny szczebel drabiny systematycznej, powyżej rodziny.","_rm":true,"l":0}],"lessons":["Klasyfikacja organizmów","Wirusy i bakterie","Różnorodność protistów","Budowa i różnorodność grzybów. Porosty"]},{"id":"b4","title":"Tkanki i organy roślinne","icon":"🌿","q":[{"t":"s","q":"Tkanka to zespół:","a":"Komórek o podobnej budowie, pełniących określoną funkcję","ex":"Tkanka to najmniejszy poziom organizacji zbudowany z podobnych komórek.","l":0},{"t":"tf","q":"Tkanka przewodząca odpowiada za transport wody, soli mineralnych i produktów fotosyntezy.","a":true,"ex":"Tkankę przewodzącą tworzą drewno (transport wody) i łyko (transport substancji pokarmowych).","l":0},{"t":"s","q":"Wodę i sole mineralne w roślinie transportuje:","a":"Drewno","ex":"Drewno prowadzi wodę i sole mineralne od korzeni w górę rośliny.","l":0},{"t":"s","q":"Produkty fotosyntezy transportowane są w roślinie przez:","a":"Łyko","ex":"Łyko transportuje substancje odżywcze wytworzone w liściach do reszty rośliny.","l":0},{"t":"f","q":"Podstawową funkcją korzenia jest pobieranie z gleby wody i _______ mineralnych.","a":"soli","acc":[],"ex":"Korzeń pobiera wodę wraz z rozpuszczonymi w niej solami mineralnymi.","l":1},{"t":"tf","q":"Korzeń spichrzowy, jak u marchwi, magazynuje substancje odżywcze.","a":true,"ex":"Korzenie spichrzowe (marchew, burak, rzodkiewka) są zgrubiałe, bo gromadzą zapasy pokarmowe.","l":1},{"t":"s","q":"Aparaty szparkowe, przez które roślina paruje wodę i wymienia gazy, znajdują się głównie:","a":"Na dolnej stronie liścia","ex":"Umieszczenie ich na dolnej stronie liścia ogranicza nadmierne parowanie wody.","l":3},{"t":"tf","q":"Fotosynteza zachodzi głównie w liściach, dzięki obecności zielonego barwnika — chlorofilu.","a":true,"ex":"Chlorofil znajduje się w chloroplastach i umożliwia wykorzystanie energii światła słonecznego.","l":3},{"t":"s","q":"Tkanka okrywająca (skórka) pełni funkcję:","a":"Ochronną — chroni roślinę przed utratą wody i uszkodzeniami","ex":"Skórka to zewnętrzna warstwa rośliny, chroniąca przed czynnikami zewnętrznymi.","l":0},{"t":"tf","q":"Miękisz asymilacyjny liścia zbudowany jest z miękiszu palisadowego i gąbczastego.","a":true,"ex":"Te dwie warstwy miękiszu odpowiadają za większość fotosyntezy zachodzącej w liściu.","l":3},{"t":"s","q":"Korzeń palowy, charakterystyczny np. dla dębu, to korzeń:","a":"Z wyraźnie zaznaczonym, silnie rozwiniętym korzeniem głównym","ex":"Korzeń palowy sięga głęboko w głąb gleby, dzięki silnie rozwiniętemu korzeniowi głównemu.","l":1},{"t":"f","q":"Roślina wytwarza tlen jako produkt uboczny procesu _______.","a":"fotosyntezy","acc":[],"ex":"Podczas fotosyntezy roślina produkuje cukry, a tlen wydzielany jest jako produkt uboczny.","l":3},{"t":"s","q":"Liście zmodyfikowane w kolce, jak u kaktusa, pełnią funkcję:","a":"Ochrony rośliny i ograniczenia parowania wody","ex":"Kolce zmniejszają powierzchnię parowania i chronią roślinę przed zjadaniem przez zwierzęta.","l":3},{"t":"tf","q":"Łodygi niektórych roślin, np. ziemniaka, mogą być zmodyfikowane w bulwy podziemne.","a":true,"ex":"Bulwa ziemniaka to zgrubiała, podziemna część łodygi, magazynująca skrobię.","l":2},{"t":"s","q":"Pęd rośliny tworzą:","a":"Łodyga wraz z liśćmi i pąkami","ex":"Pęd to nadziemna część rośliny — łodyga z liśćmi i pąkami.","l":2},{"t":"s","q":"Nasiono zawiera zarodek oraz materiały zapasowe potrzebne do:","a":"Kiełkowania i rozwoju siewki","ex":"Zgromadzone w nasieniu substancje odżywcze zapewniają energię potrzebną do kiełkowania.","l":null},{"t":"tf","q":"Korzenie oddechowe występują u niektórych roślin bagiennych i pomagają w pobieraniu tlenu.","a":true,"ex":"Rośliny rosnące w podmokłej glebie potrzebują dodatkowego sposobu na dostęp do tlenu.","l":1},{"t":"s","q":"Rozmnażanie wegetatywne (bezpłciowe) roślin może odbywać się np. za pomocą:","a":"Rozłogów, bulw i sadzonek","ex":"Rozmnażanie wegetatywne nie wymaga nasion — nowa roślina powstaje z fragmentu rośliny macierzystej.","l":2},{"t":"s","q":"Tkanka to zespół:","a":"Komórek o podobnej budowie, pełniących określoną funkcję","ex":"Tkanka to najmniejszy poziom organizacji zbudowany z podobnych komórek.","l":0},{"t":"tf","q":"Tkanka twórcza umożliwia wzrost rośliny dzięki intensywnym podziałom komórek.","a":true,"ex":"To główna funkcja tkanki twórczej.","l":0},{"t":"f","q":"Tkanka, której komórki intensywnie się dzielą, umożliwiając wzrost rośliny, to tkanka _______.","a":"twórcza","acc":[],"ex":"Tkanka twórcza znajduje się m.in. na końcach pędów i korzeni.","l":0},{"t":"s","q":"Tkanka okrywająca (skórka) pełni głównie funkcję:","a":"Ochronną","ex":"Skórka chroni roślinę przed czynnikami zewnętrznymi.","l":0},{"t":"tf","q":"Tkanka okrywająca chroni roślinę przed nadmierną utratą wody i uszkodzeniami.","a":true,"ex":"To podstawowa funkcja skórki rośliny.","l":0},{"t":"s","q":"Tkanka przewodząca odpowiada za:","a":"Transport substancji w roślinie","ex":"Drewno i łyko to dwa rodzaje tkanki przewodzącej.","l":0},{"t":"o","q":"Wymień pięć podstawowych rodzajów tkanek roślinnych.","a":"Tkanka twórcza, okrywająca, miękiszowa, przewodząca i wzmacniająca.","l":0},{"t":"s","q":"Wodę i sole mineralne w roślinie transportuje:","a":"Drewno","ex":"Drewno prowadzi wodę i sole mineralne od korzeni w górę rośliny.","l":0},{"t":"s","q":"Produkty fotosyntezy transportowane są w roślinie przez:","a":"Łyko","ex":"Łyko transportuje substancje odżywcze z liści do reszty rośliny.","l":0},{"t":"tf","q":"Drewno i łyko to dwa rodzaje tkanki przewodzącej.","a":true,"ex":"Razem tworzą wiązki przewodzące rośliny.","l":0},{"t":"f","q":"Drewno transportuje wodę i sole mineralne, a łyko transportuje _______ fotosyntezy.","a":"produkty","acc":[],"ex":"To dwa różne kierunki transportu w roślinie.","l":0},{"t":"s","q":"Tkanka wzmacniająca pełni głównie funkcję:","a":"Zapewnienia roślinie wytrzymałości mechanicznej","ex":"Dzięki niej roślina zachowuje odpowiedni kształt i odporność na uszkodzenia.","l":0},{"t":"tf","q":"Tkanka wzmacniająca pomaga utrzymać roślinę w odpowiednim kształcie i chroni ją przed uszkodzeniami mechanicznymi.","a":true,"ex":"Występuje m.in. w łodygach.","l":0},{"t":"s","q":"Miękisz asymilacyjny liścia pełni głównie funkcję:","a":"Fotosyntezy","ex":"Zawiera liczne chloroplasty umożliwiające fotosyntezę.","l":0},{"t":"f","q":"Miękisz zawierający liczne chloroplasty i przeprowadzający fotosyntezę to miękisz _______.","a":"asymilacyjny","acc":[],"ex":"To główny typ miękiszu w liściu.","l":0},{"t":"o","q":"Wyjaśnij, czym różni się funkcja miękiszu asymilacyjnego od miękiszu spichrzowego.","a":"Miękisz asymilacyjny zawiera dużo chloroplastów i przeprowadza fotosyntezę, natomiast miękisz spichrzowy magazynuje substancje zapasowe, np. skrobię, i zwykle nie zawiera chloroplastów.","l":0},{"t":"s","q":"Podstawową funkcją korzenia jest:","a":"Pobieranie wody i soli mineralnych oraz utrzymywanie rośliny w podłożu","ex":"To dwie kluczowe funkcje korzenia.","l":1},{"t":"tf","q":"Korzeń pobiera z gleby wodę wraz z rozpuszczonymi w niej solami mineralnymi.","a":true,"ex":"Woda i sole mineralne są pobierane razem przez korzeń.","l":1},{"t":"s","q":"Włośniki:","a":"Zwiększają powierzchnię chłonną korzenia","ex":"Dzięki włośnikom korzeń może efektywniej pobierać wodę.","l":1},{"t":"f","q":"Włośniki są przedłużeniami komórek _______ korzenia.","a":"skórki","acc":[],"ex":"To zewnętrzna warstwa komórek korzenia, z której wyrastają włośniki.","l":1},{"t":"tf","q":"Włośniki znajdują się w strefie włośnikowej korzenia.","a":true,"ex":"To specjalny obszar korzenia odpowiedzialny za pobieranie wody.","l":1},{"t":"s","q":"System korzeniowy złożony z wielu podobnej grubości korzeni, wyrastających z podstawy łodygi, nazywamy:","a":"Systemem wiązkowym","ex":"Przykładem są korzenie traw.","l":1},{"t":"tf","q":"System korzeniowy wiązkowy jest charakterystyczny m.in. dla traw, np. pszenicy.","a":true,"ex":"Trawy nie mają wyróżniającego się korzenia głównego.","l":1},{"t":"o","q":"Wyjaśnij różnicę między systemem korzeniowym palowym a wiązkowym.","a":"System palowy ma wyraźnie zaznaczony, silnie rozwinięty korzeń główny z odchodzącymi od niego korzeniami bocznymi (np. u dębu), natomiast system wiązkowy składa się z wielu podobnej grubości korzeni wyrastających z podstawy łodygi, bez wyróżniającego się korzenia głównego (np. u traw).","l":1},{"t":"s","q":"Która roślina ma korzeń spichrzowy?","a":"Marchew","ex":"Korzeń marchwi jest zgrubiały, bo magazynuje substancje zapasowe.","l":1},{"t":"tf","q":"Korzeń spichrzowy magazynuje substancje zapasowe rośliny.","a":true,"ex":"To ich charakterystyczna funkcja.","l":1},{"t":"f","q":"Marchew, burak i rzodkiewka mają korzenie typu _______.","a":"spichrzowego","acc":[],"ex":"Wszystkie te warzywa magazynują substancje odżywcze w korzeniu.","l":1},{"t":"tf","q":"Łodyga wraz z liśćmi, pąkami, kwiatami i owocami tworzy pęd.","a":true,"ex":"Pęd to cała nadziemna część rośliny zbudowana z tych elementów.","l":2},{"t":"s","q":"Łodyga wraz z liśćmi, pąkami, kwiatami i owocami tworzy:","a":"Pęd","ex":"To definicja pędu rośliny.","l":2},{"t":"f","q":"Bulwa ziemniaka to przykład zmodyfikowanej podziemnej _______.","a":"łodygi","acc":[],"ex":"Bulwa magazynuje skrobię jako materiał zapasowy.","l":2},{"t":"s","q":"Ziemniak jest przykładem rośliny posiadającej przekształconą:","a":"Łodygę (bulwę)","ex":"Bulwa ziemniaka to zgrubiała, podziemna część łodygi.","l":2},{"t":"tf","q":"Cebula jest przykładem przekształconej łodygi wykorzystywanej do magazynowania substancji zapasowych.","a":true,"ex":"Cebula magazynuje substancje odżywcze w grubych, mięsistych liściach otaczających krótką łodygę.","l":2},{"t":"s","q":"Truskawka może rozmnażać się za pomocą:","a":"Rozłogów","ex":"Rozłogi to płożące się pędy, na których powstają nowe rośliny.","l":2},{"t":"o","q":"Podaj trzy przykłady zmodyfikowanych łodyg wykorzystywanych przez rośliny i ich funkcje.","a":"Bulwa (np. ziemniaka) — magazynowanie substancji zapasowych; cebula (np. cebuli zwyczajnej) — magazynowanie i rozmnażanie wegetatywne; rozłogi (np. truskawki) — rozmnażanie wegetatywne.","l":2},{"t":"s","q":"Aparaty szparkowe, przez które roślina paruje wodę i wymienia gazy, znajdują się głównie:","a":"Na dolnej stronie liścia","ex":"Umieszczenie ich na dolnej stronie liścia ogranicza nadmierne parowanie wody.","l":3},{"t":"tf","q":"Aparaty szparkowe umieszczone są głównie na dolnej stronie liścia, co ogranicza nadmierne parowanie wody.","a":true,"ex":"Górna strona liścia jest bardziej narażona na bezpośrednie działanie słońca.","l":3},{"t":"s","q":"Najważniejszą funkcją liścia jest:","a":"Przeprowadzanie fotosyntezy","ex":"To główna funkcja liścia w roślinie.","l":3},{"t":"f","q":"Utrata wody przez roślinę w postaci pary wodnej nazywa się _______.","a":"transpiracją","acc":[],"ex":"Transpiracja zachodzi głównie przez aparaty szparkowe.","l":3},{"t":"s","q":"Transpiracja zachodzi głównie przez:","a":"Aparaty szparkowe","ex":"To przez nie roślina traci wodę w postaci pary wodnej.","l":3},{"t":"tf","q":"Fotosynteza zachodzi głównie w liściach, dzięki obecności zielonego barwnika — chlorofilu.","a":true,"ex":"Chlorofil znajduje się w chloroplastach komórek liścia.","l":3},{"t":"o","q":"Wyjaśnij znaczenie transpiracji dla rośliny.","a":"Transpiracja, czyli parowanie wody przez aparaty szparkowe, pomaga w transporcie wody i soli mineralnych z korzeni ku górze rośliny oraz zapobiega przegrzaniu liścia w słoneczne dni.","l":3},{"t":"s","q":"Liść wąski, wydłużony, o gładkich brzegach, przypominający ostrze, nazywamy liściem:","a":"Lancetowatym","ex":"Taki kształt mają np. liście wierzby.","l":3},{"t":"tf","q":"Liście roślin mogą różnić się kształtem, np. być sercowate, lancetowate, dłoniaste lub pierzaste.","a":true,"ex":"Kształt liścia jest jedną z cech pomocnych w rozpoznawaniu gatunku rośliny.","l":3},{"t":"f","q":"Płaska, szeroka część liścia to _______ liściowa.","a":"blaszka","acc":[],"ex":"Blaszka liściowa to główna, zielona część liścia.","l":3},{"t":"s","q":"Elementem łączącym blaszkę liściową z łodygą jest:","a":"Ogonek liściowy","ex":"Ogonek liściowy podtrzymuje blaszkę i łączy ją z łodygą.","l":3},{"t":"tf","q":"Ogonek liściowy łączy blaszkę liściową z łodygą.","a":true,"ex":"Nie wszystkie liście mają jednak ogonek — niektóre są siedzące, przyrośnięte bezpośrednio do łodygi.","l":3},{"t":"o","q":"Wymień dwa podstawowe elementy budowy zewnętrznej liścia.","a":"Blaszka liściowa i ogonek liściowy.","l":3},{"t":"s","q":"Liście zmodyfikowane w kolce, jak u kaktusa, pełnią funkcję:","a":"Ochrony rośliny i ograniczenia parowania wody","ex":"Kolce zmniejszają powierzchnię parowania i chronią roślinę przed zjadaniem.","l":3},{"t":"tf","q":"Kolce kaktusa to zmodyfikowane liście, ograniczające utratę wody.","a":true,"ex":"Fotosyntezę u kaktusa przejmuje zielona, mięsista łodyga.","l":3},{"t":"s","q":"Do przeprowadzenia fotosyntezy niezbędne są:","a":"Woda, dwutlenek węgla i energia świetlna","ex":"To trzy niezbędne składniki reakcji fotosyntezy.","l":3},{"t":"f","q":"Podczas fotosyntezy roślina wytwarza substancje pokarmowe i wydziela _______.","a":"tlen","acc":[],"ex":"Tlen jest produktem ubocznym fotosyntezy.","l":3},{"t":"s","q":"Produktem fotosyntezy jest m.in.:","a":"Tlen","ex":"Tlen powstaje jako produkt uboczny fotosyntezy.","l":3},{"t":"tf","q":"Fotosynteza zachodzi w chloroplastach, dzięki obecności chlorofilu.","a":true,"ex":"Chlorofil pochłania energię światła potrzebną do fotosyntezy.","l":3},{"t":"o","q":"Zapisz słownie uproszczony przebieg fotosyntezy: co roślina pobiera, a co wytwarza.","a":"Roślina pobiera wodę i dwutlenek węgla oraz wykorzystuje energię światła słonecznego, a w wyniku fotosyntezy wytwarza substancje pokarmowe (cukry) oraz uwalnia tlen.","l":3},{"t":"s","q":"Nowa roślina powstała w wyniku rozmnażania wegetatywnego jest:","a":"Bardzo podobna genetycznie do rośliny macierzystej","ex":"Powstaje z fragmentu rośliny macierzystej, więc dziedziczy identyczny materiał genetyczny.","l":2},{"t":"f","q":"Ponieważ nowa roślina w rozmnażaniu wegetatywnym powstaje z fragmentu rośliny macierzystej, jest do niej bardzo podobna _______.","a":"genetycznie","acc":[],"ex":"To efekt braku udziału zapłodnienia w tym typie rozmnażania.","l":2},{"t":"tf","q":"Rozmnażanie wegetatywne nie wymaga udziału kwiatów ani nasion.","a":true,"ex":"Nowa roślina powstaje bezpośrednio z organu wegetatywnego rośliny macierzystej.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego rozmnażanie wegetatywne jest korzystne dla rolnika chcącego uzyskać rośliny o dokładnie takich samych cechach.","a":"Ponieważ nowa roślina powstaje z fragmentu rośliny macierzystej, dziedziczy identyczny materiał genetyczny, dzięki czemu rolnik ma pewność, że wszystkie nowe rośliny będą miały te same, pożądane cechy, np. smak owoców.","l":2},{"t":"s","q":"Korzenie oddechowe występują u niektórych roślin:","a":"Bagiennych, pomagając w pobieraniu tlenu","ex":"Rośliny bagienne potrzebują dodatkowego sposobu na dostęp do tlenu.","l":1},{"t":"tf","q":"Korzenie oddechowe pomagają roślinom bagiennym w pobieraniu tlenu z powietrza.","a":true,"ex":"Wystają one często ponad powierzchnię podmokłej gleby.","l":1},{"t":"s","q":"Nasiono zawiera zarodek oraz materiały zapasowe potrzebne do:","a":"Kiełkowania i rozwoju siewki","ex":"Substancje zapasowe dają energię potrzebną do kiełkowania.","l":null},{"t":"f","q":"Podstawową funkcją korzenia jest pobieranie z gleby wody i _______ mineralnych.","a":"soli","acc":[],"ex":"Korzeń pobiera wodę wraz z rozpuszczonymi w niej solami mineralnymi.","l":1},{"t":"tf","q":"Korzeń może pełnić więcej niż jedną funkcję, np. pobierania wody i magazynowania substancji zapasowych.","a":true,"ex":"Przykładem jest korzeń spichrzowy marchwi.","l":1},{"t":"o","q":"Wyjaśnij różnicę między organami wegetatywnymi a generatywnymi rośliny.","a":"Organy wegetatywne (korzeń, łodyga, liść) odpowiadają za wzrost, odżywianie i podstawowe funkcje życiowe rośliny, natomiast organy generatywne (kwiat, owoc, nasiono) są związane z rozmnażaniem płciowym rośliny.","l":null},{"t":"s","q":"Prawidłowa droga wody w roślinie to:","a":"Gleba → korzeń → łodyga → liście","ex":"Woda wędruje od korzenia w górę rośliny.","l":2},{"t":"tf","q":"Woda wędruje w roślinie od korzenia, przez łodygę, aż do liści.","a":true,"ex":"To typowa droga transportu wody w roślinie.","l":2},{"t":"s","q":"Uszkodzenie drewna w łodydze najbardziej zaburzy transport:","a":"Wody i soli mineralnych","ex":"Drewno odpowiada za transport wody i soli mineralnych.","l":2},{"t":"f","q":"Uszkodzenie łyka najbardziej zaburzy transport _______ fotosyntezy.","a":"produktów","acc":[],"ex":"Łyko transportuje substancje odżywcze wytworzone w liściach.","l":2},{"t":"tf","q":"Uszkodzenie łyka zaburza głównie transport produktów fotosyntezy, a nie wody.","a":true,"ex":"Za transport wody odpowiada drewno, a nie łyko.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego uszkodzenie korzeni może prowadzić do więdnięcia liści, mimo że liście są zdrowe.","a":"Korzenie odpowiadają za pobieranie wody z gleby. Jeśli są uszkodzone, roślina nie może dostarczyć wystarczającej ilości wody do liści, przez co więdną, mimo że same nie są uszkodzone.","l":1},{"t":"s","q":"Rośliny rosnące w bardzo suchym środowisku często mają:","a":"Grube, mięsiste liście magazynujące wodę lub liście zredukowane do kolców","ex":"To typowe przystosowania roślin do suchego klimatu.","l":3},{"t":"tf","q":"Rośliny rosnące w suchym środowisku często ograniczają utratę wody dzięki zredukowanym liściom lub grubej, woskowatej skórce.","a":true,"ex":"Takie przystosowania pomagają przetrwać w warunkach niedoboru wody.","l":3},{"t":"s","q":"Dlaczego liście większości roślin mają dużą, płaską powierzchnię?","a":"Zwiększa to powierzchnię chłonącą światło potrzebne do fotosyntezy","ex":"Duża powierzchnia liścia zwiększa efektywność fotosyntezy.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego liście większości roślin są szerokie i płaskie.","a":"Szeroka i płaska blaszka liściowa zwiększa powierzchnię, na którą pada światło słoneczne, co zwiększa efektywność fotosyntezy zachodzącej w liściu.","l":3},{"t":"w","q":"tkanka twórcza","a":"Tkanka złożona z komórek, które się dzielą, dzięki czemu roślina rośnie.","l":0,"k":1},{"t":"w","q":"tkanka okrywająca","a":"Tkanka chroniąca roślinę z zewnątrz, np. skórka.","l":0,"k":1},{"t":"w","q":"tkanka przewodząca","a":"Tkanka transportująca wodę i substancje odżywcze w roślinie (drewno i łyko).","l":0,"k":1},{"t":"w","q":"tkanka miękiszowa","a":"Tkanka wypełniająca wnętrze roślin, w której zachodzi fotosynteza lub magazynuje się substancje zapasowe.","l":0,"k":1},{"t":"w","q":"tkanka wzmacniająca","a":"Tkanka o grubych ścianach komórek, która nadaje roślinie sztywność.","l":0,"k":1},{"t":"w","q":"korzeń","a":"Organ rośliny, który mocuje ją w podłożu oraz pobiera wodę i sole mineralne.","l":1,"k":1},{"t":"w","q":"włośnik","a":"Cienki wyrostek komórki skórki korzenia, który zwiększa powierzchnię pobierania wody.","l":1,"k":1},{"t":"w","q":"łodyga","a":"Organ rośliny, który podtrzymuje liście i kwiaty oraz transportuje substancje.","l":2,"k":1},{"t":"w","q":"liść","a":"Organ rośliny, w którym głównie zachodzi fotosynteza.","l":3,"k":1},{"t":"w","q":"aparat szparkowy","a":"Zespół komórek w skórce liścia tworzący szparkę, przez którą roślina wymienia gazy i oddaje parę wodną.","l":3,"k":1},{"t":"w","q":"transpiracja","a":"Parowanie wody z roślin, głównie przez szparki w liściach.","l":3,"k":1},{"t":"w","q":"organ","a":"Wyodrębniona część rośliny zbudowana z kilku tkanek, np. korzeń, łodyga, liść.","l":null,"k":1}],"lessons":["Tkanki roślinne","Korzeń – organ podziemny rośliny","Pęd. Budowa i funkcje łodygi","Liść – wytwórnia pokarmu"]},{"id":"b5","title":"Różnorodność roślin","icon":"🌸","q":[{"t":"s","q":"Mchy to rośliny, które:","a":"Nie mają prawdziwych korzeni — zamiast nich mają chwytniki","ex":"Mchy są zbudowane prościej niż paprocie — zamiast korzeni mają chwytniki.","l":0},{"t":"tf","q":"Mchy rosną głównie w miejscach wilgotnych i zacienionych.","a":true,"ex":"Mchy potrzebują wilgoci do rozmnażania, dlatego preferują wilgotne siedliska.","l":0},{"t":"s","q":"Za utrzymywanie mchu w podłożu odpowiadają:","a":"Chwytniki","ex":"Chwytniki mocują roślinę do podłoża, ale nie pobierają wody tak sprawnie jak korzenie.","l":0},{"t":"f","q":"Pokolenie mchu, które widzimy jako zieloną roślinkę, to _______ (gametofit czy sporofit?).","a":"gametofit","acc":[],"ex":"U mchów to właśnie gametofit jest pokoleniem dominującym i widocznym gołym okiem.","l":0},{"t":"s","q":"Paprocie, w odróżnieniu od mchów, posiadają:","a":"Prawdziwe korzenie, łodygę (kłącze) i liście","ex":"Paprocie mają bardziej złożoną budowę niż mchy — prawdziwe organy: korzeń, łodygę i liście.","l":1},{"t":"tf","q":"Paprocie rozmnażają się za pomocą nasion.","a":false,"ex":"Paprocie to rośliny zarodnikowe — rozmnażają się za pomocą zarodników, nie nasion.","l":1},{"t":"s","q":"Zarodnie u paproci znajdują się najczęściej:","a":"Na spodniej stronie liści","ex":"Charakterystyczne skupienia zarodni (kupki zarodni) widać na spodniej stronie liści paproci.","l":1},{"t":"s","q":"Skrzypy i widłaki, podobnie jak paprocie:","a":"Są roślinami zarodnikowymi","ex":"Wszystkie trzy grupy rozmnażają się za pomocą zarodników.","l":1},{"t":"tf","q":"Węgiel kamienny powstał m.in. z obumarłych, prehistorycznych paproci, skrzypów i widłaków.","a":true,"ex":"Miliony lat temu te rośliny tworzyły ogromne lasy, z których po obumarciu powstały pokłady węgla.","l":1},{"t":"s","q":"Cecha charakterystyczna widłaków to:","a":"Łodygi płożące się po ziemi, przypominające sznury","ex":"Widłaki mają długie, płożące się łodygi z drobnymi listkami.","l":1},{"t":"s","q":"Do mchów zaliczamy np.:","a":"Torfowiec i płonnik","ex":"Torfowiec i płonnik to popularne, dobrze znane gatunki mchów.","l":0},{"t":"tf","q":"Torfowce mają zdolność magazynowania dużych ilości wody w swoich komórkach.","a":true,"ex":"Dzięki temu torfowce mogą chłonąć wodę jak gąbka, tworząc podmokłe torfowiska.","l":0},{"t":"s","q":"Z obumarłych torfowców, w warunkach beztlenowych i dużej wilgotności, powstaje:","a":"Torf","ex":"Torf powstaje ze szczątków roślin torfowiskowych, głównie torfowców, w warunkach ograniczonego dostępu tlenu.","l":0},{"t":"f","q":"Rośliny zarodnikowe rozmnażają się za pomocą _______, a nie nasion.","a":"zarodników","acc":[],"ex":"Mchy, paprocie, skrzypy i widłaki to właśnie rośliny zarodnikowe.","l":0},{"t":"s","q":"Mchy i paprocie potrzebują wody do rozmnażania, ponieważ:","a":"Plemniki muszą dopłynąć do komórki jajowej","ex":"U tych roślin męskie komórki płciowe (plemniki) poruszają się w wodzie, by dotrzeć do komórki jajowej.","l":0},{"t":"tf","q":"Skrzypy mają w łodydze dużo krzemionki, dlatego dawniej używano ich do szorowania naczyń.","a":true,"ex":"Krzemionka sprawia, że łodygi skrzypu są szorstkie, co wykorzystywano jak dzisiejszą druciak.","l":1},{"t":"s","q":"Paprocie preferują siedliska:","a":"Wilgotne i zacienione, np. lasy","ex":"Paprocie najlepiej rosną w cienistych, wilgotnych miejscach, np. w lesie.","l":1},{"t":"s","q":"Widłak i skrzyp, obok paproci, zaliczane są do roślin:","a":"Zarodnikowych","ex":"Wszystkie trzy grupy rozmnażają się za pomocą zarodników, nie nasion.","l":1},{"t":"tf","q":"Mchy odgrywają ważną rolę w ekosystemie, ponieważ zatrzymują wodę i zapobiegają erozji gleby.","a":true,"ex":"Poduchowate skupiska mchu działają jak naturalna gąbka chroniąca glebę.","l":0},{"t":"s","q":"Cecha budowy paproci ułatwiająca rozpoznanie gatunku to przede wszystkim:","a":"Kształt i podział liścia paprociowego","ex":"Paprocie nie mają kwiatów ani owoców, dlatego do rozpoznawania gatunku wykorzystuje się kształt liści.","l":1},{"t":"s","q":"Mchy to rośliny, które:","a":"Nie mają prawdziwych korzeni — zamiast nich mają chwytniki","ex":"Mchy mają prostszą budowę niż paprocie.","l":0},{"t":"tf","q":"Mchy mają prawdziwe korzenie, podobnie jak paprocie.","a":false,"ex":"Mchy nie mają prawdziwych korzeni — zamiast nich mają chwytniki.","l":0},{"t":"f","q":"Organy mchów przypominające korzenie, ale prostsze w budowie, nazywamy _______.","a":"chwytnikami","acc":[],"ex":"Chwytniki mocują mech do podłoża, ale nie pobierają wody tak sprawnie jak korzenie.","l":0},{"t":"s","q":"Funkcją chwytników u mchów jest głównie:","a":"Przytwierdzanie rośliny do podłoża","ex":"Chwytniki mocują mech, ale nie zastępują w pełni funkcji korzenia.","l":0},{"t":"tf","q":"Mchy rosną głównie w miejscach wilgotnych i zacienionych.","a":true,"ex":"Potrzebują wilgoci m.in. do rozmnażania płciowego.","l":0},{"t":"s","q":"Mchy najlepiej rozwijają się w środowisku:","a":"Wilgotnym i zacienionym","ex":"Wilgotne, zacienione miejsca sprzyjają wzrostowi i rozmnażaniu mchów.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego mchy najczęściej występują w wilgotnych i zacienionych miejscach.","a":"Mchy potrzebują wody do rozmnażania płciowego (plemniki muszą dopłynąć do komórki jajowej) oraz mają słabo rozwiniętą tkankę okrywającą, przez co łatwo tracą wodę — dlatego najlepiej radzą sobie w wilgotnym, zacienionym środowisku.","l":0},{"t":"s","q":"Pokolenie mchu, które widzimy jako zieloną roślinkę, to:","a":"Gametofit","ex":"U mchów gametofit jest pokoleniem dominującym.","l":0},{"t":"f","q":"Pokolenie mchu widoczne jako zielona roślinka to _______ (nazwa pokolenia płciowego).","a":"gametofit","acc":[],"ex":"To pokolenie wytwarza komórki płciowe.","l":0},{"t":"tf","q":"U mchów pokoleniem dominującym (widocznym) jest gametofit.","a":true,"ex":"To odróżnia mchy od paproci, u których dominującym pokoleniem jest sporofit.","l":0},{"t":"s","q":"Torfowiec to przykład:","a":"Mchu zdolnego do magazynowania dużych ilości wody","ex":"Torfowiec ma zdolność chłonięcia i magazynowania wody jak gąbka.","l":0},{"t":"tf","q":"Torfowce mogą magazynować w swoich komórkach duże ilości wody, działając jak gąbka.","a":true,"ex":"Dzięki temu tworzą podmokłe torfowiska.","l":0},{"t":"f","q":"Z obumarłych torfowców, w warunkach dużej wilgotności i braku tlenu, powstaje _______.","a":"torf","acc":[],"ex":"Torf gromadzi się przez wieki na torfowiskach.","l":0},{"t":"s","q":"Torf powstaje głównie ze szczątków:","a":"Torfowców","ex":"Torfowce to główny budulec torfu.","l":0},{"t":"o","q":"Wyjaśnij, w jaki sposób torfowce przyczyniają się do powstawania torfowisk.","a":"Torfowce magazynują ogromne ilości wody, tworząc podmokłe środowisko. Ich obumarłe szczątki, w warunkach dużej wilgotności i niedoboru tlenu, nie rozkładają się w pełni, lecz gromadzą się, tworząc z czasem torf.","l":0},{"t":"s","q":"Paprocie, w odróżnieniu od mchów, posiadają:","a":"Prawdziwe korzenie, łodygę (kłącze) i liście","ex":"Paprocie mają bardziej złożoną budowę niż mchy.","l":1},{"t":"tf","q":"Paprocie mają bardziej złożoną budowę niż mchy — posiadają prawdziwe korzenie.","a":true,"ex":"To jedna z głównych różnic między obiema grupami.","l":1},{"t":"s","q":"Podziemna, pozioma łodyga paproci nazywana jest:","a":"Kłączem","ex":"Z kłącza wyrastają liście i korzenie paproci.","l":1},{"t":"f","q":"Podziemna łodyga paproci, z której wyrastają liście, nazywa się _______.","a":"kłączem","acc":[],"ex":"Kłącze pełni funkcję magazynującą i umożliwia rozwój nowych liści.","l":1},{"t":"tf","q":"Paprocie rozmnażają się za pomocą nasion.","a":false,"ex":"Paprocie to rośliny zarodnikowe — rozmnażają się za pomocą zarodników.","l":1},{"t":"s","q":"Paprocie rozmnażają się za pomocą:","a":"Zarodników","ex":"To cecha typowa dla wszystkich paprotników.","l":1},{"t":"s","q":"Zarodnie u paproci znajdują się najczęściej:","a":"Na spodniej stronie liści","ex":"To tam dojrzewają zarodniki paproci.","l":1},{"t":"f","q":"Skupienia zarodni na spodniej stronie liści paproci nazywamy _______ zarodni.","a":"kupkami","acc":[],"ex":"Kupki zarodni są charakterystycznym elementem liści paproci.","l":1},{"t":"tf","q":"Kupki zarodni to charakterystyczne skupienia zarodni widoczne na spodniej stronie liści paproci.","a":true,"ex":"Łatwo je zauważyć, odwracając liść paproci.","l":1},{"t":"o","q":"Wyjaśnij, gdzie u paproci znajdują się zarodnie i jak nazywamy ich skupienia.","a":"Zarodnie paproci znajdują się najczęściej na spodniej stronie liści, a ich charakterystyczne skupienia nazywamy kupkami zarodni.","l":1},{"t":"s","q":"Skrzypy i widłaki, podobnie jak paprocie:","a":"Są roślinami zarodnikowymi","ex":"Wszystkie trzy grupy rozmnażają się za pomocą zarodników.","l":1},{"t":"tf","q":"Skrzypy, widłaki i paprocie należą razem do grupy roślin zwanych paprotnikami.","a":true,"ex":"To wspólna nazwa dla tych trzech grup roślin zarodnikowych.","l":1},{"t":"s","q":"Cecha charakterystyczna skrzypów to obecność w łodydze dużej ilości:","a":"Krzemionki","ex":"Krzemionka nadaje łodygom skrzypów szorstkość.","l":1},{"t":"f","q":"Skrzypy mają w łodydze dużo _______, dlatego dawniej używano ich do szorowania naczyń.","a":"krzemionki","acc":[],"ex":"Szorstkość łodyg skrzypów przypomina papier ścierny.","l":1},{"t":"tf","q":"Dawniej skrzypy wykorzystywano do szorowania naczyń dzięki dużej zawartości krzemionki w ich łodygach.","a":true,"ex":"To ciekawy, praktyczny przykład wykorzystania rośliny przez człowieka.","l":1},{"t":"s","q":"Cecha charakterystyczna widłaków to:","a":"Łodygi płożące się po ziemi, przypominające sznury","ex":"Widłaki mają długie, płożące się łodygi z drobnymi listkami.","l":1},{"t":"o","q":"Podaj po jednej cesze charakterystycznej mchów, paproci, skrzypów i widłaków.","a":"Mchy: brak prawdziwych korzeni, zastąpionych chwytnikami. Paprocie: liście z zarodniami na spodniej stronie. Skrzypy: łodygi bogate w krzemionkę. Widłaki: płożące się, sznurowate łodygi.","l":null},{"t":"s","q":"Mchy i paprocie potrzebują wody do rozmnażania płciowego, ponieważ:","a":"Plemniki muszą dopłynąć do komórki jajowej","ex":"Woda umożliwia plemnikom dotarcie do komórki jajowej.","l":null},{"t":"tf","q":"U mchów i paproci plemniki poruszają się w wodzie, by dotrzeć do komórki jajowej.","a":true,"ex":"To dlatego rozmnażanie płciowe tych roślin jest ograniczone do wilgotnych warunków.","l":null},{"t":"f","q":"Rośliny rozmnażające się za pomocą zarodników, a nie nasion, nazywamy roślinami _______.","a":"zarodnikowymi","acc":[],"ex":"Mchy, paprocie, skrzypy i widłaki to rośliny zarodnikowe.","l":null},{"t":"s","q":"Do roślin zarodnikowych zaliczamy:","a":"Mchy, paprocie, skrzypy i widłaki","ex":"Pozostałe wymienione rośliny są nasienne.","l":null},{"t":"tf","q":"Rośliny zarodnikowe, w odróżnieniu od nasiennych, są bardziej zależne od obecności wody podczas rozmnażania.","a":true,"ex":"To kluczowa różnica ekologiczna między obiema grupami.","l":null},{"t":"s","q":"Dlaczego rośliny nasienne są lepiej przystosowane do życia na lądzie niż rośliny zarodnikowe?","a":"Ich rozmnażanie nie wymaga bezpośrednio wody (pyłek przenosi wiatr lub owady)","ex":"To uniezależnienie od wody było ważnym krokiem ewolucyjnym.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego rośliny zarodnikowe (jak mchy i paprocie) są bardziej zależne od wody niż rośliny nasienne.","a":"U roślin zarodnikowych plemniki muszą przepłynąć przez cienką warstwę wody, by dotrzeć do komórki jajowej, dlatego rozmnażanie płciowe tych roślin jest możliwe głównie w wilgotnym środowisku. Rośliny nasienne przenoszą pyłek za pomocą wiatru lub zwierząt, niezależnie od obecności wody.","l":null},{"t":"s","q":"Węgiel kamienny powstał głównie z obumarłych, prehistorycznych:","a":"Paproci, skrzypów i widłaków","ex":"Te rośliny tworzyły niegdyś rozległe, bagienne lasy.","l":1},{"t":"tf","q":"Węgiel kamienny powstał m.in. z obumarłych, prehistorycznych paproci, skrzypów i widłaków.","a":true,"ex":"Proces ten trwał miliony lat.","l":1},{"t":"o","q":"Wyjaśnij, w jaki sposób powstał węgiel kamienny.","a":"Miliony lat temu ogromne lasy złożone z paproci, skrzypów i widłaków obumierały i gromadziły się w bagnistych warunkach bez dostępu tlenu; z czasem, pod wpływem ciśnienia i wysokiej temperatury, ich szczątki przekształciły się w węgiel kamienny.","l":1},{"t":"s","q":"Mchy odgrywają ważną rolę w ekosystemie, ponieważ:","a":"Zatrzymują wodę i zapobiegają erozji gleby","ex":"Poduchy mchu działają jak naturalna gąbka chroniąca glebę.","l":0},{"t":"tf","q":"Poduchowate skupiska mchu mogą działać jak naturalna gąbka, zatrzymując wodę w glebie.","a":true,"ex":"To ważna ekologiczna funkcja mchów.","l":0},{"t":"f","q":"Ponieważ paprocie nie mają kwiatów ani owoców, do ich rozpoznawania wykorzystuje się głównie kształt _______.","a":"liści","acc":[],"ex":"Kształt liścia paprociowego jest cechą charakterystyczną dla gatunku.","l":1},{"t":"tf","q":"Paprocie preferują siedliska wilgotne i zacienione, np. lasy.","a":true,"ex":"To typowe środowisko życia większości gatunków paproci.","l":1},{"t":"s","q":"Paprocie preferują siedliska:","a":"Wilgotne i zacienione, np. lasy","ex":"W lasach paprocie znajdują odpowiednią wilgoć i cień.","l":1},{"t":"o","q":"Porównaj budowę mchu i paproci — wskaż dwie różnice.","a":"Mech nie ma prawdziwych korzeni (ma chwytniki), a paproć ma prawdziwe korzenie; u mchu widocznym pokoleniem jest gametofit, a paproć, którą widzimy, to sporofit — bardziej złożona roślina z korzeniem, łodygą i liśćmi.","l":1},{"t":"s","q":"Do mchów zaliczamy np.:","a":"Torfowiec i płonnik","ex":"Torfowiec i płonnik to popularne gatunki mchów.","l":0},{"t":"tf","q":"Płonnik jest przykładem gatunku mchu.","a":true,"ex":"Płonnik pospolity to jeden z częściej spotykanych mchów.","l":0},{"t":"f","q":"Paprocie, skrzypy i widłaki razem tworzą grupę roślin zwaną _______.","a":"paprotnikami","acc":[],"ex":"To wspólna nazwa dla tych trzech grup.","l":1},{"t":"tf","q":"Paprotniki to szersza grupa obejmująca paprocie, skrzypy i widłaki.","a":true,"ex":"Wszystkie trzy grupy mają podobną, bardziej złożoną budowę niż mszaki.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego mszaki i paprotniki nazywane są roślinami zarodnikowymi.","a":"Ponieważ rozmnażają się za pomocą zarodników, a nie nasion — zarodniki, po uwolnieniu z zarodni, kiełkują w nowe pokolenie rośliny, bez udziału zapylenia czy zapłodnienia typowego dla roślin nasiennych.","l":null},{"t":"s","q":"Liść paproci, zwany też liściem paprociowym, charakteryzuje się zwykle:","a":"Silnie podzielonym, pierzastym kształtem","ex":"To charakterystyczna, „koronkowa” budowa liścia paproci.","l":1},{"t":"tf","q":"Liście paproci mają zwykle silnie podzielony, pierzasty kształt.","a":true,"ex":"Taki kształt liścia ułatwia rozpoznanie paproci.","l":1},{"t":"s","q":"Mchy i paprotniki należały do jednych z pierwszych roślin, które:","a":"Zasiedliły środowisko lądowe","ex":"To ważny etap w historii ewolucji roślin.","l":null},{"t":"f","q":"Mchy i paprotniki należą do pierwszych roślin, które zasiedliły środowisko _______.","a":"lądowe","acc":[],"ex":"Wcześniej życie roślinne koncentrowało się głównie w wodzie.","l":null},{"t":"tf","q":"Mchy i paprotniki były jednymi z pierwszych roślin, które zasiedliły ląd.","a":true,"ex":"To znaczący krok w ewolucji roślin.","l":null},{"t":"o","q":"Wyjaśnij, jakie znaczenie miało zasiedlenie lądu przez pierwsze rośliny zarodnikowe.","a":"Zasiedlenie lądu przez rośliny umożliwiło późniejszy rozwój życia lądowego zwierząt, wzbogaciło glebę w materię organiczną i przyczyniło się do zmian w atmosferze dzięki produkcji tlenu w procesie fotosyntezy.","l":null},{"t":"s","q":"Torfowiska, tworzone m.in. przez torfowce, są ważnym środowiskiem, ponieważ:","a":"Magazynują wodę i węgiel, wpływając na klimat","ex":"Torfowiska pełnią ważną funkcję w globalnym obiegu węgla.","l":0},{"t":"tf","q":"Torfowiska magazynują duże ilości węgla, co ma znaczenie dla klimatu.","a":true,"ex":"Zniszczenie torfowisk może uwalniać zgromadzony w nich węgiel do atmosfery.","l":0},{"t":"s","q":"Które stwierdzenie o mchach jest prawdziwe?","a":"Mchy nie mają prawdziwych korzeni, lecz chwytniki","ex":"To jedna z podstawowych cech budowy mchów.","l":0},{"t":"f","q":"Zamiast korzeni mchy posiadają proste struktury zwane _______.","a":"chwytnikami","acc":[],"ex":"Chwytniki są znacznie prostsze w budowie niż prawdziwe korzenie.","l":0},{"t":"tf","q":"Chwytniki mchów pełnią funkcję zbliżoną do korzeni, ale są prostsze w budowie.","a":true,"ex":"Chwytniki mocują roślinę, ale słabiej pobierają wodę niż korzenie.","l":0},{"t":"s","q":"Paprocie wykształciły w toku ewolucji:","a":"Prawdziwe tkanki przewodzące, umożliwiające transport wody i substancji odżywczych","ex":"To pozwoliło paprociom osiągać większe rozmiary niż mchy.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego posiadanie prawdziwych tkanek przewodzących (jak u paproci) jest korzystne dla rośliny lądowej.","a":"Tkanki przewodzące umożliwiają sprawny transport wody i soli mineralnych z korzeni do wyższych części rośliny oraz transport produktów fotosyntezy, co pozwala roślinie rosnąć wyżej i skuteczniej radzić sobie w środowisku lądowym.","l":1},{"t":"tf","q":"Skrzypy, podobnie jak paprocie, mają kłącze oraz proste lub rozgałęzione nadziemne łodygi.","a":true,"ex":"To cecha wspólna dla wielu paprotników.","l":1},{"t":"s","q":"Niektóre skrzypy wykształcają dwa rodzaje pędów:","a":"Pęd wiosenny (zarodnionośny) i pęd letni (zielony, asymilacyjny)","ex":"To ciekawe przystosowanie niektórych gatunków skrzypów.","l":1},{"t":"f","q":"U niektórych skrzypów pęd wiosenny służy do wytwarzania _______, a pęd letni do fotosyntezy.","a":"zarodników","acc":[],"ex":"Podział funkcji między dwoma rodzajami pędów jest charakterystyczny dla niektórych skrzypów.","l":1},{"t":"tf","q":"Niektóre gatunki skrzypów wytwarzają osobny pęd wiosenny do rozmnażania i osobny pęd letni do fotosyntezy.","a":true,"ex":"To rozdzielenie funkcji jest widoczne np. u skrzypu polnego.","l":1},{"t":"o","q":"Opisz różnicę między pędem wiosennym a letnim u niektórych gatunków skrzypów.","a":"Pęd wiosenny jest zwykle bezzielony i służy do wytwarzania zarodników (jest zarodnionośny), natomiast pęd letni jest zielony, rozgałęziony i pełni funkcję fotosyntetyczną.","l":1},{"t":"s","q":"Widłaki mają delikatne korzenie i:","a":"Płożące się łodygi","ex":"To typowa cecha budowy widłaków.","l":1},{"t":"tf","q":"Widłaki są roślinami o delikatnych korzeniach i płożących się łodygach.","a":true,"ex":"Ich łodygi przypominają długie, płożące się sznury.","l":1},{"t":"s","q":"Do jakiej grupy roślin należy skrzyp polny?","a":"Paprotników","ex":"Skrzyp polny, podobnie jak paprocie i widłaki, jest paprotnikiem.","l":1},{"t":"f","q":"Skrzyp polny, podobnie jak paprocie i widłaki, należy do grupy roślin zwanej _______.","a":"paprotnikami","acc":[],"ex":"To wspólna grupa roślin zarodnikowych o bardziej złożonej budowie.","l":1},{"t":"tf","q":"Skrzyp polny jest rośliną zarodnikową, podobnie jak paprocie.","a":true,"ex":"Skrzyp polny rozmnaża się za pomocą zarodników, tak jak paprocie.","l":1},{"t":"s","q":"Rośliny nagonasienne to w większości rośliny:","a":"Iglaste","ex":"Do nagonasiennych zaliczamy głównie drzewa i krzewy iglaste, np. sosnę czy świerk.","l":2},{"t":"tf","q":"Nasiona roślin nagonasiennych są ukryte wewnątrz owocu.","a":false,"ex":"U nagonasiennych nasiona leżą „nago”, np. między łuskami szyszki — stąd nazwa.","l":2},{"t":"s","q":"Żeński kwiatostan sosny z czasem przekształca się w:","a":"Szyszkę","ex":"Po zapyleniu żeńskie kwiatostany sosny drewnieją i stają się szyszką.","l":2},{"t":"f","q":"Rośliny, których nasiona są ukryte wewnątrz owocu, nazywamy roślinami _______.","a":"okrytonasiennymi","acc":[],"ex":"To największa i najbardziej zróżnicowana grupa roślin na Ziemi.","l":3},{"t":"s","q":"Kwiat rośliny okrytonasiennej zbudowany jest z:","a":"Działek kielicha, płatków korony, pręcików i słupka","ex":"To typowa budowa kwiatu okrytonasiennego — kielich i korona tworzą okwiat, wewnątrz są pręciki i słupek.","l":3},{"t":"tf","q":"Rośliny wiatropylne mają zwykle małe, niepozorne i mało pachnące kwiaty.","a":true,"ex":"Skoro nie muszą przyciągać owadów, nie inwestują w duże, barwne kwiaty.","l":3},{"t":"s","q":"Kwiaty owadopylne, w odróżnieniu od wiatropylnych, są zwykle:","a":"Duże, barwne i pachnące, często z nektarem","ex":"Muszą przyciągać owady, dlatego są kolorowe, pachnące i często oferują nektar jako nagrodę.","l":3},{"t":"s","q":"Zalążek po zapłodnieniu przekształca się w:","a":"Nasienie","ex":"Zalążek zawiera zarodek — po zapłodnieniu rozwija się w nasienie.","l":3},{"t":"tf","q":"Nasiona roślin mogą być rozsiewane przez wiatr, zwierzęta lub wodę.","a":true,"ex":"Rośliny wykształciły różne sposoby na rozprzestrzenianie nasion — np. skrzydełka, haczyki czy pływające owocnie.","l":4},{"t":"tf","q":"Wszystkie drzewa iglaste zrzucają igły na zimę.","a":false,"ex":"Większość drzew iglastych jest zimozielona — wyjątkiem jest np. modrzew.","l":2},{"t":"s","q":"Kwiatostan męski sosny wytwarza:","a":"Ziarna pyłku","ex":"To właśnie z kwiatostanu męskiego pochodzi żółty pyłek unoszący się wiosną w powietrzu.","l":2},{"t":"f","q":"Proces przenoszenia pyłku z kwiatów męskich na żeńskie nazywamy _______.","a":"zapylaniem","acc":[],"ex":"Zapylanie może odbywać się za pośrednictwem wiatru, owadów lub innych zwierząt.","l":3},{"t":"s","q":"Owoc to:","a":"Rozwinięta zalążnia wraz z nasionami","ex":"Zalążnia po zapłodnieniu rozrasta się i przekształca w owoc chroniący nasiona.","l":4},{"t":"tf","q":"Owoce mogą być rozsiewane przez wiatr, wodę i zwierzęta, co pomaga roślinom zasiedlać nowe tereny.","a":true,"ex":"Różne przystosowania owoców (skrzydełka, haczyki, soczysty miąższ) ułatwiają ich przenoszenie.","l":4},{"t":"s","q":"Kwiat obupłciowy to kwiat, który posiada:","a":"Zarówno pręciki, jak i słupek","ex":"Kwiat obupłciowy ma jednocześnie męskie (pręciki) i żeńskie (słupek) organy rozrodcze.","l":3},{"t":"s","q":"Podział roślin okrytonasiennych na jednoliścienne i dwuliścienne opiera się na:","a":"Liczbie liści zarodkowych w nasieniu","ex":"Rośliny jednoliścienne mają w zarodku jeden liścień, a dwuliścienne — dwa.","l":5},{"t":"tf","q":"Trawy, np. pszenica i kukurydza, są przykładem roślin jednoliściennych.","a":true,"ex":"Trawy mają charakterystyczne wąskie liście z równoległym unerwieniem, typowe dla jednoliściennych.","l":5},{"t":"s","q":"Szyszka jest organem charakterystycznym dla roślin:","a":"Nagonasiennych","ex":"Szyszki wytwarzają głównie drzewa i krzewy iglaste, należące do roślin nagonasiennych.","l":2},{"t":"s","q":"Rośliny nagonasienne to w większości rośliny:","a":"Iglaste","ex":"Do nagonasiennych zaliczamy głównie drzewa i krzewy iglaste, np. sosnę czy świerk.","l":2},{"t":"tf","q":"Sosna, świerk i jodła to przykłady drzew nagonasiennych.","a":true,"ex":"Wszystkie te drzewa wytwarzają szyszki i nasiona odsłonięte.","l":2},{"t":"f","q":"Nasiona roślin nagonasiennych nazywamy „nagimi”, ponieważ nie są ukryte wewnątrz _______.","a":"owocu","acc":[],"ex":"To właśnie stąd pochodzi nazwa „nagonasienne”.","l":2},{"t":"s","q":"Nasiona roślin nagonasiennych znajdują się:","a":"Między łuskami szyszki","ex":"To typowe miejsce, w którym dojrzewają nasiona nagonasiennych.","l":2},{"t":"tf","q":"Nasiona nagonasiennych są ukryte wewnątrz owocu, tak jak u okrytonasiennych.","a":false,"ex":"Nasiona nagonasiennych leżą odsłonięte, np. w szyszce, nie w owocu.","l":2},{"t":"s","q":"Żeński kwiatostan sosny z czasem przekształca się w:","a":"Szyszkę","ex":"Po zapyleniu żeńskie kwiatostany sosny drewnieją, tworząc szyszkę.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego nasiona roślin nagonasiennych nazywane są „nagimi”.","a":"Nazywa się je tak, ponieważ leżą odsłonięte, np. między łuskami szyszki, a nie są otoczone i chronione przez owoc, jak u roślin okrytonasiennych.","l":2},{"t":"s","q":"Kwiatostan męski sosny wytwarza:","a":"Ziarna pyłku","ex":"To z niego pochodzi żółty pyłek unoszący się wiosną w powietrzu.","l":2},{"t":"tf","q":"U sosny pyłek powstaje w kwiatostanach męskich.","a":true,"ex":"Kwiatostany męskie sosny wytwarzają ogromne ilości pyłku.","l":2},{"t":"f","q":"Proces przenoszenia pyłku z kwiatów męskich na żeńskie nazywamy _______.","a":"zapylaniem","acc":[],"ex":"Zapylanie może odbywać się za pośrednictwem wiatru lub zwierząt.","l":2},{"t":"s","q":"Sosna jest zapylana głównie przez:","a":"Wiatr","ex":"Sosna produkuje ogromne ilości lekkiego pyłku przenoszonego przez wiatr.","l":2},{"t":"tf","q":"Sosna, podobnie jak wiele innych roślin nagonasiennych, jest zapylana przez wiatr.","a":true,"ex":"To typowy sposób zapylania roślin iglastych.","l":2},{"t":"tf","q":"Wszystkie drzewa iglaste zrzucają igły na zimę.","a":false,"ex":"Większość drzew iglastych jest zimozielona — wyjątkiem jest np. modrzew.","l":2},{"t":"o","q":"Wyjaśnij, czym modrzew różni się od większości innych drzew iglastych.","a":"Modrzew, w odróżnieniu od większości drzew iglastych (np. sosny czy świerka), zrzuca igły na zimę — jest jednym z niewielu drzew iglastych o takiej cesze.","l":2},{"t":"s","q":"Rośliny okrytonasienne, w odróżnieniu od nagonasiennych, wytwarzają:","a":"Kwiaty i owoce chroniące nasiona","ex":"To definicyjna cecha okrytonasiennych.","l":3},{"t":"tf","q":"Rośliny okrytonasienne chronią swoje nasiona wewnątrz owocu.","a":true,"ex":"Owoc powstaje z zalążni i osłania rozwijające się nasiona.","l":3},{"t":"f","q":"Rośliny, których nasiona są ukryte wewnątrz owocu, nazywamy roślinami _______.","a":"okrytonasiennymi","acc":[],"ex":"To największa i najbardziej zróżnicowana grupa roślin na Ziemi.","l":3},{"t":"s","q":"Do roślin okrytonasiennych zaliczamy m.in.:","a":"Jabłoń, różę i tulipana","ex":"Pozostałe zestawy zawierają rośliny nagonasienne lub zarodnikowe.","l":3},{"t":"tf","q":"Jabłoń jest przykładem rośliny okrytonasiennej.","a":true,"ex":"Jabłoń wytwarza kwiaty i owoce (jabłka) chroniące nasiona.","l":3},{"t":"s","q":"Kwiat rośliny okrytonasiennej zbudowany jest z:","a":"Działek kielicha, płatków korony, pręcików i słupka","ex":"To typowa budowa kwiatu okrytonasiennego.","l":3},{"t":"f","q":"Zewnętrzny okółek kwiatu, złożony zwykle z zielonych działek, nazywamy _______.","a":"kielichem","acc":[],"ex":"Kielich chroni pąk kwiatowy przed rozwinięciem.","l":3},{"t":"s","q":"Wewnętrzny, zwykle barwny okółek kwiatu nazywamy:","a":"Koroną","ex":"Korona jest zbudowana z płatków, często kolorowych.","l":3},{"t":"tf","q":"Kielich i korona razem tworzą okwiat kwiatu.","a":true,"ex":"Okwiat to zewnętrzna, niebezpośrednio rozrodcza część kwiatu.","l":3},{"t":"o","q":"Wymień cztery podstawowe elementy budowy typowego kwiatu rośliny okrytonasiennej.","a":"Działki kielicha, płatki korony, pręciki i słupek.","l":3},{"t":"s","q":"Męskim organem rozmnażania w kwiecie jest:","a":"Pręcik","ex":"Pręcik wytwarza pyłek.","l":3},{"t":"s","q":"Żeńskim organem rozmnażania w kwiecie jest:","a":"Słupek","ex":"Słupek zawiera zalążnię z zalążkami.","l":3},{"t":"f","q":"Pręcik zbudowany jest z nitki oraz _______, w której powstaje pyłek.","a":"główki","acc":[],"ex":"Główka pręcika jest miejscem produkcji pyłku.","l":3},{"t":"tf","q":"Pyłek powstaje w główce pręcika.","a":true,"ex":"To tam dojrzewają ziarna pyłku.","l":3},{"t":"s","q":"Słupek składa się z:","a":"Znamienia, szyjki i zalążni","ex":"To trzy podstawowe części słupka, od góry do dołu.","l":3},{"t":"tf","q":"Rośliny wiatropylne mają zwykle małe, niepozorne i mało pachnące kwiaty.","a":true,"ex":"Nie muszą przyciągać zapylaczy, więc nie inwestują w wygląd kwiatu.","l":3},{"t":"s","q":"Kwiaty owadopylne, w odróżnieniu od wiatropylnych, są zwykle:","a":"Duże, barwne i pachnące, często z nektarem","ex":"Muszą przyciągać uwagę owadów zapylających.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego kwiaty zapylane przez wiatr są zwykle małe i niepozorne, a zapylane przez owady — duże i barwne.","a":"Kwiaty wiatropylne nie muszą przyciągać zapylaczy, więc oszczędzają energię na produkcję barwnych płatków czy nektaru — inwestują za to w dużą ilość lekkiego pyłku. Kwiaty owadopylne muszą przyciągnąć uwagę owadów, dlatego są kolorowe, pachnące i często oferują nektar jako nagrodę.","l":3},{"t":"s","q":"Zalążek po zapłodnieniu przekształca się w:","a":"Nasienie","ex":"Zalążek zawiera zarodek — po zapłodnieniu rozwija się w nasienie.","l":4},{"t":"s","q":"Zalążnia po zapłodnieniu przekształca się w:","a":"Owoc","ex":"Zalążnia rozrasta się, tworząc owoc chroniący nasiona.","l":4},{"t":"f","q":"Po zapłodnieniu z zalążka rozwija się _______.","a":"nasiono","acc":[],"ex":"To bezpośredni skutek zapłodnienia komórki jajowej w zalążku.","l":4},{"t":"tf","q":"Z zalążni po zapłodnieniu rozwija się owoc.","a":true,"ex":"To druga, obok nasienia, konsekwencja zapłodnienia u okrytonasiennych.","l":4},{"t":"s","q":"Zapylenie to:","a":"Przeniesienie pyłku na znamię słupka","ex":"Zapylenie jest etapem poprzedzającym zapłodnienie.","l":3},{"t":"s","q":"Zapłodnienie to:","a":"Połączenie komórek rozrodczych, żeńskiej i męskiej","ex":"W wyniku zapłodnienia powstaje zygota.","l":3},{"t":"tf","q":"Zapylenie zawsze poprzedza zapłodnienie.","a":true,"ex":"Bez zapylenia zapłodnienie nie może zajść.","l":3},{"t":"o","q":"Ułóż w prawidłowej kolejności etapy: zapylenie, zapłodnienie, powstanie nasienia i owocu, rozsiewanie.","a":"Zapylenie → zapłodnienie → powstanie nasienia (z zalążka) i owocu (z zalążni) → rozsiewanie nasion.","l":3},{"t":"s","q":"Nasiona mogą być rozsiewane przez:","a":"Wiatr, wodę i zwierzęta","ex":"Rośliny wykształciły różnorodne sposoby rozsiewania nasion.","l":4},{"t":"tf","q":"Nasiona roślin mogą być rozsiewane przez wiatr, wodę lub zwierzęta.","a":true,"ex":"To trzy podstawowe sposoby rozprzestrzeniania się nasion w przyrodzie.","l":4},{"t":"tf","q":"Wszystkie nasiona bezwzględnie potrzebują światła, by wykiełkować.","a":false,"ex":"Większość nasion kiełkuje niezależnie od dostępu do światła.","l":4},{"t":"f","q":"Do kiełkowania większość nasion potrzebuje wody, tlenu i odpowiedniej _______.","a":"temperatury","acc":[],"ex":"Zbyt niska lub zbyt wysoka temperatura może zahamować kiełkowanie.","l":4},{"t":"s","q":"Rośliny okrytonasienne dzielimy między innymi na:","a":"Jednoliścienne i dwuliścienne","ex":"Ten podział opiera się na liczbie liścieni w nasieniu.","l":5},{"t":"tf","q":"Trawy, np. pszenica i kukurydza, są przykładem roślin jednoliściennych.","a":true,"ex":"Mają charakterystyczne wąskie liście z równoległym unerwieniem.","l":5},{"t":"s","q":"Nasiono rośliny jednoliściennej zawiera:","a":"Jeden liścień","ex":"Liczba liścieni to podstawa podziału na jedno- i dwuliścienne.","l":5},{"t":"s","q":"Nasiono rośliny dwuliściennej zawiera:","a":"Dwa liścienie","ex":"Dwa liścienie widać wyraźnie np. w kiełkującej fasoli.","l":5},{"t":"o","q":"Podaj po dwa przykłady roślin jednoliściennych i dwuliściennych.","a":"Jednoliścienne: np. kukurydza i pszenica (lub trawa, cebula). Dwuliścienne: np. fasola i groch (lub jabłoń, róża).","l":5},{"t":"s","q":"Szyszka jest organem charakterystycznym dla roślin:","a":"Nagonasiennych","ex":"Szyszki wytwarzają głównie drzewa i krzewy iglaste.","l":2},{"t":"tf","q":"Szyszki wytwarzają głównie drzewa i krzewy iglaste, należące do nagonasiennych.","a":true,"ex":"To typowy organ rozrodczy roślin nagonasiennych.","l":2},{"t":"s","q":"Owoc to:","a":"Rozwinięta zalążnia wraz z nasionami","ex":"Zalążnia po zapłodnieniu rozrasta się, tworząc owoc.","l":4},{"t":"f","q":"Owoc rozwija się z _______ kwiatu.","a":"zalążni","acc":[],"ex":"To dolna, rozszerzona część słupka.","l":4},{"t":"s","q":"Kwiat obupłciowy to kwiat, który posiada:","a":"Zarówno pręciki, jak i słupek","ex":"Kwiat obupłciowy ma jednocześnie oba organy rozrodcze.","l":3},{"t":"tf","q":"Kwiat obupłciowy ma jednocześnie męskie i żeńskie organy rozrodcze.","a":true,"ex":"To odróżnia go od kwiatu jednopłciowego, mającego tylko jeden rodzaj organów.","l":3},{"t":"o","q":"Wyjaśnij różnicę między kwiatem obupłciowym a jednopłciowym.","a":"Kwiat obupłciowy zawiera zarówno pręciki (organy męskie), jak i słupek (organ żeński). Kwiat jednopłciowy ma tylko jeden z tych organów — jest wyłącznie męski (ma pręciki) albo wyłącznie żeński (ma słupek).","l":3},{"t":"s","q":"Funkcją płatków korony jest przede wszystkim:","a":"Przywabianie zapylaczy","ex":"Kolorowe, często pachnące płatki mają przyciągać owady.","l":3},{"t":"tf","q":"Płatki korony mogą pełnić funkcję przywabiania owadów zapylających.","a":true,"ex":"To jedna z głównych funkcji korony kwiatu.","l":3},{"t":"s","q":"Działki kielicha pełnią głównie funkcję:","a":"Ochrony pąka kwiatowego przed rozwinięciem","ex":"Zielone działki osłaniają młody, jeszcze niekwitnący kwiat.","l":3},{"t":"f","q":"Działki kielicha, zwykle zielone, chronią _______ kwiatowy przed jego rozwinięciem.","a":"pąk","acc":[],"ex":"To ich główna funkcja ochronna.","l":3},{"t":"s","q":"Rośliny wytwarzające nektar robią to głównie po to, by:","a":"Przywabić zwierzęta zapylające, np. owady","ex":"Nektar jest nagrodą dla zapylaczy.","l":3},{"t":"tf","q":"Nektar jest „nagrodą” dla zapylaczy za przeniesienie pyłku.","a":true,"ex":"To wzajemnie korzystna relacja między rośliną a owadem.","l":3},{"t":"s","q":"Owoce mogą pomagać roślinie w:","a":"Rozsiewaniu nasion","ex":"To jedna z głównych funkcji owoców.","l":4},{"t":"o","q":"Wyjaśnij, w jaki sposób owoce mogą pomagać w rozsiewaniu nasion.","a":"Owoce mogą być zjadane przez zwierzęta, które przenoszą nasiona na duże odległości i wydalają je w innym miejscu; mogą też mieć haczyki przyczepiające się do sierści zwierząt lub skrzydełka ułatwiające przenoszenie przez wiatr.","l":4},{"t":"tf","q":"Podstawową różnicą między nagonasiennymi a okrytonasiennymi jest to, czy nasiona są chronione owocem.","a":true,"ex":"U okrytonasiennych nasiona są chronione owocem, u nagonasiennych — nie.","l":3},{"t":"s","q":"Do drzew iglastych (nagonasiennych) rosnących w Polsce zaliczamy m.in.:","a":"Sosnę, świerk, jodłę i modrzew","ex":"To najpopularniejsze gatunki drzew iglastych w Polsce.","l":2},{"t":"f","q":"Sosna, świerk, jodła i modrzew to przykłady drzew _______ rosnących w Polsce.","a":"iglastych","acc":[],"ex":"Wszystkie te gatunki są roślinami nagonasiennymi.","l":2},{"t":"s","q":"Liście roślin iglastych mają zwykle postać:","a":"Igieł lub łusek","ex":"To charakterystyczna cecha budowy drzew nagonasiennych.","l":2},{"t":"tf","q":"Liście roślin iglastych (nagonasiennych) mają zwykle postać wąskich igieł.","a":true,"ex":"Igły to zmodyfikowane liście przystosowane do ograniczania utraty wody.","l":2},{"t":"o","q":"Wyjaśnij, jaką korzyść dla drzewa iglastego może dawać igiełkowaty kształt liści.","a":"Wąskie, igiełkowate liście mają mniejszą powierzchnię parowania wody niż szerokie liście, co pomaga drzewu ograniczać utratę wody, zwłaszcza zimą, gdy pobieranie wody z zamarzniętej gleby jest utrudnione.","l":2},{"t":"s","q":"Rośliny okrytonasienne są uważane za grupę roślin:","a":"Najliczniejszą i najbardziej zróżnicowaną wśród roślin lądowych","ex":"To największa grupa roślin współcześnie żyjących na Ziemi.","l":3},{"t":"tf","q":"Rośliny okrytonasienne są najliczniejszą grupą roślin na Ziemi.","a":true,"ex":"Obejmują dziesiątki tysięcy gatunków, od traw po drzewa.","l":3},{"t":"s","q":"Który proces zachodzi bezpośrednio po zapyleniu, prowadząc do powstania zygoty?","a":"Zapłodnienie","ex":"Zapłodnienie to połączenie komórki jajowej z komórką plemnikową.","l":3},{"t":"f","q":"Po zapyleniu i dotarciu pyłku do zalążni dochodzi do _______, czyli połączenia komórek rozrodczych.","a":"zapłodnienia","acc":[],"ex":"To kluczowy etap prowadzący do powstania nasienia.","l":3},{"t":"tf","q":"Zapłodnienie polega na połączeniu komórki jajowej z komórką plemnikową pochodzącą z ziarna pyłku.","a":true,"ex":"W wyniku tego połączenia powstaje zygota.","l":3},{"t":"s","q":"Rośliny jednoliścienne, w odróżnieniu od dwuliściennych, mają zwykle:","a":"Liście z równoległym unerwieniem","ex":"To charakterystyczna cecha budowy liścia jednoliściennych, np. traw.","l":5},{"t":"o","q":"Podaj jedną różnicę w budowie liści między roślinami jednoliściennymi a dwuliściennymi.","a":"Rośliny jednoliścienne mają zwykle liście wąskie, z równoległym unerwieniem (np. trawy), natomiast rośliny dwuliścienne mają liście szersze, z unerwieniem siatkowatym (np. liście jabłoni).","l":5},{"t":"s","q":"Męskim organem rozmnażania w kwiecie jest:","a":"Pręcik","ex":"Pręcik wytwarza pyłek, czyli męskie komórki rozrodcze rośliny.","l":3},{"t":"s","q":"Żeńskim organem rozmnażania w kwiecie jest:","a":"Słupek","ex":"Słupek zawiera zalążnię, w której znajdują się zalążki z komórkami jajowymi.","l":3},{"t":"f","q":"Pręcik składa się z nitki i _______.","a":"główki","acc":[],"ex":"W główce pręcika powstaje pyłek.","l":3},{"t":"s","q":"Słupek składa się z:","a":"Znamienia, szyjki i zalążni","ex":"To trzy podstawowe części słupka, od góry do dołu.","l":3},{"t":"tf","q":"Pyłek powstaje w główce pręcika.","a":true,"ex":"To właśnie tam dojrzewają ziarna pyłku.","l":3},{"t":"s","q":"Zalążki znajdują się w:","a":"Zalążni","ex":"Zalążnia to dolna, rozszerzona część słupka, chroniąca zalążki.","l":3},{"t":"s","q":"Funkcją płatków korony jest przede wszystkim:","a":"Przywabianie zapylaczy","ex":"Kolorowe, często pachnące płatki mają przyciągać owady zapylające.","l":3},{"t":"s","q":"Zapylenie to:","a":"Przeniesienie pyłku na znamię słupka","ex":"Zapylenie to etap poprzedzający zapłodnienie.","l":3},{"t":"s","q":"Zapłodnienie to:","a":"Połączenie komórek rozrodczych, żeńskiej i męskiej","ex":"W wyniku zapłodnienia komórka jajowa łączy się z komórką plemnikową, tworząc zygotę.","l":3},{"t":"tf","q":"Zapylenie zawsze poprzedza zapłodnienie.","a":true,"ex":"Bez przeniesienia pyłku na znamię słupka zapłodnienie nie może zajść.","l":3},{"t":"tf","q":"Kwiaty zapylane przez wiatr są zwykle niepozorne i produkują dużo lekkiego pyłku.","a":true,"ex":"Skoro nie muszą przyciągać zapylaczy, nie inwestują w kolor czy zapach.","l":3},{"t":"s","q":"W wyniku zapłodnienia powstaje:","a":"Zygota","ex":"Zygota to pierwsza komórka nowego pokolenia rośliny, z której rozwinie się zarodek.","l":3},{"t":"f","q":"Roślina wydzielająca słodką substancję przywabiającą owady zapylające produkuje _______.","a":"nektar","acc":[],"ex":"Nektar jest „nagrodą” dla owadów za przeniesienie pyłku.","l":3},{"t":"s","q":"Kwiaty zapylane przez owady są zwykle:","a":"Kolorowe, pachnące, często z nektarem","ex":"Muszą przyciągać owady wzrokiem i zapachem, oferując im nektar.","l":3},{"t":"s","q":"Prawidłowa kolejność elementów słupka od góry to:","a":"Znamię → szyjka → zalążnia","ex":"Pyłek trafia najpierw na znamię, potem przez szyjkę dociera do zalążni.","l":3},{"t":"s","q":"Prawidłowa kolejność elementów pręcika to:","a":"Nitka → główka","ex":"Nitka pręcika podtrzymuje umieszczoną na jej końcu główkę, w której powstaje pyłek.","l":3},{"t":"tf","q":"Działki kielicha, zwykle zielone, znajdują się na zewnątrz kwiatu i chronią pąk przed rozwinięciem.","a":true,"ex":"Działki kielicha osłaniają młody, jeszcze niekwitnący kwiat.","l":3},{"t":"s","q":"Co powstaje bezpośrednio w miejscu połączenia komórki jajowej z komórką plemnikową?","a":"Zygota","ex":"Zygota to pierwsza komórka nowego pokolenia rośliny.","l":3},{"t":"s","q":"Kwiatostan to:","a":"Skupienie wielu kwiatów na jednej roślinie","ex":"Kwiatostany grupują wiele drobnych kwiatów razem.","l":3},{"t":"tf","q":"Niektóre gatunki roślin grupują swoje kwiaty w kwiatostany, zamiast wytwarzać pojedyncze kwiaty.","a":true,"ex":"Przykładem jest słonecznik czy bez czarny.","l":3},{"t":"f","q":"Skupienie wielu kwiatów na jednej roślinie nazywamy _______.","a":"kwiatostanem","acc":[],"ex":"To zjawisko występuje u wielu gatunków roślin.","l":3},{"t":"s","q":"Przykładem kwiatostanu jest:","a":"Baldach lub grono","ex":"To dwa z wielu typów kwiatostanów spotykanych u roślin.","l":3},{"t":"o","q":"Podaj przykład rośliny, która wytwarza kwiatostan, zamiast pojedynczych kwiatów.","a":"Np. słonecznik (koszyczek) lub bez czarny (baldachogrono) — kwiatostanem może być też np. kłos zboża.","l":3},{"t":"s","q":"Rośliny samopylne to takie, u których:","a":"Pyłek z pręcików danego kwiatu zapyla słupek tego samego kwiatu (lub tej samej rośliny)","ex":"Samopylność nie wymaga udziału innej rośliny.","l":3},{"t":"tf","q":"Groch jest przykładem rośliny samopylnej.","a":true,"ex":"To dlatego był wykorzystywany m.in. w klasycznych doświadczeniach genetycznych.","l":3},{"t":"s","q":"Rośliny obcopylne wymagają, aby pyłek pochodził:","a":"Z innej rośliny tego samego gatunku","ex":"To zwiększa różnorodność genetyczną potomstwa.","l":3},{"t":"f","q":"Zapylenie, przy którym pyłek pochodzi z innej rośliny tego samego gatunku, nazywamy zapyleniem _______.","a":"obcym","acc":["krzyżowym"],"ex":"To zapylenie krzyżowe (obce).","l":3},{"t":"o","q":"Wyjaśnij różnicę między zapyleniem samopylnym a obcopylnym.","a":"Przy zapyleniu samopylnym pyłek z pręcików zapyla słupek tego samego kwiatu lub tej samej rośliny, natomiast przy zapyleniu obcopylnym (krzyżowym) pyłek pochodzi z kwiatu innej rośliny tego samego gatunku, co zwiększa różnorodność genetyczną potomstwa.","l":3},{"t":"s","q":"Dąb jest rośliną jednopienną, co oznacza, że:","a":"Na tym samym drzewie występują zarówno kwiaty męskie, jak i żeńskie","ex":"Jednopienność oznacza obecność obu typów kwiatów na jednym osobniku.","l":3},{"t":"tf","q":"U roślin jednopiennych na tym samym osobniku znajdują się zarówno kwiaty męskie, jak i żeńskie.","a":true,"ex":"Dąb jest klasycznym przykładem rośliny jednopiennej.","l":3},{"t":"s","q":"U roślin dwupiennych, np. u niektórych wierzb:","a":"Osobne rośliny mają wyłącznie kwiaty męskie lub wyłącznie żeńskie","ex":"To odróżnia je od roślin jednopiennych.","l":3},{"t":"f","q":"Rośliny, u których poszczególne osobniki mają wyłącznie kwiaty męskie albo wyłącznie żeńskie, nazywamy roślinami _______.","a":"dwupiennymi","acc":[],"ex":"Przykładem są niektóre gatunki wierzb.","l":3},{"t":"o","q":"Wyjaśnij różnicę między roślinami jednopiennymi a dwupiennymi.","a":"U roślin jednopiennych na tym samym osobniku występują zarówno kwiaty męskie, jak i żeńskie (np. dąb), natomiast u roślin dwupiennych poszczególne osobniki mają wyłącznie kwiaty męskie albo wyłącznie żeńskie (np. niektóre wierzby).","l":3},{"t":"s","q":"Nektarniki w kwiecie produkują:","a":"Nektar, przywabiający owady zapylające","ex":"Nektar jest „nagrodą” dla zapylaczy.","l":3},{"t":"tf","q":"Nektar produkowany przez nektarniki jest nagrodą dla owadów zapylających kwiat.","a":true,"ex":"To zachęca owady do odwiedzania kolejnych kwiatów.","l":3},{"t":"s","q":"Ziarno pyłku, po dotarciu na znamię słupka, wykształca:","a":"Łagiewkę pyłkową, rosnącą w kierunku zalążni","ex":"Łagiewka transportuje komórkę plemnikową do zalążka.","l":3},{"t":"f","q":"Struktura wyrastająca z ziarna pyłku po zapyleniu, rosnąca w kierunku zalążni, to _______ pyłkowa.","a":"łagiewka","acc":[],"ex":"Łagiewka umożliwia dotarcie plemnika do zalążka.","l":3},{"t":"tf","q":"Łagiewka pyłkowa umożliwia dotarcie komórki plemnikowej do zalążka znajdującego się w zalążni.","a":true,"ex":"To kluczowy etap prowadzący do zapłodnienia.","l":3},{"t":"o","q":"Opisz, co dzieje się z ziarnem pyłku po jego dotarciu na znamię słupka.","a":"Ziarno pyłku, które dotarło na znamię słupka, wykształca łagiewkę pyłkową, która wrasta w szyjkę słupka i rośnie w kierunku zalążni, transportując komórkę plemnikową do zalążka, gdzie może dojść do zapłodnienia.","l":3},{"t":"s","q":"Znamię słupka pełni funkcję:","a":"Miejsca, na które trafia pyłek podczas zapylenia","ex":"To górna, lepka część słupka.","l":3},{"t":"tf","q":"Znamię słupka jest tą częścią kwiatu, na którą osiada pyłek podczas zapylenia.","a":true,"ex":"Znamię jest zwykle lepkie, co ułatwia przyleganie pyłku.","l":3},{"t":"s","q":"Szyjka słupka łączy:","a":"Znamię z zalążnią","ex":"To środkowa część słupka.","l":3},{"t":"f","q":"Część słupka łącząca znamię z zalążnią to _______ słupka.","a":"szyjka","acc":[],"ex":"Przez szyjkę wrasta łagiewka pyłkowa.","l":3},{"t":"s","q":"Zapylenie entomogamiczne to zapylenie:","a":"Za pośrednictwem owadów","ex":"Nazwa pochodzi od greckiego słowa oznaczającego owada.","l":3},{"t":"tf","q":"Zapylenie entomogamiczne odbywa się dzięki owadom przenoszącym pyłek między kwiatami.","a":true,"ex":"To najczęstszy typ zapylenia u roślin okrytonasiennych.","l":3},{"t":"s","q":"Zapylenie anemogamiczne to zapylenie:","a":"Za pośrednictwem wiatru","ex":"Typowe np. dla traw i drzew iglastych.","l":3},{"t":"f","q":"Zapylenie odbywające się dzięki wiatrowi nazywamy zapyleniem _______.","a":"anemogamicznym","acc":[],"ex":"To alternatywa dla zapylenia przez owady.","l":3},{"
