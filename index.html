Morze Bałtyckie, obmywające wybrzeża Polski, jest częścią zlewiska Oceanu Atlantyckiego.","a":true,"ex":"To pośrednie połączenie przez cieśniny duńskie i Morze Północne.","l":4},{"t":"s","q":"Największym oceanem na Ziemi jest:","a":"Ocean Spokojny (Pacyfik)","ex":"Pacyfik zajmuje największą powierzchnię spośród wszystkich oceanów.","l":4},{"t":"f","q":"Największym i najgłębszym oceanem na Ziemi jest Ocean _______.","a":"Spokojny","acc":[],"ex":"Nazywany jest też Pacyfikiem.","l":4},{"t":"tf","q":"Ocean Spokojny (Pacyfik) jest największym oceanem na Ziemi.","a":true,"ex":"Jest większy niż wszystkie kontynenty razem wzięte.","l":4},{"t":"o","q":"Do głównych oceanów na Ziemi zaliczamy:","a":"Ocean Spokojny, Atlantycki, Indyjski, Południowy i Arktyczny (pięć oceanów).","ex":"W podręczniku wyróżniono pięć oceanów.","l":4},{"t":"o","q":"Wymień pięć oceanów na Ziemi.","a":"Ocean Spokojny (Pacyfik), Atlantycki (Atlantyk), Indyjski, Południowy i Arktyczny.","l":4},{"t":"s","q":"Najwyższym szczytem świata jest:","a":"Mount Everest","ex":"Mount Everest ma wysokość ponad 8800 m n.p.m.","l":4,"k":1},{"t":"tf","q":"Mount Everest, znajdujący się w Himalajach, jest najwyższym szczytem świata.","a":true,"ex":"To najwyższy punkt na Ziemi.","l":4,"k":1},{"t":"s","q":"Mount Everest znajduje się w:","a":"Himalajach, w Azji","ex":"Himalaje leżą na granicy Nepalu i Chin (Tybetu).","l":4,"k":1},{"t":"f","q":"Najwyższy szczyt świata, Mount Everest, znajduje się w paśmie górskim zwanym _______.","a":"Himalajami","acc":[],"ex":"To najwyższe pasmo górskie na Ziemi.","l":4,"k":1},{"t":"s","q":"Najdłuższą rzeką świata jest tradycyjnie uznawany:","a":"Nil","ex":"Nil płynie przez wschodnią Afrykę.","l":4},{"t":"tf","q":"Nil, płynący w Afryce, jest tradycyjnie uznawany za najdłuższą rzekę świata.","a":true,"ex":"Czasem porównuje się go z Amazonką, w zależności od metody pomiaru.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego czasem trudno jednoznacznie wskazać najdłuższą rzekę świata.","a":"Trudność wynika z różnych sposobów mierzenia długości rzeki (np. gdzie dokładnie znajduje się jej źródło) — dlatego czasem podaje się Nil, a czasem Amazonkę jako najdłuższą rzekę świata, w zależności od przyjętej metody pomiaru.","l":4},{"t":"s","q":"Największą pustynią gorącą na świecie jest:","a":"Sahara","ex":"Sahara zajmuje ogromną część północnej Afryki.","l":4},{"t":"tf","q":"Sahara, znajdująca się w Afryce, jest największą gorącą pustynią na świecie.","a":true,"ex":"Zajmuje powierzchnię porównywalną z całymi Stanami Zjednoczonymi.","l":4},{"t":"s","q":"Wyprawa, która jako pierwsza w historii opłynęła Ziemię, była kierowana przez:","a":"Ferdynanda Magellana","ex":"Sam Magellan zginął w trakcie podróży, ale jego wyprawa dopłynęła do celu.","l":null},{"t":"f","q":"Wyprawa kierowana przez Ferdynanda Magellana jako pierwsza w historii opłynęła _______.","a":"Ziemię","acc":[],"ex":"To potwierdziło, że Ziemia ma kształt zbliżony do kuli.","l":null},{"t":"o","q":"Wyjaśnij znaczenie wyprawy Ferdynanda Magellana dla historii odkryć geograficznych.","a":"Wyprawa kierowana przez Ferdynanda Magellana jako pierwsza w historii opłynęła całą kulę ziemską, co ostatecznie potwierdziło, że Ziemia jest okrągła i że można dotrzeć do Azji, płynąc w kierunku zachodnim, opływając kontynent amerykański.","l":null},{"t":"s","q":"Krzysztof Kolumb jest znany przede wszystkim z:","a":"Dotarcia do Ameryki w 1492 roku","ex":"Szukał drogi morskiej do Azji, płynąc na zachód.","l":null},{"t":"tf","q":"Krzysztof Kolumb dotarł do Ameryki w 1492 roku, szukając drogi morskiej do Azji.","a":true,"ex":"To jedno z najważniejszych wydarzeń epoki wielkich odkryć geograficznych.","l":null},{"t":"s","q":"Marco Polo słynął z:","a":"Podróży lądowych do Chin i innych krajów Azji","ex":"Opisał potem swoje podróże w słynnej książce.","l":null},{"t":"f","q":"Marco Polo odbył słynną podróż do _______, opisując potem swoje przygody w książce.","a":"Chin","acc":[],"ex":"Jego relacje wzbudziły w Europie ogromne zainteresowanie Azją.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego podróż Marco Polo do Chin była ważnym wydarzeniem w historii odkryć geograficznych.","a":"Marco Polo jako jeden z pierwszych Europejczyków dotarł do odległych krain Azji, w tym do Chin, i opisał w swojej książce zwyczaje, bogactwa i kulturę tamtych krajów, co rozbudziło w Europie zainteresowanie dalekimi podróżami i handlem z Azją.","l":null},{"t":"s","q":"Vasco da Gama jest znany z:","a":"Odnalezienia drogi morskiej z Europy do Indii, opływając Afrykę","ex":"To otworzyło nowy szlak handlowy z Europy do Azji.","l":null},{"t":"tf","q":"Vasco da Gama odnalazł drogę morską z Europy do Indii, opływając Afrykę.","a":true,"ex":"To ważne odkrycie epoki wielkich odkryć geograficznych.","l":null},{"t":"s","q":"Wielkie odkrycia geograficzne miały miejsce głównie w:","a":"XV i XVI wieku","ex":"To okres podróży Kolumba, Magellana i Vasco da Gamy.","l":null},{"t":"f","q":"Okres wielkich odkryć geograficznych, obejmujący m.in. podróże Kolumba i Magellana, przypada głównie na wiek XV i _______.","a":"XVI","acc":[],"ex":"To dwa kolejne stulecia intensywnych podróży morskich.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego wielkie odkrycia geograficzne (XV–XVI w.) były ważnym momentem w historii ludzkości.","a":"Wielkie odkrycia geograficzne pozwoliły Europejczykom poznać nowe lądy, ludy i szlaki handlowe, znacząco poszerzając wiedzę o świecie, zmieniając mapy, handel oraz relacje między różnymi częściami świata.","l":null},{"t":"s","q":"Kontynent, na którym leżą Chiny i Indie, to:","a":"Azja","ex":"To dwa najludniejsze kraje świata.","l":4},{"t":"tf","q":"Chiny i Indie leżą na kontynencie azjatyckim.","a":true,"ex":"Azja jest największym i najludniejszym kontynentem.","l":4},{"t":"s","q":"Kontynent, na którym leży większość krajów, takich jak Egipt czy Kenia, to:","a":"Afryka","ex":"Afryka jest drugim co do wielkości kontynentem.","l":4},{"t":"f","q":"Egipt i Kenia leżą na kontynencie _______.","a":"afrykańskim","acc":[],"ex":"Afryka obejmuje m.in. Saharę i sawanny wschodniej Afryki.","l":4},{"t":"s","q":"Kontynent, na którym leżą Stany Zjednoczone i Kanada, to:","a":"Ameryka Północna","ex":"To trzeci co do wielkości kontynent.","l":4},{"t":"tf","q":"Stany Zjednoczone i Kanada leżą na kontynencie Ameryki Północnej.","a":true,"ex":"Ameryka Północna obejmuje też Meksyk i kraje Ameryki Środkowej.","l":4},{"t":"s","q":"Kontynent, na którym leżą Brazylia i Argentyna, to:","a":"Ameryka Południowa","ex":"To kontynent, przez który przepływa Amazonka.","l":4},{"t":"f","q":"Brazylia i Argentyna leżą na kontynencie _______.","a":"Ameryki Południowej","acc":[],"ex":"Ten kontynent słynie m.in. z lasów Amazonii.","l":4},{"t":"o","q":"Przyporządkuj cztery kraje (Egipt, Chiny, Brazylia, Kanada) do właściwych kontynentów.","a":"Egipt — Afryka; Chiny — Azja; Brazylia — Ameryka Południowa; Kanada — Ameryka Północna.","l":4},{"t":"s","q":"Podróże geograficzne w XX wieku, np. zdobycie bieguna południowego, były możliwe dzięki:","a":"Postępowi technologicznemu i lepszemu przygotowaniu wypraw","ex":"Nowoczesny sprzęt i wiedza umożliwiły dotarcie w najbardziej odległe miejsca na Ziemi.","l":null},{"t":"tf","q":"Zdobycie biegunów Ziemi w XX wieku było możliwe m.in. dzięki postępowi technologicznemu.","a":true,"ex":"Lepszy sprzęt i transport ułatwiły takie wyprawy.","l":null},{"t":"s","q":"Różnica między kontynentem a oceanem polega na tym, że:","a":"Kontynent to duży, zwarty obszar lądu, a ocean to rozległy zbiornik słonej wody","ex":"To dwa zupełnie różne rodzaje form powierzchni Ziemi.","l":4},{"t":"tf","q":"Kontynent to duży, zwarty obszar lądu, a ocean to rozległy zbiornik słonej wody oddzielający kontynenty.","a":true,"ex":"Oceany zajmują większość powierzchni Ziemi.","l":4},{"t":"o","q":"Wyjaśnij różnicę między kontynentem a oceanem.","a":"Kontynent to duży, zwarty obszar lądu, natomiast ocean to ogromny zbiornik słonej wody, oddzielający od siebie poszczególne kontynenty i pokrywający większą część powierzchni Ziemi.","l":4},{"t":"s","q":"Powierzchnia Ziemi jest w większości pokryta:","a":"Wodą (oceanami i morzami)","ex":"Ponad 70% powierzchni Ziemi to woda.","l":4},{"t":"f","q":"Woda (oceany i morza) pokrywa większość _______ Ziemi.","a":"powierzchni","acc":[],"ex":"To dlatego Ziemię nazywa się „błękitną planetą”.","l":4},{"t":"tf","q":"Powierzchnia Ziemi jest w większości (ponad 70%) pokryta wodą.","a":true,"ex":"Ląd zajmuje mniejszą część powierzchni Ziemi.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego Ziemię czasem nazywa się „błękitną planetą”.","a":"Ziemię nazywa się „błękitną planetą”, ponieważ ponad 70% jej powierzchni pokrywają oceany i morza, które z kosmosu nadają jej charakterystyczny, niebieski odcień.","l":4},{"t":"s","q":"Który ocean oddziela Europę od Ameryki Północnej?","a":"Ocean Atlantycki","ex":"To drugi co do wielkości ocean na Ziemi.","l":4},{"t":"tf","q":"Ocean Atlantycki oddziela Europę od Ameryki Północnej i Południowej.","a":true,"ex":"Przez ten ocean płynęła wyprawa Kolumba.","l":4},{"t":"s","q":"Który ocean jest największy i oddziela Azję od Ameryki?","a":"Ocean Spokojny","ex":"To Pacyfik, największy ocean świata.","l":4},{"t":"f","q":"Ocean Spokojny (Pacyfik) oddziela Azję od kontynentu _______.","a":"amerykańskiego","acc":[],"ex":"To ogromny obszar wodny między obiema Amerykami a Azją.","l":4},{"t":"s","q":"Który ocean znajduje się głównie w rejonie bieguna północnego?","a":"Ocean Arktyczny","ex":"To najmniejszy z oceanów.","l":4},{"t":"tf","q":"Ocean Arktyczny znajduje się w rejonie bieguna północnego i jest w dużej mierze pokryty lodem.","a":true,"ex":"To najzimniejszy z oceanów.","l":4},{"t":"s","q":"Który ocean sąsiaduje z Afryką, Azją i Australią?","a":"Ocean Indyjski","ex":"To trzeci co do wielkości ocean na świecie.","l":4},{"t":"f","q":"Ocean sąsiadujący z Afryką, częścią Azji i Australią to Ocean _______.","a":"Indyjski","acc":[],"ex":"To przez ten ocean prowadziła droga morska Vasco da Gamy do Indii.","l":4},{"t":"o","q":"Wymień, które kontynenty sąsiadują z Oceanem Indyjskim.","a":"Z Oceanem Indyjskim sąsiadują m.in. Afryka, Azja i Australia.","l":4},{"t":"s","q":"Który kontynent jest zamieszkany przez najwięcej ludzi na świecie?","a":"Azja","ex":"To efekt m.in. ogromnej liczby mieszkańców Chin i Indii.","l":4},{"t":"tf","q":"Azja jest kontynentem zamieszkanym przez największą liczbę ludzi na świecie.","a":true,"ex":"Mieszka tam ponad połowa ludności świata.","l":4},{"t":"f","q":"Spośród zamieszkanych kontynentów, Australia ma stosunkowo _______ liczbę mieszkańców.","a":"małą","acc":[],"ex":"Duża część jej powierzchni to pustynne interior.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego Azja jest najliczniej zaludnionym kontynentem na świecie.","a":"Azja jest największym kontynentem, obejmującym m.in. Chiny i Indie — dwa najludniejsze kraje świata — dlatego łączna liczba mieszkańców Azji znacznie przewyższa liczbę mieszkańców innych kontynentów.","l":4},{"t":"s","q":"Wyprawy geograficzne w XX wieku obejmowały m.in.:","a":"Zdobycie biegunów Ziemi i eksplorację dna oceanów","ex":"To rozszerzyło wiedzę o najbardziej niedostępnych miejscach na Ziemi.","l":null},{"t":"tf","q":"W XX wieku miały miejsce ważne wyprawy geograficzne, np. zdobycie biegunów Ziemi.","a":true,"ex":"To pokazuje, że odkrywanie Ziemi trwało długo po epoce wielkich odkryć geograficznych.","l":null},{"t":"s","q":"Mapy pomagały odkrywcom geograficznym przede wszystkim w:","a":"Planowaniu tras i dokumentowaniu nowo odkrytych lądów","ex":"Bez map trudno byłoby planować dalekie, bezpieczne podróże.","l":null},{"t":"f","q":"Mapy pomagały odkrywcom planować trasy oraz dokumentować nowo odkryte _______.","a":"lądy","acc":[],"ex":"Dzięki temu wiedza geograficzna mogła być przekazywana dalej.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego mapy były ważnym narzędziem dla podróżników i odkrywców geograficznych.","a":"Mapy pozwalały odkrywcom planować trasy podróży, orientować się w nieznanym terenie oraz dokumentować nowo odkryte lądy i szlaki morskie, co ułatwiało kolejne wyprawy i rozwój wiedzy geograficznej o świecie.","l":null},{"t":"s","q":"Chronologicznie jako pierwsza z trzech miała miejsce:","a":"Podróż Marco Polo do Chin","ex":"Marco Polo podróżował w XIII wieku, znacznie wcześniej niż Kolumb czy Magellan.","l":null},{"t":"tf","q":"Marco Polo podróżował do Azji wcześniej niż miały miejsce podróże Kolumba i wyprawa Magellana.","a":true,"ex":"Marco Polo żył w XIII wieku, a Kolumb i Magellan w XV/XVI wieku.","l":null},{"t":"o","q":"Ułóż chronologicznie trzy wydarzenia: podróż Marco Polo do Chin, odkrycie Ameryki przez Kolumba, opłynięcie Ziemi przez wyprawę Magellana.","a":"Najpierw miała miejsce podróż Marco Polo do Chin (XIII wiek), następnie odkrycie Ameryki przez Krzysztofa Kolumba (1492 rok), a na końcu opłynięcie Ziemi przez wyprawę kierowaną przez Ferdynanda Magellana (XVI wiek, lata 1519–1522).","l":null},{"t":"tf","q":"Krzysztof Kolumb, wyruszając w podróż, szukał zachodniej drogi morskiej do Azji, a nie zamierzał odkryć nowego kontynentu.","a":true,"ex":"To dlatego przez pewien czas sądził, że dotarł do Indii.","l":null},{"t":"f","q":"Wielkie odkrycia geograficzne otworzyły nowe szlaki _______ między Europą, Azją i Ameryką.","a":"handlowe","acc":[],"ex":"To zmieniło gospodarkę światową na wieki.","l":null},{"t":"o","q":"Podsumuj krótko znaczenie epoki wielkich odkryć geograficznych dla poznania świata.","a":"Epoka wielkich odkryć geograficznych (XV–XVI w.) pozwoliła Europejczykom poznać nowe kontynenty, ludy i szlaki morskie, znacząco poszerzając wiedzę o kształcie i wielkości Ziemi, a także otwierając nowe możliwości handlu i wymiany kulturowej między odległymi częściami świata.","l":null},{"t":"s","q":"Granica między Europą a Azją przebiega umownie wzdłuż:","a":"Gór Uralskich","ex":"Ural jest tradycyjnie przyjmowaną granicą między obydwoma kontynentami.","l":4},{"t":"tf","q":"Umowna granica między Europą a Azją przebiega wzdłuż Gór Uralskich.","a":true,"ex":"To najczęściej przyjmowana granica na mapach fizycznych.","l":4},{"t":"s","q":"Największą wyspą świata jest:","a":"Grenlandia","ex":"Grenlandia jest w większości pokryta lądolodem.","l":4},{"t":"f","q":"Największą wyspą na świecie jest _______.","a":"Grenlandia","acc":[],"ex":"Znajduje się w pobliżu bieguna północnego.","l":4},{"t":"s","q":"Najgłębsze znane miejsce oceanu, Rów Mariański, znajduje się w:","a":"Oceanie Spokojnym","ex":"To najgłębsze miejsce na Ziemi.","l":4},{"t":"tf","q":"Rów Mariański, najgłębsze miejsce oceanu na Ziemi, znajduje się w Oceanie Spokojnym.","a":true,"ex":"Jego głębokość przekracza 10 kilometrów.","l":4},{"t":"s","q":"Kanał Sueski łączy:","a":"Morze Śródziemne z Morzem Czerwonym","ex":"To sztuczny kanał wybudowany w Egipcie.","l":4},{"t":"f","q":"Kanał Sueski skraca drogę morską między Europą a Azją, łącząc Morze Śródziemne z Morzem _______.","a":"Czerwonym","acc":[],"ex":"Dzięki temu statki nie muszą opływać Afryki.","l":4},{"t":"o","q":"Wyjaśnij, jakie znaczenie ma Kanał Sueski dla żeglugi międzynarodowej.","a":"Kanał Sueski umożliwia statkom płynącym między Europą a Azją ominięcie długiej drogi wokół Afryki, znacznie skracając czas i koszty transportu morskiego.","l":4},{"t":"s","q":"Kanał Panamski łączy:","a":"Ocean Atlantycki z Oceanem Spokojnym","ex":"To sztuczny kanał przecinający Amerykę Środkową.","l":4},{"t":"tf","q":"Kanał Panamski umożliwia statkom skrócenie drogi między Oceanem Atlantyckim a Spokojnym, bez opływania Ameryki Południowej.","a":true,"ex":"To jedna z najważniejszych dróg wodnych na świecie.","l":4},{"t":"s","q":"Płetwal błękitny, żyjący w oceanach, jest:","a":"Największym zwierzęciem na Ziemi","ex":"Płetwal błękitny jest ssakiem, nie rybą, mimo że żyje w wodzie.","l":4},{"t":"f","q":"Największym zwierzęciem żyjącym obecnie na Ziemi jest _______ błękitny.","a":"płetwal","acc":[],"ex":"To ssak morski, a nie ryba.","l":4},{"t":"o","q":"Wyjaśnij, dlaczego wielkie zwierzęta morskie, jak płetwal błękitny, mogą osiągać tak ogromne rozmiary, mimo że na lądzie tak duże zwierzęta by nie przetrwały.","a":"Woda podtrzymuje ciężar ciała zwierzęcia dzięki wyporności, dzięki czemu organizm nie musi dźwigać całej swojej masy tak, jak musiałby to robić na lądzie — to pozwala zwierzętom wodnym, jak płetwal błękitny, osiągać znacznie większe rozmiary niż zwierzęta lądowe.","l":4},{"t":"s","q":"Cieśnina Beringa oddziela:","a":"Azję od Ameryki Północnej","ex":"To wąski pas wody między dwoma kontynentami.","l":4},{"t":"tf","q":"Cieśnina Beringa oddziela kontynent azjatycki od amerykańskiego.","a":true,"ex":"W najwęższym miejscu oba kontynenty dzieli zaledwie kilkadziesiąt kilometrów.","l":4},{"t":"w","q":"kontynent","a":"Rozległy ląd otoczony oceanami, wraz z przybrzeżnymi wyspami.","l":4,"k":1},{"t":"w","q":"ocean","a":"Największy zbiornik wody słonej na Ziemi.","l":4,"k":1},{"t":"w","q":"morze","a":"Część oceanu oddzielona lądami lub wyspami, albo położona przy lądzie.","l":4,"k":1},{"t":"w","q":"półwysep","a":"Część lądu z trzech stron otoczona wodą.","l":4,"k":1},{"t":"w","q":"wyspa","a":"Obszar lądu otoczony ze wszystkich stron wodą.","l":4,"k":1},{"t":"w","q":"archipelag","a":"Grupa blisko siebie położonych wysp.","l":4,"k":1},{"t":"w","q":"cieśnina","a":"Wąski przesmyk wodny łączący dwa zbiorniki wodne.","l":4,"k":1},{"t":"w","q":"zatoka","a":"Część morza lub oceanu wcinająca się w ląd.","l":4,"k":1},{"t":"w","q":"przesmyk","a":"Wąski pas lądu łączący dwa większe lądy.","l":4,"k":1},{"t":"w","q":"półkula","a":"Połowa kuli ziemskiej wyznaczona np. przez równik lub południk zerowy.","l":4,"k":1},{"t":"w","q":"równik","a":"Linia o szerokości geograficznej 0°, dzieląca Ziemię na półkulę północną i południową.","l":4,"k":1},{"t":"w","q":"biegun","a":"Punkt, w którym oś obrotu Ziemi przecina jej powierzchnię; są dwa: północny i południowy.","l":4,"k":1},{"t":"w","q":"rów oceaniczny","a":"Bardzo głębokie, wąskie zagłębienie dna oceanicznego.","l":4,"k":1},{"t":"o","q":"Jak nazywa się równoleżnik 0°?","a":"Równik.","l":3,"k":1},{"t":"o","q":"Przez jakie miejsce przechodzi południk zerowy?","a":"Przez Greenwich w Londynie.","l":3,"k":1},{"t":"o","q":"Na jakie półkule dzieli Ziemię równik?","a":"Na północną i południową.","l":3},{"t":"o","q":"Co określa szerokość geograficzna?","a":"Odległość punktu od równika, mierzoną w stopniach na północ lub południe.","l":3},{"t":"o","q":"Co określa długość geograficzna?","a":"Odległość punktu od południka zerowego, mierzoną w stopniach na wschód lub zachód.","l":3,"k":1},{"t":"o","q":"Na jakie półkule dzieli Ziemię południk zerowy wraz z południkiem 180°?","a":"Na wschodnią i zachodnią.","l":3,"k":1},{"t":"o","q":"Wymień cechy mapy.","a":"Mapa jest ważnym źródłem informacji geograficznej; przedstawia całą powierzchnię Ziemi lub jej część na płaszczyźnie; obiekty są na niej przedstawione za pomocą umownych znaków kartograficznych; obszar jest narysowany w pomniejszeniu.","l":0},{"t":"o","q":"Na czym polega orientowanie mapy?","a":"Na ustawieniu mapy tak, aby kierunek północny na mapie pokrywał się z kierunkiem północnym w terenie.","l":0},{"t":"o","q":"Jak może być wskazana północ na mapie?","a":"Strzałką (oznaczoną najczęściej N lub pn) albo górną ramką mapy.","l":0},{"t":"o","q":"Wymień główne elementy mapy.","a":"Siatka kartograficzna, tytuł, legenda, treść i skala.","l":0},{"t":"o","q":"Do czego służy siatka kartograficzna?","a":"To układ południków i równoleżników, który ułatwia określanie położenia obiektów.","l":0,"k":1},{"t":"o","q":"Co informuje nas tytuł mapy?","a":"Jaki obszar lub jakie zjawisko jest przedstawione na mapie.","l":0},{"t":"o","q":"Co zawiera legenda mapy?","a":"Zestawienie wszystkich znaków kartograficznych użytych na mapie oraz ich wyjaśnienie.","l":0},{"t":"o","q":"Co to jest treść mapy?","a":"Wszystkie obszary i obiekty narysowane na mapie i przedstawione za pomocą umownych znaków kartograficznych.","l":0},{"t":"o","q":"Co informuje skala mapy?","a":"Ile razy na mapie pomniejszono wymiary rzeczywiste.","l":0},{"t":"o","q":"Jak nazywa się ocean światowy i z czego się składa?","a":"Ocean światowy, czyli wszechocean, tworzą wszystkie morza i oceany. Oblewają one dookoła obszary lądowe.","l":4},{"t":"o","q":"Na jakie mniejsze obszary dzielimy lądy i wszechocean?","a":"Lądy dzielimy na kontynenty, a wszechocean na oceany.","l":4},{"t":"o","q":"Wymień wszystkie kontynenty od największego do najmniejszego.","a":"Azja, Afryka, Ameryka Północna, Ameryka Południowa, Antarktyda, Europa, Australia.","l":4},{"t":"o","q":"Wymień wszystkie oceany od największego do najmniejszego.","a":"Ocean Spokojny (Pacyfik), Ocean Atlantycki (Atlantyk), Ocean Indyjski, Ocean Południowy, Ocean Arktyczny.","l":4},{"t":"f","q":"Na Ziemi jest pięć oceanów i _______ kontynentów.","a":"siedem","acc":["7"],"ex":"Są to: Azja, Afryka, Ameryka Północna, Ameryka Południowa, Antarktyda, Europa i Australia.","l":4},{"t":"f","q":"Na Ziemi jest siedem kontynentów i _______ oceanów.","a":"pięć","acc":["5"],"ex":"Spokojny, Atlantycki, Indyjski, Południowy i Arktyczny.","l":4},{"t":"o","q":"Który kontynent ma drugą co do wielkości powierzchnię?","a":"Afryka (po Azji).","l":4},{"t":"o","q":"Który ocean jest najmniejszy?","a":"Ocean Arktyczny.","l":4},{"t":"tf","q":"Ocean Południowy to jeden z oceanów na Ziemi.","a":true,"ex":"Jest ich pięć: Spokojny, Atlantycki, Indyjski, Południowy i Arktyczny.","l":4},{"t":"tf","q":"Europa jest większa od Antarktydy.","a":false,"ex":"Antarktyda jest większa (5. miejsce), Europa jest szósta.","l":4},{"t":"o","q":"Jak nazywają się wielkie formy ukształtowania lądów?","a":"Niziny, wyżyny i góry.","l":4},{"t":"o","q":"Jaką wysokość mają niziny i jaka jest ich powierzchnia?","a":"Niziny to obszary o wysokości do 300 m n.p.m. Ich powierzchnia jest najczęściej równinna, falista lub pagórkowata.","l":4,"k":1},{"t":"o","q":"Gdzie położone są wyżyny i jaka jest ich rzeźba?","a":"Wyżyny są położone powyżej 300 m n.p.m. Mają krajobraz równinny lub pagórkowaty i zwykle małe (do 300 m) wysokości względne.","l":4,"k":1},{"t":"o","q":"Czym charakteryzują się góry?","a":"Dużymi wysokościami względnymi (powyżej 300 m) i znacznym nachyleniem stoków.","l":4,"k":1},{"t":"f","q":"Niziny to obszary położone do _______ m n.p.m.","a":"300","acc":["300 m","300m"],"ex":"Wyżyny leżą powyżej 300 m n.p.m.","l":4},{"t":"tf","q":"Wyżyny charakteryzują się dużymi wysokościami względnymi i znacznym nachyleniem stoków.","a":false,"ex":"To cecha gór. Wyżyny mają zwykle małe (do 300 m) wysokości względne.","l":4},{"t":"o","q":"Dlaczego warto znać nazwy i rozmieszczenie kontynentów i oceanów?","a":"Ułatwia to orientację na mapie świata. Wielkie wyprawy odkrywców pozwoliły poznać lądy i oceany.","l":4},{"t":"o","q":"Co skłoniło Europejczyków do wielkich wypraw morskich i lądowych w epoce wielkich odkryć?","a":"Chęć zdobycia nowych ziem pod osadnictwo i uprawy oraz nowe możliwości handlu.","l":4},{"t":"o","q":"Kiedy rozpoczęła się epoka wielkich odkryć geograficznych?","a":"W XV wieku. Przełom XV i XVI wieku był początkiem wielkich odkryć geograficznych.","l":4},{"t":"o","q":"Kto odbył pierwsze duże zamorskie wyprawy i dokąd dotarł?","a":"Wikingowie. Żeglując po Atlantyku i Oceanie Arktycznym, dotarli do Islandii, Grenlandii i wschodnich wybrzeży dzisiejszej Kanady w Ameryce Północnej.","l":4},{"t":"o","q":"Dokąd dotarł Marco Polo i jaką drogą?","a":"Jako kupiec i podróżnik wędrował jedwabnym szlakiem po stepach, górach i pustyniach Azji i dotarł do Chin i Japonii. Przepłynął też Ocean Indyjski i odwiedził Indie.","l":4},{"t":"o","q":"Czego szukał Krzysztof Kolumb i co odkrył?","a":"Zmierzał na zachód, chcąc znaleźć drogę do Indii. Przez Ocean Atlantycki dotarł do nieznanego wcześniej Europejczykom kontynentu, nazwanego później Ameryką.","l":4},{"t":"o","q":"Z jakiego kraju wyruszył Vasco da Gama i czego dokonał?","a":"Wyruszył z Portugalii. Opłynął Afrykę, wpłynął na Ocean Indyjski przez Kanał Mozambicki i jako pierwszy dotarł drogą morską do Półwyspu Indyjskiego.","l":4},{"t":"o","q":"Czego dokonała wyprawa Ferdynanda Magellana?","a":"Jego statki jako pierwsze opłynęły świat dookoła. Przepłynęły przez cieśninę przy Ziemi Ognistej, nazwaną Cieśniną Magellana. Magellan zginął na jednej z wysp Filipin.","l":4},{"t":"o","q":"Czego dokonał James Cook?","a":"Jako pierwszy ustalił wielkość kontynentu Australii. Dotarł do Nowej Zelandii, opłynął Australię i przez Cieśninę Torresa wpłynął na morza między Australią a Nową Gwineą.","l":4},{"t":"f","q":"Jako pierwszy opłynął świat dookoła _______ Magellan (jego statki).","a":"Ferdynand","acc":["Ferdynand","Ferdynanda","Ferdynand Magellan"],"ex":"Magellan zginął w czasie wyprawy na Filipinach.","l":4},{"t":"o","q":"Wymień największych podróżników i odkrywców z lekcji o kontynentach i oceanach.","a":"Wikingowie, Marco Polo, Krzysztof Kolumb, Vasco da Gama, Ferdynand Magellan i James Cook.","l":4},{"t":"w","q":"wszechocean","a":"Ocean światowy, czyli wszystkie morza i oceany, które oblewają dookoła obszary lądowe.","l":4,"k":1},{"t":"w","q":"kontynent","a":"Duży, zwarty obszar lądu. Na Ziemi jest ich siedem.","l":4,"k":1},{"t":"w","q":"nizina","a":"Obszar położony na wysokości do 300 m n.p.m.","l":4,"k":1},{"t":"w","q":"wyżyna","a":"Obszar położony powyżej 300 m n.p.m. o małych (do 300 m) wysokościach względnych.","l":4,"k":1}]},{"id":"g2","title":"Krajobrazy nizinne Polski","icon":"🌾","lessons":["Różnorodność krajobrazów w Polsce","Krajobraz nadmorski","Krajobraz pojezierny","Krajobraz nizin środkowej Polski","Krajobraz wielkomiejski"],"q":[{"t":"s","q":"Krajobraz nadmorski w Polsce charakteryzuje się obecnością:","a":"Plaż, wydm i klifów","ex":"Wybrzeże Bałtyku to plaże, ruchome wydmy (np. na Mierzei Łebskiej) i klify.","l":1},{"t":"tf","q":"Największym jeziorem w Polsce pod względem powierzchni jest jezioro Śniardwy.","a":true,"ex":"Śniardwy leżą na Pojezierzu Mazurskim i są największym jeziorem w kraju.","l":2},{"t":"s","q":"Pojezierza w Polsce powstały głównie w wyniku działalności:","a":"Lodowca","ex":"Cofający się lodowiec pozostawił zagłębienia, które wypełniły się wodą, tworząc liczne jeziora.","l":2},{"t":"tf","q":"Krajobraz nizinny zajmuje większość powierzchni Polski.","a":true,"ex":"Polska leży głównie na Nizinie Środkowoeuropejskiej, dlatego przeważają u nas niziny.","l":3},{"t":"s","q":"Najdłuższą rzeką Polski jest:","a":"Wisła","ex":"Wisła ma około 1047 km długości i jest najdłuższą rzeką w Polsce.","l":0},{"t":"tf","q":"W Polsce można wyróżnić krajobraz górski, wyżynny, nizinny, pojezierny i nadmorski.","a":true,"ex":"To główne typy krajobrazu naturalnego występujące na terenie naszego kraju.","l":0},{"t":"s","q":"Puszcza Białowieska, znana z żubrów, to przykład krajobrazu:","a":"Nizinnego, leśnego","ex":"Puszcza Białowieska leży na nizinie, na wschodzie Polski.","l":0},{"t":"s","q":"Największą polską wyspą jest:","a":"Wolin","ex":"Wolin leży u ujścia Odry i jest największą wyspą leżącą w całości w granicach Polski.","l":0},{"t":"tf","q":"Bałtyk jest morzem stosunkowo płytkim i słabo zasolonym w porównaniu z oceanami.","a":true,"ex":"Bałtyk jest morzem śródlądowym o ograniczonej wymianie wód z oceanem, dlatego jest mniej słony.","l":1},{"t":"s","q":"Mierzeja to:","a":"Wąski, wydłużony pas lądu oddzielający zatokę lub jezioro od morza","ex":"Przykładem są Mierzeja Wiślana i Mierzeja Łebska na polskim wybrzeżu.","l":1},{"t":"f","q":"Stromy, urwisty brzeg morski, powstały wskutek niszczącej pracy fal (czyli _______ morskiej), nazywamy klifem.","a":"abrazji","acc":[],"ex":"Abrazja to proces niszczenia brzegu przez uderzające o niego fale morskie.","l":1},{"t":"tf","q":"Polska graniczy z siedmioma państwami.","a":true,"ex":"Sąsiadami Polski są: Niemcy, Czechy, Słowacja, Ukraina, Białoruś, Litwa i Rosja (obwód kaliningradzki).","l":0},{"t":"s","q":"Największym miastem Polski pod względem liczby mieszkańców jest:","a":"Warszawa","ex":"Warszawa jest stolicą i największym miastem Polski.","l":4},{"t":"s","q":"Charakterystyczną rośliną krajobrazu wydmowego, sadzoną w celu ograniczenia ruchu piasku, jest:","a":"Piaskownica (trawa wydmowa)","ex":"Korzenie piaskownicy skutecznie wiążą piasek, zapobiegając wędrowaniu wydm.","l":1},{"t":"tf","q":"Wyżyny w Polsce leżą wyżej niż niziny, ale niżej niż góry.","a":true,"ex":"To pośrednia forma ukształtowania terenu między nizinami a górami.","l":0},{"t":"s","q":"Do parków narodowych w Polsce, chroniących m.in. żubry, należy:","a":"Białowieski Park Narodowy","ex":"Białowieski Park Narodowy chroni fragment pierwotnej Puszczy Białowieskiej wraz z żyjącymi tam żubrami.","l":0},{"t":"s","q":"Krajobraz nizinny charakteryzuje się:","a":"Niewielkimi wysokościami i płaskim lub falistym ukształtowaniem terenu","ex":"To najbardziej rozpowszechniony typ krajobrazu w Polsce.","l":0},{"t":"tf","q":"Krajobraz nizinny cechuje się niewielkimi wysokościami nad poziomem morza i stosunkowo płaskim terenem.","a":true,"ex":"Większość obszaru Polski to właśnie niziny.","l":0},{"t":"f","q":"Krajobraz o niewielkich wysokościach i płaskim lub lekko falistym terenie nazywamy krajobrazem _______.","a":"nizinnym","acc":[],"ex":"To dominujący typ krajobrazu w środkowej Polsce.","l":0},{"t":"s","q":"Krajobraz wyżynny różni się od nizinnego:","a":"Większym urozmaiceniem terenu i większymi wysokościami","ex":"Wyżyny mają bardziej urozmaiconą rzeźbę terenu niż niziny.","l":0},{"t":"tf","q":"Krajobraz wyżynny charakteryzuje się większym urozmaiceniem rzeźby terenu niż nizinny.","a":true,"ex":"To pośrednia forma między nizinami a górami.","l":0},{"t":"s","q":"Krajobraz górski charakteryzuje się:","a":"Dużymi wysokościami bezwzględnymi i względnymi, stromymi zboczami","ex":"To najbardziej urozmaicony i najwyższy typ krajobrazu w Polsce.","l":0},{"t":"f","q":"Krajobraz o dużych wysokościach i stromych zboczach nazywamy krajobrazem _______.","a":"górskim","acc":[],"ex":"Występuje na południu Polski, w Sudetach i Karpatach.","l":0},{"t":"o","q":"Wymień trzy podstawowe typy krajobrazu występujące w Polsce i krótko je scharakteryzuj.","a":"Krajobraz nizinny — niewielkie wysokości, płaski lub falisty teren; krajobraz wyżynny — większe urozmaicenie terenu i wysokości; krajobraz górski — duże wysokości, strome zbocza i szczyty.","l":0},{"t":"s","q":"Krajobraz nadmorski w Polsce związany jest przede wszystkim z wybrzeżem:","a":"Morza Bałtyckiego","ex":"To jedyne morze, do którego Polska ma dostęp.","l":1},{"t":"f","q":"Polska ma dostęp do morza dzięki wybrzeżu Morza _______.","a":"Bałtyckiego","acc":[],"ex":"To morze na północy kraju.","l":1},{"t":"s","q":"Charakterystycznym elementem krajobrazu nadmorskiego są:","a":"Wydmy i plaże piaszczyste","ex":"To typowe cechy polskiego wybrzeża.","l":1},{"t":"tf","q":"Wydmy i piaszczyste plaże są charakterystycznymi elementami polskiego wybrzeża Morza Bałtyckiego.","a":true,"ex":"Ciągną się one wzdłuż całego polskiego wybrzeża.","l":1},{"t":"o","q":"Wymień dwa charakterystyczne elementy krajobrazu nadmorskiego w Polsce.","a":"Np. wydmy (w tym ruchome wydmy Słowińskiego Parku Narodowego) oraz piaszczyste plaże, a także klify (np. w okolicach Wolina).","l":1},{"t":"s","q":"Mierzeja to:","a":"Wąski, piaszczysty pas lądu oddzielający zatokę lub lagunę od morza","ex":"Mierzeja powstaje w wyniku działania fal i prądów morskich.","l":1},{"t":"tf","q":"Mierzeja to wąski pas lądu oddzielający zatokę lub lagunę od otwartego morza.","a":true,"ex":"Przykładem jest Mierzeja Wiślana.","l":1},{"t":"s","q":"Przykładem mierzei w Polsce jest:","a":"Mierzeja Wiślana","ex":"Mierzeja Wiślana oddziela Zalew Wiślany od Bałtyku.","l":1},{"t":"f","q":"Wąski, piaszczysty pas lądu oddzielający Zalew Wiślany od Bałtyku nazywamy Mierzeją _______.","a":"Wiślaną","acc":[],"ex":"To jedna z najbardziej znanych mierzei w Polsce.","l":1},{"t":"s","q":"Klif to:","a":"Stromy, urwisty brzeg morski, powstały w wyniku niszczącej działalności fal","ex":"Klify można zobaczyć np. na wyspie Wolin.","l":1},{"t":"tf","q":"Klif to stromy, urwisty brzeg morski, kształtowany przez niszczącą działalność fal.","a":true,"ex":"Fale stopniowo podcinają i osłabiają taki brzeg.","l":1},{"t":"o","q":"Wyjaśnij, jak powstaje klif na wybrzeżu morskim.","a":"Klif powstaje w wyniku systematycznego niszczenia (erozji) wysokiego, stromego brzegu morskiego przez uderzające o niego fale, które stopniowo podcinają i osłabiają brzeg, aż dochodzi do jego obrywania.","l":1},{"t":"s","q":"Pojezierza w Polsce, np. Pojezierze Mazurskie, charakteryzują się:","a":"Dużą liczbą jezior polodowcowych","ex":"To region znany z tysięcy jezior.","l":2},{"t":"tf","q":"Pojezierza, jak Pojezierze Mazurskie, charakteryzują się dużą liczbą jezior powstałych w wyniku działalności lodowca.","a":true,"ex":"To region bardzo popularny wśród turystów wodnych.","l":2},{"t":"s","q":"Jeziora polodowcowe powstały w wyniku działalności:","a":"Lądolodu (lodowca) w przeszłości geologicznej","ex":"To skutek zlodowaceń, które miały miejsce tysiące lat temu.","l":2},{"t":"f","q":"Jeziora powstałe w wyniku działalności dawnego lądolodu nazywamy jeziorami _______.","a":"polodowcowymi","acc":[],"ex":"Takich jezior jest wiele na Pojezierzu Mazurskim i Pomorskim.","l":2},{"t":"o","q":"Wyjaśnij, w jaki sposób powstały liczne jeziora na Pojezierzu Mazurskim.","a":"Tysiące lat temu przez obszar dzisiejszego Pojezierza Mazurskiego przesuwał się potężny lądolód, który żłobił zagłębienia w podłożu; gdy lądolód stopniał, w tych zagłębieniach zebrała się woda, tworząc liczne jeziora polodowcowe.","l":2},{"t":"s","q":"Największą rzeką Polski, zarówno pod względem długości, jak i znaczenia, jest:","a":"Wisła","ex":"Wisła jest najdłuższą rzeką w Polsce.","l":0},{"t":"tf","q":"Wisła jest najdłuższą rzeką Polski.","a":true,"ex":"Przepływa m.in. przez Kraków i Warszawę.","l":0},{"t":"s","q":"Drugą co do długości rzeką Polski jest:","a":"Odra","ex":"Odra przepływa m.in. przez Wrocław i Szczecin.","l":0},{"t":"f","q":"Oprócz Wisły, drugą ważną, dużą rzeką Polski jest _______.","a":"Odra","acc":[],"ex":"Odra stanowi też fragment granicy Polski z Niemcami.","l":0},{"t":"o","q":"Podaj nazwy dwóch największych rzek Polski.","a":"Wisła i Odra.","l":0},{"t":"s","q":"Wisła uchodzi do:","a":"Morza Bałtyckiego","ex":"Ujście Wisły znajduje się w okolicach Gdańska.","l":0},{"t":"tf","q":"Wisła uchodzi do Morza Bałtyckiego w okolicach Gdańska.","a":true,"ex":"To kończy bieg tej najdłuższej polskiej rzeki.","l":0},{"t":"s","q":"Puszcza Białowieska jest przykładem:","a":"Jednego z ostatnich fragmentów pierwotnego lasu w Europie","ex":"To wyjątkowy, unikatowy obszar leśny.","l":0},{"t":"tf","q":"Puszcza Białowieska jest jednym z ostatnich fragmentów pierwotnego lasu (puszczy) w Europie.","a":true,"ex":"Dlatego jest objęta szczególną ochroną, m.in. jako Białowieski Park Narodowy.","l":0},{"t":"s","q":"W Puszczy Białowieskiej można spotkać m.in.:","a":"Żubry, żyjące tam na wolności","ex":"Żubry są symbolem Puszczy Białowieskiej.","l":0},{"t":"f","q":"W Puszczy Białowieskiej żyją na wolności m.in. _______, największe europejskie ssaki lądowe.","a":"żubry","acc":[],"ex":"To symbol tego wyjątkowego lasu.","l":0},{"t":"o","q":"Wyjaśnij, dlaczego Puszcza Białowieska jest szczególnie cenna przyrodniczo.","a":"Puszcza Białowieska jest jednym z ostatnich fragmentów pierwotnego lasu w Europie, zachowującego naturalny charakter zbliżony do tego sprzed wieków, a także ostoją wielu rzadkich gatunków zwierząt, w tym żyjących tam na wolności żubrów.","l":0},{"t":"s","q":"Park narodowy to obszar:","a":"Objęty najwyższą formą ochrony przyrody w Polsce","ex":"To najważniejsza forma ochrony przyrody w polskim prawie.","l":0},{"t":"tf","q":"Park narodowy jest w Polsce najwyższą formą ochrony przyrody.","a":true,"ex":"Podlega szczególnym zasadom ochrony i zarządzania.","l":0},{"t":"o","q":"Wyjaśnij, czym różni się park narodowy od zwykłego parku miejskiego.","a":"Park narodowy to obszar objęty najwyższą formą ochrony przyrody, obejmujący cenne, często unikatowe ekosystemy i gatunki, z ograniczeniami dotyczącymi działalności człowieka, podczas gdy park miejski to zwykle teren rekreacyjny w mieście, niepodlegający tak rygorystycznej ochronie przyrodniczej.","l":0},{"t":"s","q":"Wysokość terenu w Polsce generalnie:","a":"Wzrasta w kierunku z północy na południe","ex":"Od pobrzeży, przez niziny i wyżyny, aż po góry na południu.","l":0},{"t":"tf","q":"Wysokość terenu w Polsce generalnie wzrasta w kierunku z północy na południe, od pobrzeży przez niziny i wyżyny, aż po góry.","a":true,"ex":"To ogólna zasada rzeźby terenu Polski.","l":0},{"t":"o","q":"Opisz ogólny układ pasów krajobrazowych Polski, z północy na południe.","a":"Z północy na południe w Polsce występują kolejno: pas pobrzeży (nadmorski), pas pojezierzy, pas nizin środkowopolskich, pas wyżyn, a na samym południu pas gór (Sudety i Karpaty).","l":0},{"t":"s","q":"Do wyżyn Polski zaliczamy m.in.:","a":"Wyżynę Krakowsko-Częstochowską i Wyżynę Lubelską","ex":"To dwie przykładowe wyżyny na terenie Polski.","l":0},{"t":"tf","q":"Wyżyna Krakowsko-Częstochowska i Wyżyna Lubelska to przykłady wyżyn w Polsce.","a":true,"ex":"Wyżyny leżą wyżej niż niziny, ale niżej niż góry.","l":0},{"t":"s","q":"Do nizin Polski zaliczamy m.in.:","a":"Nizinę Mazowiecką i Nizinę Śląską","ex":"Niziny zajmują większość powierzchni Polski.","l":0},{"t":"f","q":"Nizina Mazowiecka i Nizina Śląska to przykłady _______ w Polsce.","a":"nizin","acc":[],"ex":"Niziny są najbardziej rozpowszechnionym typem krajobrazu w kraju.","l":0},{"t":"o","q":"Podaj po jednym przykładzie niziny, wyżyny i pasma górskiego w Polsce.","a":"Nizina: np. Nizina Mazowiecka. Wyżyna: np. Wyżyna Krakowsko-Częstochowska. Pasmo górskie: np. Tatry lub Sudety.","l":0},{"t":"s","q":"Wydmy nadmorskie w Polsce mogą być:","a":"Ruchome, przemieszczające się pod wpływem wiatru","ex":"To ciekawe zjawisko przyrodnicze widoczne na polskim wybrzeżu.","l":1},{"t":"tf","q":"Niektóre wydmy nadmorskie w Polsce, np. w Słowińskim Parku Narodowym, są ruchome i przemieszczają się pod wpływem wiatru.","a":true,"ex":"To jedna z atrakcji przyrodniczych polskiego wybrzeża.","l":1},{"t":"s","q":"Słowiński Park Narodowy jest znany przede wszystkim z:","a":"Ruchomych wydm","ex":"To unikatowy krajobraz na skalę europejską.","l":1},{"t":"f","q":"Słowiński Park Narodowy słynie z _______ wydm, przemieszczających się pod wpływem wiatru.","a":"ruchomych","acc":[],"ex":"To niezwykłe zjawisko przyrodnicze polskiego wybrzeża.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego wydmy w Słowińskim Parku Narodowym nazywane są „ruchomymi”.","a":"Wydmy te są zbudowane z drobnego, sypkiego piasku, który pod wpływem silnego wiatru wiejącego znad morza jest stopniowo przenoszony, przez co cała wydma z czasem przesuwa się w głąb lądu, czasem nawet zasypując pobliskie drzewa czy roślinność.","l":1},{"t":"tf","q":"Polska ma zróżnicowane krajobrazy — od nadmorskiego, przez pojezierny, nizinny, wyżynny, aż po górski.","a":true,"ex":"To sprawia, że Polska oferuje wiele różnych typów przyrody i turystyki.","l":0},{"t":"s","q":"Rzeki takie jak Wisła i Odra mają duże znaczenie:","a":"Transportowe, gospodarcze i przyrodnicze","ex":"Rzeki od wieków były ważne dla rozwoju miast i gospodarki.","l":0},{"t":"f","q":"Rzeki takie jak Wisła i Odra mają duże znaczenie transportowe, gospodarcze i _______ dla Polski.","a":"przyrodnicze","acc":[],"ex":"Doliny rzek są też ważnymi korytarzami ekologicznymi.","l":0},{"t":"o","q":"Wyjaśnij znaczenie Wisły dla Polski.","a":"Wisła jest najdłuższą rzeką Polski, ważną drogą wodną wykorzystywaną w transporcie, źródłem wody dla wielu miast i rolnictwa, a także cennym środowiskiem przyrodniczym dla wielu gatunków roślin i zwierząt, biegnącą przez wiele ważnych historycznie miast, jak Kraków czy Warszawa.","l":0},{"t":"s","q":"W Polsce funkcjonuje sieć parków narodowych i innych obszarów chronionych, obejmujących:","a":"Różne typy krajobrazów, od nadmorskiego po górski","ex":"Parki narodowe chronią bardzo różnorodne ekosystemy w całym kraju.","l":0},{"t":"tf","q":"W Polsce funkcjonuje sieć parków narodowych i innych obszarów chronionych, obejmujących różne typy krajobrazów — od nadmorskiego po górski.","a":true,"ex":"To dzięki temu chronione są różnorodne ekosystemy w całym kraju.","l":0},{"t":"o","q":"Podsumuj, dlaczego różnorodność krajobrazowa Polski (niziny, wyżyny, góry, pobrzeża, pojezierza) jest wartościowa przyrodniczo i turystycznie.","a":"Różnorodność krajobrazowa Polski sprawia, że kraj ten oferuje wiele odmiennych ekosystemów — od nadmorskich wydm, przez jeziora polodowcowe i żyzne niziny, po skaliste wyżyny i wysokie góry — co sprzyja bogactwu gatunków roślin i zwierząt, a także przyciąga turystów zainteresowanych różnymi formami wypoczynku i poznawania przyrody.","l":0},{"t":"s","q":"Krutynia to przykład:","a":"Malowniczej rzeki płynącej przez Pojezierze Mazurskie","ex":"Jest bardzo popularna wśród miłośników spływów kajakowych.","l":2},{"t":"tf","q":"Krutynia jest znaną, malowniczą rzeką płynącą przez tereny Pojezierza Mazurskiego, popularną wśród kajakarzy.","a":true,"ex":"Spływ Krutynią to jedna z najpopularniejszych tras kajakowych w Polsce.","l":2},{"t":"s","q":"Krajobraz wielkomiejski, jak w Warszawie, charakteryzuje się:","a":"Gęstą zabudową i rozbudowaną infrastrukturą","ex":"To typowy krajobraz dużych ośrodków miejskich.","l":4},{"t":"tf","q":"Krajobraz wielkomiejski charakteryzuje się gęstą zabudową i rozbudowaną infrastrukturą, jak w przypadku Warszawy.","a":true,"ex":"Obejmuje to m.in. wieżowce, sieć dróg i komunikacji miejskiej.","l":4},{"t":"o","q":"Wymień dwie cechy charakterystyczne krajobrazu wielkomiejskiego, np. Warszawy.","a":"Np. gęsta, wysoka zabudowa (w tym wieżowce) oraz rozbudowana infrastruktura, taka jak sieć dróg, linii tramwajowych czy metra.","l":4},{"t":"s","q":"Jeziora przybrzeżne na polskim wybrzeżu, np. Łebsko czy Gardno, powstały w wyniku:","a":"Odcięcia dawnej zatoki morskiej przez mierzeję","ex":"Mierzeja stopniowo odcinała zatokę od otwartego morza.","l":1},{"t":"tf","q":"Jeziora przybrzeżne na polskim wybrzeżu powstały w wyniku odcięcia dawnych zatok morskich przez mierzeje.","a":true,"ex":"To charakterystyczny proces kształtowania wybrzeża Bałtyku.","l":1},{"t":"o","q":"Wyjaśnij, w jaki sposób powstały jeziora przybrzeżne na polskim wybrzeżu Bałtyku.","a":"Jeziora przybrzeżne powstały w wyniku stopniowego odcięcia dawnych, płytkich zatok morskich od otwartego morza przez namuloną, piaszczystą mierzeję, która z czasem oddzieliła zbiornik wodny od morza, tworząc odrębne jezioro.","l":1},{"t":"w","q":"krajobraz","a":"Wygląd okolicy, na który składają się rzeźba terenu, wody, szata roślinna i działalność człowieka.","l":0,"k":1},{"t":"w","q":"wyżyna","a":"Obszar położony powyżej 300 m n.p.m. o małych (do 300 m) wysokościach względnych; krajobraz równinny lub pagórkowaty.","l":0,"k":1},{"t":"w","q":"góry","a":"Obszar o dużych wysokościach względnych (powyżej 300 m) i znacznym nachyleniu stoków.","l":0,"k":1},{"t":"w","q":"pojezierze","a":"Obszar z licznymi jeziorami i pagórkami, powstały po zlodowaceniu.","l":2,"k":1},{"t":"w","q":"pobrzeże","a":"Pas nizin wzdłuż wybrzeża morza.","l":1,"k":1},{"t":"w","q":"morena","a":"Skały i piasek naniesione i pozostawione przez lodowiec.","l":2,"k":1},{"t":"w","q":"wydma","a":"Wzniesienie z piasku usypane przez wiatr.","l":1,"k":1},{"t":"w","q":"dorzecze","a":"Obszar, z którego wody spływają do jednej rzeki i jej dopływów.","l":0,"k":1},{"t":"w","q":"dział wodny","a":"Granica między dorzeczami sąsiednich rzek.","l":0,"k":1},{"t":"w","q":"kotlina","a":"Rozległe obniżenie otoczone wyższymi terenami.","l":0,"k":1},{"t":"w","q":"lodowiec","a":"Duża masa lodu powoli spływająca w dół lub rozprzestrzeniająca się po lądzie.","l":2,"k":1},{"t":"o","q":"Opisz ukształtowanie powierzchni Niziny Mazowieckiej.","a":"Jest to teren płaski lub lekko falisty, położony na niewielkiej wysokości nad poziomem morza (do 300 m n.p.m.).","l":3,"k":1},{"t":"o","q":"Jaka duża rzeka płynie przez Nizinę Mazowiecką?","a":"Wisła.","l":3},{"t":"o","q":"Dlaczego na Nizinie Mazowieckiej rozwinęło się rolnictwo?","a":"Płaski teren i dobre gleby sprzyjają uprawie roślin, dlatego jest tu wiele pól uprawnych i sadów.","l":3},{"t":"o","q":"Jaki park narodowy chroni lasy, wydmy i torfowiska w pobliżu Warszawy?","a":"Kampinoski Park Narodowy.","l":3},{"t":"o","q":"Co to jest nizina?","a":"Obszar położony na wysokości do 300 m n.p.m. Powierzchnia jest najczęściej równinna, falista lub pagórkowata.","l":3,"k":1},{"t":"o","q":"Wymień trzy elementy krajobrazu Niziny Mazowieckiej.","a":"Np. pola uprawne, rzeka Wisła, lasy i wsie.","l":3},{"t":"o","q":"Nad jaką rzeką leży Warszawa?","a":"Nad Wisłą.","l":4},{"t":"o","q":"Dlaczego krajobraz Warszawy nazywamy krajobrazem wielkomiejskim?","a":"Dominują w nim gęsta zabudowa, ulice i inne budowle, a naturalnej przyrody jest niewiele.","l":4},{"t":"o","q":"Jakie funkcje pełni Warszawa jako stolica Polski?","a":"Jest siedzibą najwyższych władz państwowych oraz ważnym ośrodkiem administracyjnym, gospodarczym i kulturalnym.","l":4},{"t":"o","q":"Po co w dużych miastach tworzy się parki i skwery?","a":"Dają mieszkańcom miejsce do wypoczynku oraz poprawiają jakość powietrza.","l":4},{"t":"o","q":"Podaj dwa problemy środowiskowe typowe dla dużych miast.","a":"Np. zanieczyszczenie powietrza i hałas (m.in. przez ruch samochodowy).","l":4},{"t":"o","q":"Co to jest krajobraz pierwotny?","a":"Krajobraz, który nie został (lub prawie nie został) zmieniony przez człowieka, ukształtowany przez przyrodę.","l":0},{"t":"o","q":"Co to jest krajobraz kulturowy?","a":"Krajobraz przekształcony przez człowieka, np. z polami, drogami i miastami.","l":0},{"t":"o","q":"Podaj dwa przykłady przekształcania krajobrazu przez człowieka.","a":"Np. wycinanie lasów pod pola uprawne, budowa miast i dróg, kopalnie.","l":0},{"t":"o","q":"Podaj przykład obszaru w Polsce o krajobrazie zbliżonym do pierwotnego.","a":"Np. Puszcza Białowieska.","l":0},{"t":"o","q":"Dlaczego warto chronić fragmenty krajobrazu naturalnego?","a":"Aby zachować przyrodę i gatunki roślin oraz zwierząt, a także miejsca do badań i wypoczynku.","l":0},{"t":"o","q":"Co to jest krajobraz i z czego się składa?","a":"Krajobrazem nazywamy to, co widzimy wokół nas. Składa się z elementów naturalnych (np. skał, jezior, lasów) oraz wytworów działalności człowieka (np. budynków, dróg, pól uprawnych).","l":0},{"t":"o","q":"Jakim ważnym elementem krajobrazu jest ukształtowanie powierzchni?","a":"To jeden z ważniejszych elementów krajobrazu. Wysokości względne i bezwzględne decydują, czy obszar zaliczamy do nizin, wyżyn czy gór.","l":0},{"t":"o","q":"Jak przedstawia się ukształtowanie powierzchni na mapach?","a":"Za pomocą poziomic i skali barw.","l":0},{"t":"o","q":"Jakie obszary dominują w Polsce?","a":"Niziny, czyli tereny położone poniżej 300 m n.p.m.","l":0,"k":1},{"t":"f","q":"W Polsce dominują obszary nizinne położone poniżej _______ m n.p.m.","a":"300","acc":["300 m","300m"],"ex":"Większość obszaru Polski to niziny o wysokościach bezwzględnych do 300 m n.p.m.","l":0},{"t":"o","q":"Podaj przykłady procesów wewnętrznych, które ukształtowały powierzchnię Polski.","a":"Zjawiska wulkaniczne i ruchy górotwórcze.","l":0},{"t":"o","q":"Podaj przykłady procesów zewnętrznych, które ukształtowały powierzchnię Polski.","a":"Działalność rzek, morza, wiatru, a kiedyś lodowców i lądolodów.","l":0},{"t":"o","q":"Jakie krajobrazy w Polsce nazywamy naturalnymi, a jakie kulturowymi? Podaj przykłady.","a":"Naturalne to takie, w których działalność człowieka jest ograniczona (np. nadmorskie, pojezierne, górskie). Kulturowe to przekształcone przez człowieka (np. rolnicze, przemysłowe, miejskie).","l":0},{"t":"o","q":"Podaj przykład krajobrazu naturalnego, który z czasem stał się kulturowym.","a":"Np. krajobraz górski Tatr jest naturalny, a krajobraz miejski Zakopanego – kulturowy. Z czasem naturalne krajobrazy ulegają coraz większemu wpływowi człowieka.","l":0},{"t":"o","q":"Wymień sześć pasów krajobrazowych Polski.","a":"Pas pobrzeży, pas pojezierzy, pas nizin środkowopolskich, pas wyżyn, pas kotlin podkarpackich i pas gór.","l":0},{"t":"o","q":"Jaki układ ma rzeźba terenu w Polsce?","a":"Ma układ pasowy. Niziny, wyżyny i góry tworzą pasy rzeźby ułożone równoleżnikowo (ze wschodu na zachód).","l":0,"k":1},{"t":"f","q":"W Polsce wyróżniamy _______ pasów krajobrazowych.","a":"sześć","acc":["6"],"ex":"Na obszarze każdego z nich znajdują się krainy geograficzne.","l":0},{"t":"o","q":"Co to jest kraina geograficzna (region)?","a":"Obszar wydzielony ze względu na podobieństwo elementów środowiska geograficznego, wyróżniający go od sąsiednich obszarów.","l":0},{"t":"o","q":"Jak wygląda pas pobrzeży?","a":"W krajobrazie dominują nadmorskie niziny, jeziora przybrzeżne i piaszczyste plaże.","l":0},{"t":"o","q":"Jak wygląda pas pojezierzy?","a":"Teren jest pagórkowaty, a duże obszary porastają lasy. Spotkamy tu wzniesienia i malownicze jeziora polodowcowe.","l":0},{"t":"o","q":"Jak wygląda pas nizin środkowopolskich?","a":"Występują tu rozległe obszary równinne, urozmaicone szerokimi dolinami rzek. Znajduje się tu stolica Polski – Warszawa.","l":0},{"t":"o","q":"Jak wygląda pas wyżyn?","a":"Spotkamy tu skały wapienne, jaskinie, wąwozy, wzgórza i głębokie doliny rzeczne. W rejonach wydobycia węgla i na obszarach rolniczych krajobraz jest silnie przekształcony przez człowieka.","l":0},{"t":"o","q":"Jak wygląda pas kotlin podkarpackich?","a":"To obniżenie otoczone od północy wzniesieniami wyżyn, a od południa pasem gór. Przeważa krajobraz równinny, poprzecinany dolinami rzek: Wisły i Sanu.","l":0},{"t":"o","q":"Jak wygląda pas gór?","a":"Występują tu duże wysokości względne i bezwzględne. W krajobrazie są wyraźnie widoczne szczyty i głębokie doliny.","l":0},{"t":"tf","q":"Pas kotlin podkarpackich zaliczamy do nizin.","a":true,"ex":"Do pasów nizinnych zaliczamy: pas pobrzeży, pojezierzy, nizin środkowopolskich i kotlin podkarpackich.","l":0},{"t":"tf","q":"Pas pojezierzy leży na południe od pasa pobrzeży.","a":true,"ex":"Kolejność od północy: pobrzeża, pojezierza, niziny środkowopolskie, wyżyny, kotliny podkarpackie, góry.","l":0},{"t":"o","q":"Co ciekawego jest w Górach Świętokrzyskich? Dlaczego nie należą do pasa gór?","a":"Leżą na wyżynach i są częścią Wyżyny Małopolskiej, a nie pasa gór. Należą do najstarszych górotworów w Polsce. Odnaleziono tu ślady dinozaurów sprzed 250 mln lat.","l":0},{"t":"o","q":"Jaki jest najwyższy szczyt Gór Świętokrzyskich?","a":"Łysica (614 m n.p.m.).","l":0},{"t":"o","q":"Jakie pasy krajobrazowe zaliczamy do nizin?","a":"Pas pobrzeży, pas pojezierzy, pas nizin środkowopolskich i pas kotlin podkarpackich.","l":0},{"t":"w","q":"niziny","a":"Obszar leżący na wysokości do 300 m n.p.m.","l":0,"k":1},{"t":"w","q":"krajobraz","a":"Przestrzeń złożona z elementów przyrody i wytworów działalności człowieka, które wyróżniają dany teren i decydują o jego wyglądzie.","l":0,"k":1},{"t":"w","q":"krajobraz naturalny","a":"Krajobraz o ograniczonym wpływie człowieka, w którym dominują elementy przyrody żywej i nieożywionej.","l":0,"k":1},{"t":"w","q":"krajobraz kulturowy (antropogeniczny)","a":"Krajobraz, w którym widać duży wpływ działalności człowieka.","l":0,"k":1},{"t":"w","q":"kraina geograficzna (region)","a":"Obszar wydzielony ze względu na podobieństwo elementów środowiska geograficznego, wyróżniający go od obszarów z nim sąsiadujących.","l":0,"k":1},{"t":"o","q":"Gdzie leży pas pobrzeży i jak jeszcze go nazywamy?","a":"Nad Morzem Bałtyckim, najdalej na północ ze wszystkich pasów krajobrazowych Polski. Nazywamy go też nizinami nadmorskimi.","l":1},{"t":"o","q":"Wymień krainy geograficzne pasa pobrzeży.","a":"Pobrzeże Szczecińskie, Pobrzeże Koszalińskie i Pobrzeże Gdańskie.","l":1},{"t":"o","q":"Jak wysoko leży pas pobrzeży? Podaj przykład wyższego wzniesienia.","a":"To najniżej położony obszar Polski. Wysokości bezwzględne przekraczają 100 m n.p.m. tylko w obrębie wyższych wzniesień, np. Rowokół (114,8 m n.p.m.) na północny wschód od Słupska.","l":1},{"t":"o","q":"Czym jest Rowokół?","a":"Wzniesieniem polodowcowym (114,8 m n.p.m.) położonym na północny wschód od Słupska.","l":1},{"t":"o","q":"Co to są depresje? Gdzie występują w Polsce?","a":"Obszary położone poniżej poziomu morza. Występują na Żuławach Wiślanych (Pobrzeże Gdańskie).","l":1},{"t":"o","q":"Gdzie znajduje się najniżej położony punkt w Polsce i jaka jest jego wysokość?","a":"We wsi Marzęcino na Żuławach Wiślanych. Ma wysokość –2,2 m n.p.m.","l":1},{"t":"o","q":"Jakie są główne typy wybrzeży morskich w Polsce?","a":"Wybrzeże niskie (wydmowe) i wysokie (klifowe).","l":1},{"t":"o","q":"Jak powstaje wybrzeże niskie (wydmowe)?","a":"W wyniku budującej działalności fal morskich, które przenoszą na brzeg piasek z dna morza. Wysuszony piasek jest wywiewany przez wiatr, a wzdłuż brzegu tworzą się piaszczyste wzniesienia – wydmy.","l":1},{"t":"o","q":"Jak powstaje wybrzeże wysokie (klifowe) i jak wygląda?","a":"W wyniku niszczącej działalności fal morskich, które podmywają brzeg i powodują jego cofanie. Charakteryzuje się wąską, czasem kamienistą plażą i stromym brzegiem – klifem.","l":1},{"t":"tf","q":"Wybrzeże wydmowe powstaje w wyniku niszczącej działalności fal.","a":false,"ex":"Wybrzeże niskie (wydmowe) powstaje dzięki budującej działalności fal, a wysokie (klifowe) – niszczącej.","l":1},{"t":"o","q":"Czym jest sztorm?","a":"To groźne zjawisko pogodowe nad morzem: silny, porywisty wiatr, który powoduje powstawanie wysokich fal. Do ochrony brzegu i portów buduje się umocnienia, np. falochrony.","l":1},{"t":"o","q":"Czym jest bryza i jak powstaje?","a":"To wiatr lokalny wiejący nad morzem w ciepłej porze roku. Powstaje z różnic w nagrzewaniu się wody i lądu w ciągu doby.","l":1},{"t":"o","q":"W którą stronę wieje bryza dzienna, a w którą nocna?","a":"Bryza dzienna wieje od morza w stronę lądu, a nocna od lądu w stronę morza.","l":1},{"t":"o","q":"Dlaczego w upalny dzień na plaży czujemy orzeźwiający powiew od morza?","a":"W dzień ląd nagrzewa się szybciej niż woda, więc wieje bryza morska od chłodniejszego morza w stronę lądu.","l":1},{"t":"o","q":"Dlaczego nocą bryza wieje od lądu w stronę morza?","a":"Po upalnym dniu morze jest jeszcze ciepłe, a ląd już się ochłodził, więc wiatr wieje od chłodniejszego lądu w stronę morza.","l":1},{"t":"o","q":"Co to jest Wybrzeże Słowińskie i jak daleko się rozciąga?","a":"Część Pobrzeża Koszalińskiego położona nad samym morzem. Obejmuje pas nadmorski o długości ponad 150 km od Kołobrzegu na zachodzie do wsi Karwia koło Władysławowa na wschodzie.","l":1},{"t":"o","q":"Co ma największy wpływ na krajobraz naturalny Wybrzeża Słowińskiego?","a":"Działalność morza oraz wiatru. Dalej od brzegu morza i w obrębie klifów widać też efekty działania lądolodu.","l":1},{"t":"o","q":"Jak powstają mierzeje?","a":"Przybrzeżny prąd (ruch wody równoległy do linii brzegowej) nanosi piasek z morza. Powstałe w ten sposób piaszczyste wały to mierzeje.","l":1},{"t":"o","q":"Jak powstają jeziora przybrzeżne? Podaj przykłady.","a":"Rozrastające się mierzeje odcinają z czasem zatokę od pełnego morza. Tak powstały niektóre jeziora przybrzeżne, np. Gardno, Jamno, Bukowo.","l":1},{"t":"o","q":"Jak powstało jezioro Łebsko?","a":"Na skutek podniesienia się poziomu morza i zalania łąk. Jest największym jeziorem Wybrzeża Słowińskiego.","l":1},{"t":"tf","q":"Wszystkie jeziora przybrzeżne powstały przez odcięcie zatoki mierzeją.","a":false,"ex":"Niektóre tak powstały (Gardno, Jamno, Bukowo), ale Łebsko powstało po podniesieniu się poziomu morza i zalaniu łąk.","l":1},{"t":"o","q":"Jak powstają wydmy i jakie lasy je porastają?","a":"Naniesiony przez morze piasek jest wywiewany przez wiatr i gromadzony w formie wzniesień zwanych wydmami. Nadmorskie wydmy porastają głównie lasy sosnowe.","l":1},{"t":"o","q":"Dlaczego na wydmach rośnie głównie sosna?","a":"Sosna jest drzewem przystosowanym do słabych gleb, jakie powstają na wydmowym piasku.","l":1},{"t":"o","q":"Gdzie na wybrzeżu rosną drzewa liściaste?","a":"Na wysokich klifach i terenach wilgotnych możemy spotkać więcej drzew liściastych. Wzniesienia polodowcowe często porastają lasy bukowe.","l":1},{"t":"o","q":"Jakie zwierzęta i jaki torf znajdziemy na terenach podmokłych wybrzeża?","a":"Tereny podmokłe są miejscem lęgowym wielu gatunków ptaków, np. żurawi. Rodzaj bagiennego torfu, nazywany borowiną, ma właściwości lecznicze.","l":1},{"t":"o","q":"Gdzie wydobywa się borowinę i do czego służy?","a":"Wydobywa się ją m.in. w Kołobrzegu i stosuje w uzdrowiskach do zabiegów leczniczych.","l":1},{"t":"o","q":"Co chroni Słowiński Park Narodowy?","a":"Park wpisany na listę rezerwatów biosfery UNESCO, chroni m.in. ruchome wydmy, jezioro Łebsko i pionierską roślinność nadmorską.","l":1},{"t":"o","q":"Dlaczego wydmy w Słowińskim Parku Narodowym nazywamy ruchomymi? Co się dzieje z lasem?","a":"Pod wpływem wiatru wydmy przemieszczają się o kilka metrów w ciągu roku, zasypując rosnące w pobliżu drzewa. Tak powstają martwe lasy.","l":1},{"t":"o","q":"Jaka jest najwyższa wydma w Słowińskim Parku Narodowym?","a":"Wydma Łącka – ma ponad 40 m wysokości. Prowadzi przez nią szlak turystyczny.","l":1},{"t":"o","q":"Co to są rośliny pionierskie? Podaj przykłady z wydm.","a":"Rośliny, które jako pierwsze porastają wydmy. Są odporne na suszę i duże nasłonecznienie, a dzięki długim korzeniom trzymają się w piaszczystym podłożu. Np. piaskownica zwyczajna, wydmuchrzyca piaskowa, mikołajek nadmorski.","l":1},{"t":"o","q":"Którą roślinę pionierską wydm obejmuje całkowita ochrona?","a":"Mikołajek nadmorski.","l":1},{"t":"o","q":"Skąd pochodzi nazwa Wybrzeże Słowińskie i czym zajmowali się dawni mieszkańcy?","a":"Od dawnych mieszkańców regionu – Słowińców. Zajmowali się głównie rybołówstwem. Ich życie można poznać w Muzeum Wsi Słowińskiej w Klukach.","l":1},{"t":"o","q":"Kim są współcześni mieszkańcy Wybrzeża Słowińskiego i czym się zajmują?","a":"Przybyli na te tereny po II wojnie światowej z różnych regionów Polski. Zajmują się głównie obsługą ruchu turystycznego, niektórzy rolnictwem i rybołówstwem.","l":1},{"t":"o","q":"Wymień elementy krajobrazu naturalnego Wybrzeża Słowińskiego.","a":"Mierzeje i jeziora przybrzeżne, plaże, wydmy, tereny podmokłe, lasy nadmorskie.","l":1},{"t":"o","q":"Wymień elementy krajobrazu kulturowego Wybrzeża Słowińskiego.","a":"Porty morskie, miejscowości wypoczynkowe, farmy wiatrowe, latarnie morskie, pola uprawne.","l":1},{"t":"o","q":"Co stało się z dawnymi wsiami rybackimi na wybrzeżu?","a":"Przekształciły się w miejscowości wypoczynkowe z ośrodkami wczasowymi, restauracjami i pensjonatami. Niektóre mają status uzdrowiska, np. Kołobrzeg, Dąbki, Ustka.","l":1},{"t":"o","q":"Podaj przykłady portów morskich i małych stoczni na Wybrzeżu Słowińskim.","a":"Np. Kołobrzeg, Łeba, Ustka, Darłowo.","l":1},{"t":"o","q":"Co to są farmy wiatrowe?","a":"Ekologiczne elektrownie napędzane ruchem powietrza. Jedna z największych w Polsce znajduje się w okolicach Słupska.","l":1},{"t":"o","q":"Ile latarni morskich z 17 wież nawigacyjnych jest na Wybrzeżu Słowińskim? Wymień kilka.","a":"7 z 17: Kołobrzeg, Gąski, Darłowo, Jarosławiec, Ustka, Czołpino, Stilo.","l":1},{"t":"o","q":"Dlaczego pas od Łeby do Darłowa nazywany jest Krainą w kratę?","a":"Ze względu na charakterystyczne budownictwo: domy mają szkielet z drewna, a przestrzenie między belkami są wypełnione gliną wymieszaną z trzciną i bielone wapnem.","l":1},{"t":"o","q":"Czym wyróżnia się nazewnictwo miejscowości w pasie od Łeby do Darłowa?","a":"Spotkamy nazwy zapisane w dwóch językach – polskim i kaszubskim, np. Ustka po kaszubsku to Ùszcz.","l":1},{"t":"o","q":"Z czego głównie utrzymują się dziś mieszkańcy miejscowości nadmorskich?","a":"Z obsługi ruchu turystycznego.","l":1},{"t":"o","q":"Wymień różnice między wybrzeżem niskim a wysokim.","a":"Niskie (wydmowe): szerokie piaszczyste plaże i wydmy, powstaje dzięki budującej działalności fal. Wysokie (klifowe): wąska, czasem kamienista plaża i stromy klif, powstaje dzięki niszczącej działalności fal.","l":1},{"t":"o","q":"Jak wygląda środkowa część pasa pobrzeży?","a":"Środkową część stanowi Pobrzeże Koszalińskie. Jego fragment położony bezpośrednio nad Morzem Bałtyckim to Wybrzeże Słowińskie.","l":1},{"t":"tf","q":"Słowiński Park Narodowy chroni m.in. wydmy, jeziora przybrzeżne, bagna i torfowiska.","a":true,"ex":"Przyroda podlega tam ochronie, a w parku można zobaczyć ruchome wydmy.","l":1},{"t":"w","q":"depresja","a":"Obszar położony poniżej poziomu morza.","l":1,"k":1},{"t":"w","q":"jezioro przybrzeżne","a":"Jezioro powstałe na skutek odcięcia zatoki morskiej od morza przez powstającą mierzeję.","l":1,"k":1},{"t":"w","q":"klif","a":"Urwisty, stromy brzeg morski.","l":1,"k":1},{"t":"w","q":"mierzeja","a":"Piaszczysty wał odcinający morze od zatoki.","l":1,"k":1},{"t":"w","q":"rośliny pionierskie","a":"Rośliny odporne na trudne warunki bytowe, które jako pierwsze zasiedlają dany teren, np. rośliny wydmowe.","l":1,"k":1},{"t":"w","q":"bryza","a":"Wiatr lokalny wiejący nad morzem w ciepłej porze roku; w dzień od morza w stronę lądu, w nocy od lądu w stronę morza.","l":1,"k":1},{"t":"w","q":"sztorm","a":"Groźne zjawisko pogodowe nad morzem: silny, porywisty wiatr, który powoduje powstawanie wysokich fal.","l":1,"k":1},{"t":"w","q":"borowina","a":"Rodzaj bagiennego torfu o właściwościach leczniczych, stosowany w uzdrowiskach.","l":1,"k":1},{"t":"o","q":"Gdzie leży pas pojezierzy i jak wygląda jego rzeźba?","a":"Na południe od pobrzeży. Tworzą go faliste i pagórkowate niziny. Wysokości bezwzględne poza wyższymi wzniesieniami sięgają 100–200 m n.p.m.","l":2},{"t":"o","q":"Dlaczego pas pojezierzy nazywamy krajobrazem pojeziernym?","a":"Zagłębienia między wzniesieniami są często wypełnione wodami jezior.","l":2},{"t":"o","q":"Wymień krainy geograficzne pasa pojezierzy.","a":"Pojezierze Pomorskie, Pojezierze Wielkopolskie i Pojezierze Mazurskie.","l":2},{"t":"o","q":"Które wzniesienie jest najwyższe w pasie pojezierzy i ile ma wysokości?","a":"Wieżyca (329 m n.p.m.).","l":2},{"t":"o","q":"Gdzie leży Pojezierze Mazurskie?","a":"W północno-wschodniej części pasa pojezierzy.","l":2},{"t":"o","q":"Które jezioro jest największe w Polsce i gdzie leży?","a":"Śniardwy, na Pojezierzu Mazurskim.","l":2},{"t":"f","q":"Największe jezioro w Polsce to _______.","a":"Śniardwy","acc":["jezioro Śniardwy"],"ex":"Ma ponad 22 km długości i 13 km szerokości.","l":2},{"t":"o","q":"Jakie jeziora na Mazurach mają największą powierzchnię?","a":"Śniardwy i Mamry.","l":2},{"t":"o","q":"Jakie jest największe miasto na Pojezierzu Mazurskim?","a":"Olsztyn.","l":2},{"t":"o","q":"Czym jest lądolód i jak kiedyś wpłynął na krajobraz Polski?","a":"Lądolód to gruba warstwa lodu pokrywająca duże obszary Ziemi. W epoce lodowcowej prawie cały obszar Polski był kilka razy nim przykryty. Największy wpływ wywarł na krajobraz pojezierzy.","l":2},{"t":"o","q":"Gdzie dziś występują lądolody?","a":"Np. w Antarktydzie, gdzie lądolód osiąga grubość do 4 km.","l":2},{"t":"o","q":"Jak powstały wzniesienia polodowcowe?","a":"Gdy lądolód zatrzymywał się na dłuższy czas, z wytopionej gliny, piasku i żwiru tworzyły się wzniesienia polodowcowe.","l":2},{"t":"o","q":"Jak powstały jeziora polodowcowe?","a":"Wody topniejącego lądolodu wyżłobiły zagłębienia, w których powstały jeziora polodowcowe.","l":2},{"t":"o","q":"Jakie elementy krajobrazu naturalnego występują na Pojezierzu Mazurskim?","a":"Jeziora polodowcowe, wzniesienia polodowcowe, rozległe kompleksy leśne (puszcze) oraz rośliny i zwierzęta obszarów podmokłych.","l":2},{"t":"o","q":"Czym porastają brzegi jezior i jakie ptaki żyją na terenach podmokłych?","a":"Brzegi jezior zwykle porastają szuwary, czyli przybrzeżna roślinność z pałki wodnej, trzciny i sitowia. Żyją tu ptaki wodne, np. czaple, gęsi i perkozy.","l":2},{"t":"o","q":"Podaj nazwy roślin szuwarowych i ptaków wodnych z Pojezierza Mazurskiego.","a":"Rośliny: trzcina pospolita, pałka wodna, sit rozpierzchły. Ptaki: czapla siwa, gęś gęgawa, perkoz dwuczuby.","l":2},{"t":"f","q":"Przybrzeżną roślinność utworzoną z pałki wodnej, trzciny i sitowia nazywamy _______.","a":"szuwarami","acc":["szuwary","szuwar"],"ex":"Szuwary rosną na brzegach jezior.","l":2},{"t":"o","q":"Czym jest Szlak Wielkich Jezior Mazurskich?","a":"To żeglugowy szlak prowadzący od Węgorzewa do Rucianego-Nidy. Ma długość 120 km. Powstał, gdy największe jeziora połączono ze sobą kanałami.","l":2},{"t":"o","q":"Między jakimi miejscowościami leży Szlak Wielkich Jezior Mazurskich?","a":"Między Węgorzewem a Rucianem-Nidą.","l":2},{"t":"o","q":"Jak można aktywnie wypoczywać na Mazurach? Podaj trzy sposoby.","a":"Np. żeglować, pływać kajakiem, łowić ryby, jeździć na rowerze, wędrować pieszo, jeździć konno, w zimie jeździć na nartach.","l":2},{"t":"o","q":"Jakie miejscowości wypoczynkowe leżą przy mazurskich jeziorach?","a":"Np. Giżycko i Mikołajki, a także Węgorzewo, Ruciane-Nida.","l":2},{"t":"o","q":"Dlaczego niektóre wzniesienia na Mazurach zimą wykorzystywane są jako stoki narciarskie? Podaj przykład.","a":"Ukształtowanie powierzchni i duże wysokości względne sprawiają, że niektóre wzniesienia nadają się na stoki narciarskie, np. Góra Czterech Wiatrów w okolicach Mrągowa.","l":2},{"t":"o","q":"Czym zajmują się mieszkańcy Pojezierza Mazurskiego?","a":"Obsługą turystów (turystyka jest istotnym źródłem dochodów), rolnictwem (zboża, rzepak, ziemniaki), meblarstwem (drewno z lasów), hodowlą ryb w jeziorach i stawach.","l":2},{"t":"o","q":"Dlaczego na Mazurach spotykamy twierdze i zamki krzyżackie?","a":"W średniowieczu tereny te należały do zakonu krzyżackiego.","l":2},{"t":"o","q":"W jakich miejscowościach na Mazurach znajdują się zamki krzyżackie?","a":"Np. w Rynie, Giżycku, Kętrzynie, Węgorzewie, Ełku.","l":2},{"t":"o","q":"Co to jest Twierdza Boyen i gdzie leży?","a":"Obiekt militarny z XIX wieku w Giżycku, który bronił niegdyś dostępu do Prus Wschodnich.","l":2},{"t":"o","q":"Czym jest Wilczy Szaniec?","a":"Sieć bunkrów, która pełniła funkcję kwatery głównej Adolfa Hitlera podczas II wojny światowej.","l":2},{"t":"o","q":"Czym wyróżnia się Kanał Elbląski?","a":"Ma początek przy zachodniej granicy Pojezierza Mazurskiego, w okolicy Ostródy. Dawniej spławiano nim zboże i drewno do portów morskich. To jedyne miejsce w Europie, gdzie na specjalnych pochylniach statek pokonuje znaczne różnice wysokości, „płynąc” po trawie.","l":2},{"t":"o","q":"Gdzie leży pochylnia Buczyniec?","a":"Na Kanale Elbląskim.","l":2},{"t":"o","q":"Jak lądolód wpłynął na krajobraz pojezierzy?","a":"Spowodował powstanie wzniesień i jezior polodowcowych.","l":2},{"t":"tf","q":"Pojezierze Mazurskie jest dla turystów ciekawe tylko przyrodniczo.","a":false,"ex":"Jest ciekawe też historycznie: zamki krzyżackie, Twierdza Boyen, Wilczy Szaniec, Kanał Elbląski.","l":2},{"t":"w","q":"kanał","a":"Sztuczna droga wodna, przekop łączący np. jeziora lub rzeki.","l":2,"k":1},{"t":"w","q":"lądolód","a":"Gruba warstwa lodu pokrywająca duże obszary lądu. Na terenie Polski występował w „epoce lodowcowej”.","l":2,"k":1},{"t":"w","q":"szuwary","a":"Przybrzeżna roślinność jezior złożona z pałki wodnej, trzciny i sitowia.","l":2,"k":1},{"t":"w","q":"jezioro polodowcowe","a":"Jezioro powstałe w zagłębieniu wyżłobionym przez wody topniejącego lądolodu.","l":2,"k":1},{"t":"o","q":"Gdzie leży pas nizin środkowopolskich?","a":"Między pasem pojezierzy na północy a wyżynami na południu.","l":3},{"t":"o","q":"Wymień krainy geograficzne pasa nizin środkowopolskich.","a":"Nizina Południowowielkopolska, Nizina Śląska, Nizina Mazowiecka, Nizina Północnopodlaska, Nizina Południowopodlaska.","l":3},{"t":"o","q":"Jak nazywa się największa nizina w Polsce i gdzie leży?","a":"Nizina Mazowiecka, w środkowo-wschodniej części pasa nizin.","l":3},{"t":"o","q":"Jakie elementy wyróżniają krajobraz Niziny Mazowieckiej?","a":"Szerokie doliny rzeczne, wysoczyzny, kotliny i równiny.","l":3},{"t":"o","q":"Jaka jest rzeźba terenu Niziny Mazowieckiej?","a":"Mało urozmaicona. W krajobrazie dominują rozległe, prawie płaskie równiny i kotliny oraz szerokie doliny rzeczne. Między nimi nieco wyżej leżą wysoczyzny.","l":3},{"t":"o","q":"Jak nazywa się największa kotlina na Nizinie Mazowieckiej?","a":"Kotlina Warszawska.","l":3},{"t":"o","q":"Jaka jest główna rzeka Niziny Mazowieckiej? Wymień jej większe dopływy.","a":"Główna rzeka to Wisła. Inne duże rzeki: Narew, Pilica, Bzura, Wkra, Bug.","l":3},{"t":"o","q":"Jakie są dwa największe miasta Niziny Mazowieckiej?","a":"Łódź i Warszawa.","l":3},{"t":"o","q":"Jak powstały pradoliny? Jak wyglądają?","a":"Obszar nizin środkowopolskich wcześniej niż pojezierzy pokrywał lądolód. Woda, która spod niego wypływała, tworzyła bardzo szerokie doliny – pradoliny. Nadal są wyraźnie widoczne, a ich dno częściowo wykorzystują współczesne rzeki.","l":3},{"t":"o","q":"Co to jest meander? Jak powstaje?","a":"Rzeki płynące po terenach równinnych zwalniają swój bieg. Nurt (najszybszy strumień wody) przerzuca się od jednego brzegu do drugiego. Rzeki zaczynają zakręcać, tworząc zakola, czyli meandry.","l":3},{"t":"o","q":"Co to jest starorzecze?","a":"Odcięty od głównego koryta rzeki meander, który zamienił się w niewielkie, szybko zarastające jezioro.","l":3},{"t":"f","q":"Odcięty od rzeki meander, który stał się niewielkim, szybko zarastającym jeziorem, to _______.","a":"starorzecze","acc":["starorzecza","starorzeczem"],"ex":"Powstaje po odcięciu meandru od głównego koryta.","l":3},{"t":"o","q":"Co po sobie pozostawił lądolód na Nizinie Mazowieckiej?","a":"Piasek, żwir i glinę. Takie podłoże dawniej porastały wielogatunkowe lasy.","l":3},{"t":"o","q":"Dlaczego na Nizinie Mazowieckiej jest mało lasów naturalnych?","a":"Dawna wielogatunkowa puszcza została wycięta pod pola uprawne, pastwiska i sady. Obecnie obszarów leśnych jest niewiele. Na terenach piaszczystych sadzono nowe lasy, głównie sosnowe.","l":3},{"t":"o","q":"Dlaczego na Nizinie Mazowieckiej jest dużo pól uprawnych i sadów?","a":"Ukształtowanie powierzchni (równiny i szerokie doliny) sprzyjało rozwojowi rolnictwa oraz zakładaniu wsi i miast.","l":3},{"t":"o","q":"Jakim kompleksem leśnym jest Puszcza Kampinoska i gdzie leży?","a":"Jednym z największych kompleksów leśnych Niziny Mazowieckiej, położonym na północny zachód od Warszawy.","l":3},{"t":"o","q":"Jak powstały wydmy śródlądowe w Puszczy Kampinoskiej?","a":"Gdy klimat był chłodniejszy, las nie mógł tu rosnąć, a wiatr usypał z piasków wydmy śródlądowe.","l":3},{"t":"o","q":"Co występuje w obniżeniach terenu Puszczy Kampinoskiej?","a":"Obok suchych, wydmowych obszarów występują bagna i torfowiska.","l":3},{"t":"o","q":"Po co utworzono Kampinoski Park Narodowy?","a":"W celu ochrony występujących obok siebie różnorodnych środowisk. Symbolem parku jest łoś – największe zwierzę żyjące w Puszczy Kampinoskiej.","l":3},{"t":"o","q":"Jakie zwierzę jest symbolem Kampinoskiego Parku Narodowego?","a":"Łoś.","l":3},{"t":"o","q":"Jak nazywa się las z przewagą drzew iglastych?","a":"Bór.","l":3},{"t":"o","q":"Jakie kultury ludowe występują na Nizinie Mazowieckiej?","a":"Łowicka i kurpiowska.","l":3},{"t":"o","q":"Podaj dwie cechy folkloru Niziny Mazowieckiej.","a":"Charakterystycznymi elementami są wycinanki, kolorowe stroje i tańce ludowe. Szczególnie wyróżnia się folklor łowicki oraz kurpiowski.","l":3},{"t":"o","q":"Czym zajmują się mieszkańcy Niziny Mazowieckiej?","a":"Dominują tereny rolnicze. Mieszkańcy zajmują się też sadownictwem – w okolicach Łowicza i Grójca są liczne sady. Powstają tu zakłady przetwórstwa owocowego, produkujące m.in. soki i dżemy.","l":3},{"t":"o","q":"Skąd pochodzi większość uprawianych w Polsce jabłek?","a":"Z Mazowsza (okolice Grójca i Łowicza).","l":3},{"t":"o","q":"Jak ludzie wykorzystali kształtowanie powierzchni Niziny Mazowieckiej?","a":"Płaski teren i rzeki od wieków sprzyjały rozwojowi rolnictwa oraz powstawaniu wsi i miast.","l":3},{"t":"tf","q":"Na Nizinie Mazowieckiej przeważają obszary górskie.","a":false,"ex":"Przeważają tereny równinne i wysoczyzny rozcięte dolinami rzecznymi.","l":3},{"t":"tf","q":"Warszawa leży nad Wisłą na Nizinie Mazowieckiej.","a":true,"ex":"To największe miasto Polski i jej stolica.","l":3},{"t":"w","q":"równiny","a":"Tereny płaskie, pozbawione wzniesień i obniżeń.","l":3,"k":1},{"t":"w","q":"kotlina","a":"Naturalne obniżenie terenu, ze wszystkich stron otoczone wzniesieniami.","l":3,"k":1},{"t":"w","q":"wysoczyzna","a":"Rozległy obszar zbudowany z osadów polodowcowych, otoczony położonymi niżej szerokimi dolinami rzek.","l":3,"k":1},{"t":"w","q":"pradolina","a":"Szerokie obniżenie o płaskim dnie, które powstało przez działalność wód z topniejącego lądolodu. Pradoliny w Polsce powstały w „epoce lodowcowej”.","l":3,"k":1},{"t":"w","q":"starorzecze","a":"Niewielkie, płytkie jezioro będące pozostałością dawnego meandru rzeki.","l":3,"k":1},{"t":"w","q":"bór","a":"Las z przewagą drzew iglastych.","l":3,"k":1},{"t":"w","q":"folklor","a":"Zwyczaje, obrzędy i twórczość ludowa.","l":3,"k":1},{"t":"o","q":"Kiedy miejscowość możemy uznać za miasto?","a":"Gdy ma zwartą zabudowę, żyje w niej co najmniej kilka tysięcy osób, a większość z nich nie pracuje w rolnictwie. Miejscowość musi też mieć nadany status miasta.","l":4},{"t":"o","q":"Kiedy przyznawano pierwsze prawa miejskie?","a":"W średniowieczu.","l":4},{"t":"o","q":"Ile jest w Polsce miast i jakie są w większości?","a":"Obecnie ponad 1000. Większość to małe i średnie miejscowości. Dużych miast jest niewiele.","l":4},{"t":"o","q":"Które miasta w Polsce mają ponad 500 tys. mieszkańców?","a":"Warszawa, Kraków, Wrocław, Łódź i Poznań.","l":4},{"t":"o","q":"Jaka część Polaków mieszka w miastach?","a":"Ponad połowa.","l":4},{"t":"o","q":"Czym jest urbanizacja?","a":"Procesem powstawania i rozwoju miast.","l":4},{"t":"o","q":"Jakim krajobrazem jest krajobraz miejski?","a":"Krajobrazem kulturowym, inaczej antropogenicznym – ukształtowanym przez człowieka.","l":4},{"t":"o","q":"Co to jest Stare Miasto?","a":"Najstarsza, zabytkowa część miasta.","l":4},{"t":"o","q":"Z jakich części składa się duże miasto?","a":"Z centralnej części, czyli śródmieścia, wokół którego często rozbudowują się osiedla mieszkaniowe i dzielnice przemysłowe. Na skraju dużych miast znajdują się przedmieścia.","l":4},{"t":"o","q":"Wymień cechy krajobrazu dużego miasta.","a":"Zwarta zabudowa, wielorodzinne osiedla mieszkaniowe, wysokie budynki i hotele, liczne centra handlowe, gęsta sieć ulic, rozwinięta komunikacja miejska, intensywny ruch samochodowy (korki), zwiększone zanieczyszczenie powietrza (smog), tereny zielone (parki, skwery), łatwy dostęp do placówek oświaty, ochrony zdrowia, sportu i kultury, brak terenów rolniczych.","l":4},{"t":"o","q":"Jakich terenów brakuje w krajobrazie dużego miasta?","a":"Terenów rolniczych.","l":4},{"t":"o","q":"Jakie są wady życia w dużym mieście?","a":"Zanieczyszczenie powietrza (smog), hałas, intensywny ruch samochodowy i korki.","l":4},{"t":"o","q":"Jakie są zalety życia w dużym mieście?","a":"Łatwy dostęp do szkół, ochrony zdrowia, sportu i kultury, liczne centra handlowe, rozwinięta komunikacja miejska.","l":4},{"t":"o","q":"Nad jaką rzeką i na jakiej nizinie leży Warszawa?","a":"Nad Wisłą, na Nizinie Mazowieckiej.","l":4},{"t":"o","q":"Co wyróżnia Warszawę wśród miast Polski?","a":"To najludniejsze miasto Polski (ponad 1,8 mln mieszkańców) i stolica kraju.","l":4},{"t":"o","q":"Jak rozwijała się Warszawa?","a":"Powstała ponad 700 lat temu, ale szybko zaczęła się rozwijać dopiero w XVI w., gdy król Zygmunt III Waza przeniósł tu swoją siedzibę.","l":4},{"t":"o","q":"Dlaczego w Warszawie znajdują się siedziby najwyższych władz państwowych?","a":"Warszawa jest stolicą województwa mazowieckiego i administracyjną stolicą Polski. Mieszczą się tu: sejm, senat i prezydent.","l":4},{"t":"o","q":"Jakie władze mają siedzibę w Warszawie?","a":"Sejm, senat i prezydent.","l":4},{"t":"o","q":"Wyjaśnij, na czym polega funkcja administracyjna Warszawy.","a":"Warszawa jest stolicą kraju, więc znajdują się tu siedziby najwyższych władz państwowych: sejmu, senatu i prezydenta.","l":4},{"t":"o","q":"Wymień funkcje, jakie pełni Warszawa.","a":"Administracyjną, handlową, transportową, kulturalną i edukacyjną (naukową).","l":4},{"t":"o","q":"Na czym polega funkcja handlowa Warszawy?","a":"Mieszczą się tu m.in. Narodowy Bank Polski, Giełda Papierów Wartościowych, liczne hurtownie i centra handlowe (np. „Złote Tarasy”).","l":4},{"t":"o","q":"Na czym polega funkcja transportowa Warszawy?","a":"Znajduje się tu Lotnisko Chopina – największy w kraju port lotniczy – oraz jedyne w Polsce linie metra.","l":4},{"t":"o","q":"Na czym polega funkcja kulturalna Warszawy?","a":"Mieszczą się tu m.in. Filharmonia i Biblioteka Narodowa oraz liczne teatry, kina i muzea.","l":4},{"t":"o","q":"Na czym polega funkcja edukacyjna Warszawy?","a":"Młodzież z całego świata może podjąć naukę na jednej z uczelni wyższych, np. na Uniwersytecie Warszawskim lub Politechnice Warszawskiej.","l":4},{"t":"o","q":"Co jest symbolem Warszawy?","a":"Warszawska Syrenka.","l":4},{"t":"o","q":"Gdzie stoi pomnik Warszawskiej Syrenki?","a":"Na Rynku Starego Miasta (m.in.).","l":4},{"t":"o","q":"Który budynek Warszawy jest jednym z najbardziej rozpoznawalnych?","a":"Pałac Kultury i Nauki.","l":4},{"t":"o","q":"Co wiesz o Starówce w Warszawie?","a":"Została odbudowana po II wojnie światowej i wpisana na listę światowego dziedzictwa UNESCO.","l":4},{"t":"o","q":"Gdzie leży Pałac Na Wodzie?","a":"Na wyspie w Łazienkach Królewskich, największym parku w Warszawie.","l":4},{"t":"o","q":"Co upamiętnia Muzeum Powstania Warszawskiego?","a":"Heroiczną walkę mieszkańców stolicy podczas okupacji w czasie II wojny światowej.","l":4},{"t":"o","q":"Do jakiego wydarzenia zbudowano Stadion Narodowy?","a":"Na Mistrzostwa Europy w Piłce Nożnej „Euro 2012”, które zorganizowała Polska wspólnie z Ukrainą.","l":4},{"t":"o","q":"Co wiesz o dzielnicy Śródmieście w Warszawie?","a":"Znajdują się w niej najważniejsze zabytki i budynki administracji państwowej.","l":4},{"t":"o","q":"Jak Wisła dzieli Warszawę?","a":"Na lewobrzeżną i prawobrzeżną część.","l":4},{"t":"o","q":"Ile mostów jest w obrębie Warszawy na Wiśle?","a":"11, w tym 2 wyłącznie kolejowe.","l":4},{"t":"o","q":"Co ułatwia poruszanie się po Warszawie?","a":"Gęsta sieć ulic, tramwaje, metro, rozbudowana sieć kolejowa oraz punkty wypożyczania rowerów i hulajnóg.","l":4},{"t":"o","q":"Podaj przykłady zmian pozytywnych w krajobrazach związanych z działalnością człowieka.","a":"Tworzenie obszarów chronionych (np. Słowiński i Kampinoski Park Narodowy), wytyczanie szlaków turystycznych, zachowanie historycznego charakteru zabytkowych części miast (np. odbudowa Starówki).","l":4},{"t":"o","q":"Podaj przykłady zmian negatywnych w krajobrazach związanych z działalnością człowieka.","a":"Zanieczyszczenie lasów, wód i plaż przez intensywny ruch turystyczny, zmniejszenie powierzchni lasów i łąk przez rozwój rolnictwa i rozbudowę miast, zanieczyszczenie powietrza i wzrost hałasu w miastach przez ruch samochodowy.","l":4},{"t":"o","q":"Co to jest „Gruba Kaśka” w Warszawie?","a":"Charakterystyczna budowla w kształcie walca w korycie Wisły, część systemu pobierającego wodę spod dna rzeki; woda jest przesyłana do stacji uzdatniania.","l":4},{"t":"tf","q":"Krajobraz wielkomiejski jest całkowicie ukształtowany przez człowieka.","a":true,"ex":"Nie ma tu obszarów rolniczych, przeważa zwarta zabudowa i gęsta sieć ulic.","l":4},{"t":"tf","q":"Duże miasta pełnią tylko jedną funkcję.","a":false,"ex":"Pełnią kilka funkcji jednocześnie, np. administracyjną, handlową, kulturalną, transportową.","l":4},{"t":"tf","q":"W Polsce przeważają duże miasta.","a":false,"ex":"Przeważają małe i średnie miasta.","l":4},{"t":"w","q":"urbanizacja","a":"Proces powstawania i rozwoju miast.","l":4,"k":1},{"t":"w","q":"lista światowego dziedzictwa UNESCO","a":"Lista obiektów kulturowych i przyrodniczych o wyjątkowej wartości dla ludzkości.","l":4,"k":1},{"t":"w","q":"śródmieście","a":"Centralna część miasta.","l":4,"k":1},{"t":"w","q":"Stare Miast
