 organiczną oraz _______, potrzebny innym organizmom do oddychania.","a":"tlen","acc":[],"ex":"Tlen jest produktem ubocznym fotosyntezy.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego zniknięcie wszystkich roślin byłoby katastrofalne dla większości ekosystemów lądowych.","a":"Rośliny są głównymi producentami materii organicznej i tlenu w ekosystemach lądowych — bez nich zabrakłoby pożywienia dla roślinożerców, a w konsekwencji dla drapieżników, a także znacząco zmniejszyłaby się ilość tlenu w atmosferze.","l":3},{"t":"tf","q":"Konsumenci są zależni od materii organicznej wytworzonej przez producentów.","a":true,"ex":"To fundament większości łańcuchów pokarmowych.","l":4},{"t":"s","q":"Który organizm można uznać za przykład cudzożywnego pasożyta roślin?","a":"Grzyb pasożytniczy niszczący uprawy","ex":"Grzyby pasożytnicze mogą osłabiać lub niszczyć rośliny uprawne.","l":4},{"t":"f","q":"Grzyby pasożytnicze mogą niszczyć uprawy roślin, powodując straty w _______.","a":"plonach","acc":[],"ex":"To poważny problem dla rolnictwa.","l":4},{"t":"s","q":"Dlaczego pasożyty są szczególnym przypadkiem cudzożywności?","a":"Czerpią pokarm z żywego organizmu, jednocześnie mu szkodząc","ex":"To odróżnia pasożyty od innych organizmów cudzożywnych.","l":4},{"t":"tf","q":"Pasożyty czerpią pokarm z żywego organizmu (żywiciela), jednocześnie mu szkodząc.","a":true,"ex":"To definicja pasożytnictwa.","l":4},{"t":"o","q":"Wyjaśnij różnicę między pasożytem a drapieżnikiem.","a":"Drapieżnik zabija swoją ofiarę od razu, by się nią odżywić, natomiast pasożyt zwykle nie zabija żywiciela od razu — żyje na jego koszt lub wewnątrz niego przez dłuższy czas, stopniowo czerpiąc z niego substancje odżywcze.","l":4},{"t":"s","q":"Rośliny mięsożerne, np. muchołówka, są przykładem:","a":"Roślin samożywnych, dodatkowo pozyskujących składniki odżywcze z owadów","ex":"Muchołówka nadal przeprowadza fotosyntezę, ale dodatkowo \"poluje\" na owady.","l":4},{"t":"tf","q":"Rośliny mięsożerne, takie jak muchołówka, wciąż przeprowadzają fotosyntezę, ale dodatkowo mogą trawić owady.","a":true,"ex":"To dodatkowe źródło składników odżywczych, np. azotu, w ubogich siedliskach.","l":4},{"t":"s","q":"Które stwierdzenie o łańcuchu pokarmowym jest prawdziwe?","a":"Zaczyna się zwykle od producenta (np. rośliny)","ex":"Producent stanowi podstawę większości łańcuchów pokarmowych.","l":null},{"t":"f","q":"Typowy łańcuch pokarmowy zaczyna się od _______, np. rośliny zielonej.","a":"producenta","acc":[],"ex":"To pierwszy poziom w typowym łańcuchu pokarmowym.","l":null},{"t":"o","q":"Wyjaśnij, dlaczego kolejność w łańcuchu pokarmowym „trawa → królik → lis” jest poprawna, a nie odwrotna.","a":"Trawa jako producent jest zjadana przez królika (konsumenta roślinożernego), a królika z kolei zjada lis (konsument drapieżny) — energia i materia przepływają od producenta, przez kolejne poziomy konsumentów, dlatego ta kolejność odzwierciedla rzeczywisty przepływ pokarmu.","l":null},{"t":"s","q":"Który organizm pełni w ekosystemie rolę zarówno konsumenta, jak i potencjalnej ofiary innych zwierząt?","a":"Większość zwierząt roślinożernych, np. królik","ex":"Królik zjada rośliny, ale sam może być zjedzony przez drapieżnika.","l":null},{"t":"tf","q":"Zwierzę roślinożerne, jak królik, może być jednocześnie konsumentem (zjada rośliny) i ofiarą innego zwierzęcia (np. lisa).","a":true,"ex":"To typowa sytuacja w łańcuchach pokarmowych.","l":null},{"t":"f","q":"Sosna jest przykładem organizmu _______, ponieważ przeprowadza fotosyntezę.","a":"samożywnego","acc":[],"ex":"Sosna sama wytwarza pokarm dzięki fotosyntezie.","l":3},{"t":"tf","q":"Pies jest organizmem cudzożywnym, musi pobierać gotowy pokarm z otoczenia.","a":true,"ex":"Jak wszystkie zwierzęta, pies nie może sam wytworzyć pokarmu.","l":4},{"t":"s","q":"Które stwierdzenie najlepiej opisuje znaczenie fotosyntezy dla całego ekosystemu?","a":"Dostarcza materii organicznej i tlenu, będących podstawą życia wielu organizmów","ex":"Fotosynteza ma znaczenie daleko wykraczające poza pojedynczą roślinę.","l":3},{"t":"f","q":"Fotosynteza dostarcza materii organicznej i _______, niezbędnych dla wielu innych organizmów w ekosystemie.","a":"tlenu","acc":[],"ex":"Oba te produkty są kluczowe dla funkcjonowania ekosystemu.","l":3},{"t":"o","q":"Wyjaśnij znaczenie fotosyntezy nie tylko dla samej rośliny, ale i dla całego ekosystemu.","a":"Fotosynteza dostarcza materii organicznej, która stanowi pokarm dla roślinożerców i pośrednio dla innych organizmów w łańcuchu pokarmowym, a także uwalnia tlen do atmosfery, niezbędny do oddychania większości organizmów żywych.","l":3},{"t":"tf","q":"Samożywne organizmy same wytwarzają pokarm, a cudzożywne muszą pobierać go z otoczenia.","a":true,"ex":"To podstawowa różnica między obiema strategiami odżywiania.","l":3},{"t":"s","q":"Dlaczego grzyby, mimo pewnego podobieństwa do roślin (np. nieruchomy tryb życia), są zaliczane do organizmów cudzożywnych?","a":"Nie mają chlorofilu i nie mogą przeprowadzać fotosyntezy","ex":"Brak chlorofilu jest kluczową różnicą między grzybami a roślinami.","l":4},{"t":"o","q":"Podsumuj, jakie są główne różnice w sposobie zdobywania pokarmu między roślinami zielonymi, zwierzętami i grzybami.","a":"Rośliny zielone są samożywne — same wytwarzają pokarm dzięki fotosyntezie. Zwierzęta są cudzożywne i aktywnie zdobywają pokarm, zjadając inne organizmy. Grzyby są cudzożywne, ale nie polują — wydzielają enzymy trawiące pokarm na zewnątrz ciała i wchłaniają powstałe substancje odżywcze.","l":4},{"t":"s","q":"Oddychanie komórkowe służy przede wszystkim do:","a":"Uzyskiwania energii","ex":"Dzięki oddychaniu komórki uwalniają energię potrzebną do wszystkich procesów życiowych.","l":5},{"t":"tf","q":"Oddychanie komórkowe zachodzi zarówno u roślin, jak i u zwierząt.","a":true,"ex":"Energia z oddychania jest potrzebna wszystkim organizmom, nie tylko zwierzętom.","l":5},{"t":"f","q":"W oddychaniu tlenowym substratem energetycznym jest przede wszystkim _______ (cukier prosty).","a":"glukoza","acc":[],"ex":"Glukoza jest rozkładana z udziałem tlenu, uwalniając energię.","l":5},{"t":"s","q":"Produktami oddychania tlenowego są:","a":"Dwutlenek węgla i woda","ex":"To odwrotność fotosyntezy pod względem substratów i produktów.","l":5},{"t":"tf","q":"Rośliny oddychają wyłącznie w nocy, gdy nie zachodzi fotosynteza.","a":false,"ex":"Rośliny oddychają przez całą dobę, niezależnie od tego, czy jest dzień, czy noc.","l":5},{"t":"s","q":"Fermentacja, w odróżnieniu od oddychania tlenowego:","a":"Zachodzi bez udziału tlenu","ex":"Fermentacja to sposób pozyskiwania energii w warunkach beztlenowych.","l":5},{"t":"s","q":"Produktem fermentacji alkoholowej drożdży jest m.in.:","a":"Alkohol etylowy i dwutlenek węgla","ex":"To właśnie te produkty wykorzystuje się np. w piekarnictwie i produkcji napojów.","l":5},{"t":"tf","q":"Ciasto drożdżowe rośnie dzięki pęcherzykom dwutlenku węgla powstającym podczas fermentacji.","a":true,"ex":"Pęcherzyki gazu powstające podczas fermentacji sprawiają, że ciasto „rośnie”.","l":5},{"t":"s","q":"Oddychanie tlenowe dostarcza organizmowi zazwyczaj:","a":"Więcej energii niż fermentacja","ex":"Oddychanie tlenowe jest znacznie bardziej wydajne energetycznie niż fermentacja.","l":5},{"t":"s","q":"Substratem w procesie oddychania tlenowego, obok glukozy, jest:","a":"Tlen","ex":"Tlen jest niezbędny do rozłożenia glukozy i uwolnienia energii.","l":5},{"t":"tf","q":"Mitochondria są nazywane „elektrowniami komórki”, bo w nich powstaje energia potrzebna do jej funkcjonowania.","a":true,"ex":"To właśnie w mitochondriach zachodzi większość reakcji oddychania tlenowego.","l":5},{"t":"s","q":"Fermentacja zachodzi w:","a":"Cytozolu (cytoplazmie)","ex":"W odróżnieniu od oddychania tlenowego, fermentacja nie wymaga mitochondriów.","l":5},{"t":"s","q":"Który proces dostarcza organizmowi więcej energii z tej samej ilości glukozy?","a":"Oddychanie tlenowe","ex":"Oddychanie tlenowe rozkłada glukozę znacznie dokładniej niż fermentacja.","l":5},{"t":"f","q":"Proces uzyskiwania energii bez udziału tlenu nazywamy _______.","a":"fermentacją","acc":[],"ex":"Fermentacja zachodzi np. u drożdży czy niektórych bakterii.","l":5},{"t":"s","q":"Dlaczego roślina potrzebuje energii również w nocy?","a":"Ponieważ zachodzą w niej procesy życiowe wymagające energii niezależnie od pory dnia","ex":"Oddychanie komórkowe, dostarczające energię, zachodzi przez całą dobę.","l":5},{"t":"tf","q":"Fotosynteza i oddychanie komórkowe to dokładnie ten sam proces.","a":false,"ex":"To dwa odrębne, w pewnym sensie przeciwstawne procesy — jeden wytwarza pokarm, drugi uwalnia z niego energię.","l":5},{"t":"s","q":"Który gaz jest zużywany podczas oddychania tlenowego?","a":"Tlen","ex":"Tlen jest niezbędny do przeprowadzenia oddychania tlenowego.","l":5},{"t":"tf","q":"Fermentacja alkoholowa i fermentacja mlekowa to dwa różne rodzaje fermentacji, prowadzone przez różne mikroorganizmy.","a":true,"ex":"Np. drożdże prowadzą fermentację alkoholową, a bakterie kwasu mlekowego — fermentację mlekową.","l":5},{"t":"s","q":"Oddychanie komórkowe jest procesem, w którym:","a":"Uwalniana jest energia zgromadzona w pokarmie","ex":"To podstawowa definicja oddychania komórkowego.","l":5},{"t":"tf","q":"Oddychanie komórkowe uwalnia energię zgromadzoną w substancjach pokarmowych.","a":true,"ex":"To główna funkcja oddychania komórkowego.","l":5},{"t":"f","q":"Proces uwalniania energii zgromadzonej w pokarmie nazywamy _______ komórkowym.","a":"oddychaniem","acc":[],"ex":"Oddychanie komórkowe dostarcza energii potrzebnej do życia.","l":5},{"t":"s","q":"Do oddychania tlenowego niezbędne są:","a":"Glukoza i tlen","ex":"To dwa podstawowe substraty oddychania tlenowego.","l":5},{"t":"tf","q":"Glukoza i tlen są niezbędnymi substratami oddychania tlenowego.","a":true,"ex":"Bez nich proces ten nie mógłby zajść.","l":5},{"t":"s","q":"Produktami oddychania tlenowego są:","a":"Dwutlenek węgla, woda i energia","ex":"To trzy główne produkty tego procesu.","l":5},{"t":"f","q":"Podczas oddychania tlenowego powstają dwutlenek węgla, woda oraz uwalniana jest _______.","a":"energia","acc":[],"ex":"To właśnie energia jest głównym „celem” tego procesu dla organizmu.","l":5},{"t":"tf","q":"Mitochondria są miejscem, w którym zachodzi oddychanie tlenowe.","a":true,"ex":"To w nich uwalniana jest energia z glukozy.","l":5},{"t":"o","q":"Zapisz słownie uproszczony przebieg oddychania tlenowego — co jest potrzebne i co powstaje.","a":"Do oddychania tlenowego potrzebne są glukoza i tlen, a w jego wyniku powstają dwutlenek węgla, woda oraz uwalniana jest energia.","l":5},{"t":"s","q":"Oddychanie komórkowe zachodzi:","a":"Przez całą dobę, zarówno w dzień, jak i w nocy","ex":"Organizmy potrzebują energii nieprzerwanie.","l":5},{"t":"tf","q":"Rośliny oddychają przez całą dobę, niezależnie od tego, czy jest dzień, czy noc.","a":true,"ex":"Oddychanie jest niezbędne do funkcjonowania komórek przez cały czas.","l":5},{"t":"s","q":"Rośliny, w odróżnieniu od zwierząt:","a":"Potrafią zarówno przeprowadzać fotosyntezę, jak i oddychać","ex":"Rośliny łączą oba te procesy.","l":5},{"t":"f","q":"Rośliny jednocześnie przeprowadzają fotosyntezę (w dzień) i _______ (przez całą dobę).","a":"oddychanie","acc":[],"ex":"Oba procesy zachodzą niezależnie od siebie.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego stwierdzenie „roślina nie oddycha w dzień, bo wtedy przeprowadza fotosyntezę” jest błędne.","a":"Jest to nieprawdziwe, ponieważ roślina oddycha przez całą dobę, niezależnie od tego, czy przeprowadza akurat fotosyntezę. W dzień w komórkach rośliny zachodzą jednocześnie oba procesy — fotosynteza i oddychanie.","l":5},{"t":"s","q":"Fermentacja różni się od oddychania tlenowego tym, że:","a":"Zachodzi bez udziału tlenu","ex":"To podstawowa różnica między obiema drogami pozyskiwania energii.","l":5},{"t":"tf","q":"Fermentacja jest procesem zachodzącym bez udziału tlenu.","a":true,"ex":"To dlatego jest przydatna w środowiskach beztlenowych.","l":5},{"t":"s","q":"Miejscem zachodzenia fermentacji w komórce jest:","a":"Cytozol (cytoplazma)","ex":"Fermentacja nie wymaga mitochondrium.","l":5},{"t":"f","q":"Fermentacja zachodzi w _______ komórki, a nie w mitochondrium.","a":"cytozolu","acc":[],"ex":"To odróżnia fermentację od oddychania tlenowego.","l":5},{"t":"s","q":"Produktem fermentacji alkoholowej, prowadzonej przez drożdże, są:","a":"Alkohol etylowy i dwutlenek węgla","ex":"Oba te produkty powstają jednocześnie.","l":5},{"t":"tf","q":"Fermentacja alkoholowa drożdży prowadzi do powstania alkoholu etylowego i dwutlenku węgla.","a":true,"ex":"Dwutlenek węgla powoduje np. wyrastanie ciasta.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego ciasto drożdżowe zwiększa swoją objętość podczas wyrastania.","a":"Podczas fermentacji alkoholowej drożdże produkują dwutlenek węgla, który tworzy pęcherzyki gazu w cieście, powodując jego zwiększenie objętości (wyrastanie).","l":5},{"t":"s","q":"Fermentacja mlekowa jest prowadzona m.in. przez:","a":"Bakterie kwasu mlekowego","ex":"To one przeprowadzają fermentację mlekową, np. w jogurtach.","l":5},{"t":"tf","q":"Fermentacja mlekowa jest wykorzystywana np. przy produkcji jogurtów i kiszonek.","a":true,"ex":"To popularne zastosowanie fermentacji mlekowej w przemyśle spożywczym.","l":5},{"t":"s","q":"Produktem fermentacji mlekowej jest głównie:","a":"Kwas mlekowy","ex":"Kwas mlekowy nadaje np. jogurtom charakterystyczny smak.","l":5},{"t":"f","q":"Produktem fermentacji mlekowej jest kwas _______.","a":"mlekowy","acc":[],"ex":"To główny produkt tego rodzaju fermentacji.","l":5},{"t":"s","q":"Który proces dostarcza organizmowi więcej energii z tej samej ilości glukozy?","a":"Oddychanie tlenowe","ex":"Oddychanie tlenowe jest znacznie wydajniejsze energetycznie.","l":5},{"t":"tf","q":"Oddychanie tlenowe jest znacznie bardziej wydajne energetycznie niż fermentacja.","a":true,"ex":"Rozkłada glukozę całkowicie, uwalniając więcej energii.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego oddychanie tlenowe jest bardziej wydajne energetycznie niż fermentacja.","a":"Oddychanie tlenowe rozkłada glukozę całkowicie, z udziałem tlenu, uwalniając znacznie więcej energii, natomiast fermentacja jest procesem niepełnym, zachodzącym bez tlenu, dlatego uwalnia się w niej znacznie mniej energii z tej samej ilości glukozy.","l":5},{"t":"s","q":"Które organizmy mogą przeprowadzać fermentację alkoholową?","a":"Drożdże","ex":"Drożdże są klasycznym przykładem organizmów fermentujących.","l":5},{"t":"tf","q":"Drożdże są organizmami zdolnymi do przeprowadzania fermentacji alkoholowej.","a":true,"ex":"To wykorzystuje się m.in. w piekarnictwie i produkcji napojów.","l":5},{"t":"s","q":"Fermentacja alkoholowa jest wykorzystywana przez człowieka m.in. do produkcji:","a":"Pieczywa, piwa i wina","ex":"To trzy popularne zastosowania fermentacji alkoholowej.","l":5},{"t":"f","q":"Fermentacja alkoholowa jest wykorzystywana m.in. w produkcji pieczywa, piwa i _______.","a":"wina","acc":[],"ex":"Wszystkie te produkty powstają dzięki działaniu drożdży.","l":5},{"t":"s","q":"Który proces zachodzi w mięśniach człowieka podczas bardzo intensywnego wysiłku, gdy brakuje tlenu?","a":"Fermentacja mlekowa (beztlenowe pozyskiwanie energii)","ex":"To zjawisko związane z odczuwanym po wysiłku zmęczeniem mięśni.","l":5},{"t":"tf","q":"Podczas intensywnego wysiłku fizycznego mięśnie mogą chwilowo pozyskiwać energię w procesie zbliżonym do fermentacji mlekowej, gdy brakuje tlenu.","a":true,"ex":"To pozwala na krótkotrwały, intensywny wysiłek.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego po bardzo intensywnym wysiłku fizycznym mięśnie mogą odczuwać zmęczenie związane z nagromadzeniem kwasu mlekowego.","a":"Przy bardzo intensywnym wysiłku dostarczanie tlenu do mięśni może być niewystarczające, dlatego komórki mięśniowe częściowo przechodzą na beztlenowe pozyskiwanie energii, produkując kwas mlekowy, którego nagromadzenie wiąże się z odczuciem zmęczenia mięśni.","l":5},{"t":"tf","q":"Oddychanie tlenowe wymaga obecności tlenu, a fermentacja zachodzi bez jego udziału.","a":true,"ex":"To definicyjna różnica między obiema drogami metabolicznymi.","l":5},{"t":"f","q":"Oddychanie tlenowe zachodzi w mitochondrium, a fermentacja w _______.","a":"cytozolu","acc":[],"ex":"To dwa różne miejsca w komórce.","l":5},{"t":"o","q":"Uzupełnij tabelę porównawczą (opisowo): udział tlenu, ilość energii i miejsce zachodzenia dla oddychania tlenowego i fermentacji.","a":"Oddychanie tlenowe: wymaga tlenu, dostarcza dużo energii, zachodzi w mitochondrium. Fermentacja: nie wymaga tlenu, dostarcza mało energii, zachodzi w cytozolu.","l":5},{"t":"tf","q":"Kiszona kapusta powstaje dzięki fermentacji mlekowej prowadzonej przez bakterie kwasu mlekowego.","a":true,"ex":"To popularny przykład wykorzystania fermentacji mlekowej.","l":5},{"t":"f","q":"Piwo i wino powstają dzięki fermentacji _______, prowadzonej przez drożdże.","a":"alkoholowej","acc":[],"ex":"To najbardziej znane zastosowanie fermentacji alkoholowej.","l":5},{"t":"o","q":"Podaj po jednym przykładzie produktu powstałego dzięki fermentacji mlekowej i fermentacji alkoholowej.","a":"Fermentacja mlekowa: np. jogurt lub kiszona kapusta. Fermentacja alkoholowa: np. piwo lub wino.","l":5},{"t":"s","q":"Który proces zachodzi w komórkach roślinnych oprócz fotosyntezy, dostarczając im energii?","a":"Oddychanie komórkowe","ex":"Rośliny, tak jak zwierzęta, potrzebują energii z oddychania.","l":5},{"t":"tf","q":"Rośliny, oprócz fotosyntezy, przeprowadzają również oddychanie komórkowe, dostarczające im energii.","a":true,"ex":"Oba procesy zachodzą niezależnie od siebie w komórkach roślinnych.","l":5},{"t":"f","q":"Substratami oddychania tlenowego są glukoza oraz _______.","a":"tlen","acc":[],"ex":"Oba substraty są niezbędne do przeprowadzenia tego procesu.","l":5},{"t":"tf","q":"Produktami oddychania tlenowego są dwutlenek węgla, woda i uwolniona energia.","a":true,"ex":"To pełny zestaw produktów tego procesu.","l":5},{"t":"s","q":"Fermentacja jest korzystna dla organizmów, które:","a":"Czasowo lub stale żyją w warunkach beztlenowych","ex":"Fermentacja pozwala pozyskiwać energię bez udziału tlenu.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego zdolność do fermentacji jest korzystna dla organizmów żyjących w środowiskach o niskiej zawartości tlenu.","a":"Fermentacja pozwala organizmom pozyskiwać energię nawet bez dostępu do tlenu, dzięki czemu mogą przetrwać i funkcjonować w środowiskach ubogich w tlen, np. w głębokich warstwach gleby, mule dennym czy w niektórych produktach spożywczych.","l":5},{"t":"tf","q":"Mitochondria są nazywane „elektrowniami komórki”, ponieważ dostarczają jej energii poprzez oddychanie tlenowe.","a":true,"ex":"To popularne i trafne określenie funkcji mitochondriów.","l":5},{"t":"f","q":"Fermentacja zachodzi w warunkach braku lub niedoboru _______.","a":"tlenu","acc":[],"ex":"To warunek konieczny do zajścia fermentacji.","l":5},{"t":"tf","q":"Fermentacja nie zachodzi w mitochondriach, lecz w cytozolu komórki.","a":true,"ex":"To ważna różnica względem oddychania tlenowego.","l":5},{"t":"o","q":"Wyjaśnij związek między odżywianiem a oddychaniem komórkowym.","a":"Odżywianie dostarcza organizmowi substancji pokarmowych (np. glukozy), które następnie są wykorzystywane w procesie oddychania komórkowego do uwalniania energii potrzebnej do wszystkich funkcji życiowych organizmu.","l":5},{"t":"s","q":"Skąd pochodzi energia zawarta w pokarmie, którą uwalnia oddychanie komórkowe?","a":"Pierwotnie ze światła słonecznego, zmagazynowanego w roślinach dzięki fotosyntezie","ex":"To pokazuje związek między fotosyntezą a oddychaniem w łańcuchu pokarmowym.","l":5},{"t":"tf","q":"Energia uwalniana podczas oddychania komórkowego pochodzi pierwotnie ze światła słonecznego, zmagazynowanego przez rośliny w procesie fotosyntezy.","a":true,"ex":"To fundamentalny łańcuch przepływu energii w przyrodzie.","l":5},{"t":"o","q":"Wyjaśnij, w jaki sposób energia słoneczna „dociera” do organizmu zwierzęcia poprzez fotosyntezę i oddychanie komórkowe.","a":"Roślina, przeprowadzając fotosyntezę, magazynuje energię słoneczną w postaci substancji pokarmowych (cukrów). Gdy zwierzę zjada roślinę, przyswaja te substancje, a następnie w procesie oddychania komórkowego uwalnia z nich zgromadzoną energię, wykorzystywaną do funkcji życiowych.","l":5},{"t":"tf","q":"Fotosynteza pochłania dwutlenek węgla i wydziela tlen, a oddychanie tlenowe pochłania tlen i wydziela dwutlenek węgla.","a":true,"ex":"To wzajemnie uzupełniające się procesy w przyrodzie.","l":5},{"t":"s","q":"Który proces zachodzi zarówno w dzień, jak i w nocy u rośliny?","a":"Oddychanie komórkowe","ex":"Oddychanie jest niezależne od dostępu do światła.","l":5},{"t":"f","q":"W przeciwieństwie do fotosyntezy, oddychanie komórkowe zachodzi u rośliny przez całą _______.","a":"dobę","acc":[],"ex":"To istotna różnica między obu procesami.","l":5},{"t":"o","q":"Porównaj fotosyntezę i oddychanie tlenowe pod względem pochłanianych i wydzielanych gazów.","a":"Fotosynteza pochłania dwutlenek węgla i wydziela tlen, natomiast oddychanie tlenowe pochłania tlen i wydziela dwutlenek węgla — te dwa procesy są w pewnym sensie odwrotne pod względem wymiany gazowej.","l":5},{"t":"tf","q":"Fermentacja jest szeroko wykorzystywana w przemyśle spożywczym, np. do produkcji pieczywa, jogurtów i napojów alkoholowych.","a":true,"ex":"To jedno z najstarszych zastosowań mikroorganizmów przez człowieka.","l":5},{"t":"f","q":"Fermentację alkoholową prowadzą drożdże, a fermentację mlekową — bakterie kwasu _______.","a":"mlekowego","acc":[],"ex":"Nazwa bakterii pochodzi od produktu, który wytwarzają.","l":5},{"t":"s","q":"Dlaczego fermentacja, mimo że dostarcza mniej energii niż oddychanie tlenowe, jest wciąż korzystna dla niektórych organizmów?","a":"Pozwala pozyskiwać energię nawet w warunkach braku tlenu, co byłoby niemożliwe przy oddychaniu tlenowym","ex":"To pozwala przetrwać w środowiskach beztlenowych.","l":5},{"t":"tf","q":"Fermentacja pozwala organizmom pozyskiwać energię nawet w warunkach niedoboru tlenu, czego oddychanie tlenowe nie umożliwia.","a":true,"ex":"To kluczowa zaleta fermentacji.","l":5},{"t":"o","q":"Wyjaśnij, dlaczego mimo mniejszej wydajności energetycznej, zdolność do fermentacji mogła być korzystna ewolucyjnie dla niektórych organizmów.","a":"Zdolność do fermentacji pozwala organizmom przetrwać i pozyskiwać energię w środowiskach, gdzie brakuje tlenu, np. w głębokiej wodzie, mule czy wnętrzu niektórych produktów spożywczych, gdzie oddychanie tlenowe byłoby niemożliwe.","l":5},{"t":"tf","q":"Oddychanie tlenowe zachodzi z udziałem tlenu w mitochondrium i dostarcza dużo energii, a fermentacja zachodzi bez tlenu w cytozolu i dostarcza mało energii.","a":true,"ex":"To podsumowanie kluczowych różnic między obiema drogami metabolicznymi.","l":5},{"t":"w","q":"komórka","a":"Podstawowa jednostka budowy i funkcjonowania organizmów.","l":1,"k":1},{"t":"w","q":"jądro komórkowe","a":"Część komórki zawierająca materiał genetyczny, która kieruje jej pracą.","l":1,"k":1},{"t":"w","q":"cytoplazma","a":"Półpłynna substancja wypełniająca komórkę, w której zachodzi wiele reakcji chemicznych.","l":1,"k":1},{"t":"w","q":"błona komórkowa","a":"Cienka warstwa otaczająca komórkę, która kontroluje, co do niej wchodzi i co z niej wychodzi.","l":1,"k":1},{"t":"w","q":"ściana komórkowa","a":"Sztywna otoczka na zewnątrz błony komórki roślinnej, która nadaje jej kształt i chroni ją.","l":2,"k":1},{"t":"w","q":"chloroplasty","a":"Zielone organelle w komórkach roślin, w których zachodzi fotosynteza.","l":2,"k":1},{"t":"w","q":"wakuola","a":"Pęcherzyk w komórce roślinnej wypełniony sokiem wakuolarnym, w którym magazynowane są m.in. woda i zbędne substancje.","l":2,"k":1},{"t":"w","q":"tkanka","a":"Grupa komórek o podobnej budowie, które razem pełnią określoną funkcję.","l":null,"k":1},{"t":"w","q":"narząd","a":"Część organizmu zbudowana z kilku tkanek, która pełni określoną funkcję, np. serce czy liść.","l":null,"k":1},{"t":"w","q":"układ narządów","a":"Zespół narządów współpracujących ze sobą, np. układ pokarmowy.","l":null,"k":1},{"t":"w","q":"fotosynteza","a":"Proces, w którym rośliny z dwutlenku węgla i wody, wykorzystując światło, wytwarzają cukier i tlen.","l":3,"k":1},{"t":"w","q":"oddychanie","a":"Proces, w którym organizm uwalnia energię z pokarmu, zwykle zużywając tlen i wytwarzając dwutlenek węgla.","l":5,"k":1},{"t":"w","q":"wydalanie","a":"Usuwanie z organizmu zbędnych produktów przemiany materii.","l":null,"k":1}],"lessons":["Składniki chemiczne organizmów","Budowa komórki zwierzęcej","Komórka roślinna. Inne rodzaje komórek","Samożywność","Cudzożywność","Sposoby oddychania organizmów"]},{"id":"b3","title":"Wirusy, bakterie, protisty i grzyby","icon":"🦠","q":[{"t":"s","q":"Bakterie to organizmy:","a":"O budowie komórkowej, bez jądra komórkowego","ex":"Bakterie mają komórki, ale ich materiał genetyczny nie jest otoczony jądrem — to organizmy prokariotyczne.","l":1},{"t":"tf","q":"Wszystkie bakterie są chorobotwórcze i szkodliwe dla człowieka.","a":false,"ex":"Większość bakterii jest pożyteczna — np. bakterie jelitowe czy te używane do produkcji jogurtów.","l":1},{"t":"s","q":"Bakterie mogą rozmnażać się przez:","a":"Podział komórki","ex":"Najczęstszy sposób rozmnażania bakterii to prosty podział komórki na dwie.","l":1},{"t":"s","q":"Wirusy różnią się od bakterii tym, że:","a":"Nie mają budowy komórkowej i namnażają się tylko wewnątrz komórek innego organizmu","ex":"Wirus to nie komórka — potrzebuje komórki gospodarza, by się namnażać.","l":1},{"t":"f","q":"Wirusy namnażają się wyłącznie wewnątrz komórek żywego _______.","a":"organizmu","acc":[],"ex":"Bez komórki gospodarza wirus nie jest w stanie się namnażać.","l":1},{"t":"tf","q":"Niektóre bakterie (np. sinice) potrafią przeprowadzać fotosyntezę.","a":true,"ex":"Sinice, mimo że są bakteriami, produkują tlen dzięki fotosyntezie — podobnie jak rośliny.","l":1},{"t":"s","q":"Chorobą wywoływaną przez wirusa jest:","a":"Grypa","ex":"Grypę wywołuje wirus grypy. Pozostałe przykłady to choroby bakteryjne.","l":1},{"t":"s","q":"Pożyteczną rolą bakterii jest m.in.:","a":"Produkcja jogurtów i serów","ex":"Bakterie fermentacji mlekowej są wykorzystywane w produkcji nabiału.","l":1},{"t":"tf","q":"Bakterie mogą oddychać tlenowo lub beztlenowo, w zależności od gatunku.","a":true,"ex":"Istnieją zarówno bakterie tlenowe, jak i beztlenowe — przystosowane do różnych środowisk.","l":1},{"t":"s","q":"Antybiotyki są skuteczne w leczeniu zakażeń:","a":"Bakteryjnych","ex":"Antybiotyki działają na bakterie — nie pomagają na infekcje wirusowe, np. przeziębienie.","l":1},{"t":"s","q":"Bakterie odgrywają ważną rolę w przyrodzie, ponieważ:","a":"Rozkładają szczątki organizmów, uczestnicząc w obiegu materii","ex":"Bakterie rozkładające martwą materię organiczną umożliwiają krążenie pierwiastków w przyrodzie.","l":1},{"t":"tf","q":"Jogurt i kiszona kapusta powstają dzięki działalności pożytecznych bakterii.","a":true,"ex":"To efekt fermentacji mlekowej, prowadzonej przez bakterie kwasu mlekowego.","l":1},{"t":"s","q":"Kształt bakterii wydłużonych, przypominających walec, nazywamy:","a":"Laseczkami (pałeczkami)","ex":"Laseczki to bakterie o wydłużonym, walcowatym kształcie.","l":1},{"t":"f","q":"Przykładem choroby wywołanej przez bakterie, leczonej antybiotykiem, jest _______ (podaj jeden przykład, np. angina).","a":"angina","acc":["gruzlica","tężec","borelioza"],"ex":"Angina, gruźlica czy tężec to choroby bakteryjne — w ich leczeniu pomagają antybiotyki.","l":1},{"t":"s","q":"Bakterie o kształcie kulistym nazywamy:","a":"Ziarniakami (ziarenkowcami)","ex":"Ziarniaki mają kształt zbliżony do kuli lub owalu.","l":1},{"t":"tf","q":"Szczepionki pomagają organizmowi wytworzyć odporność na niektóre choroby wirusowe i bakteryjne.","a":true,"ex":"Szczepionka „uczy” układ odpornościowy rozpoznawać dany drobnoustrój, zanim dojdzie do prawdziwego zakażenia.","l":1},{"t":"s","q":"Wirus grypy przenosi się głównie drogą:","a":"Kropelkową (przez kaszel i kichanie)","ex":"Drobne kropelki wydzieliny z dróg oddechowych są głównym źródłem zakażenia.","l":1},{"t":"s","q":"Higiena, np. mycie rąk, pomaga ograniczyć:","a":"Rozprzestrzenianie się chorobotwórczych bakterii i wirusów","ex":"Mycie rąk usuwa mechanicznie drobnoustroje z powierzchni skóry.","l":1},{"t":"tf","q":"Bakterie są znacznie mniejsze od typowych komórek roślinnych i zwierzęcych.","a":true,"ex":"Komórki bakteryjne są zwykle dziesiątki razy mniejsze niż komórki organizmów wielokomórkowych.","l":1},{"t":"s","q":"Psucie się żywności jest często wywołane przez:","a":"Działanie bakterii i grzybów","ex":"Mikroorganizmy rozkładają składniki żywności, co prowadzi do jej zepsucia.","l":1},{"t":"s","q":"Bakterie mają budowę:","a":"Komórkową, ale bez jądra komórkowego","ex":"Bakterie to organizmy prokariotyczne — mają komórki, ale bez jądra otoczonego błoną.","l":1},{"t":"tf","q":"Bakterie są organizmami prokariotycznymi, czyli bez jądra komórkowego otoczonego błoną.","a":true,"ex":"To kluczowa cecha odróżniająca bakterie od organizmów eukariotycznych.","l":1},{"t":"f","q":"Bakterie o kulistym kształcie nazywamy _______.","a":"ziarniakami","acc":[],"ex":"Ziarniaki to jeden z podstawowych kształtów bakterii.","l":1},{"t":"s","q":"Bakterie o wydłużonym, walcowatym kształcie nazywamy:","a":"Laseczkami","ex":"Laseczki (pałeczki) mają charakterystyczny, podłużny kształt.","l":1},{"t":"s","q":"Bakterie o kształcie spiralnym nazywamy:","a":"Krętkami","ex":"Krętki przypominają swoim kształtem sprężynę.","l":1},{"t":"tf","q":"Kształt bakterii pozwala częściowo je klasyfikować, np. na ziarniaki, laseczki i krętki.","a":true,"ex":"To jedno z podstawowych kryteriów opisu bakterii.","l":1},{"t":"o","q":"Wymień trzy podstawowe kształty bakterii i podaj ich nazwy.","a":"Kuliste (ziarniaki), wydłużone, walcowate (laseczki/pałeczki) oraz spiralne (krętki).","l":1},{"t":"s","q":"Bakterie rozmnażają się najczęściej przez:","a":"Podział komórki","ex":"To najprostszy i najczęstszy sposób rozmnażania się bakterii.","l":1},{"t":"f","q":"Podstawowym sposobem rozmnażania bakterii jest prosty _______ komórki.","a":"podział","acc":[],"ex":"Jedna komórka bakterii dzieli się na dwie identyczne komórki potomne.","l":1},{"t":"tf","q":"Podczas podziału bakterii powstają dwie identyczne komórki potomne.","a":true,"ex":"To typowy efekt podziału bakteryjnego.","l":1},{"t":"s","q":"Bakterie mogą odgrywać w przyrodzie rolę:","a":"Rozkładających materię organiczną","ex":"Bakterie saprotroficzne rozkładają szczątki organizmów, uczestnicząc w obiegu materii.","l":1},{"t":"tf","q":"Bakterie uczestniczą w rozkładzie szczątków organicznych, co jest ważne dla obiegu materii w przyrodzie.","a":true,"ex":"Dzięki temu pierwiastki mogą krążyć w przyrodzie i być ponownie wykorzystywane.","l":1},{"t":"s","q":"Produktem spożywczym powstającym z udziałem pożytecznych bakterii jest:","a":"Jogurt","ex":"Bakterie kwasu mlekowego przeprowadzają fermentację, dzięki której powstaje jogurt.","l":1},{"t":"o","q":"Podaj dwa przykłady pożytecznej działalności bakterii.","a":"Np. produkcja jogurtów i serów dzięki fermentacji mlekowej oraz rozkład materii organicznej w przyrodzie (a także rola bakterii jelitowych w trawieniu).","l":1},{"t":"s","q":"Przykładem choroby wywołanej przez bakterie jest:","a":"Angina","ex":"Pozostałe wymienione choroby są wywoływane przez wirusy.","l":1},{"t":"tf","q":"Wszystkie bakterie są szkodliwe i wywołują choroby.","a":false,"ex":"Większość bakterii jest neutralna lub wręcz pożyteczna dla człowieka i przyrody.","l":1},{"t":"f","q":"Antybiotyki są stosowane w leczeniu zakażeń _______.","a":"bakteryjnych","acc":[],"ex":"Antybiotyki nie działają na wirusy.","l":1},{"t":"tf","q":"Antybiotyki są skuteczne w leczeniu przeziębienia wywołanego przez wirusy.","a":false,"ex":"Przeziębienie jest wywoływane przez wirusy, na które antybiotyki nie działają.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego nie należy samodzielnie przerywać przepisanej kuracji antybiotykowej.","a":"Przedwczesne przerwanie kuracji może sprawić, że przetrwają najbardziej odporne bakterie, co może prowadzić do nawrotu choroby i rozwoju bakterii opornych na dany antybiotyk.","l":1},{"t":"s","q":"Wirusy różnią się od bakterii tym, że:","a":"Nie mają budowy komórkowej","ex":"To podstawowa różnica między wirusami a bakteriami.","l":1},{"t":"tf","q":"Wirusy mają budowę komórkową, podobnie jak bakterie.","a":false,"ex":"Wirusy nie są zbudowane z komórek — to ich zasadnicza różnica względem bakterii.","l":1},{"t":"f","q":"Wirus składa się z materiału genetycznego otoczonego _______ otoczką.","a":"białkową","acc":[],"ex":"Otoczka białkowa chroni materiał genetyczny wirusa.","l":1},{"t":"s","q":"Wirus może namnażać się:","a":"Wyłącznie wewnątrz komórki organizmu gospodarza","ex":"Wirus wykorzystuje „maszynerię” komórki gospodarza do namnażania się.","l":1},{"t":"tf","q":"Organizm, w którego komórkach namnaża się wirus, nazywamy gospodarzem.","a":true,"ex":"To standardowe określenie w biologii i medycynie.","l":1},{"t":"o","q":"Podaj po dwa przykłady chorób wywoływanych przez wirusy oraz przez bakterie.","a":"Wirusowe: np. grypa, ospa wietrzna (lub odra, COVID-19). Bakteryjne: np. angina, gruźlica (lub tężec).","l":1},{"t":"s","q":"Szczepienia pomagają organizmowi:","a":"Przygotować się do obrony przed określonym patogenem","ex":"Szczepionka „uczy” układ odpornościowy rozpoznawać dany patogen.","l":1},{"t":"tf","q":"Szczepienia mogą ograniczać ryzyko zachorowania na niektóre choroby wirusowe i bakteryjne.","a":true,"ex":"Istnieją szczepionki zarówno przeciw chorobom wirusowym, jak i bakteryjnym.","l":1},{"t":"f","q":"Regularne mycie rąk to przykład zachowania związanego z _______, które ogranicza rozprzestrzenianie się drobnoustrojów.","a":"higieną","acc":[],"ex":"Higiena to podstawowy sposób zapobiegania zakażeniom.","l":1},{"t":"tf","q":"Wirus grypy przenosi się najczęściej drogą kropelkową, np. podczas kaszlu czy kichania.","a":true,"ex":"Drobne kropelki wydzieliny z dróg oddechowych są głównym źródłem zakażenia.","l":1},{"t":"s","q":"Jaka jest główna różnica w wielkości między bakteriami a wirusami?","a":"Wirusy są zwykle znacznie mniejsze od bakterii","ex":"Wirusy są zwykle wielokrotnie mniejsze od typowych komórek bakteryjnych.","l":1},{"t":"o","q":"Wymień trzy różnice między wirusem a bakterią.","a":"Bakteria ma budowę komórkową, wirus jej nie ma; bakteria może rozmnażać się samodzielnie przez podział, a wirus tylko wewnątrz komórki gospodarza; bakterie są zwykle znacznie większe od wirusów.","l":1},{"t":"s","q":"Niektóre bakterie, np. sinice, potrafią:","a":"Przeprowadzać fotosyntezę","ex":"Sinice, mimo że są bakteriami, produkują tlen dzięki fotosyntezie.","l":1},{"t":"tf","q":"Sinice są bakteriami zdolnymi do fotosyntezy.","a":true,"ex":"To wyjątek wśród bakterii — większość z nich nie przeprowadza fotosyntezy.","l":1},{"t":"s","q":"Bakterie mogą oddychać:","a":"Tlenowo lub beztlenowo, zależnie od gatunku","ex":"Wśród bakterii są zarówno gatunki tlenowe, jak i beztlenowe.","l":1},{"t":"f","q":"Bakterie zdolne do życia bez dostępu tlenu nazywamy bakteriami _______.","a":"beztlenowymi","acc":[],"ex":"Takie bakterie mogą żyć np. głęboko w glebie lub w jelitach.","l":1},{"t":"tf","q":"Wszystkie bakterie potrzebują tlenu do życia.","a":false,"ex":"Bakterie beztlenowe mogą żyć bez dostępu tlenu.","l":1},{"t":"s","q":"Poprawna kolejność etapów podziału bakterii to:","a":"Komórka zwiększa rozmiary → materiał genetyczny zostaje skopiowany → komórka się dzieli → powstają dwie komórki potomne","ex":"To logiczna kolejność: najpierw wzrost i kopiowanie DNA, potem podział.","l":1},{"t":"o","q":"Opisz krótko, jak wygląda proces podziału bakterii.","a":"Komórka bakterii zwiększa swoje rozmiary, kopiuje swój materiał genetyczny, a następnie dzieli się na dwie identyczne komórki potomne.","l":1},{"t":"s","q":"Zakażenie wirusowe różni się od zakażenia bakteryjnego m.in. tym, że:","a":"W leczeniu zakażeń wirusowych antybiotyki zwykle nie pomagają","ex":"Antybiotyki są skuteczne wyłącznie przeciwko bakteriom.","l":1},{"t":"tf","q":"COVID-19 jest chorobą wywoływaną przez wirusa.","a":true,"ex":"COVID-19 wywołuje wirus SARS-CoV-2.","l":1},{"t":"f","q":"Choroba zakaźna wywoływana przez bakterie, przenoszona np. przez zanieczyszczoną żywność, może powodować zatrucia _______.","a":"pokarmowe","acc":[],"ex":"Zatrucia pokarmowe często są wywoływane przez bakterie, np. salmonellę.","l":1},{"t":"tf","q":"Higiena osobista, jak mycie rąk, może zmniejszać ryzyko zakażeń bakteryjnych i wirusowych.","a":true,"ex":"To jeden z najprostszych i najskuteczniejszych sposobów ochrony przed zakażeniami.","l":1},{"t":"s","q":"Który organizm jest przykładem bakterii wykorzystywanej w przemyśle spożywczym?","a":"Bakteria kwasu mlekowego, wykorzystywana do produkcji jogurtu","ex":"Bakterie kwasu mlekowego przeprowadzają fermentację mlekową.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego wirusy nie są zaliczane do żadnego z pięciu królestw organizmów.","a":"Wirusy nie mają budowy komórkowej — składają się jedynie z materiału genetycznego otoczonego białkową otoczką, dlatego nie spełniają podstawowego kryterium przynależności do żadnego z pięciu królestw, które obejmują organizmy zbudowane z komórek.","l":1},{"t":"s","q":"Materiał genetyczny wirusa jest otoczony:","a":"Białkową otoczką","ex":"Białkowa otoczka chroni materiał genetyczny wirusa.","l":1},{"t":"tf","q":"Wirus poza komórką gospodarza nie wykazuje żadnych czynności życiowych.","a":true,"ex":"Dopiero wewnątrz komórki gospodarza wirus może się namnażać.","l":1},{"t":"s","q":"Dlaczego wirus potrzebuje komórki gospodarza do namnażania?","a":"Nie posiada własnego aparatu do produkcji nowych cząsteczek i korzysta z „maszynerii” komórki gospodarza","ex":"Wirus wykorzystuje struktury komórki gospodarza do wytwarzania swoich kopii.","l":1},{"t":"f","q":"Bakterie chorobotwórcze mogą wywoływać choroby takie jak angina czy _______ (choroba płuc).","a":"gruźlica","acc":[],"ex":"Gruźlica jest poważną chorobą bakteryjną atakującą głównie płuca.","l":1},{"t":"tf","q":"Gruźlica jest chorobą wywoływaną przez bakterie.","a":true,"ex":"Gruźlicę wywołują prątki gruźlicy, będące bakteriami.","l":1},{"t":"o","q":"Podaj trzy sposoby zapobiegania zakażeniom bakteryjnym i wirusowym.","a":"Np. mycie rąk, szczepienia, unikanie bliskiego kontaktu z osobami chorymi (można też wymienić dbanie o higienę żywności i wody).","l":1},{"t":"s","q":"Bakterie glebowe odgrywają ważną rolę, ponieważ:","a":"Rozkładają materię organiczną, użyźniając glebę","ex":"Dzięki bakteriom glebowym składniki odżywcze wracają do gleby.","l":1},{"t":"tf","q":"Bakterie glebowe uczestniczą w rozkładzie materii organicznej i użyźnianiu gleby.","a":true,"ex":"To jedna z najważniejszych ekologicznych funkcji bakterii.","l":1},{"t":"s","q":"Zakażenie bakteryjne można czasem rozpoznać po objawach takich jak:","a":"Gorączka i stan zapalny w konkretnym miejscu ciała, np. gardle","ex":"Objawy zakażenia bakteryjnego bywają zauważalne i skoncentrowane w jednym miejscu.","l":1},{"t":"f","q":"Namnażanie się wirusa wewnątrz komórki gospodarza prowadzi zwykle do jej _______.","a":"zniszczenia","acc":["uszkodzenia"],"ex":"Nowe cząsteczki wirusa opuszczają komórkę, często ją niszcząc.","l":1},{"t":"s","q":"Bakterie tlenowe potrzebują do życia:","a":"Tlenu","ex":"Bakterie tlenowe wykorzystują tlen do oddychania.","l":1},{"t":"tf","q":"Bakterie beztlenowe mogą żyć w środowiskach pozbawionych tlenu.","a":true,"ex":"To ich charakterystyczna cecha, odróżniająca je od bakterii tlenowych.","l":1},{"t":"o","q":"Wyjaśnij, dlaczego higiena rąk jest ważnym sposobem zapobiegania zakażeniom.","a":"Mycie rąk mechanicznie usuwa z ich powierzchni bakterie i wirusy, zmniejszając ryzyko przeniesienia ich do organizmu, np. przez dotykanie twarzy czy jedzenia.","l":1},{"t":"s","q":"Chorobotwórcze bakterie mogą wnikać do organizmu m.in. przez:","a":"Drogi oddechowe, skórę lub układ pokarmowy","ex":"To najczęstsze drogi wnikania drobnoustrojów do organizmu.","l":1},{"t":"tf","q":"Zakażenie wirusowe może przebiegać bezobjawowo, czyli bez widocznych objawów choroby.","a":true,"ex":"Osoba zakażona może czuć się dobrze, a mimo to przenosić wirusa na innych.","l":1},{"t":"s","q":"Typowa bakteria, w porównaniu do typowego wirusa, jest zazwyczaj:","a":"Większa","ex":"Bakterie są zwykle znacznie większe od wirusów.","l":1},{"t":"f","q":"Bakterie o kształcie przypominającym przecinek nazywamy _______.","a":"przecinkowcami","acc":[],"ex":"To kolejny, rzadszy kształt bakterii, obok ziarniaków, laseczek i krętków.","l":1},{"t":"tf","q":"Bakterie mogą mieć różne kształty, np. kuliste, pałeczkowate lub spiralne.","a":true,"ex":"Kształt jest jedną z podstawowych cech wykorzystywanych do opisu bakterii.","l":1},{"t":"s","q":"Dlaczego bakterie są ważne dla funkcjonowania ekosystemów?","a":"Uczestniczą w rozkładzie materii organicznej i obiegu pierwiastków w przyrodzie","ex":"Bez bakterii rozkładających materię organiczną obieg pierwiastków w przyrodzie byłby niemożliwy.","l":1},{"t":"o","q":"Wyjaśnij znaczenie bakterii w przyrodzie, podając przynajmniej dwa przykłady ich pożytecznej roli.","a":"Bakterie rozkładają martwą materię organiczną, uczestnicząc w obiegu pierwiastków (np. węgla i azotu) w przyrodzie, a także są wykorzystywane przez człowieka np. do produkcji jogurtów, serów i kiszonek.","l":1},{"t":"s","q":"Chorobotwórcze wirusy mogą być przenoszone m.in. przez:","a":"Kontakt z osobą zakażoną lub kropelki wydzieliny dróg oddechowych","ex":"To najczęstsze drogi przenoszenia się wirusów między ludźmi.","l":1},{"t":"tf","q":"Odra jest chorobą wirusową, przeciwko której stosuje się szczepienia.","a":true,"ex":"Szczepienie przeciw odrze jest jednym ze standardowych szczepień ochronnych.","l":1},{"t":"s","q":"Dlaczego wirusy są czasem nazywane „pasożytami wewnątrzkomórkowymi”?","a":"Ponieważ mogą namnażać się jedynie wewnątrz komórek innego organizmu, wykorzystując jego zasoby","ex":"Wirus „przejmuje” komórkę gospodarza, by wytworzyć swoje kopie.","l":1},{"t":"f","q":"Wirusy, w odróżnieniu od bakterii, nie posiadają własnej _______ komórkowej.","a":"budowy","acc":[],"ex":"To zasadnicza różnica między wirusami a organizmami komórkowymi.","l":1},{"t":"tf","q":"Niektóre choroby wirusowe, jak ospa prawdziwa, udało się dzięki szczepieniom całkowicie wyeliminować na świecie.","a":true,"ex":"Ospa prawdziwa to jak dotąd jedyna choroba zakaźna człowieka całkowicie wyeliminowana dzięki szczepieniom.","l":1},{"t":"s","q":"Bakterie chorobotwórcze różnią się od bakterii pożytecznych:","a":"Sposobem oddziaływania na organizm człowieka lub środowisko, mimo podobnej budowy komórkowej","ex":"Obie grupy mają podobną budowę komórkową — różni je wpływ na organizm gospodarza czy środowisko.","l":1},{"t":"o","q":"Porównaj bakterie i wirusy pod względem budowy i sposobu rozmnażania.","a":"Bakterie mają budowę komórkową (choć bez jądra) i rozmnażają się samodzielnie przez podział komórki. Wirusy nie mają budowy komórkowej — składają się z materiału genetycznego i otoczki białkowej — i mogą namnażać się wyłącznie wewnątrz komórek organizmu gospodarza.","l":1},{"t":"s","q":"Które stwierdzenie o antybiotykach jest prawdziwe?","a":"Działają na bakterie, ale nie na wirusy","ex":"Antybiotyki zwalczają bakterie, nie mają natomiast działania przeciwwirusowego.","l":1},{"t":"tf","q":"Niewłaściwe, zbyt częste stosowanie antybiotyków może prowadzić do powstawania bakterii opornych na leczenie.","a":true,"ex":"Nadużywanie antybiotyków sprzyja selekcji bakterii odpornych na ich działanie.","l":1},{"t":"s","q":"Grzyby, w odróżnieniu od roślin:","a":"Nie przeprowadzają fotosyntezy i odżywiają się cudzożywnie","ex":"Grzyby nie mają chlorofilu, więc muszą pobierać gotowe substancje odżywcze z otoczenia.","l":3},{"t":"tf","q":"Grzybnia to część grzyba ukryta zwykle pod ziemią, zbudowana ze strzępek.","a":true,"ex":"Grzybnia jest zwykle znacznie większa niż widoczny nad ziemią owocnik.","l":3},{"t":"s","q":"Widoczna nad ziemią część grzyba kapeluszowego to:","a":"Owocnik","ex":"To, co zrywamy w lesie (kapelusz i trzon), to owocnik — organ do wytwarzania zarodników.","l":3},{"t":"f","q":"Grzyby odżywiające się szczątkami obumarłych organizmów nazywamy grzybami _______.","a":"saprotroficznymi","acc":["saprotrofy","rozkladajace","rozkładającymi"],"ex":"Grzyby saprotroficzne rozkładają martwą materię organiczną, np. liście czy drewno.","l":3},{"t":"s","q":"Przykładem grzyba pasożytniczego jest:","a":"Hubiak pospolity (huba)","ex":"Huba pasożytuje na drzewach, osłabiając je i powodując gnicie drewna.","l":3},{"t":"tf","q":"Wszystkie grzyby kapeluszowe są jadalne.","a":false,"ex":"Wiele gatunków jest trujących, np. muchomor sromotnikowy — dlatego zbieramy tylko znane grzyby.","l":3},{"t":"s","q":"Grzyby wchodzące w korzystną współpracę z korzeniami drzew tworzą:","a":"Mikoryzę","ex":"Mikoryza to symbioza grzyba z korzeniami rośliny — obie strony na tym korzystają.","l":3},{"t":"s","q":"Porosty to organizmy powstałe ze współżycia:","a":"Grzyba i glona (lub sinicy)","ex":"Porost to symbioza grzyba (dostarcza schronienia) i glonu lub sinicy (dostarcza pokarmu z fotosyntezy).","l":3},{"t":"tf","q":"Drożdże to jednokomórkowe grzyby wykorzystywane m.in. w piekarnictwie.","a":true,"ex":"Drożdże powodują fermentację ciasta, dzięki czemu pieczywo „rośnie”.","l":3},{"t":"s","q":"Zbierając grzyby w lesie, należy:","a":"Zbierać tylko znane sobie gatunki i nie niszczyć grzybni","ex":"Wyrywanie grzybni niszczy cały organizm — wystarczy odciąć lub odkręcić owocnik.","l":3},{"t":"s","q":"Grzyby magazynują materiały zapasowe w postaci:","a":"Glikogenu, podobnie jak zwierzęta","ex":"Pod tym względem grzyby są bliższe zwierzętom niż roślinom.","l":3},{"t":"tf","q":"Ściana komórkowa grzybów zbudowana jest głównie z chityny.","a":true,"ex":"Chityna to ta sama substancja, która buduje pancerzyki owadów.","l":3},{"t":"f","q":"Grzyby żywiące się kosztem żywego organizmu i szkodzące mu nazywamy grzybami _______.","a":"pasożytniczymi","acc":["pasozyty"],"ex":"Grzyby pasożytnicze czerpią pokarm z żywego gospodarza, osłabiając go.","l":3},{"t":"s","q":"Pleśń pojawiająca się na chlebie to przykład grzyba:","a":"Pleśniowego (strzępkowego)","ex":"Grzyby pleśniowe tworzą charakterystyczny, puszysty nalot na zepsutej żywności.","l":3},{"t":"tf","q":"Penicylina, pierwszy antybiotyk, została odkryta dzięki obserwacji pleśni.","a":true,"ex":"Odkrycie penicyliny przez Alexandra Fleminga zapoczątkowało erę antybiotyków.","l":3},{"t":"s","q":"Grzyby, podobnie jak rośliny:","a":"Mają ścianę komórkową","ex":"Zarówno grzyby, jak i rośliny mają komórki otoczone ścianą komórkową, choć zbudowaną z innych substancji.","l":3},{"t":"s","q":"Muchomor sromotnikowy jest przykładem grzyba:","a":"Silnie trującego, śmiertelnie niebezpiecznego","ex":"To jeden z najbardziej niebezpiecznych trujących grzybów występujących w Polsce.","l":3},{"t":"tf","q":"Porosty są bardzo wrażliwe na zanieczyszczenie powietrza, dlatego wykorzystuje się je jako wskaźnik jego czystości.","a":true,"ex":"Tam, gdzie powietrze jest mocno zanieczyszczone, porosty zwykle nie rosną.","l":3},{"t":"s","q":"Grzyby rozprzestrzeniają się w przyrodzie głównie za pomocą:","a":"Zarodników","ex":"Drobne, lekkie zarodniki są łatwo przenoszone przez wiatr na duże odległości.","l":3},{"t":"s","q":"Grzyby są organizmami:","a":"Cudzożywnymi, bez chlorofilu","ex":"Grzyby nie mają chlorofilu, więc muszą pobierać gotowe substancje odżywcze.","l":3},{"t":"tf","q":"Grzyby nie mają chlorofilu, dlatego nie mogą przeprowadzać fotosyntezy.","a":true,"ex":"To podstawowa różnica między grzybami a roślinami.","l":3},{"t":"f","q":"Ciało wielu grzybów zbudowane jest z cienkich, nitkowatych struktur zwanych _______.","a":"strzępkami","acc":[],"ex":"Strzępki tworzą razem grzybnię.","l":3},{"t":"s","q":"Sieć strzępek tworzących ciało grzyba nazywamy:","a":"Grzybnią","ex":"Grzybnia jest zwykle ukryta w podłożu.","l":3},{"t":"s","q":"Widoczna nad ziemią część grzyba kapeluszowego to:","a":"Owocnik","ex":"To, co zrywamy w lesie, to owocnik grzyba.","l":3},{"t":"tf","q":"Owocnik grzyba jest zwykle znacznie mniejszy niż jego grzybnia.","a":true,"ex":"Grzybnia bywa rozległa, choć niewidoczna, podczas gdy owocnik pojawia się tylko okresowo.","l":3},{"t":"o","q":"Wyjaśnij różnicę między grzybnią a owocnikiem grzyba.","a":"Grzybnia to część grzyba ukryta zwykle pod ziemią lub w podłożu, zbudowana ze strzępek, natomiast owocnik to widoczna nad powierzchnią część grzyba (np. kapelusz i trzon), służąca do wytwarzania zarodników.","l":3},{"t":"s","q":"Grzyby odżywiające się szczątkami obumarłych organizmów nazywamy grzybami:","a":"Saprotroficznymi","ex":"Grzyby saprotroficzne rozkładają martwą materię organiczną.","l":3},{"t":"f","q":"Grzyby żywiące się kosztem żywego organizmu, szkodząc mu, nazywamy grzybami _______.","a":"pasożytniczymi","acc":[],"ex":"Grzyby pasożytnicze czerpią pokarm z żywego gospodarza.","l":3},{"t":"tf","q":"Grzyby saprotroficzne rozkładają martwą materię organiczną, np. opadłe liście czy martwe drewno.","a":true,"ex":"To ważna rola ekologiczna tych grzybów.","l":3},{"t":"s","q":"Przykładem grzyba pasożytniczego jest:","a":"Hubiak pospolity (huba)","ex":"Huba pasożytuje na drzewach, osłabiając je.","l":3},{"t":"tf","q":"Wszystkie grzyby kapeluszowe są jadalne.","a":false,"ex":"Wiele gatunków jest trujących, np. muchomor sromotnikowy.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego nie należy zbierać nieznanych grzybów w lesie.","a":"Nieznane grzyby mogą być trujące, a niektóre gatunki, jak muchomor sromotnikowy, są bardzo niebezpieczne i mogą spowodować poważne zatrucie, a nawet śmierć.","l":3},{"t":"s","q":"Muchomor sromotnikowy jest przykładem grzyba:","a":"Silnie trującego","ex":"To jeden z najbardziej niebezpiecznych trujących grzybów w Polsce.","l":3},{"t":"f","q":"Grzyby wchodzące w korzystną współpracę z korzeniami drzew tworzą _______.","a":"mikoryzę","acc":[],"ex":"Mikoryza to symbioza grzyba z korzeniami rośliny.","l":3},{"t":"tf","q":"Mikoryza to symbioza korzystna zarówno dla grzyba, jak i dla drzewa.","a":true,"ex":"Obie strony czerpią korzyści z tej współpracy.","l":3},{"t":"s","q":"Dzięki mikoryzie drzewo zyskuje:","a":"Lepsze pobieranie wody i soli mineralnych z pomocą grzyba","ex":"Grzybnia znacząco zwiększa powierzchnię chłonną systemu korzeniowego drzewa.","l":3},{"t":"o","q":"Wyjaśnij, na czym polega korzyść grzyba i drzewa z mikoryzy.","a":"Grzyb otrzymuje od drzewa substancje odżywcze powstałe w fotosyntezie, a drzewo dzięki grzybni zyskuje znacznie większą powierzchnię do pobierania wody i soli mineralnych z gleby.","l":3},{"t":"s","q":"Porosty to organizmy powstałe ze współżycia:","a":"Grzyba i glona (lub sinicy)","ex":"To symbioza grzyba z organizmem fotosyntetyzującym.","l":3},{"t":"tf","q":"Porosty mogą rosnąć w miejscach trudnych dla wielu innych organizmów, np. na skałach.","a":true,"ex":"Porosty są bardzo wytrzymałe i mogą zasiedlać skrajne środowiska.","l":3},{"t":"f","q":"Porosty są wykorzystywane jako wskaźniki czystości _______.","a":"powietrza","acc":[],"ex":"Porosty są bardzo wrażliwe na zanieczyszczenia atmosferyczne.","l":3},{"t":"s","q":"Porosty są wrażliwe na zanieczyszczenia powietrza, dlatego:","a":"Wykorzystuje się je do oceny czystości powietrza","ex":"Obecność lub brak porostów pozwala ocenić jakość powietrza w danym miejscu.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego porosty mogą służyć jako wskaźnik czystości powietrza.","a":"Porosty są bardzo wrażliwe na zanieczyszczenia, zwłaszcza związki siarki, dlatego rosną głównie tam, gdzie powietrze jest czyste — ich obecność lub brak pozwala ocenić stan czystości powietrza w danym miejscu.","l":3},{"t":"s","q":"Drożdże to grzyby:","a":"Jednokomórkowe, wykorzystywane m.in. w piekarnictwie","ex":"Drożdże są prostymi, jednokomórkowymi grzybami.","l":3},{"t":"tf","q":"Drożdże są wykorzystywane w produkcji pieczywa dzięki procesowi fermentacji.","a":true,"ex":"Fermentacja alkoholowa drożdży powoduje, że ciasto rośnie.","l":3},{"t":"f","q":"Podczas fermentacji alkoholowej drożdże wytwarzają dwutlenek węgla, dzięki czemu ciasto drożdżowe _______.","a":"rośnie","acc":[],"ex":"Pęcherzyki gazu powstające podczas fermentacji zwiększają objętość ciasta.","l":3},{"t":"s","q":"Penicylina, pierwszy antybiotyk, została odkryta dzięki obserwacji:","a":"Pleśni","ex":"Odkrycie penicyliny zapoczątkowało erę antybiotyków.","l":3},{"t":"o","q":"Wyjaśnij pokrótce, jak doszło do odkrycia penicyliny.","a":"Naukowiec Alexander Fleming zauważył, że pleśń rosnąca na hodowli bakterii hamuje ich wzrost — na tej podstawie opracowano pierwszy antybiotyk, penicylinę.","l":3},{"t":"s","q":"Ściana komórkowa grzybów zbudowana jest głównie z:","a":"Chityny","ex":"Chityna nadaje ścianie komórkowej grzybów wytrzymałość.","l":3},{"t":"tf","q":"Ściana komórkowa grzybów jest zbudowana z tej samej substancji, która buduje pancerzyki owadów (chityny).","a":true,"ex":"To ciekawe podobieństwo między grzybami a owadami.","l":3},{"t":"s","q":"Grzyby magazynują materiały zapasowe głównie w postaci:","a":"Glikogenu, podobnie jak zwierzęta","ex":"Pod tym względem grzyby są bliższe zwierzętom niż roślinom.","l":3},{"t":"f","q":"Zarodniki grzybów są bardzo lekkie, dzięki czemu łatwo przenosi je _______.","a":"wiatr","acc":[],"ex":"To ułatwia grzybom rozprzestrzenianie się na duże odległości.","l":3},{"t":"tf","q":"Zarodniki grzybów są bardzo lekkie, dzięki czemu łatwo przenosi je wiatr.","a":true,"ex":"Lekkość zarodników sprzyja ich szerokiemu rozprzestrzenianiu.","l":3},{"t":"s","q":"Zbierając grzyby w lesie, należy:","a":"Zbierać tylko znane sobie gatunki i nie niszczyć grzybni","ex":"Odcinanie lub odkręcanie owocnika nie niszczy całej grzybni.","l":3},{"t":"o","q":"Wymień trzy zasady, których warto przestrzegać, zbierając grzyby w lesie.","a":"Zbierać tylko dobrze znane, sprawdzone gatunki; nie wyrywać grzybów razem z grzybnią, tylko delikatnie odcinać lub odkręcać owocnik; nie zbierać grzybów rosnących przy ruchliwych drogach, bo mogą kumulować zanieczyszczenia.","l":3},{"t":"s","q":"Pleśń pojawiająca się na chlebie to przykład grzyba:","a":"Pleśniowego (strzępkowego)","ex":"Grzyby pleśniowe tworzą charakterystyczny nalot na zepsutej żywności.","l":3},{"t":"tf","q":"Wszystkie grzyby pleśniowe są szkodliwe dla człowieka.","a":false,"ex":"Niektóre pleśnie są wykorzystywane pożytecznie, np. do produkcji penicyliny lub serów pleśniowych.","l":3},{"t":"s","q":"Grzyby, podobnie jak rośliny:","a":"Mają ścianę komórkową","ex":"Oba te królestwa mają komórki otoczone ścianą komórkową, choć zbudowaną z innych substancji.","l":3},{"t":"f","q":"Zespół strzępek grzyba, ukryty zwykle pod ziemią, to _______.","a":"grzybnia","acc":[],"ex":"Grzybnia jest właściwym „ciałem” grzyba.","l":3},{"t":"s","q":"Grzyby kapeluszowe wytwarzają zarodniki najczęściej:","a":"W blaszkach lub rurkach pod kapeluszem","ex":"To tam dojrzewają i uwalniają się zarodniki.","l":3},{"t":"tf","q":"Grzyby są zaliczane do odrębnego królestwa, różnego od roślin i zwierząt.","a":true,"ex":"Grzyby mają cechy odróżniające je zarówno od roślin, jak i od zwierząt.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego grzybów nie zaliczamy ani do roślin, ani do zwierząt.","a":"Grzyby różnią się od roślin brakiem chlorofilu i niezdolnością do fotosyntezy (są cudzożywne), a od zwierząt m.in. sposobem odżywiania (wchłanianie substancji przez powierzchnię ciała) i obecnością ściany komórkowej — dlatego tworzą osobne królestwo.","l":3},{"t":"s","q":"Przykładem grzyba jadalnego jest:","a":"Pieczarka","ex":"Pieczarka jest jednym z najpopularniejszych grzybów jadalnych.","l":3},{"t":"tf","q":"Purchawka jest przykładem grzyba jadalnego, gdy jest młoda.","a":true,"ex":"Młode, białe wewnątrz purchawki nadają się do jedzenia.","l":3},{"t":"s","q":"Grzyby chorobotwórcze mogą pasożytować m.in. na:","a":"Roślinach uprawnych, powodując ich choroby","ex":"Grzyby pasożytnicze mogą znacząco osłabiać rośliny uprawne.","l":3},{"t":"f","q":"Choroby roślin wywoływane przez grzyby pasożytnicze mogą prowadzić do strat w _______ rolniczych.","a":"plonach","acc":[],"ex":"Rolnicy muszą chronić uprawy przed grzybami pasożytniczymi.","l":3},{"t":"tf","q":"Niektóre grzyby pasożytnicze mogą niszczyć plony roślin uprawnych.","a":true,"ex":"To poważny problem w rolnictwie na całym świecie.","l":3},{"t":"o","q":"Podaj przykład grzyba jadalnego i przykład grzyba trującego.","a":"Jadalny: np. pieczarka, borowik lub kurka. Trujący: np. muchomor sromotnikowy lub muchomor czerwony.","l":3},{"t":"s","q":"Porost jest przykładem symbiozy dwóch różnych organizmów, ponieważ składa się z:","a":"Grzyba oraz glonu lub sinicy","ex":"Porost to trwały związek dwóch różnych organizmów, przynoszący korzyść obu stronom.","l":3},{"t":"tf","q":"Porost nie jest pojedynczym organizmem, lecz zespołem dwóch współżyjących ze sobą organizmów.","a":true,"ex":"To właśnie definicja symbiozy, jaką tworzy porost.","l":3},{"t":"s","q":"Który składnik porostu odpowiada za dostarczanie pokarmu dzięki fotosyntezie?","a":"Glon lub sinica","ex":"Glon lub sinica, dzięki fotosyntezie, produkuje substancje odżywcze dla obu organizmów.","l":3},{"t":"f","q":"W skład porostu wchodzi grzyb oraz organizm zdolny do przeprowadzania _______.","a":"fotosyntezy","acc":[],"ex":"To właśnie ten składnik (glon lub sinica) dostarcza pokarmu.","l":3},{"t":"o","q":"Wyjaśnij, jaką rolę pełni każdy ze składników porostu (grzyb i glon lub sinica).","a":"Grzyb tworzy strukturę porostu, chroni go i pobiera wodę oraz sole mineralne, natomiast glon lub sinica przeprowadza fotosyntezę, dostarczając obu organizmom substancji odżywczych.","l":3},{"t":"s","q":"Grzyby odgrywają ważną rolę w przyrodzie, ponieważ:","a":"Rozkładają materię organiczną i uczestniczą w obiegu pierwiastków","ex":"Bez grzybów rozkład materii organicznej byłby znacznie wolniejszy.","l":3},{"t":"tf","q":"Bez grzybów rozkładających martwą materię organiczną obieg pierwiastków w przyrodzie byłby utrudniony.","a":true,"ex":"Grzyby, obok bakterii, są głównymi „rozkładaczami” w ekosystemach.","l":3},{"t":"s","q":"Rozmnażanie płciowe u wielu grzybów kapeluszowych związane jest z:","a":"Łączeniem się strzępek grzybni i wytwarzaniem zarodników","ex":"To prowadzi do powstania owocnika i nowych zarodników.","l":3},{"t":"f","q":"Grzyby, w odróżnieniu od zwierząt, nie trawią pokarmu wewnątrz ciała, lecz wydzielają enzymy trawiące pokarm na _______.","a":"zewnątrz","acc":[],"ex":"To charakterystyczny dla grzybów sposób trawienia pozakomórkowego.","l":3},{"t":"tf","q":"Grzyby trawią pokarm na zewnątrz swojego ciała, wydzielając specjalne enzymy, a następnie wchłaniają powstałe substancje.","a":true,"ex":"To odróżnia sposób odżywiania grzybów od zwierząt.","l":3},{"t":"o","q":"Wyjaśnij, na czym polega charakterystyczny dla grzybów sposób trawienia pokarmu.","a":"Grzyby wydzielają na zewnątrz swojego ciała enzymy trawienne, które rozkładają pokarm w otoczeniu, a następnie wchłaniają powstałe, rozłożone substancje odżywcze przez powierzchnię strzępek.","l":3},{"t":"s","q":"Grzyby kapeluszowe zbudowane są z:","a":"Kapelusza i trzonu","ex":"To dwa główne elementy owocnika grzyba kapeluszowego.","l":3},{"t":"tf","q":"Kapelusz i trzon to elementy budowy owocnika grzyba kapeluszowego.","a":true,"ex":"Owocnik jest tą częścią grzyba, którą widzimy nad ziemią.","l":3},{"t":"s","q":"Zarodniki grzybów kapeluszowych powstają najczęściej:","a":"Pod kapeluszem, w blaszkach lub rurkach","ex":"To miejsce dojrzewania i uwalniania zarodników.","l":3},{"t":"f","q":"Miejsce, w którym u grzybów kapeluszowych powstają zarodniki, nazywamy zwykle blaszkami lub _______.","a":"rurkami","acc":[],"ex":"To zależy od gatunku grzyba — np. borowik ma rurki, a pieczarka blaszki.","l":3},{"t":"s","q":"Czym różni się grzyb pasożytniczy od grzyba saprotroficznego?","a":"Grzyb pasożytniczy żywi się kosztem żywego organizmu, a saprotroficzny rozkłada materię martwą","ex":"To podstawowa różnica w sposobie odżywiania obu typów grzybów.","l":3},{"t":"o","q":"Wyjaśnij różnicę między grzybem pasożytniczym a saprotroficznym.","a":"Grzyb pasożytniczy pobiera substancje odżywcze z żywego organizmu, szkodząc mu, natomiast grzyb saprotroficzny odżywia się szczątkami obumarłych organizmów, np. martwym drewnem czy opadłymi liśćmi.","l":3},{"t":"s","q":"Który grzyb jest przykładem pasożyta drzew, powodującego gnicie drewna?","a":"Huba (hubiak pospolity)","ex":"Huba osłabia drzewo i przyspiesza rozkład jego drewna.","l":3},{"t":"tf","q":"Hubiak pospolity (huba) jest grzybem pasożytującym na drzewach.","a":true,"ex":"To typowy przykład grzyba pasożytniczego w lesie.","l":3},{"t":"s","q":"Grzyby drożdżowe rozmnażają się głównie przez:","a":"Pączkowanie","ex":"Nowa komórka drożdży „wypącza się” z komórki macierzystej.","l":3},{"t":"f","q":"Drożdże rozmnażają się głównie przez _______, czyli wypączkowywanie nowej komórki z komórki macierzystej.","a":"pączkowanie","acc":[],"ex":"To najczęstszy sposób rozmnażania się drożdży.","l":3},{"t":"tf","q":"Drożdże, mimo że są grzybami, są organizmami jednokomórkowymi.","a":true,"ex":"To wyjątek wśród grzybów — większość z nich jest wielokomórkowa.","l":3},{"t":"o","q":"Wyjaśnij, dlaczego drożdże, mimo że są jednokomórkowe, zaliczamy do grzybów, a nie do bakterii czy protistów.","a":"Drożdże mają budowę komórkową charakterystyczną dla grzybów — m.in. ścianę komórkową z chityny i cudzożywny sposób odżywiania przez wchłanianie substancji odżywczych, a nie fotosyntezę czy inny sposób typowy dla bakterii lub protistów.","l":3},{"t":"s","q":"Który proces zachodzi dzięki drożdżom podczas produkcji piwa lub wina?","a":"Fermentacja alkoholowa","ex":"Drożdże przekształcają cukry w alkohol i dwutlenek węgla.","l":3},{"t":"tf","q":"Fermentacja alkoholowa prowadzona przez drożdże jest wykorzystywana m.in. w produkcji piwa i wina.","a":true,"ex":"To jedno z najstarszych zastosowań drożdży przez człowieka.","l":3},{"t":"s","q":"Które stwierdzenie o grzybach jest prawdziwe?","a":"Grzyby są cudzożywne i nie mają chlorofilu","ex":"To podstawowa, prawdziwa cecha wszystkich grzybów.","l":3},{"t":"o","q":"Wymień trzy cechy odróżniające grzyby od roślin.","a":"Grzyby nie mają chlorofilu i nie przeprowadzają fotosyntezy (są cudzożywne); ich ściana komórkowa zbudowana jest z chityny, a nie z celulozy; magazynują materiały zapasowe w postaci glikogenu, a nie skrobi.","l":3},{"t":"tf","q":"Grzybnia pobiera substancje odżywcze z podłoża, w którym rośnie.","a":true,"ex":"To główna funkcja grzybni.","l":3},{"t":"s","q":"Dlaczego grzyby mikoryzowe są ważne dla lasu?","a":"Pomagają drzewom skuteczniej pobierać wodę i sole mineralne, zwiększając ich odporność","ex":"Mikoryza jest korzystna dla zdrowia i wzrostu wielu gatunków drzew leśnych.","l":3},{"t":"s","q":"Protisty to organizmy:","a":"Głównie jednokomórkowe, choć zdarzają się formy wielokomórkowe","ex":"Protisty to bardzo zróżnicowana grupa, w większości jednokomórkowa.","l":2},{"t":"s","q":"Przykładem protista jest:","a":"Pantofelek","ex":"Pantofelek to klasyczny przykład protista poznawany w szkole.","l":2},{"t":"f","q":"Ameba porusza się za pomocą _______.","a":"nibynóżek","acc":[],"ex":"Nibynóżki to zmienne wypustki cytoplazmy, dzięki którym ameba się przemieszcza i chwyta pokarm.","l":2},{"t":"s","q":"Pantofelek porusza się za pomocą:","a":"Rzęsek","ex":"Liczne, drobne rzęski pokrywające ciało pantofelka umożliwiają mu szybki ruch.","l":2},{"t":"s","q":"Euglena porusza się za pomocą:","a":"Wici","ex":"Euglena ma jedną długą wić, którą porusza, by pływać.","l":2},{"t":"tf","q":"Euglena potrafi przeprowadzać fotosyntezę, ale może też pobierać gotowy pokarm.","a":true,"ex":"To wyjątkowa cecha euglen — łączą cechy organizmów samo- i cudzożywnych.","l":2},{"t":"s","q":"Struktura ameby, dzięki której pobiera ona pokarm i się porusza, to:","a":"Nibynóżki","ex":"Nibynóżki służą amebie zarówno do ruchu, jak i do otaczania cząstek pokarmu.","l":2},{"t":"tf","q":"Wszystkie protisty są wyłącznie cudzożywne.","a":false,"ex":"Niektóre protisty, jak euglena, mogą przeprowadzać fotosyntezę i są samożywne.","l":2},{"t":"s","q":"Organizm jednokomórkowy poruszający się za pomocą licznych rzęsek i pobierający pokarm to najprawdopodobniej:","a":"Pantofelek","ex":"Ruch za pomocą rzęsek jest charakterystyczny właśnie dla pantofelka.","l":2},{"t":"f","q":"Struktura pantofelka odpowiedzialna za usuwanie nadmiaru wody z komórki to wodniczka _______.","a":"tętniąca","acc":[],"ex":"Wodniczka tętniąca okresowo się kurczy, wypychając nadmiar wody z komórki.","l":2},{"t":"s","q":"Do protistów zaliczamy m.in.:","a":"Ameby, pantofelki i euglenę","ex":"To trzy klasyczne przykłady protistów poznawane w szkole podstawowej.","l":2},{"t":"tf","q":"Niektóre protisty mogą być wielokomórkowe, np. duże glony morskie.","a":true,"ex":"Choć większość protistów jest jednokomórkowa, zdarzają się też formy wielokomórkowe.","l":2},{"t":"s","q":"Euglena łączy cechy organizmu samożywnego i cudzożywnego, ponieważ:","a":"Potrafi przeprowadzać fotosyntezę i pobierać gotowy pokarm","ex":"To wyjątkowa cecha euglen wśród protistów.","l":2},{"t":"s","q":"Pantofelek pobiera pokarm głównie za pomocą:","a":"Specjalnego rowka gębowego otoczonego rzęskami","ex":"Rzęski wokół rowka gębowego kierują pokarm do wnętrza komórki pantofelka.","l":2},{"t":"tf","q":"Wszystkie protisty żyją wyłącznie w wodzie słodkiej.","a":false,"ex":"Protisty można spotkać zarówno w wodzie słodkiej, jak i słonej, a nawet w wilgotnej glebie.","l":2},{"t":"s","q":"Ruch za pomocą nibynóżek charakterystyczny jest dla:","a":"Ameby","ex":"Nibynóżki to zmienne wypustki cytoplazmy ameby.","l":2},{"t":"s","q":"Dlaczego protisty są bardzo zróżnicowaną grupą organizmów?","a":"Obejmują zarówno formy samożywne, jak i cudzożywne, jednokomórkowe i część wielokomórkowych","ex":"Ta różnorodność sprawia, że protisty trudno jednoznacznie sklasyfikować.","l":2},{"t":"tf","q":"Pantofelek, ameba i euglena to organizmy jednokomórkowe.","a":true,"ex":"Wszystkie trzy są klasycznymi przykładami jednokomórkowych protistów.","l":2},{"t":"s","q":"Protisty to organizmy:","a":"Eukariotyczne, najczęściej jednokomórkowe","ex":"To podstawowa cecha łącząca tę zróżnicowaną grupę.","l":2},{"t":"tf","q":"Protisty mają komórki eukariotyczne, czyli z jądrem komórkowym otoczonym błoną.","a":true,"ex":"To odróżnia je od bakterii, które są prokariotyczne.","l":2},{"t":"f","q":"Protisty to bardzo zróżnicowana grupa organizmów, najczęściej _______.","a":"jednokomórkowych","acc":[],"ex":"Choć zdarzają się też protisty wielokomórkowe, jak niektóre glony.","l":2},{"t":"s","q":"Pantofelek porusza się za pomocą:","a":"Rzęsek","ex":"Liczne rzęski pokrywają całą powierzchnię komórki pantofelka.","l":2},{"t":"tf","q":"Pantofelek jest protistem poruszającym się za pomocą licznych rzęsek pokrywających jego ciało.","a":true,"ex":"Dzięki rzęskom pantofelek sprawnie pływa w wodzie.","l":2},{"t":"s","q":"Organellum pantofelka odpowiedzialne za usuwanie nadmiaru wody z komórki to:","a":"Wodniczka tętniąca","ex":"Wodniczka tętniąca reguluje gospodarkę wodną komórki.","l":2},{"t":"f","q":"Wodniczka tętniąca pantofelka usuwa z komórki nadmiar _______.","a":"wody","acc":[],"ex":"Bez niej komórka mogłaby nadmiernie napęcznieć.","l":2},{"t":"o","q":"Wyjaśnij, jaką funkcję pełni wodniczka tętniąca u pantofelka.","a":"Wodniczka tętniąca gromadzi nadmiar wody, która wnika do komórki pantofelka (żyjącego w środowisku słodkowodnym), a następnie okresowo usuwa ją na zewnątrz, zapobiegając pęknięciu komórki.","l":2},{"t":"s","q":"Pantofelek pobiera pokarm przez:","a":"Rowek gębowy","ex":"Rowek gębowy prowadzi pokarm do wnętrza komórki.","l":2},{"t":"tf","q":"Pantofelek posiada dwa jądra komórkowe — większe i mniejsze.","a":true,"ex":"Pełnią one różne funkcje w komórce.","l":2},{"t":"s","q":"Euglena zielona jest ciekawym protistem, ponieważ:","a":"Może przeprowadzać fotosyntezę, mając chloroplasty, ale też pobierać gotowy pokarm","ex":"Euglena łączy cechy organizmów samo- i cudzożywnych.","l":2},{"t":"f","q":"Euglena porusza się za pomocą pojedynczej, długiej _______.","a":"wici","acc":[],"ex":"Wić napędza euglenę w środowisku wodnym.","l":2},{"t":"tf","q":"Euglena, w odróżnieniu od pantofelka, porusza się za pomocą wici, a nie rzęsek.","a":true,"ex":"To odróżnia obie grupy protistów pod względem sposobu poruszania się.","l":2},{"t":"s","q":"Do zielenic (glonów jednokomórkowych) zaliczamy m.in.:","a":"Chlorellę","ex":"Chlorella jest popularnym przykładem zielenicy.","l":2},{"t":"tf","q":"Chlorella jest przykładem jednokomórkowego glonu zdolnego do fotosyntezy.","a":true,"ex":"Chlorella zawiera chloroplasty umożliwiające fotosyntezę.","l":2},{"t":"s","q":"Okrzemki charakteryzują się obecnością:","a":"Krzemionkowej skorupki (pancerzyka)","ex":"Skorupka okrzemek jest zbudowana z krzemionki.","l":2},{"t":"f","q":"Skorupka (pancerzyk) okrzemek zbudowana jest głównie z _______.","a":"krzemionki","acc":[],"ex":"To nadaje skorupce sztywność i charakterystyczny wygląd.","l":2},{"t":"tf","q":"Okrzemki mają charakterystyczną, krzemionkową skorupkę zbudowaną z dwóch połówek.","a":true,"ex":"Przypomina to pudełko z wieczkiem.","l":2},{"t":"o","q":"Wyjaśnij, z czego zbudowana jest skorupka okrzemek i jakie to ma znaczenie.","a":"Skorupka okrzemek jest zbudowana z krzemionki i składa się z dwóch połówek nakładających się na siebie jak wieczko na pudełko, co chroni komórkę i nadaje jej sztywność.","l":2},{"t":"s","q":"Otwornice charakteryzują się obecnością:","a":"Wapiennej skorupki","ex":"Skorupki otwornic są zbudowane z węglanu wapnia.","l":2},{"t":"tf","q":"Otwornice mają skorupki zbudowane głównie z węglanu wapnia.","a":true,"ex":"Po obumarciu otwornic ich skorupki mogą tworzyć osady wapienne.","l":2},{"t":"f","q":"Szkielet promienic (radiolarii) zbudowany jest głównie z _______.","a":"krzemionki","acc":[],"ex":"Podobnie jak skorupki okrzemek.","l":2},{"t":"s","q":"Pełzak (ameba) porusza się za pomocą:","a":"Nibynóżek (pseudopodiów)","ex":"Nibynóżki to tymczasowe wypustki cytoplazmy.","l":2},{"t":"tf","q":"Pełzak porusza się i pobiera pokarm za pomocą nibynóżek, czyli tymczasowych wypustek cytoplazmy.","a":true,"ex":"To charakterystyczny sposób poruszania się i odżywiania pełzaka.","l":2},{"t":"o","q":"Wyjaśnij, w jaki sposób pełzak (ameba) porusza się i pobiera pokarm.","a":"Pełzak tworzy nibynóżki, czyli tymczasowe wypustki cytoplazmy, dzięki którym może się przemieszczać oraz otaczać i pochłaniać cząstki pokarmu (proces zwany fagocytozą).","l":2},{"t":"s","q":"Lęgniowiec ziemniaczany (zaraza ziemniaka) jest przykładem protista:","a":"Pasożytniczego, wywołującego choroby roślin","ex":"To groźny patogen roślin uprawnych.","l":2},{"t":"tf","q":"Zaraza ziemniaka, wywoływana przez protista, może poważnie niszczyć uprawy ziemniaków.","a":true,"ex":"Historycznie doprowadziła nawet do klęsk głodu.","l":2},{"t":"s","q":"Protisty mogą różnić się sposobem odżywiania — wśród nich znajdziemy:","a":"Organizmy samożywne, cudzożywne, a nawet mieszane","ex":"To pokazuje ogromne zróżnicowanie tej grupy.","l":2},{"t":"f","q":"Wśród protistów znajdują się zarówno organizmy samożywne, cudzożywne, jak i _______ (łączące oba typy odżywiania).","a":"mieszane","acc":[],"ex":"Przykładem jest euglena.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego protisty uważane są za bardzo zróżnicowaną grupę organizmów.","a":"Protisty obejmują organizmy o bardzo różnej budowie i sposobie życia — od jednokomórkowych glonów zdolnych do fotosyntezy, przez orzęski poruszające się za pomocą rzęsek, po pasożytnicze lęgniowce — dlatego trudno wskazać jedną wspólną cechę poza budową eukariotyczną.","l":2},{"t":"s","q":"Do protistów zaliczamy m.in.:","a":"Pantofelka, euglenę, okrzemki i lęgniowce","ex":"To reprezentatywne przykłady różnych grup protistów.","l":2},{"t":"tf","q":"Pantofelek, euglena, okrzemki i lęgniowce to przykłady protistów.","a":true,"ex":"Wszystkie należą do bardzo zróżnicowanej grupy protistów.","l":2},{"t":"s","q":"Który protist jest zaliczany do orzęsków (poruszających się za pomocą rzęsek)?","a":"Pantofelek","ex":"Pantofelek jest klasycznym przykładem orzęska.","l":2},{"t":"f","q":"Grupa protistów poruszających się za pomocą licznych rzęsek nazywana jest _______.","a":"orzęskami","acc":[],"ex":"Pantofelek jest przedstawicielem tej grupy.","l":2},{"t":"s","q":"Który protist jest zaliczany do wiciowców (poruszających się za pomocą wici)?","a":"Euglena","ex":"Euglena porusza się za pomocą pojedynczej wici.","l":2},{"t":"tf","q":"Euglena, poruszająca się za pomocą wici, jest zaliczana do wiciowców.","a":true,"ex":"To jedna z podstawowych grup protistów wyróżnianych na podstawie sposobu poruszania się.","l":2},{"t":"s","q":"Który protist jest zaliczany do korzenionóżek (poruszających się za pomocą nibynóżek)?","a":"Pełzak","ex":"Pełzak jest klasycznym przedstawicielem korzenionóżek.","l":2},{"t":"f","q":"Pełzak, poruszający się za pomocą nibynóżek, jest zaliczany do grupy zwanej _______.","a":"korzenionóżkami","acc":[],"ex":"To jedna z grup wyróżnianych wśród protistów.","l":2},{"t":"o","q":"Wymień trzy sposoby poruszania się protistów i podaj po jednym przykładzie organizmu.","a":"Za pomocą rzęsek — np. pantofelek; za pomocą wici — np. euglena; za pomocą nibynóżek — np. pełzak.","l":2},{"t":"s","q":"Okrzemki są ważnym elementem:","a":"Planktonu wodnego, produkującym znaczną część tlenu na Ziemi","ex":"Fitoplankton, w tym okrzemki, jest kluczowy dla produkcji tlenu.","l":2},{"t":"tf","q":"Okrzemki, jako część fitoplanktonu, produkują znaczną część tlenu na Ziemi dzięki fotosyntezie.","a":true,"ex":"Fitoplankton ma ogromne znaczenie dla globalnego bilansu tlenu.","l":2},{"t":"s","q":"Który protist jest przykładem organizmu wywołującego choroby u roślin?","a":"Lęgniowiec ziemniaczany","ex":"Lęgniowiec wywołuje groźną zarazę ziemniaka.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego zaraza ziemniaka (wywoływana przez lęgniowca) była historycznie tak groźna dla rolnictwa.","a":"Zaraza ziemniaka może szybko niszczyć całe plantacje ziemniaków, prowadząc do drastycznych strat w plonach — historycznie doprowadziła nawet do poważnych klęsk głodu, gdy uprawy ziemniaków były podstawą wyżywienia ludności.","l":2},{"t":"s","q":"Protisty żyją głównie:","a":"W środowiskach wodnych i wilgotnych","ex":"Woda jest typowym środowiskiem życia większości protistów.","l":2},{"t":"tf","q":"Większość protistów żyje w środowiskach wodnych lub bardzo wilgotnych.","a":true,"ex":"To dlatego często znajdujemy je w stawach, jeziorach czy kroplach wody.","l":2},{"t":"s","q":"Skamieniałe szczątki okrzemek i promienic mogą tworzyć:","a":"Osady na dnie zbiorników wodnych, wykorzystywane m.in. w przemyśle","ex":"Te osady mają realne zastosowania przemysłowe.","l":2},{"t":"f","q":"Osady zbudowane ze skorupek okrzemek nazywane są ziemią _______ i mają zastosowanie przemysłowe (np. jako materiał filtracyjny).","a":"okrzemkową","acc":[],"ex":"Wykorzystuje się ją m.in. do filtrowania płynów.","l":2},{"t":"tf","q":"Ziemia okrzemkowa, zbudowana ze skorupek okrzemek, jest wykorzystywana np. jako materiał filtracyjny.","a":true,"ex":"To ciekawy przykład praktycznego zastosowania szczątków protistów.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego pantofelek, w odróżnieniu od euglenu czy chlorelli, nie może przeprowadzać fotosyntezy.","a":"Pantofelek nie posiada chloroplastów ani chlorofilu, dlatego jest organizmem wyłącznie cudzożywnym i musi pobierać gotowy pokarm z otoczenia, w odróżnieniu od euglenu czy chlorelli, które mają chloroplasty umożliwiające fotosyntezę.","l":2},{"t":"s","q":"Który protist pobiera pokarm przez fagocytozę, otaczając go nibynóżkami?","a":"Pełzak","ex":"To typowy sposób odżywiania się pełzaka.","l":2},{"t":"tf","q":"Pełzak pobiera pokarm, otaczając go nibynóżkami w procesie fagocytozy.","a":true,"ex":"Fagocytoza to „pochłanianie” cząstek pokarmu przez komórkę.","l":2},{"t":"s","q":"Rozmnażanie wielu protistów jednokomórkowych odbywa się głównie przez:","a":"Prosty podział komórki","ex":"To najprostszy sposób rozmnażania bezpłciowego.","l":2},{"t":"f","q":"Wiele protistów rozmnaża się bezpłciowo przez prosty _______ komórki.","a":"podział","acc":[],"ex":"Jedna komórka dzieli się na dwie identyczne komórki potomne.","l":2},{"t":"tf","q":"Podział komórki jest podstawowym sposobem rozmnażania bezpłciowego wielu protistów jednokomórkowych.","a":true,"ex":"To najprostszy i najszybszy sposób namnażania się.","l":2},{"t":"s","q":"Które środowisko jest typowym siedliskiem pantofelka?","a":"Staw lub inny zbiornik słodkowodny","ex":"Pantofelek żyje w wodach słodkich, bogatych w materię organiczną.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego pantofelek potrzebuje wodniczki tętniącej, żyjąc w wodzie słodkiej.","a":"W wodzie słodkiej stężenie substancji rozpuszczonych jest niższe niż wewnątrz komórki pantofelka, dlatego woda stale wnika do jego wnętrza; wodniczka tętniąca gromadzi ten nadmiar wody i okresowo usuwa go na zewnątrz, zapobiegając nadmiernemu napęcznieniu i pęknięciu komórki.","l":2},{"t":"tf","q":"Pantofelek należy do orzęsków, poruszających się za pomocą rzęsek.","a":true,"ex":"To odzwierciedla sposób poruszania się tego protista.","l":2},{"t":"f","q":"Euglena należy do grupy protistów zwanej _______.","a":"wiciowcami","acc":[],"ex":"To grupa wyróżniona na podstawie sposobu poruszania się.","l":2},{"t":"o","q":"Porównaj sposób poruszania się pantofelka, euglenu i pełzaka.","a":"Pantofelek porusza się za pomocą licznych, drobnych rzęsek pokrywających całą powierzchnię komórki; euglena porusza się za pomocą jednej, długiej wici; pełzak natomiast tworzy nibynóżki, czyli tymczasowe wypustki cytoplazmy, dzięki którym się przesuwa.","l":2},{"t":"s","q":"Rafy koralowe, choć budowane przez zwierzęta (koralowce), mogą korzystać ze współpracy z:","a":"Protistami fotosyntetyzującymi żyjącymi w ich tkankach","ex":"To przykład symbiozy korzystnej dla obu stron.","l":2},{"t":"tf","q":"Niektóre koralowce żyją w symbiozie z fotosyntetyzującymi protistami, które dostarczają im substancji odżywczych.","a":true,"ex":"Ta symbioza jest kluczowa dla zdrowia raf koralowych.","l":2},{"t":"s","q":"Protisty odgrywają ważną rolę w ekosystemach wodnych, ponieważ:","a":"Wiele z nich, jak okrzemki, jest podstawą łańcucha pokarmowego jako producenci","ex":"Fotosyntetyzujące protisty produkują materię organiczną dla innych organizmów.","l":2},{"t":"f","q":"Fotosyntetyzujące protisty, jak okrzemki, są ważnym elementem _______ (drobnych organizmów unoszących się w wodzie).","a":"planktonu","acc":[],"ex":"Plankton jest podstawą wielu wodnych łańcuchów pokarmowych.","l":2},{"t":"o","q":"Wyjaśnij, dlaczego fotosyntetyzujące protisty, np. okrzemki, są ważne dla ekosystemów wodnych.","a":"Fotosyntetyzujące protisty, takie jak okrzemki, są producentami w ekosystemach wodnych — wytwarzają materię organiczną i tlen, stanowiąc podstawę łańcucha pokarmowego dla wielu organizmów wodnych.","l":2},{"t":"s","q":"Który protist charakteryzuje się obecnością dwóch jąder komórkowych (większego i mniejszego)?","a":"Pantofelek","ex":"To wyjątkowa cecha budowy pantofelka.","l":2},{"t":"tf","q":"Pantofelek posiada dwa różne jądra komórkowe pełniące różne funkcje.","a":true,"ex":"Większe jądro (makronukleus) i mniejsze (mikronukleus) mają odmienne role.","l":2},{"t":"o","q":"Wymień trzy różne sposoby odżywiania się wśród protistów, podając przykład organizmu dla każdego.","a":"Samożywność (fotosynteza) — np. chlorella lub okrzemka; cudzożywność — np. pantofelek lub pełzak; pasożytnictwo — np. lęgniowiec ziemniaczany.","l":2},{"t":"s","q":"Który protist jest wykorzystywany czasem jako suplement diety lub źródło białka (np. w przemyśle spożywczym)?","a":"Chlorella","ex":"Chlorella jest bogata w białko i inne składniki odżywcze.","l":2},{"t":"tf","q":"Chlorella jest czasem wykorzystywana jako suplement diety, bogaty w białko.","a":true,"ex":"To praktyczne zastosowanie tego jednokomórkowego glonu.","l":2},{"t":"f","q":"Protisty mogą mieć zarówno pozytywne, jak i _______ znaczenie dla człowieka i gospodarki.","a":
